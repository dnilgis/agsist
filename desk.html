<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Desk | AGSIST</title>
<link rel="icon" href="/img/favicon.ico" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="/img/icon.svg">
<!-- Sig's desk (Oct 28, 2026: "a singular place for all things agsist, executive
     level, KISS"). Not linked from anywhere, noindex, not in a sitemap, the
     search index, the feeds or the menu. No analytics.
     Public parts read the site's own public files (data/daily-sent,
     data/*sponsors*.json, data/sponsors/<portal>.json, data/audience.json,
     TODO-SIG.md), the bids repo's public directory and GitHub's public run
     list. Private parts read one answer from the subs worker, GET /desk
     (v5.59), with LIST_TOKEN in the Authorization header only, never in an
     address. The token is the one elev-admin.html and the Today page keep in
     this browser's localStorage, so it is pasted once; "Forget the token"
     clears it. Without it no worker call is made and the private parts say so.
     The worker answer holds counts only: no reader's address, name, town or
     ZIP ever reaches this page. A number that cannot be read says
     "can't read: <why>", never a blank or a guess.
     THE CARDS ARE ONE LIST (CARDS below): a new card is one entry, naming the
     sources it needs (SOURCES), its headline tiles and its body. -->
<style>
:root{--bg:#f6f5f1;--panel:#fff;--text:#1E2125;--dim:#5E6475;--line:#d6d9d2;--accent:#2B5C8A;--warn:#A8321E;--ok:#2f6b3a;--amber:#8a5a00}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1b1c1a;--panel:#252623;--text:#e9edeb;--dim:#b4b8b1;--line:#3a3c37;--accent:#8db6d8;--warn:#e08a78;--ok:#8fc79a;--amber:#e0b860}}
:root[data-theme="dark"]{--bg:#1b1c1a;--panel:#252623;--text:#e9edeb;--dim:#b4b8b1;--line:#3a3c37;--accent:#8db6d8;--warn:#e08a78;--ok:#8fc79a;--amber:#e0b860}
html,body{background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;overflow-wrap:anywhere}
main{max-width:1100px;margin:0 auto;padding:16px 12px 60px}
h1{font-size:1.35rem;margin:0}
h2{font-size:1.05rem;margin:0}
h3{font-size:.9rem;margin:.9rem 0 .3rem}
p{margin:.3rem 0}
a{color:var(--accent)}
.dim,.src{color:var(--dim)}
.src{font-size:.78rem;margin:.15rem 0 0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
section,.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin:12px 0}
label{display:block;font-size:.85rem;font-weight:600;margin:.4rem 0 .15rem}
input,select{font:inherit;font-size:16px;width:100%;min-height:44px;padding:.35rem .5rem;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--text)}
button,.btn{font:inherit;font-weight:600;min-height:44px;padding:0 1rem;border-radius:5px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;display:inline-flex;align-items:center;text-decoration:none}
button.quiet,.btn.quiet{background:none;color:var(--accent)}
:root[data-theme="dark"] button:not(.quiet){color:#10151a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) button:not(.quiet){color:#10151a}}
.tok-row{display:flex;gap:8px;align-items:center}
.tok-row input{flex:1;min-width:0}
#tok-state{font-size:.9rem;margin:.3rem 0 0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}
@media(min-width:760px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:96px;display:block;color:inherit;text-decoration:none}
.tile .k{font-size:.78rem;color:var(--dim);font-weight:600}
.tile .v{font-size:1.25rem;font-weight:700;line-height:1.2;margin:.1rem 0}
.tile .s{font-size:.78rem;color:var(--dim)}
.tile.bad{border-color:var(--warn)}.tile.bad .v{color:var(--warn)}
.tile.good .v{color:var(--ok)}
.tile.cantv .v{font-size:.95rem;color:var(--amber)}
.cards{display:grid;grid-template-columns:minmax(0,1fr);gap:0 12px}
@media(min-width:1000px){.cards{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:row dense}.card.wide{grid-column:1/-1}}
.card .acts{display:flex;gap:6px;flex-wrap:wrap}
.card .acts a{font-size:.85rem;font-weight:600;min-height:44px;display:inline-flex;align-items:center}
.cant{color:var(--amber);font-weight:600}
.red{color:var(--warn);font-weight:600}
.green{color:var(--ok);font-weight:600}
.need{color:var(--dim);font-style:italic}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
table{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:.4rem}
td,th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
th{font-size:.75rem;color:var(--dim);font-weight:600}
td.n,th.n{text-align:right;white-space:nowrap}
ul.l{margin:.3rem 0;padding-left:1.1rem}
ul.l li{margin:.15rem 0}
details{margin:.4rem 0}
summary{cursor:pointer;font-weight:600;font-size:.9rem;min-height:32px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 10px}
@media(max-width:640px){.row4{grid-template-columns:1fr 1fr}}
.out{margin-top:.5rem;font-size:.9rem}.out.bad{color:var(--warn)}.out.good{color:var(--ok)}
.out:empty{display:none}
#loading{color:var(--dim);margin:12px 0}
@media(max-width:640px){
  table.stack,table.stack tbody,table.stack tr,table.stack td{display:block;width:100%}
  table.stack thead{display:none}
  table.stack tr{border-bottom:1px solid var(--line);padding:.4rem 0}
  table.stack td{border:0;padding:1px 0}
  table.stack td[data-h]::before{content:attr(data-h) ": ";color:var(--dim);font-size:.78rem;font-weight:600}
}
</style>
</head>
<body>
<main>
  <div class="top"><h1>Desk</h1><span class="dim" id="now"></span></div>

  <section id="tok-box">
    <label for="tok">Token (LIST_TOKEN)</label>
    <div class="tok-row"><input id="tok" type="password" autocomplete="off" spellcheck="false"><button type="button" class="quiet" id="tok-forget">Forget the token</button><button type="button" id="reload">Read</button></div>
    <p id="tok-state" class="dim">Paste it once; this browser keeps it (the same one the elevator desk uses). Never put it in a link.</p>
  </section>

  <div id="desk"><p id="loading">Reading...</p></div>
</main>
<script>
(function () {
  'use strict';
  var API = 'https://agsist-api.dnilgis.workers.dev/';
  var TOK_KEY = 'agsist-elev-admin-token';
  var GH = 'https://api.github.com/repos/dnilgis/agsist/actions/';
  var BIDS = 'https://dnilgis.github.io/bids/data/';
  var EDIT = 'https://github.com/dnilgis/agsist/edit/main/';
  var TODO_EDIT = EDIT + 'TODO-SIG.md';
  var WEEK = 7 * 864e5;
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#x27;' }[c]; }); }
  function num(n) { return Number(n).toLocaleString('en-US'); }
  function money(n) { return '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function cant(why) { return '<span class="cant">can’t read: ' + esc(why) + '</span>'; }
  function need() { return '<span class="need">Paste the token to see this.</span>'; }
  function src(what, at) { return '<p class="src">' + esc(what) + (at ? ', ' + esc(at) : '') + '</p>'; }
  function ct(d, withDay) {
    d = d instanceof Date ? d : new Date(d);
    if (isNaN(d)) return '';
    var o = { timeZone: 'America/Chicago', hour: 'numeric', minute: '2-digit' };
    if (withDay !== false) { o.month = 'short'; o.day = 'numeric'; }
    return d.toLocaleString('en-US', o) + ' CT';
  }
  function day(s) { var d = new Date(s + 'T12:00:00Z'); return isNaN(d) ? s : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' }); }
  function ago(t, now) {
    var m = Math.round((now - t) / 60000);
    if (m < 60) return m + ' min ago';
    var h = Math.round(m / 60);
    return h < 48 ? h + ' h ago' : Math.round(h / 24) + ' days ago';
  }
  function isoDay(t) { return new Date(t).toISOString().slice(0, 10); }
  /* Central-time calendar day, for sponsor start/end dates (as geo-sponsor.js reads them) */
  function ctDay(t) { var p = new Date(t).toLocaleDateString('en-CA', { timeZone: 'America/Chicago' }); return /^\d{4}-\d{2}-\d{2}$/.test(p) ? p : isoDay(t); }

  /* ---------- the token ---------- */
  function tok() { return $('tok').value.trim(); }
  try { $('tok').value = localStorage.getItem(TOK_KEY) || ''; } catch (e) {}
  $('tok').addEventListener('change', function () { try { localStorage.setItem(TOK_KEY, tok()); } catch (e) {} });
  $('tok-forget').addEventListener('click', function () { $('tok').value = ''; try { localStorage.removeItem(TOK_KEY); } catch (e) {} load(); });
  $('reload').addEventListener('click', function () { try { localStorage.setItem(TOK_KEY, tok()); } catch (e) {} load(); });

  /* ---------- reading, every source fails soft ---------- */
  function why(e, host) {
    if (e && e.status === 404) return 'not found at ' + host + ' (404)';
    if (e && e.status === 403 && /github/.test(host)) return 'GitHub refused (403): its limit for visits without a login is 60 an hour';
    if (e && e.status === 403) return 'the token was not accepted';
    if (e && e.status) return host + ' answered ' + e.status;
    if (e && e.name === 'AbortError') return host + ' did not answer in 20 seconds';
    if (e && e.parse) return host + ' did not send readable data';
    return 'no answer from ' + host;
  }
  function get(url, opt) {
    opt = opt || {};
    var host = /^https?:/.test(url) ? new URL(url).host : 'agsist.com';
    var ctl = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = ctl ? setTimeout(function () { ctl.abort(); }, 20000) : null;
    var init = { cache: 'no-store', headers: opt.headers || {}, method: opt.method || 'GET', referrerPolicy: 'no-referrer' };
    if (opt.body) { init.body = JSON.stringify(opt.body); init.headers['Content-Type'] = 'application/json'; }
    if (ctl) init.signal = ctl.signal;
    return fetch(url, init).then(function (r) {
      if (!r.ok) { var e = new Error('http'); e.status = r.status; throw e; }
      return opt.text ? r.text() : r.json().catch(function () { var e = new Error('parse'); e.parse = true; throw e; });
    }).then(function (d) { if (timer) clearTimeout(timer); return { ok: true, d: d }; },
      function (e) { if (timer) clearTimeout(timer); return { ok: false, why: why(e, host) }; });
  }
  function worker(path, body) {
    var t = tok();
    if (!t) return Promise.resolve({ ok: false, notok: true, why: 'no token in this browser' });
    return get(API + path, { method: body ? 'POST' : 'GET', body: body, headers: { Authorization: 'Bearer ' + t } });
  }

  var WORKFLOWS = [['daily.yml', 'The Daily'], ['fetch_bids.yml', 'Cash bids'], ['cattle-auction.yml', 'Cattle auctions'], ['hay-ams.yml', 'Hay reports'], ['sponsor-report.yml', 'Sponsor portals']];
  var SOURCES = {
    worker: function () { return worker('desk'); },
    runs: function () {
      return Promise.all(WORKFLOWS.map(function (w) {
        return get(GH + 'workflows/' + w[0] + '/runs?branch=main&per_page=5&exclude_pull_requests=true').then(function (r) {
          if (!r.ok) return { file: w[0], name: w[1], why: r.why };
          var runs = (r.d && r.d.workflow_runs) || [];
          var done = runs.filter(function (x) { return x.status === 'completed'; })[0] || null;
          var going = runs.filter(function (x) { return x.status !== 'completed'; })[0] || null;
          var out = { file: w[0], name: w[1], last: done, going: going };
          /* a red Daily: which step stopped it */
          if (w[0] === 'daily.yml' && done && done.conclusion === 'failure') {
            return get(GH + 'runs/' + done.id + '/jobs?per_page=20').then(function (j) {
              var step = null;
              ((j.ok && j.d.jobs) || []).forEach(function (job) { (job.steps || []).forEach(function (s) { if (!step && s.conclusion === 'failure') step = s.name; }); });
              out.step = step; out.stepWhy = j.ok ? '' : j.why;
              return out;
            });
          }
          return out;
        });
      }));
    },
    sent: function (now) {
      var d0 = isoDay(now), d1 = isoDay(now - 864e5);
      return get('/data/daily-sent/' + d0 + '.json').then(function (r) {
        if (r.ok) return { day: d0, rec: r.d };
        return get('/data/daily-sent/' + d1 + '.json').then(function (y) { return y.ok ? { day: d1, rec: y.d, yesterday: true, todayWhy: r.why } : { why: r.why }; });
      });
    },
    sponsors: function () {
      var files = ['sponsors', 'page-sponsors', 'prf-sponsors', 'geo-sponsors', 'sponsor'];
      return Promise.all(files.map(function (f) { return get('/data/' + f + '.json'); })).then(function (got) {
        var out = {};
        files.forEach(function (f, i) { out[f] = got[i]; });
        var list = out.sponsors.ok && Array.isArray(out.sponsors.d.sponsors) ? out.sponsors.d.sponsors : [];
        return Promise.all(list.map(function (s) {
          if (!/^[a-z0-9-]+$/.test(s.slug || '') || !/^[0-9a-f]{16}$/.test(s.token || '')) return Promise.resolve({ ok: false, why: 'no portal token' });
          return get('/data/sponsors/' + s.slug + '-' + s.token + '.json');
        })).then(function (portals) { out.portals = portals; return out; });
      });
    },
    dir: function () { return get(BIDS + 'directory.json'); },
    ids: function () { return get(BIDS + 'elevator-ids.jsonl', { text: true }); },
    aud: function () { return get('/data/audience.json'); },
    todo: function () { return get('/TODO-SIG.md', { text: true }); }
  };

  /* ---------- Signups: where Daily readers signed up. COPY of SIGNUP_GROUPS in
     scripts/morning_report.py (test/desk.test.mjs runs both on the same sources). ---------- */
  var SIGNUP_GROUPS = [
    ['Sitewide bar', function (s) { return s === 'bar' || s.indexOf('bar-') === 0 || s.indexOf('bar:') === 0; }],
    ['Daily page', function (s) { return s === 'daily-briefing-subscribe' || s === 'daily' || s.indexOf('page:daily') === 0; }],
    ['Town pages', function (s) { return s.indexOf('town:') === 0; }],
    ['Homepage', function (s) { return ['hero', 'homepage-email', 'signup-band', 'watch-optin'].indexOf(s) >= 0; }],
    ['Menu and footer', function (s) { return s.indexOf('menu') === 0 || s.indexOf('footer') === 0; }],
    ['Imported or added by hand', function (s) { return s === 'import' || s === 'manual'; }],
    ['One more', function (s) { return s.indexOf('onemore:') === 0; }],
    ['Forwarded or not recorded', function (s) { return s === 'email-forward' || s === '(none)' || s === ''; }],
    ['Page asks', function () { return true; }]
  ];
  function signupGroup(s) { s = String(s == null ? '' : s); for (var i = 0; i < SIGNUP_GROUPS.length; i++) if (SIGNUP_GROUPS[i][1](s)) return SIGNUP_GROUPS[i][0]; return 'Page asks'; }
  /* notice topics by family (the worker sends families only, never a topic with its place) */
  var FAMILY = { 'rain-gauge': 'Rain gauge waiting list', rent: 'County cash rent notice', arcplc: 'ARC/PLC deadline reminder', prf: 'PRF interval notice',
    rainyear: 'Full-year rain email', 'rain-month': 'Monthly county rain', landsales: 'Monthly land sales', 'milk-month': 'Milk price day',
    reports: 'WASDE and report-day emails', cot: 'Funds this week' };
  var LISTS = [['alerts', 'Hail alerts'], ['ewatch', 'Elevator watch and bid alerts'], ['pwatch', 'Price targets'], ['watch', 'County watch']];

  /* ---------- the cards: ONE LIST. A new card is one entry. ---------- */
  var CARDS = [
    { id: 'today', title: 'Today', needs: ['sent', 'runs', 'worker'], acts: [['https://github.com/dnilgis/agsist/actions', 'Actions'], ['/daily', 'The Daily']], tiles: todayTiles, body: todayBody },
    { id: 'ads', title: 'Ads and sponsors', wide: true, needs: ['sponsors', 'worker'], acts: [['/sponsor-kit', 'Sponsor kit']], tiles: adsTiles, body: adsBody },
    { id: 'signups', title: 'Signups', needs: ['worker'], private: true, acts: [], tiles: signupTiles, body: signupBody },
    { id: 'boards', title: 'Elevator boards', needs: ['dir', 'ids', 'worker'], acts: [['/elev-admin.html', 'Elevator desk'], ['/elev-today.html', 'Today list']], tiles: boardTiles, body: boardBody },
    { id: 'money', title: 'Money in', needs: ['worker', 'sponsors'], private: true, acts: [['/rp-gift-admin.html', 'Gift card desk'], ['https://dashboard.stripe.com/payments', 'Stripe']], tiles: moneyTiles, body: moneyBody },
    { id: 'audience', title: 'Audience', needs: ['aud'], acts: [['https://analytics.google.com/', 'GA4']], tiles: audTiles, body: audBody },
    { id: 'todo', title: 'To-do', needs: ['todo'], acts: [[TODO_EDIT, 'Edit the list']], tiles: todoTiles, body: todoBody }
  ];

  /* the worker's answer, or why not; a part of it that failed carries {error} */
  function part(D, k) {
    var w = D.worker;
    if (!w || !w.ok) return { why: w && w.notok ? null : (w ? w.why : 'not asked') };
    var p = w.d && w.d[k];
    if (!p || typeof p !== 'object') return { why: 'the worker sent no ' + k + ' part (an older worker? deploy v5.59)' };
    if (p.error) return { why: 'the worker could not count it: ' + p.error };
    return { d: p };
  }
  function partOr(D, k, fn) { var p = part(D, k); if (p.d) return fn(p.d); return p.why === null ? need() : cant(p.why); }
  function wAt(D) { return D.worker && D.worker.ok && D.worker.d.at ? ct(D.worker.d.at) : ''; }
  function tile(k, v, s, kind, href) { return { k: k, v: v, s: s || '', kind: kind || '', href: href || '' }; }
  function cantTile(k, p) { return p.why === null ? tile(k, 'Token needed', 'paste it above', 'cantv') : tile(k, 'Can’t read', p.why, 'cantv'); }

  /* ---------- 1. Today ---------- */
  function dailyState(D) {
    var s = D.sent, runs = D.runs || [], dr = runs.filter(function (r) { return r.file === 'daily.yml'; })[0] || {};
    var b = part(D, 'briefed'), today = isoDay(D.now);
    var flag = b.d ? b.d[today] : null;
    var red = dr.last && dr.last.conclusion === 'failure' && isoDay(Date.parse(dr.last.created_at)) === today;
    if (s && s.rec && !s.yesterday) return { state: 'sent', rec: s.rec, flag: flag, red: red, run: dr };
    return { state: red ? 'blocked' : (flag ? 'flag' : 'not yet'), rec: s && s.rec, flag: flag, red: red, run: dr, why: s && (s.why || s.todayWhy) };
  }
  function todayTiles(D) {
    var ds = dailyState(D), t = [];
    if (ds.state === 'sent') t.push(tile('The Daily today', 'Sent ' + ct(ds.rec.sent_at, false), ds.rec.subject || '', 'good', '#c-today'));
    else if (ds.state === 'blocked') t.push(tile('The Daily today', 'Blocked', ds.run.step ? 'at ' + ds.run.step : 'the run failed', 'bad', '#c-today'));
    else if (ds.state === 'flag') t.push(tile('The Daily today', 'Sent', 'the day flag is set; no sent copy in the site yet', 'good', '#c-today'));
    else t.push(tile('The Daily today', 'Not sent yet', ds.rec ? 'last sent ' + ct(ds.rec.sent_at) : '', '', '#c-today'));
    var runs = D.runs || [], red = runs.filter(function (r) { return r.last && r.last.conclusion === 'failure'; }), unread = runs.filter(function (r) { return r.why; });
    if (red.length) t.push(tile('Checks on main', red.length + ' red', red.map(function (r) { return r.name; }).join(', '), 'bad', '#c-today'));
    else if (!runs.length || unread.length === runs.length) t.push(tile('Checks on main', 'Can’t read', unread[0] ? unread[0].why : 'GitHub not asked', 'cantv'));
    else if (unread.length) t.push(tile('Checks on main', 'No red seen', unread.length + ' of ' + runs.length + ' can’t read: ' + unread[0].why, 'cantv', '#c-today'));
    else t.push(tile('Checks on main', 'All green', runs.length + ' jobs', 'good', '#c-today'));
    return t;
  }
  function todayBody(D) {
    var ds = dailyState(D), h = '<h3>The Daily</h3>';
    if (ds.rec) {
      h += '<p>' + (ds.state === 'sent' ? '<span class="green">Sent</span> ' + esc(ct(ds.rec.sent_at)) : 'Last sent copy: ' + esc(ct(ds.rec.sent_at))) +
        ': <b>' + esc(ds.rec.subject || 'subject not kept') + '</b></p>';
    } else h += '<p>Sent copy: ' + cant(ds.why || 'none found') + '</p>';
    if (ds.state === 'blocked') {
      h += '<p class="red">Blocked today' + (ds.run.step ? ' at the step "' + esc(ds.run.step) + '"' : '') + '.' +
        ' <a href="' + esc(ds.run.last.html_url) + '">Open the run</a></p>';
      if (!ds.run.step) h += '<p>Which check: ' + cant(ds.run.stepWhy || 'GitHub listed no failed step') + '</p>';
    }
    var b = part(D, 'briefed');
    h += '<p>Day flag (the worker’s "sent" mark for ' + esc(day(isoDay(D.now))) + '): ' +
      (b.d ? (b.d[isoDay(D.now)] ? '<span class="green">set</span>' : 'not set') : (b.why === null ? need() : cant(b.why))) + '</p>';
    h += '<p>To how many: ' + cant('the send count is only in the job log, which GitHub shows to signed-in users') + '.</p>' +
      '<p>On the list now: ' + partOr(D, 'daily', function (d) { return '<b>' + num(d.n) + '</b>'; }) + '</p>';
    h += src('Sent copy: data/daily-sent; flag and list: subs worker', wAt(D));
    h += '<h3>Daily readers</h3><p>' + partOr(D, 'daily', function (d) {
      var u = d.unsubs || {};
      return '<b>' + num(d.n) + '</b> now. Last 7 days: <b>' + num(d.new_7d) + '</b> joined, <b>' + num((u.d7 || 0)) + '</b> stopped' +

    var cell = function (v) { return v == null ? cant('not in the file') : num(v); };
    h += '<tr><td>Readers</td><td class="n">' + cell(a.totals['7d'] && a.totals['7d'].users) + '</td><td class="n">' + cell(a.totals['28d'] && a.totals['28d'].users) + '</td></tr>';
    h += '<tr><td>Page views</td><td class="n">' + cell(a.totals['7d'] && a.totals['7d'].views) + '</td><td class="n">' + cell(a.totals['28d'] && a.totals['28d'].views) + '</td></tr>';
    h += '<tr><td>Visits from AI assistants</td><td class="n">' + cell(ai('7d')) + '</td><td class="n">' + cell(ai('28d')) + '</td></tr></tbody></table></div>';
    var r7 = rng(a, '7d'), r28 = rng(a, '28d');
    var st = (a.states && a.states['7d']) || [];
    h += '<h3>Top states, 7 days</h3>' + (st.length ? '<p>' + st.slice().sort(function (x, y) { return y.users - x.users; }).slice(0, 5).map(function (s) { return esc(s.name) + ' ' + num(s.users); }).join(', ') + '</p>' : '<p>' + cant('no state rows in the file') + '</p>');
    var sv = a.servers;
    if (sv && Array.isArray(sv.towns) && sv.towns.length && sv.window) {
      h += '<p class="dim"><b>Data-center traffic left out.</b> Towns whose “readers” averaged under ' + esc(sv.rule && sv.rule.seconds) + ' seconds are servers, not people, and are removed from every figure above. Over ' +
        esc(day(sv.window.start)) + ' to ' + esc(day(sv.window.end)) + ' they carried ' + num(sv.users || 0) + ': ' +
        sv.towns.slice(0, 6).map(function (x) { return esc(x.city) + ', ' + esc(x.region) + ' ' + num(x.users); }).join('; ') + (sv.towns.length > 6 ? '; and ' + (sv.towns.length - 6) + ' more' : '') + '.</p>';
    }
    h += src('Google Analytics 4 via data/audience.json' + (r7 ? ', 7 days ' + day(r7.start) + ' to ' + day(r7.end) : '') + (r28 ? ', 28 days to ' + day(r28.end) : '') + '; AI assistants = GA4’s "AI Assistant" channel', a.built ? 'built ' + ct(a.built) : '');
    return h;
  }

  /* ---------- 7. To-do ---------- */
  var MON = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
  function dueOf(text, now) {
    var m = /\b(\d{4})-(\d{2})-(\d{2})\b/.exec(text);
    if (m) return Date.UTC(+m[1], +m[2] - 1, +m[3]);
    m = /\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.? (\d{1,2})\b/.exec(text);
    if (!m) return null;
    var y = new Date(now).getUTCFullYear(), t = Date.UTC(y, MON[m[1].toLowerCase()], +m[2]);
    if (t < now - 180 * 864e5) t = Date.UTC(y + 1, MON[m[1].toLowerCase()], +m[2]);
    return t;
  }
  function todos(D) {
    var r = D.todo;
    if (!r || !r.ok) return { why: r ? r.why : 'not read' };
    var items = String(r.d).split('\n').map(function (l) { return /^\s*[-*]\s+\[( |x|X)\]\s+(.+?)\s*$/.exec(l); }).filter(function (m) { return m && m[1] === ' '; }).map(function (m) { return m[2]; });
    return { items: items };
  }
  function todoTiles(D) {
    var t = todos(D);
    if (!t.items) return [tile('To-dos open', 'Can’t read', t.why, 'cantv')];
    var dated = t.items.filter(function (x) { return dueOf(x, D.now) !== null; }).length;
    return [tile('To-dos open', num(t.items.length), dated ? dated + ' with a date' : 'none dated', '', '#c-todo')];
  }
  function todoBody(D) {
    var t = todos(D);
    if (!t.items) return '<p>TODO-SIG.md: ' + cant(t.why) + '</p>';
    var now = D.now, dated = [], rest = [];
    t.items.forEach(function (x) { var d = dueOf(x, now); if (d === null) rest.push(x); else dated.push([d, x]); });
    dated.sort(function (a, b) { return a[0] - b[0]; });
    var h = '';
    if (dated.length) h += '<h3>Dated</h3><ul class="l">' + dated.map(function (x) {
      var days = Math.round((x[0] - Date.UTC(new Date(now).getUTCFullYear(), new Date(now).getUTCMonth(), new Date(now).getUTCDate())) / 864e5);
      return '<li>' + (days < 0 ? '<span class="red">' + (-days) + ' days past</span>' : days === 0 ? '<span class="red">today</span>' : 'in ' + days + ' days') + ': ' + esc(x[1]) + '</li>';
    }).join('') + '</ul>';
    h += rest.length ? '<h3>Open</h3><ul class="l">' + rest.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : (dated.length ? '' : '<p>Nothing open.</p>');
    h += '<p class="dim">To add a dated reminder, add a line like <code>- [ ] Nov 10: decide on the Open-Meteo key</code>. Check one off with <code>- [x]</code>. The file is public: no names.</p>';
    h += src('TODO-SIG.md on agsist.com (the morning email reads the same file)', ct(now));
    return h;
  }

  /* ---------- drawing: one pass, after every source answered ---------- */
  var D = null;
  function draw() {
    var hasTok = !!tok();
    var tiles = [];
    CARDS.forEach(function (c) { try { tiles = tiles.concat(c.tiles(D)); } catch (e) { tiles.push(tile(c.title, 'Can’t read', 'this card failed to draw', 'cantv')); } });
    var h = '<div class="tiles">' + tiles.map(function (t) {
      var inner = '<div class="k">' + esc(t.k) + '</div><div class="v">' + esc(t.v) + '</div><div class="s">' + esc(t.s) + '</div>';
      return t.href ? '<a class="tile ' + t.kind + '" href="' + esc(t.href) + '">' + inner + '</a>' : '<div class="tile ' + t.kind + '">' + inner + '</div>';
    }).join('') + '</div><div class="cards">';
    CARDS.forEach(function (c) {
      var body;
      if (c.private && !hasTok) body = '<p>' + need() + '</p>';
      else { try { body = c.body(D); } catch (e) { body = '<p>' + cant('this card failed to draw (' + (e && e.message || 'error') + ')') + '</p>'; } }
      h += '<div class="card' + (c.wide ? ' wide' : '') + '" id="c-' + c.id + '"><div class="top"><h2>' + esc(c.title) + '</h2><div class="acts">' +
        c.acts.map(function (a) { return '<a href="' + esc(a[0]) + '">' + esc(a[1]) + '</a>'; }).join('') + '</div></div>' + body + '</div>';
    });
    $('desk').innerHTML = h + '</div>';
    $('now').textContent = ct(D.now);
    var w = D.worker;
    $('tok-state').textContent = !hasTok ? 'No token in this browser: the private parts stay closed and the worker is not asked.'
      : w && w.ok ? 'Token accepted. Private parts read ' + ct(w.d.at) + '.' : 'Private parts: can’t read: ' + (w ? w.why : 'not asked') + '.';
    wire();
  }
  function wire() {
    var f = $('mark');
    if (f) f.addEventListener('submit', function (e) {
      e.preventDefault();
      var slug = $('m-slug').value || $('m-other').value.trim().toLowerCase();
      var body = { action: 'mark', slug: slug, period: $('m-period').value.trim(), amount: Number($('m-amt').value), paid_on: $('m-date').value };
      var o = $('m-out'); o.className = 'out'; o.textContent = 'Saving...';
      worker('desk/ledger', body).then(function (r) {
        if (!r.ok || !r.d.ok) { o.className = 'out bad'; o.textContent = 'Not saved: ' + (r.ok ? (r.d.error || 'refused') : r.why) + '.'; return; }
        setLedger(r.d.rows); draw();
        var o2 = $('m-out'); if (o2) { o2.className = 'out good'; o2.textContent = 'Marked ' + slug + ' paid for ' + body.period + '.'; }
      });
    });
    [].forEach.call(document.querySelectorAll('[data-unmark]'), function (b) {
      b.addEventListener('click', function () {
        var p = b.getAttribute('data-unmark').split('|');
        if (!window.confirm('Mark ' + p[0] + ' unpaid for ' + p[1] + '?')) return;
        worker('desk/ledger', { action: 'unmark', slug: p[0], period: p[1] }).then(function (r) {
          if (!r.ok || !r.d.ok) { window.alert('Not changed: ' + (r.ok ? (r.d.error || 'refused') : r.why)); return; }
          setLedger(r.d.rows); draw();
        });
      });
    });
  }
  function setLedger(rows) { if (D.worker && D.worker.ok && D.worker.d) D.worker.d.ledger = { rows: rows || [] }; }

  var gen = 0;
  function load() {
    var mine = ++gen, now = Date.now(), want = {};
    CARDS.forEach(function (c) { c.needs.forEach(function (n) { want[n] = 1; }); });
    var names = Object.keys(want);
    Promise.all(names.map(function (n) { return SOURCES[n](now).catch(function (e) { return { ok: false, why: 'read failed (' + (e && e.message || 'error') + ')' }; }); })).then(function (got) {
      if (mine !== gen) return;
      D = { now: now };
      names.forEach(function (n, i) { D[n] = got[i]; });
      draw();
    });
  }
  load();
})();
</script>
</body>
</html>
