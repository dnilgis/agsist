<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Ag in 60 frames</title>
<style>
@font-face{font-family:'Inter';font-weight:400 900;src:url('/fonts/inter-var.woff2') format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:400 800;src:url('/fonts/jetbrains-mono-var.woff2') format('woff2')}
@font-face{font-family:'Oswald';font-weight:400 700;src:url('/fonts/oswald-var.woff2') format('woff2')}
@font-face{font-family:'Fraunces';font-weight:300 900;src:url('/fonts/rp-fraunces-opsz.woff2') format('woff2')}
:root{
  --bg:#0a0c0d; --surface:#101415; --surface2:#161b1c; --surface3:#1d2324;
  --gold:#d4a23f; --gold-hi:#e9bd62; --cream:#F4EFE1; --text:#e9edeb; --muted:rgba(233,237,235,.70);
  --green:#5fc28a; --red:#e0685f; --blue:#6f9fc2; --stone:#ECE6DE; --ink:#2b2a27;
  --line:rgba(132,160,168,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden}
.bg{position:absolute;inset:-200px;background:
  radial-gradient(900px 700px at 20% 18%, rgba(212,162,63,.16), transparent 60%),
  radial-gradient(800px 900px at 90% 85%, rgba(111,159,194,.10), transparent 60%), var(--bg)}
.rows{position:absolute;inset:-400px;opacity:.10;background:repeating-linear-gradient(115deg, rgba(244,239,225,.9) 0 2px, transparent 2px 46px)}
.top{position:absolute;left:60px;right:60px;top:70px;height:90px;display:flex;align-items:center;justify-content:space-between;z-index:5}
.top img{height:70px}
.pill{font:700 34px Oswald;letter-spacing:.08em;color:var(--bg);background:var(--gold);padding:8px 22px;border-radius:999px}
.date{font:600 30px 'JetBrains Mono';color:var(--muted);margin-right:18px}
.prog{position:absolute;left:0;top:0;height:10px;background:var(--gold);z-index:6}
.scene{position:absolute;left:60px;right:60px;top:200px;height:1020px}
.asof{position:absolute;left:60px;right:140px;top:1240px;font:600 29px/1.3 'JetBrains Mono';color:var(--muted);z-index:4}
.asof b{color:var(--gold);font-weight:700}
.cap{position:absolute;left:50px;right:150px;top:1370px;min-height:260px;display:flex;align-items:flex-start;z-index:7}
.cap span{font:900 84px/1.08 Inter;color:#fff;letter-spacing:-.01em;text-shadow:0 5px 0 #000,0 0 26px rgba(0,0,0,.9);-webkit-text-stroke:3px #000;paint-order:stroke fill}
.cap span em{font-style:normal;color:var(--gold-hi)}
.flash{position:absolute;inset:0;z-index:8;pointer-events:none}
.kicker{font:700 40px Oswald;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.big{font:700 300px/0.95 Oswald;color:var(--gold);letter-spacing:-.02em}
.h1{font:700 104px/1.04 Oswald;color:var(--cream);letter-spacing:-.005em}
.h2{font:600 58px/1.2 Inter;color:var(--text)}
.mono{font-family:'JetBrains Mono'}
.card{background:linear-gradient(180deg,var(--surface2),var(--surface));border:2px solid var(--line);border-radius:28px}
.up{color:var(--green)} .down{color:var(--red)}
svg text{font-family:Inter}
</style>
</head>
<body>
<div id="stage">
  <div class="bg"></div><div class="rows" id="rows"></div>
  <div class="prog" id="prog"></div>
  <div class="top"><img src="/img/logo-agsist-ondark.svg" alt="agsist.com"><div style="display:flex;align-items:center"><span class="date" id="date"></span><span class="pill">AG IN 60</span></div></div>
  <div class="scene" id="scene"></div>
  <div class="asof" id="asof"></div>
  <div class="cap" id="cap"></div>
  <div class="flash" id="flash"></div>
</div>
<script src="/scripts/ag60/scenes.js"></script>
</body>
</html>
