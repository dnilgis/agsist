<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Opening your report | AGSIST</title>
<!-- The printed report QR (HTTPS://AGSIST.COM/Q?...): a comp report, a land report or a
     Hail History Report written short so the code stays small. components/report-link.js
     turns it back into the full link and this page opens it. Nothing is looked up or kept.
     test/print-qr.test.mjs checks it. -->
<style>
  :root{--bg:#f6f7f5;--text:#161a18;--muted:rgba(22,26,24,.7);--link:#7a5a12}
  @media (prefers-color-scheme: dark){:root{--bg:#0a0c0d;--text:#e9edeb;--muted:rgba(233,237,235,.7);--link:#d4a23f}}
  html,body{background:var(--bg)}
  body{margin:0;color:var(--text);font:17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:520px;margin:0 auto;padding:4rem 16px;opacity:0;animation:q-show 0s .7s forwards}
  main.now{opacity:1;animation:none}
  @keyframes q-show{to{opacity:1}}
  h1{font-size:1.3rem;margin:0 0 .6rem}
  p{color:var(--muted);margin:.4rem 0}
  a{color:var(--link)}
</style>
<noscript><style>main{opacity:1;animation:none}</style></noscript>
</head>
<body>
<main id="box">
<h1 id="msg">Opening your report</h1>
<p id="sub">One moment.</p>
<p><a href="/field-scout">Field Scout</a> &middot; <a href="/hail-map">Hail map</a> &middot; <a href="/">agsist.com</a></p>
</main>
<script src="/components/report-link.js?v=1"></script>
<script>
(function () {
  var u = window.AgReportLink ? window.AgReportLink.full(location.search) : null;
  if (u && u.indexOf('https://agsist.com/') === 0) { location.replace(u.slice('https://agsist.com'.length)); return; }
  document.getElementById('msg').textContent = 'This report link did not open';
  document.getElementById('sub').textContent = 'The code may be torn or smudged. Make the report again from Field Scout or the hail map.';
  document.getElementById('box').className = 'now';
})();
</script>
</body>
</html>
