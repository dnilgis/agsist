     AGSIST Analytics — Google Analytics 4
     ── HOW TO UPDATE ────────────────────────────────────────────────────────
     1. Go to analytics.google.com
     2. Create a property for agsist.com
     3. Copy your Measurement ID (format: G-6KXCTD5Z9H)
     4. Replace BOTH instances of G-6KXCTD5Z9H below
     5. Commit and push — analytics will activate site-wide instantly
     2026-10-01 consent B: the guard script loads gtag.js only when the browser
     sends no Global Privacy Control and localStorage
     agsist-ga-off is not 1. The same guard is inline on every page that
     carries GA itself; cookie_flags dropped to match those pages.
     ════════════════════════════════════════════════════════════════════════ -->
<script>/* agsist-ga-guard 2026-10-01: Google Analytics loads only when the browser sends no Global Privacy Control signal and the off switch on /privacy is not set. dataLayer and gtag always exist, so page code that calls them never throws. */(function(w,d,n){var off=false,v,i,s;w.dataLayer=w.dataLayer||[];if(typeof w.gtag!=='function'){w.gtag=function(){w.dataLayer.push(arguments);};}try{off=w.localStorage.getItem('agsist-ga-off')==='1';}catch(e){}if(n.globalPrivacyControl===true){off=true;}w.agsistGaOff=off;w.gtag('set','allow_google_signals',false);w.gtag('set','allow_ad_personalization_signals',false);if(off){return;}s=d.createElement('script');s.async=true;s.src='https://www.googletagmanager.com/gtag/js?id=G-6KXCTD5Z9H';(d.head||d.documentElement).appendChild(s);})(window,document,navigator);</script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('config', 'G-6KXCTD5Z9H', {
    send_page_view: true
  });

  /* ── Helper: fire custom events from any page ────────────────────────────
     Usage: agsist.track('button_click', 'engagement', 'spray_check')
  ── */
  window.agsist = window.agsist || {};
  window.agsist.track = function(action, category, label, value) {
    if(typeof gtag === 'undefined') return;
    gtag('event', action, {
      event_category: category || 'engagement',
      event_label:    label   || document.title,
      value:          value   || 0
    });
  };
</script>
