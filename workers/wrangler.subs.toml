name = "agsist-subs"
main = "subs-worker.js"
compatibility_date = "2026-09-30"
# Never wipe settings made in the dashboard on a Git deploy.
keep_vars = true
# Keep the workers.dev address on, and no per-version preview URLs: a deploy
# from the dashboard once left the new Worker with no address at all.
workers_dev = true
preview_urls = false

# The KV store holding every subscriber, alert and sponsor application.
# MUST be declared here: a Git deploy sets the Worker's bindings to exactly
# what this file says, so leaving it out would unplug the store from the
# Worker. The data itself would survive, but every signup would fail until
# the binding came back.
# Until the real id is filled in, deploys fail loudly and the live Worker is
# left as-is -- which is the safe way to fail.
# Find it: Cloudflare -> Storage & Databases -> KV -> the namespace bound as
# SUBS -> copy its ID.
[[kv_namespaces]]
binding = "SUBS"
id = "9024f0b7ca5948bf9ed98d6135d73357"

# Secrets/vars (GMAIL_USER, GMAIL_APP_PASS, UNSUB_SECRET, LIST_TOKEN, etc.)
# live on the Worker itself in the dashboard under Settings -> Variables and
# Secrets. Deploys never touch secrets.

# Plain switches set from the repo, so a deploy sets them and nobody has to edit the dashboard
# (Nov 3, 2026). Secrets stay in the dashboard.
# RP_*_LIVE "1": the worker asks the Rain Print design / buyer email jobs for a live run, not a dry
# run to the owner (the repo variables of the same names gate the hourly runs).
[vars]
RP_DESIGN_EMAIL_LIVE = "1"
RP_BUYER_EMAIL_LIVE = "1"
