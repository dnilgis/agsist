<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campaign portal — AGSIST</title>
<!-- A sponsor's own campaign, on a link they hold. Not for search. -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/components/styles.css?v=16">
<link rel="stylesheet" href="/components/sponsor-ad.css?v=1">
<script src="/components/util.js?v=16"></script>
<script src="/components/sponsor-ad.js?v=1"></script>
<style>
/* THE CAMPAIGN PORTAL. Every colour is a site token (styles.css) or the ad
   orange the ad itself uses; a block does not get its own colour vocabulary.
   (An earlier version invented --sr-panel and shipped white-on-white.) */
.cp{--acc:var(--ad-orange,#e8743a);--acc-rgb:var(--ad-orange-rgb,232,116,58);
  --ok:#4ade80;--ok-rgb:74,222,128;
  max-width:1080px;margin:0 auto;padding:1.6rem 1.1rem 5rem;color:var(--text,#e8ece9)}
.cp *{box-sizing:border-box}
.cp-eyebrow{font-family:var(--font-mono,'JetBrains Mono',monospace);font-size:.68rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--text-muted,#7d8782)}

/* ── hero ── */
.cp-hero{position:relative;overflow:hidden;border:1px solid var(--border,#2a3230);border-radius:18px;
  padding:1.6rem 1.6rem 1.4rem;background:
  radial-gradient(90% 120% at 100% 0%,rgba(var(--acc-rgb),.16) 0%,rgba(var(--acc-rgb),0) 60%),
  radial-gradient(70% 90% at 0% 100%,rgba(var(--ok-rgb),.06) 0%,rgba(var(--ok-rgb),0) 60%),
  var(--surface,#141918)}
.cp-hero-top{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;justify-content:space-between}
.cp-brands{display:flex;align-items:center;gap:.7rem}
.cp-logo{display:flex;align-items:center;justify-content:center;background:#fff;border-radius:12px;
  padding:.45rem .7rem;min-height:58px;min-width:120px;box-shadow:0 8px 20px -12px rgba(0,0,0,.6)}
.cp-logo img{max-height:44px;max-width:170px;display:block}
.cp-logo .sa-wordmark{display:none}
.cp-logo.sa-logo--text img{display:none}
.cp-logo.sa-logo--text .sa-wordmark{display:block}
.cp-x{font-family:var(--font-mono,'JetBrains Mono',monospace);color:var(--text-muted,#7d8782);font-size:.9rem}
.cp-agsist{font-family:var(--font-display,'Inter',sans-serif);font-weight:800;letter-spacing:.06em;font-size:1.05rem}
.cp-agsist span{color:var(--gold,#d4a23f)}
.cp-hero h1{font-size:clamp(1.7rem,3.6vw,2.5rem);line-height:1.08;letter-spacing:-.02em;margin:1.1rem 0 .35rem}
.cp-sub{color:var(--text-dim,#a9b3ae);font-size:1rem;margin:0}
.cp-sub b{color:var(--text,#e8ece9)}

.cp-status{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;margin:1.3rem 0 0;padding:1rem 1.1rem;
  border-radius:12px;border:1px solid rgba(var(--acc-rgb),.45);background:rgba(var(--acc-rgb),.07)}
.cp-status.is-ok{border-color:rgba(var(--ok-rgb),.45);background:rgba(var(--ok-rgb),.07)}
.cp-status-dot{width:12px;height:12px;border-radius:50%;background:var(--acc);flex:0 0 auto;
  box-shadow:0 0 0 5px rgba(var(--acc-rgb),.18)}
.cp-status.is-ok .cp-status-dot{background:var(--ok);box-shadow:0 0 0 5px rgba(var(--ok-rgb),.18)}
.cp-status-txt{flex:1 1 280px;min-width:0}
.cp-status-h{font-weight:800;font-size:1.08rem;line-height:1.25}
.cp-status-p{color:var(--text-dim,#a9b3ae);font-size:.9rem;margin:.2rem 0 0;line-height:1.5}
.cp-btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:44px;padding:.65rem 1.15rem;
  border-radius:10px;background:var(--acc);color:#0d1117;text-decoration:none;border:0;cursor:pointer;
  font-family:var(--font-mono,'JetBrains Mono',monospace);font-size:.8rem;font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;box-shadow:0 10px 22px -12px rgba(var(--acc-rgb),.95)}
.cp-btn:hover{filter:brightness(1.08);color:#0d1117}
.cp-btn:focus-visible{outline:2px solid var(--text,#e8ece9);outline-offset:3px}
.cp-btn--ghost{background:transparent;color:var(--text,#e8ece9);border:1px solid var(--border,#2a3230);box-shadow:none}
.cp-btn--ghost:hover{border-color:var(--acc);color:var(--text,#e8ece9)}

/* ── the five steps ── */
.cp-steps{list-style:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.5rem;margin:1.2rem 0 0;padding:0}
.cp-step{position:relative;padding:.7rem .75rem;border-radius:10px;border:1px solid var(--border,#2a3230);
  background:rgba(255,255,255,.015);min-width:0}
.cp-step-n{font-family:var(--font-mono,'JetBrains Mono',monospace);font-size:.66rem;letter-spacing:.12em;color:var(--text-muted,#7d8782)}
.cp-step-t{font-weight:700;font-size:.86rem;margin-top:.15rem;line-height:1.25}
.cp-step-d{font-size:.74rem;color:var(--text-muted,#7d8782);margin-top:.2rem;line-height:1.35}
.cp-step.is-done{border-color:rgba(var(--ok-rgb),.4)}
.cp-step.is-done .cp-step-n{color:var(--ok)}
.cp-step.is-now{border-color:var(--acc);background:rgba(var(--acc-rgb),.08)}
.cp-step.is-now .cp-step-n{color:var(--acc)}

/* ── nav ── */
.cp-nav{position:sticky;top:0;z-index:5;display:flex;gap:.3rem;overflow-x:auto;scrollbar-width:none;
  margin:1.2rem -1.1rem 0;padding:.6rem 1.1rem;background:linear-gradient(var(--bg,#0d1110) 70%,rgba(0,0,0,0))}
.cp-nav::-webkit-scrollbar{display:none}
.cp-nav a{flex:0 0 auto;font-family:var(--font-mono,'JetBrains Mono',monospace);font-size:.72rem;letter-spacing:.06em;
  text-transform:uppercase;color:var(--text-dim,#a9b3ae);text-decoration:none;padding:.45rem .75rem;border-radius:999px;
  border:1px solid var(--border,#2a3230);min-height:36px;display:inline-flex;align-items:center;background:var(--bg,#0d1110)}
.cp-nav a:hover{color:var(--text,#e8ece9);border-color:var(--acc)}

/* ── sections ── */
.cp-sec{margin:2.2rem 0 0;scroll-margin-top:60px}
.cp-h2{display:flex;align-items:baseline;gap:.7rem;flex-wrap:wrap;margin:0 0 .9rem}
.cp-h2 h2{font-size:1.3rem;letter-spacing:-.01em;margin:0}
.cp-h2 .cp-eyebrow{margin-left:auto}
.cp-card{border:1px solid var(--border,#2a3230);border-radius:14px;background:var(--surface,#141918);padding:1.2rem 1.25rem}
.cp-note{font-size:.84rem;line-height:1.6;color:var(--text-dim,#a9b3ae);margin:.6rem 0 0}
.cp-note b{color:var(--text,#e8ece9)}

/* ── KPIs ── */
.cp-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.7rem}
.cp-kpi{border:1px solid var(--border,#2a3230);border-radius:14px;padding:1rem 1.05rem;background:var(--surface,#141918);min-width:0}
.cp-kpi-n{font-family:var(--font-display,'Inter',sans-serif);font-weight:800;font-size:clamp(1.6rem,3.4vw,2.3rem);
  line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cp-kpi-n.is-empty{color:var(--text-muted,#7d8782)}
.cp-kpi-k{font-size:.8rem;color:var(--text-dim,#a9b3ae);margin-top:.4rem;line-height:1.35}
.cp-kpi-s{font-family:var(--font-mono,'JetBrains Mono',monospace);font-size:.68rem;color:var(--text-muted,#7d8782);margin-top:.35rem}

/* ── the ad ── */
.cp-tabs{display:flex;gap:.35rem;flex-wrap:wrap;margin:0 0 .8rem;align-items:center}
.cp-tab{font-family:var(--font-mono,'JetBrains Mono',monospace);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;
  padding:.5rem .8rem;border-radius:8px;border:1px solid var(--border,#2a3230);background:transparent;color:var(--text-dim,#a9b3ae);
  cursor:pointer;min-height:40px}
.cp-tab[aria-selected="true"]{background:rgba(var(--acc-rgb),.12);border-color:var(--acc);color:var(--text,#e8ece9)}
.cp-tab:focus-visible,.cp-dev button:focus-visible,.cp-copy:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.cp-dev{margin-left:auto;display:inline-flex;border:1px solid var(--border,#2a3230);border-radius:8px;overflow:hidden}
.cp-dev button{font-family:var(--font-mono,'JetBrains Mono',monospace);font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;
  padding:.45rem .7rem;background:transparent;color:var(--text-dim,#a9b3ae);border:0;cursor:pointer;min-height:40px}
.cp-dev button[aria-pressed="true"]{background:rgba(var(--acc-rgb),.14);color:var(--text,#e8ece9)}
.cp-stage{border:1px dashed var(--border,#2a3230);border-radius:14px;padding:1.4rem;
  background:repeating-linear-gradient(45deg,rgba(128,128,128,.035) 0 10px,rgba(0,0,0,0) 10px 20px),var(--bg,#0d1110)}
.cp-frame{container-type:inline-size;container-name:sa-frame;margin:0 auto;max-width:760px;transition:max-width .25s}
.cp-frame.is-phone{max-width:380px}
.cp-frame .sa-ad{margin:0}
.cp-where{font-size:.8rem;color:var(--text-muted,#7d8782);margin:.8rem 0 0;text-align:center}
.cp-mail{background:#fdfcf9;border-radius:10px;padding:1rem;color:#14100a}
.cp-pre{font-family:var(--font-mono,'JetBrains Mono',monospace);font-size:.78rem;line-height:1.6;white-space:pre-wrap;word-break:break-word;
  margin:0;padding:1rem;border-radius:10px;background:var(--surface,#141918);border:1px solid var(--border,#2a3230);color:var(--text,#e8ece9)}

.cp-proof{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1rem;align-items:center;margin:1.1rem 0 0}
.cp-code{font-family:var(--font-mono,'JetBrains Mono',monospace);font-size:1.35rem;font-weight:800;letter-spacing:.18em;color:var(--acc)}
.cp-proof-acts{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:flex-end}
.cp-fields{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:.4rem 1rem;margin:.8rem 0 0;font-size:.86rem}
.cp-fields dt{font-family:var(--font-mono,'JetBrains Mono',monospace);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-muted,#7d8782);padding-top:.15rem}
.cp-fields dd{margin:0;color:var(--text,#e8ece9);word-break:break-word}
.cp-sum{cursor:pointer;min-height:40px;display:flex;align-items:center}

/* ── performance ── */
.cp-chart{width:100%;height:210px;display:block}
.cp-chart text{font-family:'JetBrains Mono',monospace;font-size:10px;fill:var(--text-muted,#7d8782)}
.cp-win{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.6rem;margin:.9rem 0 0}
.cp-win div{border:1px solid var(--border,#2a3230);border-radius:10px;padding:.7rem .8rem}
.cp-win b{display:block;font-size:1.15rem;font-variant-numeric:tabular-nums}
.cp-win span{font-size:.76rem;color:var(--text-muted,#7d8782)}
table.cp-t{width:100%;border-collapse:collapse;font-size:.88rem;margin:.9rem 0 0}
.cp-t th{text-align:left;font-family:var(--font-mono,'JetBrains Mono',monospace);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-muted,#7d8782);font-weight:500;padding:0 .8rem .5rem 0;border-bottom:1px solid var(--border,#2a3230)}
.cp-t td{padding:.55rem .8rem .55rem 0;border-bottom:1px solid var(--border,#2a3230);vertical-align:top}
.cp-t td.n{font-family:var(--font-mono,'JetBrains Mono',monospace);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.cp-t tr:last-child td{border-bottom:0}
.cp-wait{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7rem}
.cp-wait div{border:1px solid var(--border,#2a3230);border-radius:12px;padding:.9rem 1rem;background:var(--surface,#141918)}
.cp-wait b{display:block;font-size:.95rem;margin-bottom:.25rem}
.cp-wait span{font-size:.82rem;color:var(--text-dim,#a9b3ae);line-height:1.5}

/* ── placements ── */
.cp-places{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}
.cp-place{border:1px solid var(--border,#2a3230);border-radius:12px;padding:.95rem 1rem;background:var(--surface,#141918)}
.cp-place-t{display:flex;align-items:center;gap:.55rem;font-weight:800}
.cp-place-t i{font-style:normal;width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;
  background:rgba(var(--acc-rgb),.14);color:var(--acc);font-size:.9rem;flex:0 0 auto}
.cp-place p{font-size:.84rem;color:var(--text-dim,#a9b3ae);line-height:1.55;margin:.45rem 0 0}

/* ── billing ── */
.cp-bill{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:.8rem}
.cp-plan-name{font-family:var(--font-mono,'JetBrains Mono',monospace);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.cp-plan-price{font-family:var(--font-display,'Inter',sans-serif);font-weight:800;font-size:2.5rem;letter-spacing:-.03em;line-height:1;margin:.45rem 0 .2rem}
.cp-plan-price small{font-size:.95rem;font-weight:600;color:var(--text-dim,#a9b3ae);letter-spacing:0}
.cp-plan ul{list-style:none;padding:0;margin:.8rem 0 0;font-size:.86rem}
.cp-plan li{padding:.4rem 0 .4rem 1.4rem;position:relative;color:var(--text-dim,#a9b3ae);line-height:1.45}
.cp-plan li::before{content:"";position:absolute;left:.1rem;top:.78rem;width:.55rem;height:.3rem;border-left:2px solid var(--ok);
  border-bottom:2px solid var(--ok);transform:rotate(-45deg)}
.cp-tl{list-style:none;margin:0;padding:0}
.cp-tl li{display:grid;grid-template-columns:130px minmax(0,1fr);gap:.8rem;padding:.7rem 0;border-bottom:1px solid var(--border,#2a3230)}
.cp-tl li:last-child{border-bottom:0}
.cp-tl-d{font-family:var(--font-mono,'JetBrains Mono',monospace);font-size:.8rem;font-weight:700;color:var(--text,#e8ece9)}
.cp-tl-d.is-tbd{color:var(--text-muted,#7d8782);font-weight:500}
.cp-tl-w b{display:block;font-size:.9rem}
.cp-tl-w span{font-size:.8rem;color:var(--text-dim,#a9b3ae);line-height:1.5}
.cp-tl li.is-now .cp-tl-d{color:var(--acc)}

/* ── links + definitions ── */
.cp-links td:first-child{font-family:var(--font-mono,'JetBrains Mono',monospace);color:var(--text-dim,#a9b3ae);white-space:nowrap;width:1%}
.cp-links code{font-family:var(--font-mono,'JetBrains Mono',monospace);font-size:.74rem;word-break:break-all}
.cp-copy{font-family:var(--font-mono,'JetBrains Mono',monospace);font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;
  background:transparent;border:1px solid var(--border,#2a3230);color:var(--text-dim,#a9b3ae);border-radius:6px;padding:.3rem .6rem;cursor:pointer;min-height:36px}
.cp-copy:hover{border-color:var(--acc);color:var(--text,#e8ece9)}
.cp-def dt{font-family:var(--font-mono,'JetBrains Mono',monospace);font-size:.74rem;letter-spacing:.05em;color:var(--gold,#d4a23f);margin-top:.9rem}
.cp-def dt:first-child{margin-top:0}
.cp-def dd{margin:.25rem 0 0;font-size:.86rem;line-height:1.65;color:var(--text-dim,#a9b3ae)}

.cp-contact{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;justify-content:space-between}
.cp-contact-who b{display:block;font-size:1.05rem}
.cp-contact-who span{font-size:.86rem;color:var(--text-dim,#a9b3ae)}
.cp-foot{margin-top:1.4rem;font-size:.76rem;color:var(--text-muted,#7d8782);line-height:1.6}
.cp-err{padding:3rem 0;color:var(--text-dim,#a9b3ae);text-align:center}


/* ── audience: the dashboard ──
   Flat cards, one hue for magnitude (the ad orange), two series colours for
   the trend lines (blue, orange -- validated for colour-blind separation on
   both themes). Numbers in mono, text in text ink, never in a series colour. */
.cp-aud{--s1:#3987e5;--s2:#d95926}
[data-theme="light"] .cp-aud{--s1:#2a78d6;--s2:#d95926}
.cp-aud-head{display:flex;align-items:center;gap:.6rem 1rem;flex-wrap:wrap;margin:0 0 .9rem}
.cp-aud-head h2{font-size:1.3rem;letter-spacing:-.01em;margin:0}
.cp-pills{display:inline-flex;border:1px solid var(--border,#2a3230);border-radius:10px;overflow:hidden;margin-left:auto}
.cp-pills button{font-family:var(--font-mono,'JetBrains Mono',monospace);font-size:.72rem;letter-spacing:.04em;padding:.45rem .8rem;
  min-height:38px;background:transparent;color:var(--text-dim,#a9b3ae);border:0;border-left:1px solid var(--border,#2a3230);cursor:pointer}
.cp-pills button:first-child{border-left:0}
.cp-pills button[aria-pressed="true"]{background:var(--text,#e8ece9);color:var(--bg,#0d1110);font-weight:700}
.cp-pills button:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.cp-asof{width:100%;font-family:var(--font-mono,'JetBrains Mono',monospace);font-size:.68rem;color:var(--text-muted,#7d8782)}
.cp-grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.7rem;margin-top:.7rem}
.cp-grid2>.cp-card{margin:0}
.cp-ct{display:flex;align-items:baseline;justify-content:space-between;gap:.6rem;flex-wrap:wrap;margin:0 0 .6rem}
.cp-ct h3{font-size:.95rem;margin:0;font-weight:700}
.cp-ct span{font-family:var(--font-mono,'JetBrains Mono',monospace);font-size:.66rem;color:var(--text-muted,#7d8782)}
.cp-keys{display:flex;gap:.9rem;flex-wrap:wrap;font-size:.76rem;color:var(--text-dim,#a9b3ae);margin:0 0 .4rem}
.cp-keys i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:.35rem}
.cp-tr{position:relative}
.cp-tr svg{width:100%;height:190px;display:block;overflow:visible}
.cp-tr text{font-family:'JetBrains Mono',monospace;font-size:10px;fill:var(--text-muted,#7d8782)}
.cp-tr .gl{stroke:var(--border,#2a3230);stroke-width:1}
.cp-tr .xh{stroke:var(--text-muted,#7d8782);stroke-width:1;stroke-dasharray:3 3}
.cp-tr .hit{fill:transparent;cursor:crosshair}
.cp-aud-map{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px;max-width:620px;margin:0 auto}
.cp-tile{position:relative;aspect-ratio:1/1;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono,'JetBrains Mono',monospace);font-size:clamp(.55rem,1.6vw,.72rem);font-weight:700;
  color:var(--text,#e8ece9);background:rgba(var(--acc-rgb),var(--a,.06));border:1px solid transparent;cursor:default;min-width:0}
.cp-tile.is-dark{color:#0d1117}
.cp-tile.is-lic{box-shadow:inset 0 0 0 2px var(--text,#e8ece9)}
.cp-tile.is-flag::after{content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--text-muted,#7d8782)}
.cp-tile:focus-visible,.cp-tile:hover{outline:2px solid var(--text,#e8ece9);outline-offset:1px;z-index:1}
.cp-tip{position:absolute;z-index:6;pointer-events:none;min-width:170px;padding:.55rem .7rem;border-radius:8px;
  background:var(--bg,#0d1110);border:1px solid var(--border,#2a3230);box-shadow:0 10px 24px -14px rgba(0,0,0,.7);
  font-size:.78rem;line-height:1.55;color:var(--text-dim,#a9b3ae);white-space:nowrap}
.cp-tip b{display:block;color:var(--text,#e8ece9);font-size:.84rem;margin-bottom:.1rem}
.cp-tip span{font-family:var(--font-mono,'JetBrains Mono',monospace);color:var(--text,#e8ece9);float:right;margin-left:1rem}
.cp-tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:.35rem}
.cp-legend{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;justify-content:center;margin:.9rem 0 0;
  font-family:var(--font-mono,'JetBrains Mono',monospace);font-size:.66rem;color:var(--text-muted,#7d8782)}
.cp-legend-ramp{display:inline-flex;gap:3px;align-items:center}
.cp-legend-ramp i{width:22px;height:10px;border-radius:2px;background:rgba(var(--acc-rgb),var(--a))}
.cp-legend-key{display:inline-flex;align-items:center;gap:.35rem}
.cp-legend-key i{width:11px;height:11px;border-radius:2px;display:inline-block}
.cp-legend-key .k-lic{box-shadow:inset 0 0 0 2px var(--text,#e8ece9)}
.cp-legend-key .k-flag{width:6px;height:6px;border-radius:50%;background:var(--text-muted,#7d8782)}
.cp-lic{display:flex;gap:.4rem 1.2rem;flex-wrap:wrap;justify-content:center;margin:0 0 .9rem;font-size:.86rem;color:var(--text-dim,#a9b3ae)}
.cp-lic b{color:var(--text,#e8ece9);font-family:var(--font-mono,'JetBrains Mono',monospace)}
.cp-aud-t td:first-child{width:1%;white-space:nowrap;color:var(--text-muted,#7d8782);font-family:var(--font-mono,'JetBrains Mono',monospace)}

/* ── requests ── */

  border-radius:9px;border:1px solid var(--border,#2a3230);background:transparent;color:var(--text-dim,#a9b3ae);cursor:pointer}

.cp-req-f input,.cp-req-f select,.cp-req-f textarea{width:100%;max-width:560px;font:inherit;font-size:.92rem;color:var(--text,#e8ece9);background:var(--bg,#0d1110);
  border:1px solid var(--border,#2a3230);border-radius:9px;padding:.6rem .7rem;min-height:44px}

.cp-req-terms{max-width:560px;margin:0 0 .85rem}
.cp-req a{color:var(--text,#e8ece9)}

  .cp-tile{border-radius:4px}

  .cp-dev{margin-left:0}

  .cp-links td:first-child{white-space:normal;width:auto}
  .cp-nav{margin:1rem -.9rem 0;padding:.6rem .9rem}
  /* Phone: the two derived columns go; both are in each tile's tooltip. */
  .cp-aud-t th:nth-child(5),.cp-aud-t td:nth-child(5),.cp-aud-t th:nth-child(6),.cp-aud-t td:nth-child(6){display:none}
  .cp-aud-t .cp-tag{display:inline-block;margin:.2rem 0 0 0}
  .cp-aud-t td:nth-child(2) .cp-tag{margin-left:.35rem}
}
[data-theme="light"] .cp{--ok:#1f9d55;--ok-rgb:31,157,85}
[data-theme="light"] .cp-code,[data-theme="light"] .cp-plan-name,[data-theme="light"] .cp-tl li.is-now .cp-tl-d{color:#a8380a}

</style>
</head>
<body>
<main class="cp" id="cp">
  <div class="cp-err" id="cp-loading">Loading your campaign&hellip;</div>
</main>

<script>
/* THE CAMPAIGN PORTAL.
 *
 * Reads one baked file, data/sponsors/<slug>-<token>.json, written by
 * scripts/build_sponsor_report.py: the numbers straight out of GA4 (through
 * yesterday), the creative with its proof code, the rate card, and the deal as
 * typed into data/sponsors.json. Nothing is counted or estimated here.
 *
 * THE AD PREVIEWS ARE THE AD. The homepage and /daily tabs are drawn by
 * components/sponsor-ad.js, the file those pages load; the archive tab is the
 * block scripts/generate_daily.py bakes, held byte-identical to the JS by
 * scripts/sponsor-checks.mjs; the email tab is brief_email.sponsor_block().
 * No preview carries a measurement slot, so looking at your own proof never
 * counts as an impression.
 *
 * THE LINK IS THE KEY, AND THAT IS OBSCURITY, NOT A LOGIN. Anyone holding the
 * URL can read this page. It has to survive being forwarded to a marketing
 * person, so nothing on it would matter if it leaked.
 */
(function () {
  var root = document.getElementById('cp');
  function die(msg) { root.innerHTML = '<div class="cp-err">' + msg + '</div>'; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function num(n) { return n == null ? '—' : Number(n).toLocaleString('en-US'); }

  /* Dates are calendar days, not instants: 'YYYY-MM-DD' in, UTC arithmetic,
     so a reader in another time zone never sees a start date move by a day. */
  function D(s) { return s ? new Date(s + 'T12:00:00Z') : null; }
  function iso(d) { return d.toISOString().slice(0, 10); }
  function addDays(s, n) { var d = D(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); }
  function addMonths(s, n) {
    /* setUTCMonth alone rolls over: Aug 31 + 6 months lands on Mar 3, so a
       six-month rate lock would end three days late. Clamp to the last day of
       the target month instead. */
    var d = D(s), day = d.getUTCDate();
    d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() + n);
    var last = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0, 12)).getUTCDate();
    d.setUTCDate(Math.min(day, last));
    return iso(d);
  }
  function fmt(s, yr) {
    if (!s || isNaN(D(s))) return '';
    return D(s).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: yr ? 'numeric' : undefined, timeZone: 'UTC' });
  }
  function localToday() { var n = new Date(); return iso(new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate(), 12))); }
  var TODAY = localToday();

  var r = (new URLSearchParams(location.search).get('r') || '').replace(/[^a-z0-9-]/gi, '');
  if (!r) return die('This page needs the link you were sent.');

  /* The audience file is site-wide and OPTIONAL. If it is missing or broken the
     page is exactly the page it was before it existed -- the sponsor's own
     link must never fail because of it. */
  var AUDP = fetch('/data/audience.json', { cache: 'no-cache' })
    .then(function (x) { return x.ok ? x.json() : null; })
    .then(function (a) {
      /* Only the shape this page draws. Anything else is treated as absent. */
      return a && a.schema === 'agsist-audience/2' && Array.isArray(a.ranges) && a.ranges.length && a.totals && a.states ? a : null;
    })
    .catch(function () { return null; });

  fetch('/data/sponsors/' + r + '.json', { cache: 'no-cache' })
    .then(function (x) { if (!x.ok) throw 0; return x.json(); })
    .then(function (d) { return AUDP.then(function (a) { d.__aud = a; return d; }); })
    .then(function (d) {
      /* A failure INSIDE the drawing is not a bad link, and saying so sends the
         sponsor chasing the wrong thing. The two are separated here. */
      try { draw(d); }
      catch (e) {
        die('Something went wrong drawing this page. Your link is fine — reply to the ' +
            'email it came in and we will fix it today.<br><small>' + esc(String((e && e.message) || e)) + '</small>');
      }
    })
    .catch(function () {
      die('That campaign link is not recognised. If it was working before, reply to the ' +
          'email it came in and we will send a fresh one.');
    });

  /* ───────────────────────────── state ───────────────────────────── */
  /* A date typed by hand into data/sponsors.json can be malformed ("2026-9-1"),
     and toISOString() on an Invalid Date THROWS. That threw inside draw(), the
     fetch's .catch swallowed it, and the sponsor was told their link was not
     recognised -- a support ticket about a link that is fine. Anything that is
     not YYYY-MM-DD is treated as "no start date": the page then shows the
     pending schedule, which is honest, instead of dying. */
  function okDate(x) { return typeof x === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(x) && !isNaN(D(x)); }
  function state(d) {
    var c = d.creative || null, ap = d.approval || null;
    var code = c && c.proof_code;
    var bill = d.billing || {};
    var tiers = (d.rateCard && d.rateCard.tiers) || [];
    var tierId = bill.tier || (c && c.tier) || null;
    var tier = null;
    tiers.forEach(function (t) { if (t.id === tierId) tier = t; });
    var s = {
      c: c, code: code, ap: ap, bill: bill, tier: tier,
      approved: !!(ap && ap.proof && code && ap.proof === code),
      stale: !!(ap && ap.proof && code && ap.proof !== code),
      live: !!(c && c.live),
      trialW: (isFinite(+bill.trial_weeks) && +bill.trial_weeks >= 0) ? Math.floor(+bill.trial_weeks) : 0,
      lockM: (isFinite(+bill.rate_lock_months) && +bill.rate_lock_months > 0) ? Math.floor(+bill.rate_lock_months) : null,
      start: okDate(d.start) ? d.start : null
    };
    if (s.start) {
      s.trialEnd = s.trialW ? addDays(s.start, s.trialW * 7 - 1) : null;
      s.firstBilled = addDays(s.start, s.trialW * 7);
      s.lockEnd = s.lockM ? addDays(addMonths(s.start, s.lockM), -1) : null;
      s.dayN = Math.floor((D(TODAY) - D(s.start)) / 864e5) + 1;
      s.inTrial = !!(s.trialEnd && TODAY >= s.start && TODAY <= s.trialEnd);
      s.trialLeft = s.inTrial ? Math.floor((D(s.trialEnd) - D(TODAY)) / 864e5) + 1 : 0;
    }
    return s;
  }

  function approveHref(d, s) {
    var f = (s.c && s.c.fields) || {};
    var to = d.approveTo || 'sig@farmers1st.com';
    var subj = 'Approved: ' + (f.advertiser || d.sponsor) + ' ad, proof ' + (s.code || '');
    var body = 'I approve the ad on my AGSIST campaign page with proof code ' + (s.code || '') + '.\n\n' +
      'Headline: ' + (f.headline || '') + '\nButton: ' + (f.cta_text || '') + ' -> ' + (f.cta_url || '') +
      (f.phone ? '\nPhone: ' + f.phone : '') + '\n\nIf the copy changes, this approval does not carry over.\n\n';
    return 'mailto:' + encodeURIComponent(to) + '?subject=' + encodeURIComponent(subj) + '&body=' + encodeURIComponent(body);
  }
  function changesHref(d, s) {
    var to = d.approveTo || 'sig@farmers1st.com';
    return 'mailto:' + encodeURIComponent(to) + '?subject=' +
      encodeURIComponent('Changes to our AGSIST ad (proof ' + (s.code || '') + ')') +
      '&body=' + encodeURIComponent('Here is what we would like changed:\n\n');
  }

  /* ───────────────────────────── hero ───────────────────────────── */
  function hero(d, s) {
    var f = (s.c && s.c.fields) || {};
    var name = f.advertiser || d.sponsor;
    var logo = f.logo ? '<div class="cp-logo"><img src="' + esc(f.logo) + '" alt="' + esc(name + ' logo') +
      '" onerror="this.parentNode.className+=\' sa-logo--text\'"><span class="sa-wordmark">' + esc(name) + '</span></div>' : '';
    var h = '<header class="cp-hero">';
    h += '<div class="cp-hero-top"><div class="cp-brands">' + logo + (logo ? '<span class="cp-x" aria-hidden="true">&times;</span>' : '') +
         '<span class="cp-agsist">AG<span>SIST</span></span></div><span class="cp-eyebrow">Campaign portal</span></div>';
    h += '<h1>' + esc(d.sponsor) + '</h1>';
    h += '<p class="cp-sub">' + (s.tier ? '<b>' + esc(s.tier.name) + '</b> of the AGSIST Daily' : 'Sponsor of the AGSIST Daily') +
         (d.contact ? ' &middot; ' + esc(d.contact) : '') + '</p>';

    /* ONE STATUS, WITH THE NEXT THING TO DO. */
    var st;
    if (!s.c) {
      st = { ok: false, h: 'Your ad is being written', p: 'It will appear here for your approval before anything runs.' };
    } else if (s.live && s.start) {
      st = { ok: true, h: 'Live' + (s.dayN > 0 ? ' · day ' + s.dayN : ''),
             p: (s.inTrial ? 'Free weeks: ' + s.trialLeft + ' day' + (s.trialLeft === 1 ? '' : 's') + ' left, through ' + esc(fmt(s.trialEnd, true)) + '. ' : '') +
                'Results update every morning, through the end of yesterday.' };
    } else if (s.live) {
      st = { ok: true, h: 'Live', p: 'The start date is being recorded. Your counter begins with it.' };
    } else if (s.approved) {
      st = { ok: true, h: 'Approved' + (fmt(s.ap.on, true) ? ' on ' + esc(fmt(s.ap.on, true)) : ''),
             p: 'Proof ' + esc(s.code) + ' is locked in. Your ad goes into the next morning’s briefing, and your free weeks start that day.' };
    } else if (s.stale) {
      st = { ok: false, h: 'The ad changed after you approved it',
             p: 'You approved proof ' + esc(s.ap.proof) + '. The ad below is proof ' + esc(s.code) + '. Look it over and approve again, or tell us what to change.', btn: true };
    } else {
      st = { ok: false, h: 'Waiting for your approval',
             p: 'Look over your ad below. When it reads right, press approve: it opens an email with proof code ' + esc(s.code) + ' filled in. Nothing runs until that email arrives.', btn: true };
    }
    h += '<div class="cp-status' + (st.ok ? ' is-ok' : '') + '" role="status"><span class="cp-status-dot" aria-hidden="true"></span>' +
         '<div class="cp-status-txt"><div class="cp-status-h">' + st.h + '</div><p class="cp-status-p">' + st.p + '</p></div>' +
         (st.btn ? '<a class="cp-btn" href="' + approveHref(d, s) + '">Approve proof ' + esc(s.code) + ' &rarr;</a>' : '') + '</div>';

    /* THE FIVE STEPS. Each is done, now, or next; none is decoration. */
    var steps = [
      { t: 'Ad written', d: s.c ? 'Proof ' + s.code : 'In progress', done: !!s.c },
      { t: 'You approve', d: s.approved ? (fmt(s.ap.on, true) || 'Approved') : (s.stale ? 'Needs a new yes' : 'One email'), done: s.approved || s.live },
      { t: 'Goes live', d: s.start ? fmt(s.start, true) : 'Next briefing after approval', done: s.live && !!s.start },
      { t: s.trialW ? s.trialW + ' free weeks' : 'Free weeks', d: s.trialEnd ? 'Through ' + fmt(s.trialEnd, true) : 'From the first day', done: !!(s.trialEnd && TODAY > s.trialEnd) },
      { t: 'Billing starts', d: s.firstBilled ? fmt(s.firstBilled, true) : 'After the free weeks', done: !!(s.firstBilled && TODAY >= s.firstBilled) }
    ];
    var nowIdx = -1;
    for (var i = 0; i < steps.length; i++) { if (!steps[i].done) { nowIdx = i; break; } }
    h += '<ol class="cp-steps" aria-label="Campaign steps">';
    steps.forEach(function (x, i) {
      var cls = x.done ? ' is-done' : (i === nowIdx ? ' is-now' : '');
      h += '<li class="cp-step' + cls + '"' + (i === nowIdx ? ' aria-current="step"' : '') + '><div class="cp-step-n">' +
           (x.done ? '✓ ' : '') + '0' + (i + 1) + '</div><div class="cp-step-t">' + esc(x.t) + '</div><div class="cp-step-d">' + esc(x.d) + '</div></li>';
    });
    return h + '</ol></header>';
  }

  function nav(hasAud) {
    var items = [['#ad', 'Your ad'], ['#results', 'Results'], ['#audience', 'Audience'], ['#where', 'Where it runs'], ['#billing', 'Billing'], ['#requests', 'Requests'], ['#links', 'Tracking links'], ['#how', 'How we count']];
    if (!hasAud) items = items.filter(function (x) { return x[0] !== '#audience'; });
    return '<nav class="cp-nav" aria-label="Sections">' + items.map(function (x) { return '<a href="' + x[0] + '">' + x[1] + '</a>'; }).join('') + '</nav>';
  }

  /* ───────────────────────────── results ───────────────────────────── */
  function kpi(n, k, sub, empty) {
    return '<div class="cp-kpi"><div class="cp-kpi-n' + (empty ? ' is-empty' : '') + '">' + n + '</div><div class="cp-kpi-k">' + k + '</div>' +
           (sub ? '<div class="cp-kpi-s">' + sub + '</div>' : '') + '</div>';
  }
  function results(d, s) {
    var t = d.totals || {};
    var h = '<section class="cp-sec" id="results"><div class="cp-h2"><h2>Results</h2><span class="cp-eyebrow">' +
      (d.pending ? 'Counting starts with your first ad' : 'Through ' + esc(fmt(d.through, true)) + ' · from GA4') + '</span></div>';
    if (d.pending) {
      h += '<div class="cp-kpis">' +
        kpi('—', 'Viewable impressions', 'MRC standard', true) + kpi('—', 'Clicks', 'button + phone', true) +
        kpi('—', 'Click-through rate', 'clicks ÷ viewable', true) +
        kpi('0', 'Days live', s.start ? 'from ' + esc(fmt(s.start)) : 'starts on day one', true) + '</div>';
      h += '<div class="cp-wait" style="margin-top:.7rem">' +
        '<div><b>No numbers until your ad runs.</b><span>The alternative is showing you site traffic that was not yours. This page fills in on its own from the first morning.</span></div>' +
        '<div><b>Every morning, through yesterday.</b><span>GA4 keeps adjusting today for hours, so a number here never changes after you have seen it.</span></div>' +
        '<div><b>Check us against your own analytics.</b><span>Every placement sends visitors with its own tagged link, listed below, so each click shows up on your side too.</span></div></div>';
      return h + '</section>';
    }
    h += '<div class="cp-kpis">' +
      kpi(num(t.viewable), 'Viewable impressions', 'half the ad, one second') +
      kpi(num(t.clicks), 'Clicks', 'button + phone') +
      kpi(t.ctr == null ? '—' : t.ctr.toFixed(2) + '%', 'Click-through rate', 'clicks ÷ viewable', t.ctr == null) +
      kpi(num((d.series || []).length), 'Days reported', s.start ? 'since ' + esc(fmt(s.start)) : '') + '</div>';
    h += '<div class="cp-card" style="margin-top:.7rem">' + chart(d.series || []);
    if (d.windows && d.windows.length) {
      h += '<div class="cp-win">';
      d.windows.forEach(function (w) {
        h += '<div><b>' + num(w.viewable) + '</b><span>viewable, last ' + esc(w.days) + ' days &middot; ' + num(w.clicks) + ' click' +
             (w.clicks === 1 ? '' : 's') + (w.ctr == null ? '' : ' &middot; ' + w.ctr.toFixed(2) + '%') + '</span></div>';
      });
      h += '</div>';
    }
    if (d.byPage && d.byPage.length) {
      h += '<table class="cp-t"><thead><tr><th>Page</th><th style="text-align:right">Viewable</th><th style="text-align:right">Clicks</th>' +
           '<th style="text-align:right">CTR</th></tr></thead><tbody>';
      d.byPage.forEach(function (p) {
        var ctr = p.viewable ? (100 * p.clicks / p.viewable) : null;
        h += '<tr><td>' + esc(p.page) + '</td><td class="n">' + num(p.viewable) + '</td><td class="n">' + num(p.clicks) +
             '</td><td class="n">' + (ctr == null ? '—' : ctr.toFixed(2) + '%') + '</td></tr>';
      });
      h += '</tbody></table>';
    }
    return h + '</div></section>';
  }

  /* One scale, the axis labelled at values the chart reaches. Bars are
     viewable impressions; a dot marks a day with a click. */
  function chart(series) {
    if (!series.length) return '<p class="cp-note" style="margin:0">No complete days yet. The first bar appears the morning after your first full day.</p>';
    var W = 900, H = 210, L = 38, B = 24, T = 14;

      xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.style.display = '';
      keys.forEach(function (k, j) { var c = svg.querySelector('.dot' + j), v = d[k[0]];
        if (v == null) { c.style.display = 'none'; return; } c.setAttribute('cx', x(i)); c.setAttribute('cy', y(v)); c.style.display = ''; });
      tip.innerHTML = '<b>' + esc(fmt(d.d, true)) + '</b>' + keys.map(function (k) { return '<i style="background:' + k[2] + '"></i>' + esc(k[1]) + '<span>' + (d[k[0]] == null ? '—' : num(d[k[0]])) + '</span>'; }).join('<br>');
      tip.hidden = false;
      var tx = x(i) * r.width / W + 12; if (tx + tip.offsetWidth > r.width) tx = x(i) * r.width / W - tip.offsetWidth - 12;
      tip.style.left = Math.max(0, tx) + 'px'; tip.style.top = '8px';
    }
    function off() { tip.hidden = true; xh.style.display = 'none'; keys.forEach(function (k, j) { svg.querySelector('.dot' + j).style.display = 'none'; }); }
    var hit = svg.querySelector('.hit');
    /* A tap is followed by emulated mouse events, including a mouseleave that
       would hide the reading the finger just asked for. On touch, the reading
       stays until the next tap somewhere else. */
    var touched = 0;
    function tat(ev) { touched = Date.now(); at(ev); }
    hit.addEventListener('mousemove', function (ev) { if (Date.now() - touched > 800) at(ev); });
    hit.addEventListener('click', function (ev) { if (Date.now() - touched > 800) at(ev); });
    hit.addEventListener('touchstart', tat, { passive: true }); hit.addEventListener('touchmove', tat, { passive: true });
    hit.addEventListener('mouseleave', function () { if (Date.now() - touched > 800) off(); });
    document.addEventListener('touchstart', function (ev) { if (!el.contains(ev.target)) off(); }, { passive: true });
  }

  function wireAudience() {
    var a = AUD.a; if (!a) return;

    var days = (a.series && a.series.days || []).filter(function (x) { return x.d >= R.start && x.d <= R.end; });
    [].forEach.call(box.querySelectorAll('[data-tr]'), function (el) {

      if (k === 's') lineChart(el, days, [['gClicks', 'Google, US', 'var(--s1)'], ['bClicks', 'Bing, worldwide', 'var(--s2)']]);
      if (k === 'ai') lineChart(el, a.ai.days, [['c', 'AI citations', 'var(--s2)']]);

    var rows = (a.states || {})[AUD.r] || [], by = {}; rows.forEach(function (r) { by[r.code] = r; });
    var wrap = document.getElementById('cp-aud-map'), tip = document.getElementById('cp-tip');
    var lic = Array.isArray(AUD.d.licensedStates) ? AUD.d.licensedStates : [];
    function show(el) {
      var c = el.getAttribute('data-st'), r = by[c];
      tip.innerHTML = r ? '<b>' + esc(r.name) + (lic.indexOf(c) >= 0 ? ' &middot; licensed' : '') + '</b>Engaged visits<span>' + num(r.engaged) + '</span><br>Readers<span>' + num(r.users) + '</span>' +
        (r.users >= THIN ? '<br>Time per reader<span>' + esc(secs(r.avgSeconds)) + '</span>' : '') +
        (r.flag === 'server' ? '<br>Includes server traffic' : r.flag === 'home' ? '<br>Includes our own visits' : '') : '<b>' + esc(c) + '</b>No readers in this range';
      tip.hidden = false;
      var wb = wrap.getBoundingClientRect(), eb = el.getBoundingClientRect();
      var x = eb.left - wb.left + eb.width / 2 - tip.offsetWidth / 2, y = eb.top - wb.top - tip.offsetHeight - 8;
      x = Math.max(4, Math.min(x, wb.width - tip.offsetWidth - 4)); if (y < 4) y = eb.bottom - wb.top + 8;
      tip.style.left = x + 'px'; tip.style.top = y + 'px';
    }
    [].forEach.call(wrap.querySelectorAll('.cp-tile'), function (el) {
      ['mouseenter', 'focus', 'click'].forEach(function (ev) { el.addEventListener(ev, function () { show(el); }); });
      ['mouseleave', 'blur'].forEach(function (ev) { el.addEventListener(ev, function () { tip.hidden = true; }); });
    });
    var more = document.getElementById('cp-aud-more'), t = document.getElementById('cp-aud-t');
    if (more) more.addEventListener('click', function () {
      var on = t.classList.toggle('is-all'); more.setAttribute('aria-expanded', String(on));

        var nb = box.querySelector('[data-range="' + AUD.r + '"]'); if (nb) nb.focus();

    });
  }
