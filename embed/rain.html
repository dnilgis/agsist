<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>County Rain Box | AGSIST</title>
<meta name="robots" content="noindex"><!-- embed target; canonical is the county rain page, set below once the county is known -->
<link rel="canonical" href="https://agsist.com/rain" id="canon">
<style>
  :root{--bg:#ffffff;--text:#1c2416;--dim:#5b6450;--border:#d6dccb;--brand:#2a6b1f;}
  @media (prefers-color-scheme:dark){:root{--bg:#141c10;--text:#eef0e6;--dim:#a9b29a;--border:#2a3320;--brand:#6cc46e;}}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;}
  .w{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);
     border:1px solid var(--border);border-radius:10px;padding:11px 14px;max-width:480px;margin:0 auto;}
  .ln{margin:0;font-size:15px;line-height:1.45;}
  .ln b{color:var(--brand);}
  .ln a{color:var(--brand);font-weight:700;text-decoration:none;white-space:nowrap;}
  .ln a:hover,.ln a:focus{text-decoration:underline;}
  .src{margin:5px 0 0;font-size:11px;color:var(--dim);}
</style>
</head>
<body>
<div class="w" id="w">
  <p class="ln" id="ln">Rain by county from <a href="https://agsist.com/rain?utm_source=embed" target="_blank" rel="noopener">AGSIST</a></p>
  <p class="src" id="src">NOAA daily records</p>
</div>
<script src="/components/rain-box.js?v=3"></script>
<script>
(function(){
'use strict';
function post(){try{parent.postMessage({agsist:'rain',height:document.body.scrollHeight},'*');}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
var q={};try{var u=new URLSearchParams(location.search);q.st=(u.get('st')||'').toUpperCase();q.c=u.get('c')||'';}catch(e){}
var B=window.AgRainBox;
if(!B||!/^[A-Z]{2}$/.test(q.st||'')||!B.STATES[q.st]||!/^\d{5}$/.test(q.c||'')){post();return;}
fetch('/data/rain/'+q.st.toLowerCase()+'.json').then(function(r){if(!r.ok)throw new Error(r.status);return r.json();}).then(function(d){
  var c=d&&d.counties&&d.counties[q.c];
  if(!c||d.state!==q.st||typeof c.total!=='number'){post();return;}
  var href='https://agsist.com'+B.path(c,q.st);
  try{document.getElementById('canon').href=href;}catch(e){}
  var t=B.line(c,q.st,d), tot=Number(c.total).toFixed(2)+' in';
  /* the line, with the total in bold; the AGSIST link goes to the county page */
  document.getElementById('ln').innerHTML=esc(t).replace(esc(tot),'<b>'+esc(tot)+'</b>')+
    ' <a href="'+esc(href)+'?utm_source=embed" target="_blank" rel="noopener">AGSIST</a>';
  document.getElementById('src').textContent=B.source(c);
  post();
}).catch(function(){post();});
window.addEventListener('resize',post);
post();
})();
</script>
</body>
</html>
