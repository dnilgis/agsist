name: Engine checkout
description: >-
  Puts the collection code (the paths in .github/engine-paths) in the workspace.
  mode empty: this repository's own copy (nothing changes). mode private: the
  engine branch of the private repo, checked out with PRIVATE_REPO_TOKEN and
  copied into place; a run on a branch (a pull request's head, or a dispatch on
  it) uses the engine branch of the same name when there is one. With "mode
  private" in .github/engine-paths the code is not in this repository at all. A failed
  checkout fails the job here, before any step can read or publish data.
inputs:
  token:
    description: PRIVATE_REPO_TOKEN (Contents read on the private repo)
    required: false
    default: ''
  mode:
    description: "'' or in-repo (this repository's copy), or private (the engine branch); the repository variable ENGINE_MODE"
    required: false
    default: ''
outputs:
  sha:
    description: the engine commit used (private mode)
    value: ${{ steps.overlay.outputs.sha }}
runs:
  using: composite
  steps:
    - id: plan
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        MODE: ${{ inputs.mode }}
        HAVE_TOKEN: ${{ inputs.token != '' }}
        RUN_BRANCH: ${{ github.event_name != 'pull_request_target' && (github.head_ref || github.ref_name) || '' }}
      run: bash "$GITHUB_ACTION_PATH/engine.sh" plan

    # the run's own branch on the engine (fx/x for a pull request from fx/x), when it exists; never on
    # pull_request_target, which runs with a write token (RUN_BRANCH is empty there)
    - id: paired
      if: steps.plan.outputs.private == 'true' && steps.plan.outputs.paired != ''
      continue-on-error: true
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      with:
        repository: ${{ steps.plan.outputs.repo }}
        ref: ${{ steps.plan.outputs.paired }}
        token: ${{ inputs.token }}
        path: .engine-pair
        persist-credentials: false

    # the default engine branch, always in private mode: with a paired branch it is what overlay compares that
    # branch with (the files it changes feed the test pick; the code is not in this repository's diff)
    - id: checkout
      if: steps.plan.outputs.private == 'true'
      continue-on-error: true
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      with:
        repository: ${{ steps.plan.outputs.repo }}
        ref: ${{ steps.plan.outputs.ref }}
        token: ${{ inputs.token }}
        path: .engine-src
        persist-credentials: false

    - id: behind
      if: steps.plan.outputs.private == 'true' && steps.checkout.outcome == 'success' && github.event_name == 'push' && github.ref_name == 'main'
      shell: bash
      working-directory: ${{ github.workspace }}
      run: bash "$GITHUB_ACTION_PATH/engine.sh" behind .engine-src

    - id: recheckout
      if: steps.behind.outputs.retry == 'true'
      continue-on-error: true
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      with:
        repository: ${{ steps.plan.outputs.repo }}
        ref: ${{ steps.plan.outputs.ref }}
        token: ${{ inputs.token }}
        path: .engine-src
        persist-credentials: false

    - id: overlay
      if: steps.plan.outputs.private == 'true'
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        CHECKOUT_OUTCOME: ${{ steps.recheckout.outcome == 'failure' && 'failure' || steps.checkout.outcome }}
        PAIRED_OUTCOME: ${{ steps.paired.outcome }}
        PAIRED: ${{ steps.plan.outputs.paired }}
        RUN_BRANCH: ${{ github.event_name != 'pull_request_target' && (github.head_ref || github.ref_name) || '' }}
      run: bash "$GITHUB_ACTION_PATH/engine.sh" overlay .engine-src
