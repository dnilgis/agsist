name: Fetch Prices
# Fetch Prices.

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Fetch even if the market is closed'
        type: boolean
        default: false
  schedule:
    - cron: '11 * * * *'

concurrency:
  group: fetch-prices
  cancel-in-progress: false

jobs:
  hours:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      open: ${{ steps.h.outputs.open }}
    steps:
      - id: h
        env:
          IN_FORCE: ${{ inputs.force }}
        run: |
          DOW=$(TZ=America/Chicago date +%u)
          HM=$(( 10#$(TZ=America/Chicago date +%H%M) ))
          OPEN=0
          case "$DOW" in
            7)       [ "$HM" -ge 1845 ] && OPEN=1 ;;
            1|2|3|4) { [ "$HM" -lt 1400 ] || [ "$HM" -ge 1845 ]; } && OPEN=1 ;;
            5)       { [ "$HM" -lt 1400 ] || [ "$HM" -ge 2330 ]; } && OPEN=1 ;;
            6)       [ "$HM" -lt 200 ] && OPEN=1 ;;
          esac
          [ "$IN_FORCE" = "true" ] && OPEN=1
          echo "CT day $DOW, $HM -> open=$OPEN"
          echo "open=$OPEN" >> "$GITHUB_OUTPUT"

  fetch:
    needs: hours
    if: needs.hours.outputs.open == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yfinance==1.7.0

      - name: Selftest — contract calendar + roll marking + feed gate
        run: |
          python scripts/contract_calendar.py
          python scripts/test_mark_rolls.py
          python scripts/test_preflight_limits.py
          python scripts/test_class_spreads.py
          python scripts/test_prev_close.py
          python scripts/test_overnight_settle.py
          python scripts/test_grain_symbols.py
          python scripts/test_nearby.py

      - name: Fetch once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_FROM_ACTIONS: ${{ vars.PAGES_FROM_ACTIONS }}
        run: |
          set -uo pipefail
          git config user.name  "AGSIST Bot"
          git config user.email "bot@agsist.com"

          python scripts/fetch_prices.py || echo "fetch_prices.py exited non-zero (kept last values)"

          python scripts/preflight_prices.py data/prices.json --repair \
            || echo "::warning::preflight reported unrepairable quotes; they were suppressed, not published"

          if ! git diff --quiet -- data/prices.json; then
            python scripts/seed_static.py --only markets || echo "::warning::markets re-bake skipped"
            git add data/prices.json markets.html
            git commit -m "💹 Prices — $(date -u +'%Y-%m-%d %H:%M UTC')"
            pushed=0
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main || {
                git checkout --theirs data/prices.json markets.html 2>/dev/null || true
                git add data/prices.json markets.html
                git rebase --continue 2>/dev/null || git rebase --abort 2>/dev/null || true
              }
              if git push origin main; then pushed=1; echo "pushed (attempt $i)"; break; fi
              echo "push attempt $i lost a race; retrying…"; sleep $((RANDOM % 5 + 2))
            done
            [ "$pushed" = "0" ] && echo "::warning::could not push this cycle; will retry next cycle"
            [ "$pushed" = "1" ] && bash .github/pages-kick.sh

            if [ "$pushed" = "1" ]; then
              gh workflow run daily.yml \
                -f heartbeat=true -f send_email=true \
                && echo "briefing heartbeat sent" \
                || echo "::warning::briefing heartbeat could not be sent this cycle"
            fi
          else
            echo "no price change this cycle"
          fi

