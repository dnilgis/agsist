name: County crop risk inputs

# Reads the USDA county loss, insurance and yield files behind the county crop risk section and keeps them
# privately as first prints. Nothing is published or committed here. Started by hand.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Only one source: rma or nass (blank: both)"
        type: string
        default: ""
      years:
        description: "Crop years, e.g. 1989-2025 (blank: 1989 to this year)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: crop-risk-fetch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the inputs
        env:
          IN_ONLY: ${{ inputs.only }}
          IN_YEARS: ${{ inputs.years }}
        run: |
          printf '%s\n' "$IN_ONLY" | grep -Eqx '(rma|nass)?' || { echo "::error::only must be rma, nass or blank"; exit 1; }
          printf '%s\n' "$IN_YEARS" | grep -Eqx '([0-9]{4}-[0-9]{4})?' || { echo "::error::years must look like 1989-2025"; exit 1; }
      - name: Selftest
        run: python3 scripts/crop_risk_fetch.py --selftest
      - name: Read USDA
        id: fetch
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
          IN_ONLY: ${{ inputs.only }}
          IN_YEARS: ${{ inputs.years }}
        run: |
          args="--fetch"
          [ -n "$IN_ONLY" ] && args="$args --only $IN_ONLY"
          [ -n "$IN_YEARS" ] && args="$args --years $IN_YEARS"
          python3 scripts/crop_risk_fetch.py $args
      - name: Keep the files as first prints (private)
        if: ${{ !cancelled() }}
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_BRANCH: raw-crop-risk
          RAW_KEEP: '1'
        run: |
          [ -d vintage/crop-risk ] || { echo "nothing was read this run"; exit 0; }
          bash scripts/push_raw.sh "crop risk first prints" vintage/crop-risk
