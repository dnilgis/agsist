name: Sponsor reports — yesterday's numbers, from GA4

# One report per sponsor, rebuilt daily from the GA4 Data API. Since Nov 4, 2026
# the reports and the link tokens are private (Sig: "move the codes to feedbag"):
# they live in the private repo (private-data, private/sponsors/) and the subs
# worker serves each report to its own link (GET /sponsor-report). Nothing about a
# sponsor's link is committed here. Nothing is computed in the browser and nothing
# is counted twice.
#
# WHY DAILY AND NOT LIVE. A live counter would need a server holding its own
# tally — a second source of truth for a number the sponsor will check against
# GA4 anyway. Reading GA4 itself means there is one number, and it is in git.
#
# It ends at YESTERDAY on purpose: GA4 keeps refining the current day for
# hours, and a figure that moves after the sponsor looked at it is worse than
# one that is a day old and says so.
#
# 6:12 Central, before the morning briefing goes out, off the hour.

on:
  schedule:
    - cron: '12 11 * * *'
  # GitHub's scheduler drops scheduled fires (it never started land-data.yml on Nov 3, 2026;
  # scripts/cron_gate.py has the numbers). So this also runs after every "Fetch Grain Bids"
  # (cron-job.org, every 15 minutes), and the gate job lets the first run after each tick of the
  # cron above, by either trigger, do the work within 360 minutes
  # (six hours, the same day and well before the next tick).
  # Every other run skips in seconds. A chained run takes the scheduled path. A run by hand or
  # a push does not use up the tick (cron_gate.py MANUAL_DOES_NOT_SERVE): it may take narrower
  # inputs, and the chained run that follows is the same idempotent job.
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_sponsor_report.py'
      - 'scripts/sponsor_links.py'
      - 'scripts/sponsor_publish.py'
      - 'scripts/test_sponsor_portal.py'
      - 'scripts/test_rate_card.py'
      - 'scripts/sponsor-checks.mjs'
      - 'sponsor-report.html'
      - 'sponsor.html'
      - 'data/sponsors.json'
      - 'data/sponsor.json'
      - 'data/geo-sponsors.json'
      - 'components/geo-sponsor.js'
      - 'data/rate-card.json'
      - 'data/supporters.json'
      - 'components/sponsor-ad.js'
      - 'components/sponsor-ad.css'
      - 'scripts/brief_email.py'
      - 'scripts/audience_from_exports.py'
      - 'scripts/build_audience.py'
      - 'scripts/bake_audience.py'
      - 'data/audience.json'
      - 'scripts/build_rp_sealed.mjs'

env:
  TZ: America/Chicago

jobs:
  # One run per tick of the schedule (see on: above). Sparse: the skip costs seconds.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow sponsor-report.yml --max-lag 360
          --cron "12 11 * * *"

  build:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: sponsor-report
      cancel-in-progress: false
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── GUARDS, BEFORE THE NUMBERS ────────────────────────────────────────
      # This is the one page a paying sponsor sees. Three ways it can be wrong
      # and every one of them is silent: an approved badge over copy that
      # changed, one surface's tracking link shown as another's, or a price the
      # sales page does not quote. They run before the build so a bad shape
      # never reaches a sponsor's link, and they need no secrets.
      #
      # sponsor-checks.mjs already existed and NOTHING RAN IT — the same way
      # delivery-checks.mjs sat unrun while a broken filter shipped. It runs
      # here now.
      # BEFORE the guards: build_audience.py's selftest builds real GA4 request
      # objects to prove the field names, so it needs the client installed. It
      # ran after the guards on 2026-09-22 and the first run died on
      # "No module named 'google'" before any report was built.
      - name: Install the GA4 client
        run: pip install --quiet google-analytics-data==0.23.3 google-auth==2.62.0 requests==2.34.2

      - name: The portal cannot approve words nobody saw
        run: |
          python3 scripts/dev/quiet.py selftest-sponsor-links -- python3 scripts/sponsor_links.py --selftest
          python3 scripts/dev/quiet.py selftest-sponsor-publish -- python3 scripts/sponsor_publish.py --selftest
          python3 scripts/dev/quiet.py test-sponsor-portal -- python3 scripts/test_sponsor_portal.py
          python3 scripts/dev/quiet.py test-rate-card -- python3 scripts/test_rate_card.py
          python3 scripts/dev/quiet.py selftest-audience-exports -- python3 scripts/audience_from_exports.py --selftest
          python3 scripts/dev/quiet.py selftest-audience -- python3 scripts/build_audience.py --selftest
          python3 scripts/dev/quiet.py selftest-signups -- python3 scripts/build_signups.py --selftest
          python3 scripts/dev/quiet.py sponsor-checks -- node scripts/sponsor-checks.mjs

      # WHO READS AGSIST -- the dashboard on every sponsor's portal. Each source
      # is optional and fails on its own; a missing or broken one keeps its last
      # figures, with their dates, and says so in the log. Nothing here can stop
      # the sponsor reports below from building.
      - name: Refresh the audience dashboard
        continue-on-error: true
        env:
          GA4_PROPERTY_ID:     ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT: ${{ secrets.GA4_SERVICE_ACCOUNT }}
          BING_API_KEY:        ${{ secrets.BING_API_KEY }}
          LIST_URL:            ${{ secrets.LIST_URL }}
          LIST_TOKEN:          ${{ secrets.LIST_TOKEN }}
        run: python3 scripts/dev/quiet.py audience -- python3 scripts/build_audience.py

      # The audience figures on /sponsor and /sponsor-kit are written into the HTML
      # from the file just refreshed (Oct 29, 2026), so crawlers, link previews and
      # readers without JavaScript see the same dated numbers. Never stops the reports.
      - name: Write the audience figures into the sponsor pages
        continue-on-error: true
        run: python3 scripts/dev/quiet.py bake-audience -- python3 scripts/bake_audience.py

      # Email signups by page ask, ZIPs given, one-time notices: counts only, for
      # /seo-report. Same token, same rule: no address reaches the file or the log.
      - name: Count signups by source
        continue-on-error: true
        env:
          LIST_URL:            ${{ secrets.LIST_URL }}
          LIST_TOKEN:          ${{ secrets.LIST_TOKEN }}
        run: python3 scripts/dev/quiet.py signups -- python3 scripts/build_signups.py

      # THE LINKS ARE PRIVATE (Nov 4, 2026). The tokens and the last reports come from
      # the private repo; a sponsor new in data/sponsors.json gets its token here and it
      # is saved back BEFORE anything uses it (a failed save stops the run, so no link
      # is ever handed out that the private copy does not hold).
      - name: Sponsor links from the private repo
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_BRANCH: private-data
        run: |
          bash scripts/pull_raw.sh private/sponsors
          python3 scripts/dev/quiet.py sponsor-mint -- python3 scripts/sponsor_publish.py mint
          # The first token wins: RAW_KEEP never replaces a token file already saved (sponsor-apply.yml may
          # have minted the same sponsor a moment ago), and the pull after it adopts whichever landed.
          RAW_KEEP=1 bash scripts/push_raw.sh "sponsor tokens" private/sponsors/tokens
          bash scripts/pull_raw.sh private/sponsors/tokens

      # No secrets, no report, no failure. A fork or a PR cannot have these and
      # should not go red for it — the script says so and exits 0.
      - name: Build the reports
        env:
          GA4_PROPERTY_ID:     ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT: ${{ secrets.GA4_SERVICE_ACCOUNT }}
        run: python3 scripts/dev/quiet.py sponsor-reports -- python3 scripts/build_sponsor_report.py

      # Each report goes to the subs worker with its token (Bearer LIST_TOKEN), and the
      # links to hand out (with the approval key k) go to private/sponsors/links.json.
      # It refuses to publish while any token is in a public file. Counts and slugs only in the log.
      - name: Send the reports to the worker
        env:
          LIST_URL:     ${{ secrets.LIST_URL }}
          LIST_TOKEN:   ${{ secrets.LIST_TOKEN }}
          UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
        run: python3 scripts/dev/quiet.py sponsor-publish -- python3 scripts/sponsor_publish.py publish

      - name: Save the reports and links to the private repo
        if: always() && needs.gate.outputs.go == '1'
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_BRANCH: private-data
          RAW_SOFT: '1'
        run: bash scripts/push_raw.sh "sponsor reports" private/sponsors/reports private/sponsors/links.json

      # THE RAIN PRINT QR WITHOUT THE WORKER (Oct 22, 2026). A printed QR opens
      # agsist.com/r?<id>; when the subs worker does not answer, /r opens a
      # sealed file from data/rp-sealed/ instead. This writes those files from
      # the private daily copy of the worker's storage: one file per short
      # link, named and locked by a slow derivation of its id, so no id and no
      # design is published (scripts/build_rp_sealed.mjs has the threat model).
      # Counts only in the log. Never stops the sponsor reports.
      - name: Rain Print QR backup
        continue-on-error: true
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          bash scripts/fetch_private.sh private-data || exit 0
          git show origin/private-data:kv-backup/latest.json.gz > "$RUNNER_TEMP/kv.json.gz" || exit 0
          node scripts/build_rp_sealed.mjs "$RUNNER_TEMP/kv.json.gz"
          rm -f "$RUNNER_TEMP/kv.json.gz"

      - name: Commit
        run: |
          git config user.name  "agsist-bot"
          git config user.email "bot@agsist.com"
          git add data/audience.json data/audience-pages.json sponsor.html sponsor-kit.html 2>/dev/null || true
          git add -A data/rp-sealed 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "sponsor reports: through $(date -d yesterday +%Y-%m-%d) [skip ci]"
          for i in 1 2 3; do
            git push && break
            git pull --rebase --autostash && sleep 3
          done
