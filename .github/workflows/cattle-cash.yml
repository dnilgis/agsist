name: Cattle cash prices

# Writes data/cattle-cash.json for the cash block on cattle-futures-prices.html:
# the boxed beef cutout (USDA AMS LM_XB403, each trading day) and the 5-area
# weekly fed steer price (USDA AMS LM_CT150, weekly). Public AMS PDFs, read by
# scripts/fetch_cattle_cash.py. The page shows nothing until this file exists.
#
# FIRST RUN: dispatch this once with "probe" ticked. It saves what AMS returned
# to data/cattle-cash-raw/ and saves it on the raw branch (never deployed), so the real PDF layout can be checked
# against the parser before trusting a number.
#
# Also (Nov 3, 2026, fx/marseth; no new schedule): data/ethanol-bids.json for the
# "Ethanol plants paying" fold on /cash-bids, from USDA My Market News (MARS API)
# reports 3617 (daily ethanol plant corn bids) and 3618 (weekly co-products), read
# by scripts/fetch_ethanol_mars.py with the MARS_API_KEY secret. It rides this
# job because the 21:43 UTC weekday run is after noon Central, when the daily
# report (usually out 6:30 to 7:15 AM CT, a few days near noon) is in, and the
# Monday runs pick up the weekly co-products report. Its step cannot fail the
# cattle steps, and a failed MARS call leaves the last good file in place.

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Probe only: save the raw AMS PDFs and text to data/cattle-cash-raw/ on the raw branch"
        type: boolean
        default: false
      ethanol_only:
        description: "Ethanol only: run the USDA ethanol plant bids step and skip the cattle fetch"
        type: boolean
        default: false
      hog_probe:
        description: "Hog probe only: ask the LM hog and pork cutout routes, save answers to data/hog-cash-raw/ on the raw branch"
        type: boolean
        default: false
  schedule:
    - cron: '43 21 * * 1-5'   # after the PM cutout
    - cron: '17 15 * * 1,2'   # the weekly 5-area report, early in the week
  # GitHub's scheduler drops scheduled fires (it never started land-data.yml on Nov 3, 2026;
  # scripts/cron_gate.py has the numbers). So this also runs after every "Fetch Grain Bids"
  # (cron-job.org, every 15 minutes), and the gate job lets the first run after each tick of the
  # cron above, by either trigger, do the work within 360 minutes
  # (six hours, the same day and well before the next tick).
  # Every other run skips in seconds. A chained run takes the scheduled path. A run by hand or
  # a push does not use up the tick (cron_gate.py MANUAL_DOES_NOT_SERVE): it may take narrower
  # inputs, and the chained run that follows is the same idempotent job.
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]

permissions:
  contents: write

jobs:
  # One run per tick of the schedule (see on: above). Sparse: the skip costs seconds.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow cattle-cash.yml --max-lag 360
          --cron "43 21 * * 1-5"
          --cron "17 15 * * 1,2"

  build:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: cattle-cash
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pypdf (fallback if pdftotext is missing)
        run: pip install pypdf==6.20.1
      - name: Selftest
        run: python scripts/fetch_cattle_cash.py --selftest
      - name: Hog cash selftest
        run: python scripts/fetch_hog_cash.py --selftest
      - name: Hog probe (LM_HG201, LM_HG203, LM_PK602 by every route)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.hog_probe }}
        env:
          MARS_API_KEY: ${{ secrets.MARS_API_KEY }}
        run: python scripts/fetch_hog_cash.py --probe
      - name: Save the hog probe's answers to the raw branch
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.hog_probe }}
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_SOFT: '1'
        run: bash scripts/push_raw.sh "hog-cash probe" data/hog-cash-raw
      - name: Probe (raw source capture)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe }}
        run: python scripts/fetch_cattle_cash.py --probe
      # Raw captures go to the raw branch (never deployed), not main: scripts/push_raw.sh.
      # Runs even when the probe step failed part way, so what it did capture is kept.
      - name: Save the probe's raw files to the raw branch
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.probe }}
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_SOFT: '1'
        run: bash scripts/push_raw.sh "cattle-cash probe" data/cattle-cash-raw
      - name: Fetch and write data/cattle-cash.json
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.probe || inputs.hog_probe || inputs.ethanol_only)) }}
        run: python scripts/fetch_cattle_cash.py
      # Cash hogs (LM_HG201, morning) and the pork cutout (LM_PK602, ~2:55 PM CT) are both out
      # before the 21:43 UTC run; data/hog-cash.json carries a daily_line for the Daily.
      - name: Fetch and write data/hog-cash.json
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.probe || inputs.hog_probe || inputs.ethanol_only)) }}
        continue-on-error: true   # a hog failure never holds back the cattle file
        run: python scripts/fetch_hog_cash.py
      # selftest first: a failing selftest writes nothing; neither can stop the cattle commit
      - name: Fetch and write data/ethanol-bids.json (USDA MARS 3617, 3618)
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.probe || inputs.hog_probe)) }}
        continue-on-error: true
        env:
          MARS_API_KEY: ${{ secrets.MARS_API_KEY }}
        run: python scripts/fetch_ethanol_mars.py --selftest && python scripts/fetch_ethanol_mars.py
      - name: Commit if changed (race-tolerant)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.hog_probe) }}
        run: |
          set -e
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          FILES="data/cattle-cash.json data/hog-cash.json"
          FILES="$FILES data/ethanol-bids.json"
          rm -rf /tmp/cc && mkdir -p /tmp/cc
          for f in $FILES; do
            [ -e "$f" ] && cp -r --parents "$f" /tmp/cc/ || true
          done
          [ -n "$(ls -A /tmp/cc)" ] || { echo "No output; nothing to commit."; exit 0; }
          BR="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3 4 5; do
            git fetch origin "$BR"
            git reset --hard "origin/$BR"
            mkdir -p data && cp -r /tmp/cc/data/. data/
            for f in $FILES; do [ -e "$f" ] && git add "$f" || true; done
            if git diff --staged --quiet; then echo "No change."; exit 0; fi
            git commit -m "Update cattle and hog cash prices $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            if git push origin "HEAD:$BR"; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push race on attempt $i; re-syncing to origin/$BR..."
            sleep $((RANDOM % 4 + 2))
          done
          echo "Failed to push after 5 attempts."; exit 1
