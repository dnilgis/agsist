name: rain print examples

# SCRATCH BRANCH ONLY (scratch/rp-press-data): a one-time data run for the press
# pitch images. GitHub only dispatches a workflow whose file is on the default
# branch, so this branch's copy of this existing dispatch-only file does the run
# (as the Oct 21 St. Croix Falls side branch did). Run it with
#   gh workflow run rain-print-examples.yml --ref scratch/rp-press-data -R dnilgis/agsist
# It opens rain-print.html for each design in .github/rp-press/designs.txt and
# keeps every NOAA RCC-ACIS and Open-Meteo answer the page asks for, then uploads
# them as the run artifact "rp-press-data". It writes nothing to the repository.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rain-print-examples
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright
        run: |
          mkdir -p /tmp/rp-pw && cd /tmp/rp-pw && npm init -y >/dev/null
          npm install --no-audit --no-fund playwright-core@1.56.1
      - name: Record
        env:
          PLAYWRIGHT_PATH: /tmp/rp-pw/node_modules/playwright-core/index.mjs
          CHROMIUM_PATH: /usr/bin/google-chrome
          OUT: ${{ runner.temp }}/rp-press
        run: bash .github/rp-press/run.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rp-press-data
          path: ${{ runner.temp }}/rp-press
          retention-days: 14
