name: Pages (site only)

# Publishes agsist.com from a filtered artifact: the repository minus what no
# reader loads (check_site_budget.NOT_READER_FACING: scripts/, test/, build/,
# references/, workers/, .github/, the workflow-only data). Plan and dry run:
# feedbag notes/panels/godseye-2026-10-26/size-trim-plan.md; the filter is
# scripts/pages_publish.py.
#
# OFF UNTIL THE SWITCH. The job runs only when the repository variable
# PAGES_FROM_ACTIONS is 1. While Settings > Pages > Source is still "Deploy from
# a branch", the variable stays unset and every run here is skipped, so this
# file can sit on main without touching the site. The switch is two settings
# in the same minute (Source = GitHub Actions, PAGES_FROM_ACTIONS = 1); the
# rollback is the same two settings back. Steps: the pull request that added
# this file.
#
# Why dispatches: data jobs push with GITHUB_TOKEN, and a push made with
# GITHUB_TOKEN does not start other workflows, so `on: push` alone would only
# deploy human merges. The fast jobs (prices, markets, fetch_bids, daily)
# dispatch this workflow after they run (a workflow_dispatch is exempt from
# that rule), so prices and bids still reach readers in 1 to 3 minutes.
# NO SCHEDULE OF ITS OWN: a new cron is Sig's call (STANDING-DECISIONS, Oct 21).
# fetch_bids is started every 15 minutes, all day, every day, so its dispatch
# also carries every other bot commit to readers within about 15 minutes. A
# dispatch skips when its commit is deployed already.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Deploy even if this commit is deployed already'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read

# One deploy at a time; a newer start replaces a waiting one, never a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.PAGES_FROM_ACTIONS == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # A failed lookup means "deploy", never "skip".
      - name: Skip when this commit is deployed already
        id: moved
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
          SHA: ${{ github.sha }}
        run: |
          go=1
          if [ "$EVENT" = workflow_dispatch ] && [ "$FORCE" != true ]; then
            ids=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&sha=$SHA&per_page=10" -q '.[].id' 2>/dev/null || true)
            for id in $ids; do
              state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" -q '.[0].state' 2>/dev/null || true)
              if [ "$state" = success ]; then go=0; echo "$SHA is deployed already (deployment $id)"; break; fi
            done
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.moved.outputs.go == '1'
        with:
          persist-credentials: false
      - name: Engine checkout
        if: steps.moved.outputs.go == '1'
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - name: Stage the site (fails if a page links to a left-out file)
        if: steps.moved.outputs.go == '1'
        run: |
          set -euo pipefail
          # measured before staging: the budget walks the checkout, and _site would count twice
          python3 scripts/check_site_budget.py || echo "::warning::over the size budget; deploying anyway (the site-budget workflow is the gate)"
          python3 scripts/pages_publish.py --stage _site
          test -f _site/index.html
          test -f _site/.well-known/security.txt
          test -f _site/CNAME
          test ! -e _site/scripts && test ! -e _site/test && test ! -e _site/.github && test ! -e _site/workers
          du -sh _site
      - uses: actions/configure-pages@v5
        if: steps.moved.outputs.go == '1'
      # v3, not v4: v4 leaves dot files out of the tarball and .well-known must ship.
      - uses: actions/upload-pages-artifact@v3
        if: steps.moved.outputs.go == '1'
        with:
          path: _site
          retention-days: 1
      # The dot-file check: read the tarball that was uploaded, not the folder.
      - name: The artifact carries .well-known and no tooling
        if: steps.moved.outputs.go == '1'
        run: |
          set -euo pipefail
          tar -tf "$RUNNER_TEMP/artifact.tar" > "$RUNNER_TEMP/members.txt"
          grep -qx './.well-known/security.txt' "$RUNNER_TEMP/members.txt" || { echo "::error::the artifact has no .well-known/security.txt"; exit 1; }
          grep -qx './index.html' "$RUNNER_TEMP/members.txt" || { echo "::error::the artifact has no index.html"; exit 1; }
          if grep -qE '^\./(scripts|test|workers|\.github)/' "$RUNNER_TEMP/members.txt"; then echo "::error::tooling is in the artifact"; exit 1; fi
          echo "artifact: $(wc -l < "$RUNNER_TEMP/members.txt") members"
      - id: deploy
        if: steps.moved.outputs.go == '1'
        uses: actions/deploy-pages@v4
