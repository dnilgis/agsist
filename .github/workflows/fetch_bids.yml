name: Fetch Grain Bids

# ONE JOB, TWO OUTPUTS, AND THE BIG FILE NEVER LANDS IN GIT.
#
# fetch_bids.py now writes two things:
#   data/bids.json   SLIM  - what /corn-futures-prices and its two siblings
#                            fetch in the browser. ~116 KB against 6.3 MB, and
#                            the script proves on every run that the page picks
#                            the same bid from it as from the full set.
#   bids-full.json   FULL  - every row, gitignored, for build_basis_map.py.
#
# build_basis_map.py therefore has to run HERE, in the same job, while the full
# file still exists on the runner. That is why basis-map.yml no longer runs on
# a schedule. It refuses to build from the slim file rather than quietly
# averaging a handful of elevators per state.

on:
  schedule:
    # OFF THE TOP OF THE HOUR. This asked for 22 fires a weekday and did not
    # get them. data/bids.json carries a `fetched` timestamp that changes every
    # run, so a commit is an exact run count, and measured 2026-08-19 to 08-26:
    #
    #   Wed 08-19  19 of 22   86%      Mon 08-24  15 of 22   68%
    #   Thu 08-20  19 of 22   86%      Tue 08-25  16 of 22   73%
    #   Fri 08-21  18 of 22   82%      Wed 08-26   9 of 22   41%
    #
    # On the 26th that left holes of 1h36m, 2h00m and 2h12m inside the trading
    # session, under a page that says it refreshes every thirty minutes.
    #
    # `*/30` fires at :00 and :30, and :00 is the single most congested minute
    # on this platform -- every cron on GitHub asks for it at once. The sibling
    # repository learned the same lesson on `*/10` and wrote it down: "offsetting
    # to :03 costs nothing and lands in a quieter queue".
    #
    # THIS IS THE CHEAP HALF OF THE FIX AND IT IS NOT THE WHOLE ONE. The real
    # answer is the one poll.yml took on 2026-08-26: stop asking for a high
    # frequency, take the hourly fire that reliably arrives, and read repeatedly
    # inside it. That change has not yet been CONFIRMED working -- nobody has
    # read a run log for it -- and applying an unverified pattern to the feed
    # behind the customer-facing page would be building on it twice. Same
    # spacing, quieter minutes, until poll.yml's loop is proven.
    - cron: '7,37 11-21 * * 1-5'
    - cron: '37 11 * * 6'
  workflow_dispatch:
    inputs:
      total_locations:
        description: 'Max locations per ZIP (blank = the script default, 200)'
        required: false
        default: ''
      dry_run:
        description: 'Fetch and report, but do not commit'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: bids-and-basis
  cancel-in-progress: false

jobs:
  fetch-bids:
    runs-on: ubuntu-latest
    # Was 10. Two hundred locations per ZIP is a lot more payload across 50
    # ZIPs, and a run that dies on the clock looks exactly like one that died
    # on an error. Headroom is cheaper than that ambiguity.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Offline, no API key, under a second. Cheap insurance against a parsing
      # edit reaching the live feed.
      - name: Check fetch_bids
        run: python scripts/fetch_bids.py --selftest

      - name: Fetch grain bids
        env:
          BARCHART_API_KEY: ${{ secrets.BARCHART_API_KEY }}
          BARCHART_TOTAL_LOCATIONS: ${{ github.event.inputs.total_locations }}
        run: python scripts/fetch_bids.py

      # Same job, while bids-full.json is still on disk. This step failing is
      # a real failure: it means the full file was not written.
      # THE DIRECTORY, TAKEN WHILE WE STILL HAVE THE FEED.
      # Sig, 2026-08-27: "i have a feeling that i wont be continuing my barchart
      # api subscription ... i want a complete directory of every elevator in
      # the country ... whoever we cant get, i want a list of them."
      #
      # The prices stop at renewal. Who operates a facility and what town it is
      # in does not, and it is the target list for every adapter still to be
      # written. This runs HERE, beside the basis map, because that is where
      # bids-full.json exists: the slim committed sample yields about forty
      # facilities and the full national sweep yields four hundred.
      #
      # It writes no price, no basis and no symbol — only the directory.
      # continue-on-error because a missing directory must never cost the run
      # its prices.
      - name: Extract the elevator directory (no prices, no extra API calls)
        continue-on-error: true
        run: python scripts/extract_directory.py --from-bids

      - name: Build the national basis map
        run: python scripts/build_basis_map.py

      # ALSO IN THIS JOB, AND FOR THE SAME REASON: the full set exists here and
      # nowhere else. Slimming data/bids.json on 2026-08-19 was right -- a
      # browser must not be sent 18,000 bids -- but it ended the per-elevator
      # basis history that the old committed file had been keeping by accident.
      # This keeps it deliberately and cheaply: the current basis, the one
      # before it, and the day it moved. Roughly a hundred rows move on an
      # ordinary day, so the daily record is small and the state shards delta
      # to nearly nothing.
      #
      # A FAILURE HERE MUST NOT COST THE BIDS. The bids and the basis map are
      # already written by the time this runs, and a history that skips a day
      # is a history with a gap; a run that aborts here would throw away a good
      # bids.json as well. So it warns and carries on, and the gap is visible
      # in data/basis/index.json's generated date.
      - name: Keep the basis history
        continue-on-error: true
        run: python scripts/build_basis_history.py

      - name: Sizes
        run: |
          ls -lh data/bids.json data/basis-map.json bids-full.json
          du -sh data/basis 2>/dev/null || true

      - name: Commit and push
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          # bids-full.json is gitignored. Adding it explicitly here would put
          # 6 MB into every commit, which is the whole thing this avoids.
          git add data/bids.json data/basis-map.json data/basis data/elevator-directory.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Update grain bids + basis map + basis history $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main
          git push

      - name: Say why nothing was committed
        if: github.event.inputs.dry_run == 'true'
        run: echo "dry_run was set - both files were written in the runner and thrown away."
