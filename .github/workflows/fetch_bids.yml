name: Fetch Grain Bids

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch and report, but do not commit'
        type: boolean
        required: false
        default: false
      force:
        description: 'Fetch even if the last fetch is under 5 minutes old'
        type: boolean
        required: false
        default: false
      bid_snapshot:
        description: 'Save today''s bid snapshot to the raw branch now (replaces today''s file)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: bids-and-basis
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      skip: ${{ steps.age.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          sparse-checkout: data/bids.json
          sparse-checkout-cone-mode: false
      - id: age
        env:
          FORCE: ${{ github.event.inputs.force }}
          DRY: ${{ github.event.inputs.dry_run }}
        run: |
          python3 - <<'PY'
          import json, os, datetime as dt
          skip = "0"
          try:
              f = json.load(open("data/bids.json")).get("fetched", "")
              age = (dt.datetime.now(dt.timezone.utc) - dt.datetime.fromisoformat(f.replace("Z", "+00:00"))).total_seconds() / 60
              print(f"last fetch {f}, {age:.0f} min ago")
              if age < 5 and os.environ.get("FORCE") != "true" and os.environ.get("DRY") != "true":
                  skip = "1"
                  print("under 5 minutes old: this run is a duplicate and stops here (force=true fetches anyway)")
          except Exception as e:
              print(f"could not read the last fetch time ({e}); fetching")
          with open(os.environ["GITHUB_OUTPUT"], "a") as o:
              o.write(f"skip={skip}\n")
          PY

  fetch-bids:
    needs: freshness
    if: ${{ !cancelled() && needs.freshness.outputs.skip != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check fetch_bids
        run: python3 scripts/dev/quiet.py selftest-fetch-bids -- python scripts/fetch_bids.py --selftest

      - name: Check the daily-change and contacts builders
        run: |
          python3 scripts/dev/quiet.py selftest-bids-prev -- python scripts/build_bids_prev.py --selftest
          python3 scripts/dev/quiet.py selftest-elevator-contacts -- python scripts/build_elevator_contacts.py --selftest

      - name: Fetch grain bids
        id: fetch
        run: python3 scripts/dev/quiet.py fetch-bids -- python scripts/fetch_bids.py

      - name: Rebuild the elevator ids
        continue-on-error: true
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          s="$RUNNER_TEMP/schedules.json"
          GH_TOKEN="$PRIVATE_REPO_TOKEN" gh api -H "Accept: application/vnd.github.raw" \
            "repos/dnilgis/feedbag/contents/apijobs/schedules-2026-10/schedules/schedules.json?ref=raw" > "$s" \
            || { echo "::warning::ids: schedules not readable; the last ids stay"; exit 0; }
          python3 scripts/dev/quiet.py ids -- python scripts/build_ids.py --no-parcels --schedules "$s" \
            || { echo "::warning::ids not rebuilt this run; the last ids stay (the bids update is unaffected)"; exit 0; }
          python3 scripts/dev/quiet.py basis-join -- python scripts/build_basis_join.py || echo "::warning::basis join not rebuilt this run"
          python3 scripts/dev/quiet.py join-report -- python scripts/join_report.py || true

      - name: River key for the elevator ids
        continue-on-error: true
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          if git diff --quiet -- data/ids/elevators.json && [ -f data/ids/river.json ]; then echo "river key: elevators unchanged"; exit 0; fi
          r="$RUNNER_TEMP/river"; mkdir -p "$r"
          for f in docks waterways; do
            GH_TOKEN="$PRIVATE_REPO_TOKEN" gh api -H "Accept: application/vnd.github.raw" \
              "repos/dnilgis/feedbag/contents/river/$f.json?ref=raw" > "$r/$f.json" 2>/dev/null \
              || { echo "river key: no river/$f.json on raw yet (river-pull.yml not run); the last river key stays"; exit 0; }
          done
          python3 scripts/dev/quiet.py river-key -- python scripts/river_key.py --river-dir "$r" \
            || echo "::warning::river key not rebuilt this run; the last one stays"

      - name: Elevator contacts for the homepage card
        continue-on-error: true
        run: python3 scripts/dev/quiet.py elevator-contacts -- python scripts/build_elevator_contacts.py

      - name: Keep the basis history
        continue-on-error: true
        run: python3 scripts/dev/quiet.py basis-history -- python scripts/build_basis_history.py

      - name: Rebuild basis sparklines
        continue-on-error: true
        run: python3 scripts/dev/quiet.py basis-sparklines -- python scripts/build_basis_sparklines.py

      - name: Keep the network's last price per trading day
        continue-on-error: true
        run: python3 scripts/dev/quiet.py bids-prev -- python scripts/build_bids_prev.py

      - name: Fold the day into the Cash Bid Index month
        continue-on-error: true
        run: python3 scripts/dev/quiet.py cash-index-fold -- python scripts/cash_bid_index.py --fold

      - name: Sizes
        run: |
          ls -lh data/bids.json bids-full.json
          ls -lh private/data/bids-withheld.json 2>/dev/null || echo "no private/data/bids-withheld.json this run"
          du -sh data/basis data/basis-sparklines 2>/dev/null || true

      - name: Commit and push
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          git add data/bids.json data/basis data/basis-sparklines data/elevator-directory.json
          git add data/ids/elevators.json data/ids/elevator-ids.json data/ids/ambiguous.json data/ids/board-parents.json data/ids/companies.json 2>/dev/null || true
          [ -f data/ids/river.json ] && git add data/ids/river.json || true
          [ -d data/ids/basis-join ] && git add -A data/ids/basis-join || true
          [ -f data/bids-stats.json ] && git add data/bids-stats.json || true
          [ -d data/bids-prev ] && git add -A data/bids-prev || true
          [ -d data/cash-index ] && git add -A data/cash-index || true
          [ -d data/elevator-contacts ] && git add -A data/elevator-contacts || true
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Update grain bids + basis map + basis history $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          pushed=0
          for n in 1 2 3 4 5; do
            if git push; then pushed=1; break; fi
            echo "Push race on attempt $n; rebasing..."
            git pull --rebase origin main || { echo "Rebase failed."; exit 1; }
            sleep $((RANDOM % 4 + 2))
          done
          [ "$pushed" = 1 ] || { echo "Failed to push after 5 attempts."; exit 1; }

      - name: Start the site deploy
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_FROM_ACTIONS: ${{ vars.PAGES_FROM_ACTIONS }}
        run: bash .github/pages-kick.sh

      - name: Withheld rows to the private repo
        if: github.event.inputs.dry_run != 'true'
        continue-on-error: true
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_BRANCH: private-data
          RAW_SOFT: '1'
        run: bash scripts/push_raw.sh "bids withheld" private/data/bids-withheld.json

      - name: Daily bid snapshot to the raw branch
        if: github.event.inputs.dry_run != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NOW: ${{ github.event.inputs.bid_snapshot }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_SOFT: '1'
        run: |
          day=$(python3 scripts/bid_snapshots.py due) || { echo "::warning::bid snapshot: due check failed"; exit 0; }
          [ "$NOW" = "true" ] && day=$(TZ=America/Chicago date +%F)
          [ -n "$day" ] || { echo "bid snapshot: not in the window (weekdays from 15:00 CT)"; exit 0; }
          f="bids-daily/${day:0:4}/${day}.json.gz"
          if [ "$NOW" != "true" ] && GH_TOKEN="$PRIVATE_REPO_TOKEN" gh api -X GET "repos/dnilgis/feedbag/contents/$f?ref=raw" --silent >/dev/null 2>&1; then
            echo "bid snapshot: $f is already on raw"; exit 0
          fi
          python3 scripts/dev/quiet.py bid-snapshot -- python3 scripts/bid_snapshots.py build --from bids-full.json --day "$day" \
            || { echo "::warning::bid snapshot for $day not built (the bids update is unaffected)"; exit 0; }
          bash scripts/push_raw.sh "bid snapshot $day" "$f" \
            || echo "::warning::bid snapshot for $day not saved to raw; the next run today retries (the bids update is unaffected)"

      - name: Bid flags to the raw branch
        if: github.event.inputs.dry_run != 'true'
        continue-on-error: true
        timeout-minutes: 8
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_SOFT: '1'
        run: |
          day=$(python3 scripts/bid_snapshots.py due) || { echo "::warning::bid flags: due check failed"; exit 0; }
          [ -n "$day" ] || { echo "bid flags: not in the window (weekdays from 15:00 CT)"; exit 0; }
          snap="bids-daily/${day:0:4}/${day}.json.gz"
          f="bids-daily-flags/${day:0:4}/${day}.csv"
          have() { GH_TOKEN="$PRIVATE_REPO_TOKEN" gh api -X GET "repos/dnilgis/feedbag/contents/$1?ref=raw" --silent >/dev/null 2>&1; }
          have "$f" && { echo "bid flags: $f is already on raw"; exit 0; }
          have "$snap" || { echo "bid flags: no snapshot for $day on raw yet; the next run tries"; exit 0; }
          bash scripts/fetch_private.sh raw || { echo "::warning::bid flags: raw not readable, no flags for $day"; exit 0; }
          python3 scripts/dev/quiet.py bid-flags -- python3 scripts/bid_flags.py build --ref origin/raw --out-dir . \
            || { echo "::warning::bid flags for $day not built (the bids update is unaffected)"; exit 0; }
          [ -d bids-daily-flags ] || { echo "bid flags: nothing new"; exit 0; }
          bash scripts/push_raw.sh "bid flags $day" bids-daily-flags \
            || echo "::warning::bid flags for $day not saved to raw; the next run today retries (the bids update is unaffected)"

      - name: Basis forecast ledger to the raw branch
        if: github.event.inputs.dry_run != 'true'
        continue-on-error: true
        timeout-minutes: 12
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_SOFT: '1'
          BASIS_REPLAY_MAX: '30'
        run: |
          day=$(python3 scripts/bid_snapshots.py due) || { echo "::warning::basis ledger: due check failed"; exit 0; }
          [ -n "$day" ] || { echo "basis ledger: not in the window (weekdays from 15:00 CT)"; exit 0; }
          snap="bids-daily/${day:0:4}/${day}.json.gz"
          f="basis-ledger/v2/live/calls/${day:0:4}/${day}.json.gz"
          have() { GH_TOKEN="$PRIVATE_REPO_TOKEN" gh api -X GET "repos/dnilgis/feedbag/contents/$1?ref=raw" --silent >/dev/null 2>&1; }
          have "$f" && { echo "basis ledger: $f is already on raw"; exit 0; }
          have "$snap" || { echo "basis ledger: no snapshot for $day on raw yet; the next run tries"; exit 0; }
          bash scripts/fetch_private.sh raw || { echo "::warning::basis ledger: raw not readable, no calls for $day"; exit 0; }
          python3 scripts/dev/quiet.py basis-ledger -- python3 scripts/basis_ledger.py run --live-day "$day" --ref origin/raw --out-dir . --replay-max "$BASIS_REPLAY_MAX" \
            || { echo "::warning::basis ledger for $day not built (the bids update is unaffected)"; exit 0; }
          [ -d basis-ledger ] || { echo "basis ledger: nothing new"; exit 0; }
          bash scripts/push_raw.sh "basis ledger $day" basis-ledger \
            || echo "::warning::basis ledger for $day not saved to raw; the next run today retries (the bids update is unaffected)"

      - name: Say why nothing was committed
        if: github.event.inputs.dry_run == 'true'
        run: echo "dry_run was set - both files were written in the runner and thrown away."
