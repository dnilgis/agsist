name: Build Price Stats (5-year percentile)
on:
  schedule:
    - cron: '40 21 * * 1-5'   # 21:40 UTC weekdays (after CBOT settle)
  # Also after every "Fetch Grain Bids" (cron-job.org, every 15 minutes): GitHub
  # drops and delays the schedule above. The gate job below lets the first run
  # after each tick of the schedule do the work; see scripts/cron_gate.py.
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write

# One run at a time, so a chained run and a late cron fire cannot both write.
concurrency:
  group: price-stats
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow price-stats.yml --max-lag 120
          --cron "40 21 * * 1-5"

  build:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install yfinance==1.7.0
      - name: Build price-stats.json
        run: python scripts/build_price_percentile.py
      # Share image (og:image) for the pages this data feeds: scripts/build_share_images.py.
      # Best effort: a share card must never block the data commit.
      - name: Share image
        continue-on-error: true
        run: |
          pip install --quiet pillow==12.3.0
          python3 scripts/build_share_images.py --only corn-futures-prices,soybean-futures-prices,wheat-futures-prices,cattle-futures-prices,markets

      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/price-stats.json corn-futures-prices.html soybean-futures-prices.html wheat-futures-prices.html cattle-futures-prices.html markets.html img/og
          git diff --staged --quiet || git commit -m "Update 5-year price stats"
          git pull --rebase --autostash origin main || true
          git push
