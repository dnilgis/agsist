name: Generate RSS Feed

on:
  push:
    branches: [main]
    paths:
      - 'data/daily-archive/index.json'
      - 'data/daily-archive/*.json'
  workflow_dispatch:

jobs:
  rss:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - name: Generate feed.xml
        run: python3 scripts/generate_rss.py

      - name: Commit feed.xml
        run: |
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          git add feed.xml
          git diff --staged --quiet || git commit -m "chore: regenerate RSS feed"
          pushed=0
          for n in 1 2 3 4 5; do
            if git push; then pushed=1; break; fi
            echo "Push race on attempt $n; rebasing..."
            git pull --rebase origin main || { echo "Rebase failed."; exit 1; }
            sleep $((RANDOM % 4 + 2))
          done
          [ "$pushed" = 1 ] || { echo "Failed to push after 5 attempts."; exit 1; }
