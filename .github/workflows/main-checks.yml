name: main-checks

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/basis-sparklines/**'
      - 'data/bids-prev/**'
      - 'data/basis/**'
      - 'data/state-basis/**'
      - 'data/radar-rain/**'
      - 'data/bids.json'
      - 'data/bids-stats.json'
      - 'data/prices.json'
      - 'data/weather-alerts.json'
  schedule:
    - cron: '17 */2 * * *'
  workflow_run:
    workflows: ["Tick 04"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  gate:
    if: github.event.workflow_run.name != 'Tick 04' || contains(github.event.workflow_run.display_title, ' main-checks.yml ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: main-checks-gate
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow main-checks.yml --max-lag 100
          --cron "17 */2 * * *"

  generated:
    name: generated pages whose builder changed
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: main-checks-generated
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: main
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
      - name: Python packages
        run: pip install --quiet --disable-pip-version-check pillow==12.3.0 numpy==2.5.3 openpyxl==3.1.5 pypdf==6.17.0
      - name: rebuild the sets whose builder changed on main
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          python3 scripts/generated_sets.py main --window 360

  rebuild:
    name: rebuild the built files
    needs: [gate, generated]
    if: needs.gate.outputs.go == '1' && (!cancelled())
    runs-on: ubuntu-24.04
    concurrency:
      group: main-checks-rebuild
      cancel-in-progress: false
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: main
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.13'
      - name: build and commit
        id: push
        run: |
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 scripts/dev/main_build.py build
            python3 scripts/dev/main_build.py stage
            if git diff --staged --quiet; then
              echo "No change."; echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"; exit 0
            fi
            git commit -q -m "Built files rebuilt on main (What's new, changelog)"
            if git push -q origin HEAD:main; then
              echo "Pushed on attempt $i."; echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "Push race on attempt $i; re-syncing to origin/main..."
            sleep $((RANDOM % 4 + 2))
          done
          echo "::error::could not push the rebuilt files after 5 attempts"; exit 1

  checks:
    needs: [gate, rebuild]
    if: needs.gate.outputs.go == '1'
    concurrency:
      group: main-checks
      cancel-in-progress: false
    uses: ./.github/workflows/pr-checks.yml
    with:
      full: true
      ref: ${{ needs.rebuild.outputs.sha }}
    secrets: inherit

  report:
    name: main is red issue
    needs: [gate, generated, rebuild, checks]
    if: needs.gate.outputs.go == '1' && (always())
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.13'
      - name: open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATED: ${{ needs.generated.result }}
          REBUILD: ${{ needs.rebuild.result }}
          CHECKS: ${{ needs.checks.result }}
          SHA: ${{ needs.rebuild.outputs.sha }}
        run: python3 scripts/dev/main_red.py
