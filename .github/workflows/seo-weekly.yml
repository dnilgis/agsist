name: SEO weekly (index check + what to fix)

on:
  schedule:
    - cron: '23 15 * * 1'
  workflow_dispatch:

concurrency:
  group: seo-weekly
  cancel-in-progress: false

jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install google-auth (pinned)
        run: pip install --disable-pip-version-check 'google-auth==2.40.3' 'requests==2.32.3'

      - name: Selftests (offline, fake transport)
        run: |
          python3 scripts/gsc_index_check.py --selftest
          python3 scripts/seo_opportunities.py --selftest

      - name: Index check (URL Inspection sample)
        continue-on-error: true
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE:                 ${{ vars.GSC_SITE }}
        run: python3 scripts/gsc_index_check.py

      - name: Usage file from raw
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: bash scripts/pull_raw.sh data/site-usage.json

      - name: What to fix
        run: python3 scripts/seo_opportunities.py

      - name: Commit
        run: |
          git config user.name  "agsist-bot"
          git config user.email "bot@agsist.com"
          for f in; do
            git add "$f" 2>/dev/null || true
          done
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "seo: weekly index sample and what-to-fix list $(date -u +%Y-%m-%d) [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then echo "Pushed on attempt $i."; exit 0; fi
            git pull --rebase --autostash || { echo "Rebase failed."; exit 1; }
            sleep 3
          done
          echo "Failed to push after 5 attempts."; exit 1
