name: COT Deep History Rebuild

# The release watcher APPENDS one week to data/cot-deep.json and never looks
# back. CFTC revises. An append-only file that is never reconciled slowly stops
# being CFTC's data and starts being ours, and nobody notices because every
# individual week looked right on the day it landed.
#
# So once a week the whole twenty-year archive is re-read and the file is
# rebuilt from scratch. The verify step runs FIRST and prints every cell that
# had drifted, so a revision shows up in the Actions log as a line of text
# rather than as a silently corrected number.
#
# Sunday, because the archive is quiet and nobody is waiting on the page.

on:
  schedule:
    - cron: '20 9 * * 0'
  # GitHub's scheduler drops scheduled fires (it never started land-data.yml on Nov 3, 2026;
  # scripts/cron_gate.py has the numbers). So this also runs after every "Fetch Grain Bids"
  # (cron-job.org, every 15 minutes), and the gate job lets the first run after each tick of the
  # cron above, by either trigger, do the work within 360 minutes
  # (six hours, the same day and well before the next tick).
  # Every other run skips in seconds. A chained run takes the scheduled path. A run by hand or
  # a push does not use up the tick (cron_gate.py MANUAL_DOES_NOT_SERVE): it may take narrower
  # inputs, and the chained run that follows is the same idempotent job.
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One run per tick of the schedule (see on: above). Sparse: the skip costs seconds.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow cot-deep-rebuild.yml --max-lag 360
          --cron "20 9 * * 0"

  rebuild:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: fetch-cot
      cancel-in-progress: false
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --quiet yfinance==1.7.0 pandas==3.0.6

      - name: Prove the readers and the calendar
        run: |
          python scripts/cot_calendar.py
          python scripts/cot_deep.py --selftest

      # Last week's file from the private raw branch (Nov 4: off main), for the
      # revision check only; the rebuild below starts from the archive.
      - name: Last deep history from raw
        continue-on-error: true
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: bash scripts/pull_raw.sh data/cot-deep.json

      # Loud, and allowed to find things: drift is the reason this job exists,
      # so a non-zero exit here is information, not a failure.
      - name: What has CFTC revised since last week?
        continue-on-error: true
        run: python scripts/cot_deep.py --verify

      - name: Rebuild from the archive
        id: rebuild
        run: python scripts/cot_deep.py --rebuild

      - name: Prove the statistics
        run: python scripts/cot_analysis.py --selftest

      # continue-on-error so a failure here does not discard a rebuild that
      # took forty minutes and several hundred megabytes. The deep file is the
      # expensive artifact; the analysis can be re-run in a minute.
      - name: Re-run the analysis on the rebuilt history
        id: analysis
        continue-on-error: true
        run: python scripts/cot_analysis.py

      - name: Commit
        run: |
          git config user.name  "AGSIST Bot"
          git config user.email "bot@agsist.com"
          cp data/cot-analysis.json /tmp/analysis.json
          for i in 1 2 3; do
            git fetch origin main && git reset --hard origin/main
            cp /tmp/analysis.json data/cot-analysis.json
            git add data/cot-analysis.json 2>/dev/null || true
            if git diff --staged --quiet; then echo "No change after rebuild."; exit 0; fi
            git commit -m "chore: rebuild COT deep history $(date +%F) [skip ci]"
            if git push; then echo "pushed"; exit 0; fi
            sleep 5
          done
          echo "ERROR: could not push"; exit 1

      # The rebuilt history is this job's product: saved to the private raw
      # branch (never main), and a failed save fails the run (no RAW_SOFT).
      - name: Save the rebuilt history to raw
        if: ${{ !cancelled() && steps.rebuild.outcome == 'success' }}
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: bash scripts/push_raw.sh "cot deep history rebuild" data/cot-deep.json

      - name: Analysis result
        if: steps.analysis.outcome == 'failure'
        run: |
          echo "The rebuilt history committed, but re-running the analysis FAILED."
          echo "data/cot-analysis.json is on the previous run, so the analysis"
          echo "sections on /cot are hiding themselves until this is fixed."
          exit 1
