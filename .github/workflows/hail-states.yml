name: Hail state pages — generate from monthly data
# Hail state pages: generate from monthly data.

on:
  schedule:
    - cron: '20 6 2 * *'
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow hail-states.yml --max-lag 360
          --cron "20 6 2 * *"

  generate:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: hail-states
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate state pages
        run: python scripts/generate_hail_states.py
      - name: Rebuild the summary files
        run: python scripts/generated_sets.py dependents hail-map --stage || true
      - name: Commit if changed
        run: |
          git config user.name  "agsist-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes."
            exit 0
          fi
          git add -A
          git commit -m "hail: regenerate state pages + sitemap block"
          for i in 1 2 3 4; do
            if python3 scripts/generated_sets.py pull-rebase hail-map && git push origin HEAD:main; then echo "pushed on attempt $i"; exit 0; fi
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main
            git reset -q --hard origin/main
            python scripts/generate_hail_states.py
            python3 scripts/generated_sets.py dependents hail-map --stage || true
            git add -A
            if git diff --staged --quiet; then echo "no change on the new main"; exit 0; fi
            git commit -q -m "hail: regenerate state pages + sitemap block"
            sleep $((10 * i))
          done
          echo "push failed after 4 attempts"; exit 1
