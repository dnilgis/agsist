name: cash-rent

on:
  schedule:
    - cron: "20 14 * * 3"
  workflow_run:
    workflows: ["Fetch Grain Bids", "Tick 11"]
    types: [completed]
  workflow_dispatch:
    inputs:
      states:
        description: "Comma-separated states (blank = all)"
        required: false
        default: ""
      customrates_send:
        description: "Also send the custom rates new-survey emails on this manual run (yes to send; needs CUSTOMRATES_NOTICE_LIVE=1)"
        required: false
        default: "no"

permissions:
  contents: write

jobs:
  gate:
    if: (github.event.workflow_run.name != 'Fetch Grain Bids' || vars.CLOCK_LIVE != '1') && (github.event.workflow_run.name != 'Tick 11' || (contains(github.event.workflow_run.display_title, ' cash-rent.yml ') && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow cash-rent.yml --max-lag 360
          --cron "20 14 * * 3"

  build:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: cash-rent
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Selftest (gate)
        run: python scripts/county_yield.py --selftest && python scripts/fetch_cash_rent.py --selftest && python scripts/send_rent_notice.py --selftest

      - name: Skip outside the release window
        id: window
        run: |
          M=$(date -u +%m); D="${{ github.event_name }}"
          if [ "$D" = "workflow_dispatch" ]; then echo "go=1" >> $GITHUB_OUTPUT; exit 0; fi
          if [ "$M" = "08" ] || [ "$M" = "09" ]; then echo "go=1" >> $GITHUB_OUTPUT; else
            echo "go=0" >> $GITHUB_OUTPUT; echo "month $M is outside the Aug/Sep release window — skipping"; fi

      - name: Fetch
        if: steps.window.outputs.go == '1'
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
          IN_STATES: ${{ github.event.inputs.states }}
        run: |
          if ! printf '%s' "$IN_STATES" | grep -Eq '^[A-Za-z, ]*$'; then
            echo "::error::states must be like IA,IL"; exit 1
          fi
          python scripts/fetch_cash_rent.py --states "$IN_STATES"

      - name: Commit
        if: steps.window.outputs.go == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python scripts/build_breakeven_data.py
          git add -A data/cash-rent data/breakeven 2>/dev/null || true
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: NASS county cash rent + trend yield"
          pushed=0
          for n in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then pushed=1; break; fi
            echo "Push race on attempt $n; rebasing..."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || { echo "Rebase failed."; exit 1; }
            sleep $((RANDOM % 4 + 2))
          done
          [ "$pushed" = 1 ] || { echo "Failed to push after 5 attempts."; exit 1; }

      - name: Rent release emails
        if: steps.window.outputs.go == '1'
        env:
          LIST_URL: ${{ secrets.LIST_URL }}
          LIST_TOKEN: ${{ secrets.LIST_TOKEN }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER || secrets.GMAIL_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || secrets.GMAIL_APP_PASS }}
          FROM_ADDR: ${{ secrets.FROM_ADDR }}
          REPLY_TO: ${{ secrets.REPLY_TO }}
        run: |
          git fetch -q --shallow-since="$(date -u +%Y)-07-01" origin "${GITHUB_REF_NAME}" || true
          python3 scripts/send_rent_notice.py --send

      - name: Custom rates new-survey emails
        if: vars.CUSTOMRATES_NOTICE_LIVE == '1' && (github.event_name != 'workflow_dispatch' || inputs.customrates_send == 'yes')
        env:
          CUSTOMRATES_NOTICE_LIVE: ${{ vars.CUSTOMRATES_NOTICE_LIVE }}
          LIST_URL: ${{ secrets.LIST_URL }}
          LIST_TOKEN: ${{ secrets.LIST_TOKEN }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER || secrets.GMAIL_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || secrets.GMAIL_APP_PASS }}
          FROM_ADDR: ${{ secrets.FROM_ADDR }}
          REPLY_TO: ${{ secrets.REPLY_TO }}
        run: |
          git fetch -q --shallow-since="$(date -u -d '-400 days' +%Y-%m-%d)" origin "${GITHUB_REF_NAME}" || true
          python3 scripts/send_custom_rates_notice.py --selftest
          python3 scripts/send_custom_rates_notice.py --send

      - name: IndexNow ping (Bing learns about new pages in seconds)
        if: steps.window.outputs.go == '1'
        run: |
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"agsist.com","key":"f4a81c26db974e0f92c35b7a6e10d8c4","keyLocation":"https://agsist.com/f4a81c26db974e0f92c35b7a6e10d8c4.txt","urlList":["https://agsist.com/rent/","https://agsist.com/sitemap.xml"]}' \
            || echo "IndexNow ping failed - harmless"
