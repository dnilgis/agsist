name: cond-yield

# Conditions-vs-final-yield honesty fits (/conditions#crop-size; was /conditions-yield). Weekly
# Tuesdays in season, after Monday's Crop Progress lands (conditions.yml
# runs 01:12 Tue; this at 03:18 so both see the same fresh week).
on:
  # 2026-10-16 audit: the nowcast stayed on the week ending Oct 4 after the
  # Columbus Day report. The Tuesday fire ran before NASS released (Tuesday
  # after a holiday), GitHub dropped the Wednesday catch-up fire, and a manual
  # run raced conditions.yml and read last week's ratings file. Now it runs
  # whenever its input (data/conditions/conditions.json) is on a newer week
  # than data/yield-nowcast.json: right after conditions.yml finishes, and
  # otherwise every two hours for five days (scripts/cron_gate.py behind),
  # off the 15-minute "Fetch Grain Bids" runs. The crons stay as a fallback.
  schedule:
    - cron: "18 3 * * 2"       # Tuesdays 03:18 UTC
    - cron: "18 3 * * 3"       # Wednesdays 03:18 UTC (holiday week)
    - cron: "18 15 * * 3,4"    # Wed-Thu 15:18 UTC (late Quick Stats)
  workflow_run:
    workflows: ["conditions", "Fetch Grain Bids"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cond-yield
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            data/conditions/conditions.json
            data/yield-nowcast.json
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          TRIGGER_WORKFLOW: ${{ github.event.workflow_run.name }}
        run: python3 scripts/cron_gate.py condyield

  build:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Selftest (gate)
        run: |
          python scripts/fetch_cond_yield.py --selftest
          python scripts/build_yield_nowcast.py --selftest
          python scripts/nowcast_direction.py --selftest
      - name: Skip off-season
        id: window
        run: |
          M=$(date -u +%m)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "go=1" >> $GITHUB_OUTPUT; exit 0; fi
          if [ "$M" -ge 4 ] && [ "$M" -le 11 ]; then echo "go=1" >> $GITHUB_OUTPUT; else
            echo "go=0" >> $GITHUB_OUTPUT; echo "month $M off-season — skipping"; fi
      - name: Fetch
        if: steps.window.outputs.go == '1'
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: python scripts/fetch_cond_yield.py
      - name: Yield Nowcast
        if: steps.window.outputs.go == '1'
        run: python scripts/build_yield_nowcast.py
      - name: Directional record (grade past WASDE, lock next)
        if: steps.window.outputs.go == '1'
        # Grades any printed WASDE once benchmarks.usda carries the new number
        # (entered on release day per the playbook), then locks the call for
        # the next report from the nowcast it just built. Both idempotent.
        run: python scripts/nowcast_direction.py --grade --lock
      # This job bakes live numbers into visible FAQ answers, so the FAQ's
      # structured data has to be regenerated after it or Google is served the
      # previous week's wording. Runs here as well as in freshness.yml so the
      # markup is never stale in between. Idempotent; refuses rather than
      # publishes a malformed question.
      - name: Bake FAQ structured data
        if: steps.window.outputs.go == '1'
        run: |
          python scripts/bake_faq.py --selftest
          python scripts/bake_faq.py
      - name: Commit
        if: steps.window.outputs.go == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Rebuild the page from the fit it just wrote. Without this the
          # ranked table, hero tiles, seed line, meta description and FAQ stay
          # frozen at whatever week they were hand-written for, while the
          # verdict module at the top reads the fresh JSON live — which is how
          # the page ended up contradicting itself by three weeks.
          python3 scripts/build_condyield.py || true
          # the model and record blocks at the top of the page are baked
          python3 scripts/bake_crop_size.py || true
          git add -A data/cond-yield data/yield-nowcast.json data/nowcast-direction.json 2>/dev/null || true
          git add conditions.html 2>/dev/null || true
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: conditions-vs-yield fits + yield nowcast"
          git pull --rebase --autostash origin main || true
          git push
