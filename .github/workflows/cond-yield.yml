name: cond-yield

on:
  schedule:
    - cron: "18 3 * * 2"
    - cron: "18 3 * * 3"
    - cron: "18 15 * * 3,4"
  workflow_run:
    workflows: ["conditions", "Fetch Grain Bids", "Tick 04"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upstream:
    if: github.event.workflow_run.conclusion != 'skipped' && (github.event.workflow_run.name != 'Fetch Grain Bids' || vars.CLOCK_LIVE != '1') && (github.event.workflow_run.name != 'Tick 04' || contains(github.event.workflow_run.display_title, ' cond-yield.yml '))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.u.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/upstream-did-work/
          sparse-checkout-cone-mode: false
      - id: u
        uses: ./.github/actions/upstream-did-work

  gate:
    needs: upstream
    if: needs.upstream.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            data/conditions/conditions.json
            data/yield-nowcast.json
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          TRIGGER_WORKFLOW: ${{ github.event.workflow_run.name }}
        run: python3 scripts/cron_gate.py condyield

  build:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: cond-yield
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Selftest (gate)
        run: |
          python scripts/fetch_cond_yield.py --selftest
          python scripts/build_yield_nowcast.py --selftest
          python scripts/nowcast_direction.py --selftest
      - name: Skip off-season
        id: window
        run: |
          M=$(date -u +%m)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "go=1" >> $GITHUB_OUTPUT; exit 0; fi
          if [ "$M" -ge 4 ] && [ "$M" -le 11 ]; then echo "go=1" >> $GITHUB_OUTPUT; else
            echo "go=0" >> $GITHUB_OUTPUT; echo "month $M off-season — skipping"; fi
      - name: Fetch
        if: steps.window.outputs.go == '1'
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: python scripts/fetch_cond_yield.py
      - name: Yield Nowcast
        if: steps.window.outputs.go == '1'
        run: python scripts/build_yield_nowcast.py
      - name: Directional record (grade past WASDE, lock next)
        if: steps.window.outputs.go == '1'
        run: python scripts/nowcast_direction.py --grade --lock
      - name: Bake FAQ structured data
        if: steps.window.outputs.go == '1'
        run: |
          python scripts/bake_faq.py --selftest
          python scripts/bake_faq.py
      - name: Commit
        if: steps.window.outputs.go == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/build_condyield.py || true
          python3 scripts/bake_crop_size.py || true
          git add -A data/cond-yield data/yield-nowcast.json data/nowcast-direction.json 2>/dev/null || true
          git add conditions.html 2>/dev/null || true
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: conditions-vs-yield fits + yield nowcast"
          pushed=0
          for n in 1 2 3 4 5; do
            if git push; then pushed=1; break; fi
            echo "Push race on attempt $n; rebasing..."
            git pull --rebase --autostash origin main || { echo "Rebase failed."; exit 1; }
            sleep $((RANDOM % 4 + 2))
          done
          [ "$pushed" = 1 ] || { echo "Failed to push after 5 attempts."; exit 1; }
