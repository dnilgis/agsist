name: cond-yield

# Conditions-vs-final-yield honesty fits (/conditions-yield page). Weekly
# Tuesdays in season, after Monday's Crop Progress lands (conditions.yml
# runs 01:12 Tue; this at 03:18 so both see the same fresh week).
on:
  schedule:
    - cron: "18 3 * * 2"       # Tuesdays 03:18 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cond-yield
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Selftest (gate)
        run: |
          python scripts/fetch_cond_yield.py --selftest
          python scripts/build_yield_nowcast.py --selftest
          python scripts/nowcast_direction.py --selftest
      - name: Skip off-season
        id: window
        run: |
          M=$(date -u +%m)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "go=1" >> $GITHUB_OUTPUT; exit 0; fi
          if [ "$M" -ge 4 ] && [ "$M" -le 11 ]; then echo "go=1" >> $GITHUB_OUTPUT; else
            echo "go=0" >> $GITHUB_OUTPUT; echo "month $M off-season — skipping"; fi
      - name: Fetch
        if: steps.window.outputs.go == '1'
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: python scripts/fetch_cond_yield.py
      - name: Yield Nowcast
        if: steps.window.outputs.go == '1'
        run: python scripts/build_yield_nowcast.py
      - name: Directional record (grade past WASDE, lock next)
        if: steps.window.outputs.go == '1'
        # Grades any printed WASDE once benchmarks.usda carries the new number
        # (entered on release day per the playbook), then locks the call for
        # the next report from the nowcast it just built. Both idempotent.
        run: python scripts/nowcast_direction.py --grade --lock
      # This job bakes live numbers into visible FAQ answers, so the FAQ's
      # structured data has to be regenerated after it or Google is served the
      # previous week's wording. Runs here as well as in freshness.yml so the
      # markup is never stale in between. Idempotent; refuses rather than
      # publishes a malformed question.
      - name: Bake FAQ structured data
        if: steps.window.outputs.go == '1'
        run: |
          python scripts/bake_faq.py --selftest
          python scripts/bake_faq.py
      - name: Commit
        if: steps.window.outputs.go == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Rebuild the page from the fit it just wrote. Without this the
          # ranked table, hero tiles, seed line, meta description and FAQ stay
          # frozen at whatever week they were hand-written for, while the
          # verdict module at the top reads the fresh JSON live — which is how
          # the page ended up contradicting itself by three weeks.
          python3 scripts/build_condyield.py || true
          git add -A data/cond-yield data/yield-nowcast.json data/nowcast-direction.json 2>/dev/null || true
          git add conditions-yield.html 2>/dev/null || true
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: conditions-vs-yield fits + yield nowcast"
          git pull --rebase --autostash origin main || true
          git push
