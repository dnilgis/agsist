name: Build State Stats (USDA NASS)

on:
  push:
    paths:
      - "scripts/build_state_stats.py"
  schedule:
    - cron: "33 12 15 * *"   # monthly, 15th 12:33 UTC (off :30) — picks up the Jan annual summary + NASS revisions
  # CROP PRODUCTION DAYS. The October forecast printed Oct 9 and this file
  # waited for the 15th. It chains off the WASDE watch (every 15 minutes) and
  # the gate job lets a run through on a Crop Production release day, after
  # the print, until the file carries that month's forecast, at most every two
  # hours (scripts/build_state_stats.py --gate).
  workflow_run:
    workflows: ["WASDE watch — grade the report as it lands"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: state-stats
  cancel-in-progress: false

jobs:
  gate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_run'
        with:
          sparse-checkout: |
            scripts/build_state_stats.py
            scripts/usda_dates.py
            data/state-stats.json
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          EV: ${{ github.event_name }}
        run: |
          if [ "$EV" = "workflow_run" ]; then python3 scripts/build_state_stats.py --gate >> "$GITHUB_OUTPUT"; else echo "go=1" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data/state-stats.json
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: |
          python scripts/build_state_stats.py --selftest
          python scripts/build_state_stats.py
      - name: Pillow, for the share image
        continue-on-error: true
        run: pip install --quiet pillow==12.3.0

      - name: Commit if changed (race-tolerant)
        run: |
          set -e
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          FILE="data/state-stats.json"
          [ -f "$FILE" ] || { echo "No output file; nothing to commit."; exit 0; }
          cp "$FILE" /tmp/state-stats.json
          BR="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3 4 5; do
            git fetch origin "$BR"
            git reset --hard "origin/$BR"
            cp /tmp/state-stats.json "$FILE"
            git add "$FILE"
            # title, snippet, state line and JSON-LD dateModified from this file
            if python scripts/bake_seo.py --page usda-quick-stats.html; then git add usda-quick-stats.html; fi
            # the yield-by-state share image reads this file (best effort)
            if python scripts/build_share_images.py --only usda-quick-stats; then git add usda-quick-stats.html img/og/usda-quick-stats.jpg; fi
            if git diff --staged --quiet; then echo "No change."; exit 0; fi
            git commit -m "Update state stats $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if git push origin "HEAD:$BR"; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push race on attempt $i; re-syncing to origin/$BR..."
            sleep $((RANDOM % 4 + 2))
          done
          echo "Failed to push after 5 attempts."; exit 1
