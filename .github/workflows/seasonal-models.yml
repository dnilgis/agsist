name: seasonal models

# Seasonal forecast models started in November (NMME through the IRI Data
# Library; Copernicus C3S through the Climate Data Store), written to
# data/prf/seasonal-fc.json by scripts/fetch_seasonal_models.py, then the PRF
# optimizer's walk-forward test (scripts/prf_opt_backtest.mjs) is re-run so
# data/prf/opt.json tests each model and their average on the new data.
# Until this has run once, opt.json lists every model as "not tested yet".
#
# The Copernicus models need the CDS_API_KEY repository secret (a free
# Climate Data Store account; the key is on the account page). Without it
# they are skipped and said so; NMME needs no key.
#
# On the 15th of November and December (both November sources are out by the
# 13th), off the hour, and by hand. A model that fails keeps what is
# already published for it; the step is marked failed and nothing older
# replaces anything newer.
#
# Run by hand with "probe" ticked to see which source paths answer (one
# start, one lead, one cell from each, 30 s each) without fetching or
# committing anything; it finishes in a few minutes.
on:
  schedule:
    - cron: "41 15 15 11,12 *"   # Nov 15 and Dec 15, 15:41 UTC
  # GitHub's scheduler drops scheduled fires (it never started land-data.yml on Nov 3, 2026;
  # scripts/cron_gate.py has the numbers). So this also runs after every "Fetch Grain Bids"
  # (cron-job.org, every 15 minutes), and the gate job lets the first run after each tick of the
  # cron above, by either trigger, do the work within 360 minutes
  # (six hours, the same day and well before the next tick).
  # Every other run skips in seconds. A chained run takes the scheduled path. A run by hand or
  # a push does not use up the tick (cron_gate.py MANUAL_DOES_NOT_SERVE): it may take narrower
  # inputs, and the chained run that follows is the same idempotent job.
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]
  workflow_dispatch:
    inputs:
      probe:
        description: "Only probe which source paths answer; fetch and commit nothing"
        type: boolean
        default: false

permissions: {}

jobs:
  # One run per tick of the schedule (see on: above). Sparse: the skip costs seconds.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow seasonal-models.yml --max-lag 360
          --cron "41 15 15 11,12 *"

  probe:
    needs: gate
    if: needs.gate.outputs.go == '1' && (github.event_name == 'workflow_dispatch' && inputs.probe)
    runs-on: ubuntu-24.04
    concurrency:
      group: seasonal-models
      cancel-in-progress: false
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - name: Probe the source paths
        timeout-minutes: 8
        run: python3 scripts/fetch_seasonal_models.py --probe

  models:
    needs: gate
    if: needs.gate.outputs.go == '1' && (github.event_name != 'workflow_dispatch' || !inputs.probe)
    runs-on: ubuntu-24.04
    concurrency:
      group: seasonal-models
      cancel-in-progress: false
    timeout-minutes: 75
    permissions:
      contents: write          # commits the two data files below
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: true   # this job pushes
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - name: Offline first
        run: python3 scripts/fetch_seasonal_models.py --selftest

      - name: Install the readers
        run: |
          for i in 1 2 3; do
            python3 -m pip install --quiet --user "numpy==2.1.3" "xarray==2024.10.0" "netCDF4==1.7.2" "cdsapi==0.7.4" && exit 0
            sleep $((15 * i))
          done
          exit 1

      - name: Fetch
        id: fetch
        continue-on-error: true
        timeout-minutes: 45     # the script stops itself at 40
        env:
          CDS_API_KEY: ${{ secrets.CDS_API_KEY }}
        run: |
          set -o pipefail
          python3 scripts/fetch_seasonal_models.py --minutes 40 2>&1 | tee seasonal.log

      - name: Re-run the optimizer test with the models
        run: |
          python3 scripts/fetch_seasonal_models.py --check
          node scripts/prf_opt_backtest.mjs --quiet
          node --test test/prf-optimize.test.mjs test/prf-climate.test.mjs test/prf-seasonal.test.mjs
          python3 scripts/check_site_budget.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prf/seasonal-fc.json data/prf/opt.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          WHAT=$(python3 -c "import json;d=json.load(open('data/prf/seasonal-fc.json'));print(', '.join('%s %d-%d'%(k,v['first'],v['last']) for k,v in d['models'].items()))")
          git commit -q -m "data: seasonal forecast models ($WHAT), PRF optimizer test re-run"
          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            if git pull -q --rebase --autostash origin main && git push -q; then exit 0; fi
            sleep $((20 * i))
          done
          echo "push failed after 5 attempts"; exit 1

      - name: Say which model failed
        if: steps.fetch.outcome == 'failure'
        run: |
          grep -E "FAILED|refusing|less than published|out of time" seasonal.log || true
          echo "::warning::A seasonal model source failed; what was published for it was kept. See the Fetch step."
