name: seasonal models

on:
  schedule:
    - cron: "41 15 15 11,12 *"
  workflow_run:
    workflows: ["Fetch Grain Bids", "Tick 12"]
    types: [completed]
  workflow_dispatch:
    inputs:
      probe:
        description: "Only probe which source paths answer; fetch and commit nothing"
        type: boolean
        default: false

permissions: {}

jobs:
  gate:
    if: (github.event.workflow_run.name != 'Fetch Grain Bids' || vars.CLOCK_LIVE != '1') && (github.event.workflow_run.name != 'Tick 12' || contains(github.event.workflow_run.display_title, ' seasonal-models.yml '))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow seasonal-models.yml --max-lag 360
          --cron "41 15 15 11,12 *"

  probe:
    needs: gate
    if: needs.gate.outputs.go == '1' && (github.event_name == 'workflow_dispatch' && inputs.probe)
    runs-on: ubuntu-24.04
    concurrency:
      group: seasonal-models
      cancel-in-progress: false
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - name: Probe the source paths
        timeout-minutes: 8
        run: python3 scripts/fetch_seasonal_models.py --probe

  models:
    needs: gate
    if: needs.gate.outputs.go == '1' && (github.event_name != 'workflow_dispatch' || !inputs.probe)
    runs-on: ubuntu-24.04
    concurrency:
      group: seasonal-models
      cancel-in-progress: false
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: true
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - name: Offline first
        run: python3 scripts/fetch_seasonal_models.py --selftest

      - name: Install the readers
        run: |
          for i in 1 2 3; do
            python3 -m pip install --quiet --user "numpy==2.1.3" "xarray==2024.10.0" "netCDF4==1.7.2" "cdsapi==0.7.4" && exit 0
            sleep $((15 * i))
          done
          exit 1

      - name: Get the saved model inputs (private repo, private-data branch)
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_BRANCH: private-data
        run: |
          bash scripts/pull_raw.sh private/prf/seasonal-fc.json
          bash scripts/pull_raw.sh private/prf/climate-indices.json

      - name: Fetch
        id: fetch
        continue-on-error: true
        timeout-minutes: 45
        env:
          CDS_API_KEY: ${{ secrets.CDS_API_KEY }}
        run: |
          set -o pipefail
          python3 scripts/fetch_seasonal_models.py --minutes 40 2>&1 | tee seasonal.log

      - name: Save the seasonal forecast models (private repo, private-data branch)
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_BRANCH: private-data
          RAW_SOFT: '1'
        run: |
          [ -f private/prf/seasonal-fc.json ] || { echo "no file written"; exit 0; }
          python3 scripts/fetch_seasonal_models.py --check
          bash scripts/push_raw.sh "seasonal forecast models" private/prf/seasonal-fc.json

      - name: Re-run the optimizer test with the models
        run: |
          python3 scripts/fetch_seasonal_models.py --check
          node scripts/prf_opt_backtest.mjs --quiet
          node --test test/prf-optimize.test.mjs test/prf-climate.test.mjs test/prf-seasonal.test.mjs
          python3 scripts/check_site_budget.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prf/opt.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "data: PRF optimizer test re-run"
          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            if git pull -q --rebase --autostash origin main && git push -q; then exit 0; fi
            sleep $((20 * i))
          done
          echo "push failed after 5 attempts"; exit 1

      - name: Say which model failed
        if: steps.fetch.outcome == 'failure'
        run: |
          grep -E "FAILED|refusing|less than published|out of time" seasonal.log || true
          echo "::warning::A seasonal model source failed; what was published for it was kept. See the Fetch step."
