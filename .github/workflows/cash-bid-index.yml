name: Cash Bid Index

on:
  schedule:
    - cron: '23 11 1 * *'
  workflow_run:
    workflows: ["Fetch Grain Bids", "Tick 08"]
    types: [completed]
  workflow_dispatch:
    inputs:
      month:
        description: "Edition month, YYYY-MM (blank: last month)"
        type: string
        default: ""
      partial_ok:
        description: "Publish a partial month, labeled with its real dates"
        type: boolean
        default: false
      usda_only:
        description: "Read USDA (prices received and paid, production weights) and rebuild the page; no edition"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  gate:
    if: (github.event.workflow_run.name != 'Fetch Grain Bids' || vars.CLOCK_LIVE != '1') && (github.event.workflow_run.name != 'Tick 08' || (contains(github.event.workflow_run.display_title, ' cash-bid-index.yml ') && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow cash-bid-index.yml --max-lag 360
          --cron "23 11 1 * *"

  build:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: cash-bid-index
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Selftest
        run: |
          python scripts/daily_edge.py --selftest
          python scripts/cash_bid_index.py --selftest
          python scripts/cash_index_usda.py --selftest
      - name: Read USDA
        continue-on-error: true
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: python scripts/cash_index_usda.py --fetch
      - name: Keep USDA's answers as first prints
        continue-on-error: true
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_KEEP: '1'
          RAW_SOFT: '1'
        run: |
          [ -d vintage/nass-cash-index ] || { echo "nothing read from USDA this run"; exit 0; }
          bash scripts/push_raw.sh "nass cash index first print $(date -u +%F)" vintage/nass-cash-index
      - name: Unpack the private month files
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_BRANCH: private-data
        run: |
          bash scripts/pull_raw.sh private/cash-index
          cat private/cash-index/*.json | sha256sum > "$RUNNER_TEMP/cash-index-before"
      - name: Build the edition
        env:
          MONTH: ${{ github.event.inputs.month }}
          PARTIAL: ${{ github.event.inputs.partial_ok }}
          USDA_ONLY: ${{ github.event.inputs.usda_only }}
        run: |
          if [ "$USDA_ONLY" = "true" ]; then
            python scripts/cash_bid_index.py --page
            python scripts/cash_bid_index.py --check
            exit 0
          fi
          args="--build"
          [ -n "$MONTH" ] && args="$args $MONTH"
          [ "$PARTIAL" = "true" ] && args="$args --partial-ok"
          python scripts/cash_bid_index.py $args
          python scripts/cash_bid_index.py --check
      - name: Save the folded month files privately
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_BRANCH: private-data
          RAW_SOFT: '1'
        run: |
          [ "$(cat private/cash-index/*.json | sha256sum)" = "$(cat "$RUNNER_TEMP/cash-index-before")" ] && { echo "cash index: nothing new to save"; exit 0; }
          bash scripts/push_raw.sh "cash index build $(date -u +%F)" private/cash-index
      - name: Commit if changed (race-tolerant)
        run: |
          set -e
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          rm -rf /tmp/cbi && mkdir -p /tmp/cbi
          cp -r --parents data/cash-index cash-bid-index.html /tmp/cbi/
          BR="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3 4 5; do
            git fetch origin "$BR"
            git reset --hard "origin/$BR"
            mkdir -p data && cp -r /tmp/cbi/data/. data/ && cp /tmp/cbi/cash-bid-index.html .
            git add -A data/cash-index cash-bid-index.html
            python scripts/generated_sets.py dependents cash-bid-index --stage || true
            if git diff --staged --quiet; then echo "No change."; exit 0; fi
            git commit -m "Cash Bid Index edition $(date -u +%Y-%m-%d) [skip ci]"
            if git push origin "HEAD:$BR"; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push race on attempt $i; re-syncing to origin/$BR..."
            sleep $((RANDOM % 4 + 2))
          done
          echo "Failed to push after 5 attempts."; exit 1
