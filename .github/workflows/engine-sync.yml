name: Engine sync
# Engine sync.

# - It never force-pushes; a push race fetches the engine branch again and

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "test/**"
      - "build/**"
      - ".github/engine-paths"
      - ".github/actions/engine/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: The engine branch (private repo)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: dnilgis/feedbag
          ref: engine-agsist
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: .engine-sync
      - name: Refuse when a file is only in the engine
        run: bash .github/actions/engine/engine.sh only-engine .engine-sync
      - name: Save main's engine paths and push (never forced)
        env:
          GIT_AUTHOR_NAME: AGSIST Bot
          GIT_AUTHOR_EMAIL: bot@agsist.com
        run: |
          set -e
          ED="$GITHUB_WORKSPACE/.engine-sync"
          SHA=$(git rev-parse --short HEAD)
          for i in 1 2 3; do
            out=$(ENGINE_DIR="$ED" bash .github/actions/engine/engine.sh save "sync engine to agsist main $SHA (engine-sync.yml)")
            echo "$out" | grep -E '^engine: (nothing to save|committed)' | head -1
            if echo "$out" | grep -q '^engine: nothing to save'; then exit 0; fi
            echo "$out" | grep -cE '^ [^ ].*\|' | sed 's/^/files changed: /' || true
            if git -C "$ED" push -q origin HEAD:engine-agsist; then echo "pushed on attempt $i"; exit 0; fi
            echo "push race on attempt $i; fetching the engine branch again"
            git -C "$ED" fetch -q origin engine-agsist
            git -C "$ED" reset -q --hard origin/engine-agsist
            bash .github/actions/engine/engine.sh only-engine "$ED"
            sleep $((10 * i))
          done
          echo "::error::could not push the engine sync after 3 attempts"; exit 1
