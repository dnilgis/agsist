name: state-rent-pages

# Rebuilds the 47 /rent/<state> pages + /rent/ hub from data/cash-rent/*.json.
# OFFLINE — no API, no key. The pages are MACHINE-OWNED like sitemap.xml:
# never hand-edit rent/*.html, edit scripts/build_state_rent_pages.py.
#
# Weekly cron (offset from cash-rent's Wed 14:20 fetch) because bot pushes
# from cash-rent.yml can't trigger other workflows — this catches new August
# data within the hour. Commits only when output actually changes, so the
# other ~51 weeks it's a no-op. Also adds/bumps all /rent URLs in the
# sitemap via update_sitemap.py --add (idempotent).
on:
  schedule:
    - cron: "55 15 * * 3"     # Wednesdays 15:55 UTC, after cash-rent's fetch
  # GitHub's scheduler drops scheduled fires (it never started land-data.yml on Nov 3, 2026;
  # scripts/cron_gate.py has the numbers). So this also runs after every "Fetch Grain Bids"
  # (cron-job.org, every 15 minutes), and the gate job lets the first run after each tick of the
  # cron above, by either trigger, do the work within 360 minutes
  # (six hours, the same day and well before the next tick).
  # Every other run skips in seconds. A chained run takes the scheduled path. A run by hand or
  # a push does not use up the tick (cron_gate.py MANUAL_DOES_NOT_SERVE): it may take narrower
  # inputs, and the chained run that follows is the same idempotent job.
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One run per tick of the schedule (see on: above). Sparse: the skip costs seconds.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow state-rent-pages.yml --max-lag 360
          --cron "55 15 * * 3"

  build:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: sitemap-write        # writes sitemap.xml — never race the other writers
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Selftest (gate)
        run: python scripts/build_state_rent_pages.py --selftest

      - name: Build pages
        run: python scripts/build_state_rent_pages.py --print-urls > /tmp/rent-urls.txt

      - name: Sitemap add/bump (idempotent)
        run: |
          urls=$(tr '\n' ' ' < /tmp/rent-urls.txt)
          python scripts/update_sitemap.py --add $urls --priority 0.7 --changefreq yearly

      - name: Commit if changed
        run: |
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          git add rent sitemap.xml
          # the summary files that read these pages (BUILD-RULES 61): the search index and llms.txt
          python scripts/generated_sets.py dependents rent --stage || true
          if git diff --staged --quiet; then echo "no change"; exit 0; fi
          git commit -m "pages: rebuild /rent state cash-rent pages"
          git pull --rebase --autostash origin main || true
          git push

      - name: IndexNow ping (best-effort)
        continue-on-error: true
        run: |
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"agsist.com","key":"f4a81c26db974e0f92c35b7a6e10d8c4","keyLocation":"https://agsist.com/f4a81c26db974e0f92c35b7a6e10d8c4.txt","urlList":["https://agsist.com/rent/","https://agsist.com/sitemap.xml"]}' \
            || echo "IndexNow ping failed - harmless"
