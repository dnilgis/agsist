name: state-rent-pages

on:
  schedule:
    - cron: "55 15 * * 3"
  workflow_run:
    workflows: ["Tick 13"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    if: github.event.workflow_run.name != 'Tick 13' || contains(github.event.workflow_run.display_title, ' state-rent-pages.yml ')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow state-rent-pages.yml --max-lag 360
          --cron "55 15 * * 3"

  build:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: sitemap-write
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Selftest (gate)
        run: python scripts/build_state_rent_pages.py --selftest

      - name: Build pages
        run: python scripts/build_state_rent_pages.py --print-urls > /tmp/rent-urls.txt

      - name: Sitemap add/bump (idempotent)
        run: |
          urls=$(tr '\n' ' ' < /tmp/rent-urls.txt)
          python scripts/update_sitemap.py --add $urls --priority 0.7 --changefreq yearly

      - name: Commit if changed
        run: |
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          git add rent sitemap.xml
          python scripts/generated_sets.py dependents rent --stage || true
          if git diff --staged --quiet; then echo "no change"; exit 0; fi
          git commit -m "pages: rebuild /rent state cash-rent pages"
          for i in 1 2 3 4; do
            if python3 scripts/generated_sets.py pull-rebase rent && git push origin HEAD:main; then echo "pushed on attempt $i"; exit 0; fi
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main
            git reset -q --hard origin/main
            python scripts/build_state_rent_pages.py --print-urls > /tmp/rent-urls.txt
            python scripts/update_sitemap.py --add $(tr '\n' ' ' < /tmp/rent-urls.txt) --priority 0.7 --changefreq yearly
            python3 scripts/generated_sets.py dependents rent --stage || true
            git add rent sitemap.xml
            if git diff --staged --quiet; then echo "no change on the new main"; exit 0; fi
            git commit -q -m "pages: rebuild /rent state cash-rent pages"
            sleep $((10 * i))
          done
          echo "push failed after 4 attempts"; exit 1

      - name: IndexNow ping (best-effort)
        continue-on-error: true
        run: |
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"agsist.com","key":"f4a81c26db974e0f92c35b7a6e10d8c4","keyLocation":"https://agsist.com/f4a81c26db974e0f92c35b7a6e10d8c4.txt","urlList":["https://agsist.com/rent/","https://agsist.com/sitemap.xml"]}' \
            || echo "IndexNow ping failed - harmless"
