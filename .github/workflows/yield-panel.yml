name: yield-panel

# "What everyone else says" on /conditions-yield — the panel of independent 2026
# yield forecasts beside our own nowcast.
#
# SEPARATE FROM cond-yield.yml ON PURPOSE. That workflow is gated on an
# in-season window and skips itself outside it, which is right for a ratings
# model and wrong for this: the benchmark file is edited by hand, and an edit
# made in December has to reach the page in December. This job carries no
# seasonal gate.
#
# It reads two files and owns neither number. data/yield-benchmarks.json is the
# hand-maintained roster of other people's forecasts; data/yield-nowcast.json is
# ours, read rather than copied so the panel cannot disagree with the tiles
# above it.

on:
  # The point of a hand-maintained file is that editing it does something. A
  # push to either of these rebuilds the panel within the minute.
  push:
    branches: [main]
    paths:
      - 'data/yield-benchmarks.json'
      - 'scripts/build_yield_benchmarks.py'
      - 'conditions-yield.html'
      - 'scripts/bake_crop_size.py'
  # Daily, off the hour. The nowcast lands Tuesdays 03:18 UTC, so this picks up
  # a fresh model number the same morning and every other day is a no-op that
  # commits nothing.
  schedule:
    - cron: '24 4 * * *'
  # USDA'S NUMBER MOVES ON REPORT DAY, so this runs when the WASDE watcher
  # finishes. It finishes every 15 minutes; the gate job below lets a run
  # through only when data/wasde.json carries a USDA yield the panel has not
  # picked up yet (scripts/usda_current.py --gate panel). A bot commit to
  # data/wasde.json does not fire the push trigger above, which is why the
  # panel kept September's 178.5 a day after the 181.2 print.
  workflow_run:
    workflows: ["WASDE watch — grade the report as it lands"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yield-panel
  cancel-in-progress: false

jobs:
  gate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_run'
        with:
          sparse-checkout: |
            scripts/usda_current.py
            data/wasde.json
            data/yield-panel.json
          sparse-checkout-cone-mode: false
      - id: g
        env:
          EV: ${{ github.event_name }}
        run: |
          if [ "$EV" = "workflow_run" ]; then python3 scripts/usda_current.py --gate panel >> "$GITHUB_OUTPUT"; else echo "go=1" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Hand-worked answers before anything is written. The failure this
      # guards against is silent: a sort that stops sorting or a rank off by
      # one produces a panel that looks fine and ranks people wrongly.
      - name: Selftest the builder
        run: |
          python scripts/usda_current.py --selftest
          python scripts/build_yield_benchmarks.py --selftest
          python scripts/bake_seo.py --selftest
          python scripts/bake_crop_size.py --selftest

      # Refuses to write on an unsourced forecast, and refuses if it disagrees
      # with data/crop-tour.json about a figure both pages print. A red X here
      # means the panel did not update and the old one is still correct.
      - name: Build the panel
        run: |
          python scripts/build_yield_benchmarks.py
          # the page's title and description name the forecasts in this file
          python scripts/bake_seo.py --page conditions-yield.html
          # and the forecast table, model and record are baked into the page
          python scripts/bake_crop_size.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/yield-panel.json conditions-yield.html
          if git diff --cached --quiet; then echo "panel unchanged"; exit 0; fi
          git commit -m "data: yield benchmark panel [skip ci]"
          for i in 1 2 3; do
            git push && break
            git pull --rebase --autostash origin main && sleep 3
          done
