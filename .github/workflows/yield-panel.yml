name: yield-panel
# yield-panel.

on:
  push:
    branches: [main]
    paths:
      - 'data/yield-benchmarks.json'
      - 'scripts/build_yield_benchmarks.py'
      - 'conditions.html'
      - 'scripts/bake_crop_size.py'
  schedule:
    - cron: '24 4 * * *'
  workflow_run:
    workflows: ["WASDE watch — grade the report as it lands"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upstream:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.u.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/upstream-did-work/
          sparse-checkout-cone-mode: false
      - id: u
        uses: ./.github/actions/upstream-did-work

  gate:
    needs: upstream
    if: needs.upstream.outputs.go == '1' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_run'
        with:
          sparse-checkout: |
            scripts/usda_current.py
            data/wasde.json
            data/yield-panel.json
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        if: github.event_name == 'workflow_run'
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          EV: ${{ github.event_name }}
        run: |
          if [ "$EV" = "workflow_run" ]; then python3 scripts/usda_current.py --gate panel >> "$GITHUB_OUTPUT"; else echo "go=1" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: yield-panel
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Selftest the builder
        run: |
          python scripts/usda_current.py --selftest
          python scripts/build_yield_benchmarks.py --selftest
          python scripts/bake_seo.py --selftest
          python scripts/bake_crop_size.py --selftest

      - name: Build the panel
        run: |
          python scripts/build_yield_benchmarks.py
          python scripts/bake_seo.py --page conditions.html
          python scripts/bake_crop_size.py

      - name: Share image
        continue-on-error: true
        run: |
          pip install --quiet pillow==12.3.0
          python3 scripts/build_share_images.py --only crop-tour

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/yield-panel.json conditions.html crop-tour.html img/og/crop-tour.jpg
          if git diff --cached --quiet; then echo "panel unchanged"; exit 0; fi
          git commit -m "data: yield benchmark panel [skip ci]"
          pushed=0
          for n in 1 2 3 4 5; do
            if git push; then pushed=1; break; fi
            echo "Push race on attempt $n; rebasing..."
            git pull --rebase --autostash origin main || { echo "Rebase failed."; exit 1; }
            sleep $((RANDOM % 4 + 2))
          done
          [ "$pushed" = 1 ] || { echo "Failed to push after 5 attempts."; exit 1; }
