name: The wire

# WHY THIS RUNS OFTEN
#   The point of the wire is to publish a measurable event before somebody else
#   writes it up. Cron delivery on this account was measured at 17.4% (66 of 380
#   fires), so a single schedule would miss most of the day. Three offset
#   schedules run the same idempotent job: whichever one lands does the work,
#   and the ones that follow find nothing new and write nothing. Duplicate items
#   are impossible -- build_news.py keys every item on what it is about, never on
#   when it ran.
on:
  schedule:
    - cron: "7,37 12-21 * * 1-5"    # 7:07am-4:37pm Central, weekdays
    - cron: "22,52 12-21 * * 1-5"   # offset by 15 minutes
    - cron: "12 22,23,0,11 * * *"   # evening and pre-open, every day
  workflow_dispatch:
  # The watchers already know the moment something lands. They can say so.
  repository_dispatch:
    types: [wire]

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # github.sha is fixed when the run is CREATED. A queued run that starts
          # ten minutes later would otherwise build the wire from a stale tree.
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the detectors before trusting them
        run: python scripts/build_news.py --selftest

      - name: Test the weather-alert reader before trusting it
        run: python scripts/fetch_weather_alerts.py --selftest

      # 2026-10-01: frost/freeze alerts, read from NWS's own public feed. This
      # is a new external dependency the rest of the wire does not have, so it
      # runs with continue-on-error -- the same convention as every other
      # non-critical step in this pipeline. A failed pull leaves the existing
      # data/weather-alerts.json in place (fetch_weather_alerts.py's own rule:
      # never overwrite good data with empty), so the wire still has whatever
      # it last fetched successfully rather than silently losing the section.
      - name: Pull active frost/freeze alerts
        continue-on-error: true
        run: python scripts/fetch_weather_alerts.py

      - name: Build the wire
        id: build
        run: |
          set -o pipefail
          python scripts/build_news.py | tee /tmp/wire.log
          # Read the count the script PRINTED, not the file. A run that finds
          # nothing now leaves the files untouched -- so the file still carries
          # the previous run's "added", and reading it would ping IndexNow for
          # news that already went out.
          ADDED=$(grep -m1 '^added=' /tmp/wire.log | cut -d= -f2)
          echo "added=${ADDED:-0}" >> "$GITHUB_OUTPUT"
          echo "Added ${ADDED:-0} item(s)."

      # A quiet wire writes nothing, so this usually finds nothing to commit and
      # says so. That is the point: before 2026-09-13 it committed three moved
      # timestamps on every fire.
      - name: Commit if changed (race-tolerant)
        id: commit
        run: |
          set -e
          git config user.name  "AGSIST Bot"
          git config user.email "bot@agsist.com"
          cp data/news.json /tmp/news.json
          cp news.xml       /tmp/news.xml
          # Optional: absent on a run where the pull step above failed and no
          # file has ever been written yet (continue-on-error already made
          # that a non-fatal case, not a reason to fail the commit step too).
          cp data/weather-alerts.json /tmp/weather-alerts.json 2>/dev/null || true
          BR="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3 4 5; do
            git fetch origin "$BR"
            git reset --hard "origin/$BR"
            cp /tmp/news.json data/news.json
            cp /tmp/news.xml  news.xml
            [ -f /tmp/weather-alerts.json ] && cp /tmp/weather-alerts.json data/weather-alerts.json
            git add data/news.json news.xml
            git add data/weather-alerts.json 2>/dev/null || true
            if git diff --staged --quiet; then echo "No change."; echo "pushed=0" >> "$GITHUB_OUTPUT"; exit 0; fi
            git commit -m "wire: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if git push origin "HEAD:$BR"; then echo "pushed=1" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "Push race on attempt $i; re-syncing..."
            sleep $((RANDOM % 4 + 2))
          done
          echo "Failed to push after 5 attempts."; exit 1

      # The whole point. A crawler hears about the page within seconds of the
      # item existing, rather than whenever it next decides to visit.
      - name: Tell the crawlers
        if: steps.build.outputs.added != '0' && steps.commit.outputs.pushed == '1'
        continue-on-error: true          # a search engine being down is not our outage
        run: python scripts/indexnow_submit.py --urls https://agsist.com/news https://agsist.com/news.xml
