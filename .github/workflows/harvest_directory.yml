# Take the national elevator directory off Barchart while the key still works.
#
# WHY THIS IS ITS OWN WORKFLOW
#
# Sig, 2026-08-27: "i have a feeling that i wont be continuing my barchart api
# subscription when it comes up for renewal ... yeah get all the barchart
# elevators info, addreseess, etc."
#
# fetch_bids runs every half hour for prices and must stay cheap; this asks a
# different question of the same API -- requestType=locations across 590 grid
# points -- and the answer changes about as often as a co-op opens a new site.
# Running it on the price schedule would be 590 extra calls every thirty
# minutes to learn nothing new.
#
# MONTHLY, AND BY HAND WHENEVER. The cron keeps the directory from rotting on
# its own; the button is what you press before a renewal date, or after adding
# grid density, or to see whether a plan change unlocked more fields.
#
# IT WRITES NO PRICES. The script keeps company, branch, address, city, state,
# ZIP, county, FIPS, lat/lng, phone, url and Barchart's own facility ids, and
# drops every price, basis, symbol and delivery window. What it keeps is a fact
# about who is where; what it drops is the licensed feed.

name: harvest elevator directory

on:
  schedule:
    # 07:20 UTC on the 2nd of each month — well clear of the price windows and
    # of the top of the hour, which is the busiest minute on the platform.
    - cron: "20 7 2 * *"
  workflow_dispatch:
    inputs:
      max_distance:
        description: "Miles around each grid point (Barchart's ceiling is 250; 75 covers the country with overlap)"
        default: "75"
      total_locations:
        description: "Cap per point. A point that returns exactly this many is reported as saturated"
        default: "500"
      start:
        description: "Skip this many grid points — resume a sweep that ran out of time"
        default: "0"
      limit:
        description: "Ask at most this many points (0 = all 590). Use 5 for a smoke test"
        default: "0"
      minutes:
        description: "Stop cleanly after this many minutes (0 = no limit)"
        default: "40"

permissions:
  contents: write

concurrency:
  group: harvest-directory
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sweep the grid for locations
        env:
          BARCHART_API_KEY: ${{ secrets.BARCHART_API_KEY }}
        run: |
          python scripts/extract_directory.py \
            --max-distance "${{ inputs.max_distance || '75' }}" \
            --total-locations "${{ inputs.total_locations || '500' }}" \
            --start "${{ inputs.start || '0' }}" \
            --limit "${{ inputs.limit || '0' }}" \
            --minutes "${{ inputs.minutes || '40' }}"

      # THE NUMBERS GO WHERE A PERSON WILL SEE THEM. The point of this run is
      # the counts -- how many facilities, how many with an address, how many
      # with real coordinates, and which ZIPs saturated -- and a run summary is
      # read where a log is not.
      - name: Say what came back
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("data/elevator-directory.json")
          if not p.exists():
              print("### harvest\n\nNo directory was written."); raise SystemExit
          d = json.loads(p.read_text()); c = d["counts"]
          print("### elevator directory\n")
          print("| | |\n|---|---|")
          for k in ("facilities","states","with_address","with_coords","with_url","with_phone"):
              print("| %s | %s |" % (k.replace("_"," "), c.get(k)))
          print("| complete national picture | %s |" % ("yes" if d.get("complete") else "**no**"))
          if d.get("saturated"):
              print("\n%d ZIPs returned a full page and are probably truncated — densify the grid there rather than raising the cap:\n\n`%s`"
                    % (len(d["saturated"]), " ".join(d["saturated"][:40])))
          if d.get("failed"):
              print("\n%d ZIPs failed:\n" % len(d["failed"]))
              for f in d["failed"][:15]:
                  print("- `%s` %s" % (f["zip"], f["why"]))
          PY

      - name: Commit the directory
        run: |
          git config user.name  "agsist-bot"
          git config user.email "bot@agsist.com"
          git add data/elevator-directory.json data/zip-grid.json
          git diff --cached --quiet && { echo "the directory did not change"; exit 0; }
          n=$(python -c "import json;print(json.load(open('data/elevator-directory.json'))['counts']['facilities'])")
          git commit -m "directory: $n elevators [skip ci]"
          git push
