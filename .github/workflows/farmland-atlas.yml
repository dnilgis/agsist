name: farmland-atlas

# The Farmland Atlas (/farmland-atlas). Ten fetches, one build, one commit.
#
#   heat    NOAA NCEI nClimDiv county minimum temperature   (no key, ~40 MB)
#   water   USDA Census 2022 via NASS Quick Stats + USGS 2015 (NASS_API_KEY)
#   loss    USDA RMA cause of loss, 1989 onward              (no key; first run ~38 zips, later 2)
#   sob     USDA RMA Summary of Business county premium      (no key; first run ~38 zips, later 2)
#   value   USDA Census land value per acre, 2012/17/22      (NASS_API_KEY)
#   crp     FSA CRP enrolment and contract expirations       (no key, two xlsx)
#   drought U.S. Drought Monitor weeks in D2+/D3+ by year    (no key; first run ~1,450 calls)
#   energy  EIA-860 solar, wind and battery by county        (no key, one zip)
#   wells   Nebraska wells and Kansas water rights           (no key, two ArcGIS services)
#   reads   one written read per county                      (ANTHROPIC_API_KEY; skipped when unset)
#
# THE SIX IN THE MIDDLE WERE WRITTEN AND NEVER WIRED -- 2026-09-17. Every one
# of them had a fetcher in scripts/, a layer function in atlas_layers_p1.py and
# a passing selftest, and not one had ever produced a byte: `git log` on each
# data/atlas/raw/*.json was empty and atlas.json read sob_ok 0, value_ok 0,
# crp_ok 0, drought_ok 0, energy_ok 0, wells_ok 0. There was no fault to find
# because build_farmland_atlas.py handles a missing raw file by design -- "no
# raw file, layer will read 'not yet measured'" -- so six dark layers looked
# exactly like six working ones. Nothing was broken; nothing was called.
#
# sob and drought both skip to the last two years when their raw file already
# exists, so only the FIRST run of each is long. refetch_all forces the whole
# history back through them.
#
# Monthly, because none of the sources moves faster: NCEI refreshes the county
# file around the 8th, RMA reposts the current crop year through the season,
# NASS census and cash rent are yearly. Off the hour and off the top of the
# month (rule 27). The first run must be started by hand from the Actions tab;
# nothing on the page appears until it has.
on:
  schedule:
    - cron: "17 9 12 * *"      # 12th of each month, 09:17 UTC
  workflow_dispatch:
    inputs:
      layers:
        description: "Which fetches to run, comma-separated: heat,water,loss,sob,value,practices,crp,drought,energy,wells,climate,storms,livestock,frost,reads. Blank = all. build = no fetch, rebuild only."
        required: false
        default: ""
      loss_all:
        description: "Refetch every RMA cause-of-loss year since 1989 instead of the last two (type: yes)"
        required: false
        default: ""
      refetch_all:
        description: "Refetch the whole history for loss, sob AND drought, not just recent years (type: yes)"
        required: false
        default: ""
      reads_model:
        description: "Model for the county reads. Blank = the ATLAS_READS_MODEL variable, else claude-sonnet-5"
        required: false
        default: ""
      reads_trial:
        description: "Trial only: a number N writes N counties on Haiku 4.5 and on Sonnet 5 into this run's log, with each text and whether it passed. Touches no live read. Use with layers = reads"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: farmland-atlas
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300     # the first RMA pull is 38 zips; later runs are minutes
    env:
      LAYERS: ${{ github.event.inputs.layers }}
    steps:
      # The job's own start time, for atlas_reads.py: its batch wait ends early
      # enough that the Commit step still runs inside the 300-minute ceiling.
      - name: Note the start time
        run: echo "ATLAS_JOB_T0=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install --quiet openpyxl pyarrow

      # Offline, no keys. If a parser is broken there is no point downloading
      # a gigabyte of RMA files to find out.
      - name: Selftests (gate)
        working-directory: scripts
        run: |
          python build_farmland_atlas.py --selftest
          python fetch_atlas_heat.py --selftest
          python fetch_atlas_water.py --selftest
          python fetch_atlas_loss.py --selftest
          python fetch_atlas_sob.py --selftest
          python fetch_atlas_value.py --selftest
          python fetch_atlas_practices.py --selftest
          python fetch_atlas_crp.py --selftest
          python fetch_atlas_drought.py --selftest
          python fetch_atlas_energy.py --selftest
          python fetch_atlas_wells.py --selftest
          python fetch_atlas_wells_states.py --selftest
          python fetch_atlas_climate.py --selftest
          python fetch_atlas_storms.py --selftest
          python fetch_atlas_livestock.py --selftest
          python fetch_atlas_frost.py --selftest
          python atlas_layers_p1.py --selftest
          python atlas_layers_p2.py --selftest
          python atlas_reads.py --selftest
          python atlas_geometry.py --selftest

      - name: Which layers
        id: which
        run: |
          L="${LAYERS:-heat,water,loss,sob,value,practices,crp,drought,energy,wells,climate,storms,livestock,frost,reads}"
          for k in heat water loss sob value practices crp drought energy wells climate storms livestock frost reads; do
            case ",$L," in *",$k,"*) echo "$k=1" >> "$GITHUB_OUTPUT";; *) echo "$k=0" >> "$GITHUB_OUTPUT";; esac
          done
          echo "running: $L"

      # Each fetch may fail on its own. A failed fetch leaves its raw file as it
      # was (or absent), the builder marks that layer not yet measured or keeps
      # last month's, and the run still builds and commits what did arrive. The
      # step turns red so the failure is visible in the Actions list.
      - name: Fetch night heat (NCEI)
        if: steps.which.outputs.heat == '1'
        continue-on-error: true
        run: python scripts/fetch_atlas_heat.py

      - name: Fetch water (NASS census + USGS)
        if: steps.which.outputs.water == '1'
        continue-on-error: true
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: python scripts/fetch_atlas_water.py

      # RMA_PROXY_BASE IS WHAT MAKES THE WORKER REAL. atlas_common.get() has
      # read it since it was written and NO workflow ever set it, so
      # workers/atlas-rma-proxy.js has been a contingency that could not fire:
      # pubfs-rma refuses a runner some days (2026-09-13, first run) and the
      # direct route is all the job had. It is a repository VARIABLE, not a
      # secret -- the Worker's address is not sensitive -- and an unset one is
      # an empty string, which atlas_common treats as "no proxy", exactly as
      # today. Setting it changes nothing until RMA refuses.
      - name: Fetch loss record (RMA)
        if: steps.which.outputs.loss == '1'
        continue-on-error: true
        env:
          RMA_PROXY_BASE: ${{ vars.RMA_PROXY_BASE }}
        run: |
          if [ "${{ github.event.inputs.loss_all }}" = "yes" ] || [ "${{ github.event.inputs.refetch_all }}" = "yes" ]; then
            python scripts/fetch_atlas_loss.py --all
          else
            python scripts/fetch_atlas_loss.py
          fi

      # ── THE SIX THAT WERE NEVER CALLED ────────────────────────────────────
      # Cheapest first, so a cancelled run still leaves the quick layers on the
      # page. Every one is continue-on-error for the reason stated above: a
      # layer that fails is marked "not yet measured" and the other nine still
      # build and commit.

      # FSA has never answered a runner; RMA_PROXY_BASE gives it a second route
      # through the Worker's /fsa/ path (workers/atlas-rma-proxy.js).
      - name: Fetch CRP (FSA)
        if: steps.which.outputs.crp == '1'
        continue-on-error: true
        env:
          RMA_PROXY_BASE: ${{ vars.RMA_PROXY_BASE }}
        # FSA refuses runners. When the two workbooks have been uploaded to
        # data/atlas/src (downloaded in a browser from the CRP statistics page,
        # names unchanged), they are read from there and nothing is fetched.
        run: |
          # the newest workbook wins if an older one was left in the folder (86-24 vs 86-25)
          H=$(ls data/atlas/src/*[Hh][Ii][Ss][Tt]*.xlsx 2>/dev/null | sort -V | tail -1)
          E=$(ls data/atlas/src/*[Ee][Xx][Pp][Ii][Rr]*.xlsx 2>/dev/null | sort -V | tail -1)
          ls -l data/atlas/src/ 2>/dev/null || true
          if [ -n "$H" ] && [ -n "$E" ]; then
            echo "reading uploaded workbooks: $H, $E"
            python scripts/fetch_atlas_crp.py --history "$H" --expire "$E"
          else
            python scripts/fetch_atlas_crp.py
          fi

      - name: Fetch land value (NASS census)
        if: steps.which.outputs.value == '1'
        continue-on-error: true
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: python scripts/fetch_atlas_value.py

      - name: Fetch tile drainage and tillage (NASS census)
        if: steps.which.outputs.practices == '1'
        continue-on-error: true
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: python scripts/fetch_atlas_practices.py

      - name: Fetch energy (EIA-860)
        if: steps.which.outputs.energy == '1'
        continue-on-error: true
        run: python scripts/fetch_atlas_energy.py

      - name: Fetch wells and water rights (NE, KS)
        if: steps.which.outputs.wells == '1'
        continue-on-error: true
        run: python scripts/fetch_atlas_wells.py

      # Ten more state registers. A state whose pull fails keeps its last good
      # pull; the step goes red only when none came back.
      - name: Fetch irrigation wells, other state registers
        if: steps.which.outputs.wells == '1'
        continue-on-error: true
        run: python scripts/fetch_atlas_wells_states.py

      - name: Fetch rain and July highs (NCEI nClimDiv)
        if: steps.which.outputs.climate == '1'
        continue-on-error: true
        run: python scripts/fetch_atlas_climate.py

      - name: Fetch hail, wind and tornado reports (NCEI Storm Events)
        if: steps.which.outputs.storms == '1'
        continue-on-error: true
        run: python scripts/fetch_atlas_storms.py

      - name: Fetch cattle, hogs and pasture (Census of Agriculture)
        if: steps.which.outputs.livestock == '1'
        continue-on-error: true
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: python scripts/fetch_atlas_livestock.py

      # 270 monthly parquet files, about 220 MB, 1996 on
      - name: Fetch freeze dates and heat units (NOAA nClimGrid daily, AWS)
        if: steps.which.outputs.frost == '1'
        continue-on-error: true
        run: python scripts/fetch_atlas_frost.py

      # continue-on-error hides a failed fetch behind a green run; say so out loud
      - name: Frost fetch check
        if: steps.which.outputs.frost == '1'
        run: |
          if [ ! -s data/atlas/raw/frost.json ]; then
            echo "::warning title=Frost layer::data/atlas/raw/frost.json was not written. Open the step 'Fetch freeze dates and heat units' and read its last lines."
          fi

      # First run pulls every year since 1989, the same shape as loss; after
      # that the raw file exists and only the last two years are refetched.
      - name: Fetch premium book (RMA Summary of Business)
        if: steps.which.outputs.sob == '1'
        continue-on-error: true
        env:
          RMA_PROXY_BASE: ${{ vars.RMA_PROXY_BASE }}
        run: |
          if [ "${{ github.event.inputs.refetch_all }}" = "yes" ]; then
            python scripts/fetch_atlas_sob.py --all
          else
            python scripts/fetch_atlas_sob.py
          fi

      # The long pole on a first run: one Drought Monitor call per county,
      # ~1,450 of them, paced 0.2s apart by the fetcher. Later runs refetch the
      # current and previous year only. Last of the fetches for that reason.
      - name: Fetch drought history (USDM)
        if: steps.which.outputs.drought == '1'
        continue-on-error: true
        run: |
          if [ "${{ github.event.inputs.refetch_all }}" = "yes" ]; then
            python scripts/fetch_atlas_drought.py --all
          else
            python scripts/fetch_atlas_drought.py
          fi

      # --seed rewrites the static "Across the Atlas" block in farmland-atlas.html
      # between its SEED markers, so a reader with no JavaScript (and a crawler)
      # still gets the national numbers of this build.
      # A fixed hash seed: a few sums run over sets, and a float summed in another
      # order can round a dollar differently, move a county's fingerprint and hide
      # its read (27111 and 27119 did on 9/19 with no data change).
      - name: Build the Atlas
        env:
          PYTHONHASHSEED: "0"
        run: python scripts/build_farmland_atlas.py --seed farmland-atlas.html

      # A county whose numbers moved gets a new fingerprint, and the page hides a
      # read whose fingerprint is old. Salvage keeps each such read, cut to the
      # sentences that still pass against the new numbers; no API, no cost. A
      # paid run of the reads step below rewrites them in full.
      - name: Keep the reads in step with the build
        continue-on-error: true
        run: python scripts/atlas_reads.py --salvage

      # Skipped, not failed, when the key is not set: the page shows numbers
      # without reads rather than nothing.
      # A BATCH, AND AN ANNOTATION WHEN THE ACCOUNT SAYS NO.
      # atlas_reads.py submits the counties as one Message Batch (half price)
      # and waits for it, up to 180 minutes and never past 255 minutes into the
      # job. Out of credit, a usage limit, a bad key or an unknown model stops it
      # before any read is overwritten and exits 1. This step is
      # continue-on-error, so the run stays green and the build's commit goes
      # through; the stop shows as an error annotation on the run's summary.
      - name: County reads
        if: steps.which.outputs.reads == '1'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ATLAS_READS_MODEL: ${{ github.event.inputs.reads_model || vars.ATLAS_READS_MODEL }}
          READS_TRIAL: ${{ github.event.inputs.reads_trial }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "ANTHROPIC_API_KEY not set; reads skipped"; exit 0; fi
          if [ -n "$READS_TRIAL" ]; then
            python scripts/atlas_reads.py --trial "$READS_TRIAL"
          else
            python scripts/atlas_reads.py
          fi

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/atlas farmland-atlas.html
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          # NAMES ONLY THE LAYERS THAT LANDED. Ten hardcoded fields would print
          # "sob 0, value 0, crp 0" for however long a layer stays dark and read
          # as noise; a layer at zero is absent from the line instead, so the
          # commit says what this run actually measured.
          C=$(python - <<'PY'
          import json
          c = json.load(open('data/atlas/atlas.json'))['counts']
          parts = ["%d counties" % c['counties']]
          for k in ("heat", "water", "loss", "sob", "value", "practices", "crp", "drought", "energy", "wells", "climate", "storms", "livestock", "frost", "premium"):
              n = c.get(k + "_ok")
              if n:
                  parts.append("%s %d" % (k, n))
          print(", ".join(parts))
          PY
          )
          git commit -m "data: farmland atlas ($C)"
          # other workflows commit to main all day; rebase and retry rather than
          # lose a five-hour run to one rejected push
          for i in 1 2 3 4; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase --autostash origin main && git push; then exit 0; fi
            sleep $((30 * i))
          done
          echo "push failed after 4 attempts"; exit 1

      - name: IndexNow ping
        run: |
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"agsist.com","key":"f4a81c26db974e0f92c35b7a6e10d8c4","keyLocation":"https://agsist.com/f4a81c26db974e0f92c35b7a6e10d8c4.txt","urlList":["https://agsist.com/farmland-atlas","https://agsist.com/sitemap.xml"]}' \
            || echo "IndexNow ping failed - harmless"
