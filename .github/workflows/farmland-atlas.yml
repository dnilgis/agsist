name: farmland-atlas

on:
  schedule:
    - cron: "17 9 12 * *"
  workflow_run:
    workflows: ["Tick 06"]
    types: [completed]
  workflow_dispatch:
    inputs:
      layers:
        description: "Which fetches to run, comma-separated: heat,water,loss,sob,value,practices,crp,drought,energy,wells,climate,storms,livestock,frost,reads. Blank = all. build = no fetch, rebuild only."
        required: false
        default: ""
      loss_all:
        description: "Refetch every RMA cause-of-loss year since 1989 instead of the last two (type: yes)"
        required: false
        default: ""
      refetch_all:
        description: "Refetch the whole history for loss, sob AND drought, not just recent years (type: yes)"
        required: false
        default: ""
      drought_years:
        description: "Drought only: refetch these whole years for every county, comma-separated (e.g. 2024). Other years are kept. Use with layers = drought"
        required: false
        default: ""
      reads_model:
        description: "Model for the county reads. Blank = the ATLAS_READS_MODEL variable, else CHECKER in scripts/claude_models.py"
        required: false
        default: ""
      reads_trial:
        description: "Trial only: a number N writes N counties on Haiku 4.5 and on Sonnet 5 into this run's log, with each text and whether it passed. Touches no live read. Use with layers = reads"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  gate:
    if: github.event.workflow_run.name != 'Tick 06' || contains(github.event.workflow_run.display_title, ' farmland-atlas.yml ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow farmland-atlas.yml --max-lag 360
          --cron "17 9 12 * *"

  build:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: farmland-atlas
      cancel-in-progress: false
    timeout-minutes: 300
    env:
      LAYERS: ${{ github.event.inputs.layers }}
      IN_LOSS_ALL: ${{ github.event.inputs.loss_all }}
      IN_REFETCH_ALL: ${{ github.event.inputs.refetch_all }}
      IN_DROUGHT_YEARS: ${{ github.event.inputs.drought_years }}
    steps:
      - name: Note the start time
        run: echo "ATLAS_JOB_T0=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet openpyxl==3.1.5 pyarrow==26.0.0

      - name: Selftests (gate)
        working-directory: scripts
        run: |
          python build_farmland_atlas.py --selftest
          python fetch_atlas_heat.py --selftest
          python fetch_atlas_water.py --selftest
          python fetch_atlas_loss.py --selftest
          python fetch_atlas_sob.py --selftest
          python fetch_atlas_value.py --selftest
          python fetch_atlas_state_value.py --selftest
          python fetch_atlas_practices.py --selftest
          python fetch_atlas_crp.py --selftest
          python fetch_atlas_drought.py --selftest
          python fetch_atlas_energy.py --selftest
          python fetch_atlas_wells.py --selftest
          python fetch_atlas_wells_states.py --selftest
          python fetch_atlas_climate.py --selftest
          python fetch_atlas_storms.py --selftest
          python fetch_atlas_livestock.py --selftest
          python fetch_atlas_frost.py --selftest
          python atlas_layers_p1.py --selftest
          python atlas_layers_p2.py --selftest
          python atlas_reads.py --selftest
          python atlas_reads_cleanup.py --selftest
          python atlas_geometry.py --selftest

      - name: Unpack the raw pulls (raw branch)
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          bash scripts/pull_raw.sh data/atlas/raw
          n=$(ls data/atlas/raw/*.json | wc -l)
          ls -l data/atlas/raw/
          for f in heat water loss sob value crp energy drought; do
            [ -s "data/atlas/raw/$f.json" ] || { echo "::error::data/atlas/raw/$f.json did not come back from the raw branch; not building"; exit 1; }
          done
          echo "raw pulls: $n files"

      - name: Which layers
        id: which
        run: |
          L="${LAYERS:-heat,water,loss,sob,value,practices,crp,drought,energy,wells,climate,storms,livestock,frost,reads}"
          for k in heat water loss sob value practices crp drought energy wells climate storms livestock frost reads; do
            case ",$L," in *",$k,"*) echo "$k=1" >> "$GITHUB_OUTPUT";; *) echo "$k=0" >> "$GITHUB_OUTPUT";; esac
          done
          echo "running: $L"

      - name: Fetch night heat (NCEI)
        if: steps.which.outputs.heat == '1'
        continue-on-error: true
        run: python scripts/fetch_atlas_heat.py

      - name: Fetch water (NASS census + USGS)
        if: steps.which.outputs.water == '1'
        continue-on-error: true
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: python scripts/fetch_atlas_water.py

      - name: Fetch loss record (RMA)
        if: steps.which.outputs.loss == '1'
        continue-on-error: true
        env:
          RMA_PROXY_BASE: ${{ vars.RMA_PROXY_BASE }}
        run: |
          if [ "$IN_LOSS_ALL" = "yes" ] || [ "$IN_REFETCH_ALL" = "yes" ]; then
            python scripts/fetch_atlas_loss.py --all
          else
            python scripts/fetch_atlas_loss.py
          fi

      - name: Fetch CRP (FSA)
        if: steps.which.outputs.crp == '1'
        continue-on-error: true
        env:
          RMA_PROXY_BASE: ${{ vars.RMA_PROXY_BASE }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          RAW_SOFT=1 bash scripts/pull_raw.sh data/atlas/src
          H=$(ls data/atlas/src/*[Hh][Ii][Ss][Tt]*.xlsx 2>/dev/null | sort -V | tail -1)
          E=$(ls data/atlas/src/*[Ee][Xx][Pp][Ii][Rr]*.xlsx 2>/dev/null | sort -V | tail -1)
          ls -l data/atlas/src/ 2>/dev/null || true
          if [ -n "$H" ] && [ -n "$E" ]; then
            echo "reading uploaded workbooks: $H, $E"
            python scripts/fetch_atlas_crp.py --history "$H" --expire "$E"
          else
            python scripts/fetch_atlas_crp.py
          fi

      - name: Fetch land value (NASS census)
        if: steps.which.outputs.value == '1'
        continue-on-error: true
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: python scripts/fetch_atlas_value.py

      - name: Fetch state land values (NASS survey)
        if: steps.which.outputs.value == '1'
        continue-on-error: true
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: python scripts/fetch_atlas_state_value.py

      - name: Fetch tile drainage and tillage (NASS census)
        if: steps.which.outputs.practices == '1'
        continue-on-error: true
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: python scripts/fetch_atlas_practices.py

      - name: Fetch energy (EIA-860)
        if: steps.which.outputs.energy == '1'
        continue-on-error: true
        run: python scripts/fetch_atlas_energy.py

      - name: Fetch wells and water rights (NE, KS)
        if: steps.which.outputs.wells == '1'
        continue-on-error: true
        run: python scripts/fetch_atlas_wells.py

      - name: Fetch irrigation wells, other state registers
        if: steps.which.outputs.wells == '1'
        continue-on-error: true
        run: python scripts/fetch_atlas_wells_states.py

      - name: Fetch rain and July highs, plus single months (NCEI nClimDiv)
        if: steps.which.outputs.climate == '1'
        continue-on-error: true
        run: python scripts/fetch_atlas_climate.py

      - name: Fetch hail, wind and tornado reports (NCEI Storm Events)
        if: steps.which.outputs.storms == '1'
        continue-on-error: true
        run: python scripts/fetch_atlas_storms.py

      - name: Fetch cattle, hogs and pasture (Census of Agriculture)
        if: steps.which.outputs.livestock == '1'
        continue-on-error: true
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: python scripts/fetch_atlas_livestock.py

      - name: Fetch freeze dates and heat units (NOAA nClimGrid daily, AWS)
        if: steps.which.outputs.frost == '1'
        continue-on-error: true
        run: python scripts/fetch_atlas_frost.py

      - name: Frost fetch check
        if: steps.which.outputs.frost == '1'
        run: |
          if [ ! -s data/atlas/raw/frost.json ]; then
            echo "::warning title=Frost layer::data/atlas/raw/frost.json was not written. Open the step 'Fetch freeze dates and heat units' and read its last lines."
          fi

      - name: Fetch premium book (RMA Summary of Business)
        if: steps.which.outputs.sob == '1'
        continue-on-error: true
        env:
          RMA_PROXY_BASE: ${{ vars.RMA_PROXY_BASE }}
        run: |
          if [ "$IN_REFETCH_ALL" = "yes" ]; then
            python scripts/fetch_atlas_sob.py --all
          else
            python scripts/fetch_atlas_sob.py
          fi

      - name: Fetch drought history (USDM)
        if: steps.which.outputs.drought == '1'
        continue-on-error: true
        run: |
          if [ -n "$IN_DROUGHT_YEARS" ]; then
            python scripts/fetch_atlas_drought.py --years "$IN_DROUGHT_YEARS"
          elif [ "$IN_REFETCH_ALL" = "yes" ]; then
            python scripts/fetch_atlas_drought.py --all
          else
            python scripts/fetch_atlas_drought.py
          fi

      - name: Build the Atlas
        env:
          PYTHONHASHSEED: "0"
        run: python scripts/build_farmland_atlas.py --seed farmland-atlas.html

      - name: Keep the reads in step with the build
        continue-on-error: true
        run: python scripts/atlas_reads.py --salvage

      - name: County reads
        if: steps.which.outputs.reads == '1'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ATLAS_READS_MODEL: ${{ github.event.inputs.reads_model || vars.ATLAS_READS_MODEL }}
          READS_TRIAL: ${{ github.event.inputs.reads_trial }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "ANTHROPIC_API_KEY not set; reads skipped"; exit 0; fi
          if [ -n "$READS_TRIAL" ]; then
            python scripts/atlas_reads.py --trial "$READS_TRIAL"
          else
            python scripts/atlas_reads.py
          fi

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/atlas farmland-atlas.html
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          C=$(python - <<'PY'
          import json
          c = json.load(open('data/atlas/atlas.json'))['counts']
          parts = ["%d counties" % c['counties']]
          for k in ("heat", "water", "loss", "sob", "value", "practices", "crp", "drought", "energy", "wells", "climate", "storms", "livestock", "frost", "premium"):
              n = c.get(k + "_ok")
              if n:
                  parts.append("%s %d" % (k, n))
          print(", ".join(parts))
          PY
          )
          git commit -m "data: farmland atlas ($C)"
          for i in 1 2 3 4; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase --autostash origin main && git push; then exit 0; fi
            sleep $((30 * i))
          done
          echo "push failed after 4 attempts"; exit 1

      - name: Save the raw pulls to the raw branch
        if: ${{ !cancelled() }}
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_SOFT: '1'
        run: bash scripts/push_raw.sh "farmland atlas raw" $(ls data/atlas/raw/*.json data/atlas/raw/*.json.gz 2>/dev/null)

      - name: IndexNow ping
        run: |
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"agsist.com","key":"f4a81c26db974e0f92c35b7a6e10d8c4","keyLocation":"https://agsist.com/f4a81c26db974e0f92c35b7a6e10d8c4.txt","urlList":["https://agsist.com/farmland-atlas","https://agsist.com/sitemap.xml"]}' \
            || echo "IndexNow ping failed - harmless"
