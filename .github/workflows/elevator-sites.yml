name: Elevator websites page

# data/elevator-sites.json is the one place the elevator website offer is
# priced. When it changes, this bakes the same numbers (and the network's
# current elevator count from data/elevator-counts.json) into
# elevator-websites.html: the page text, its meta descriptions and its
# Service/Offer structured data (scripts/build_elevator_sites.py). The page
# already re-reads the JSON on load, so readers see a new price before this
# finishes; this is for search engines and readers without JavaScript.

on:
  push:
    branches: [main]   # commits and rebases onto main
    paths:
      - "data/elevator-sites.json"
      - "scripts/build_elevator_sites.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: elevator-sites
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prove the builder
        run: python3 scripts/build_elevator_sites.py --selftest

      - name: Bake the page
        run: python3 scripts/build_elevator_sites.py

      - name: Commit if changed
        run: |
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          git add elevator-websites.html
          if git diff --staged --quiet; then
            echo "page already current"
          else
            git commit -m "elevator-websites: bake offer from data/elevator-sites.json"
            git pull --rebase --autostash origin main || true
            git push
          fi
