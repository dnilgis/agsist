name: Fetch Markets

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_run:
    workflows: ["Tick 07"]
    types: [completed]
  workflow_dispatch:

jobs:
  gate:
    if: github.event.workflow_run.name != 'Tick 07' || contains(github.event.workflow_run.display_title, ' markets.yml ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow markets.yml --max-lag 360
          --cron "23 9 * * *"

  fetch:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: markets
      cancel-in-progress: false
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests==2.34.2

      - name: Fetch markets
        run: python scripts/fetch_markets.py

      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_FROM_ACTIONS: ${{ vars.PAGES_FROM_ACTIONS }}
        run: |
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          git add data/markets.json
          git diff --staged --quiet || git commit -m "🎯 Markets — $(date -u +%Y-%m-%d)"
          pushed=0
          for n in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then pushed=1; break; fi
            echo "Push race on attempt $n; rebasing..."
            git pull --rebase origin "${GITHUB_REF_NAME}" || { echo "Rebase failed."; exit 1; }
            sleep $((RANDOM % 4 + 2))
          done
          [ "$pushed" = 1 ] || { echo "Failed to push after 5 attempts."; exit 1; }
          bash .github/pages-kick.sh
