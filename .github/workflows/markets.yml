name: Fetch Markets

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch markets
        run: python scripts/fetch_markets.py

      # The page's static odds block (crawlers, no-JS readers) is baked from
      # markets.json. Nothing re-baked it after a fetch, so it showed the
      # previous pull while saying "the board below re-renders the same pull".
      - name: Bake ag-odds.html from this pull
        run: |
          python -c "import sys;sys.path.insert(0,'scripts');import prerender_wpi_scorecard as p;o,s,f=p.bake_agodds();open(f,'w',encoding='utf-8').write(s)"

      - name: Commit and push
        run: |
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          git add data/markets.json ag-odds.html
          git diff --staged --quiet || git commit -m "🎯 Markets — $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
