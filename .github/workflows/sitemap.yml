name: Sitemap lastmod

on:
  push:
    branches: [main]   # these jobs commit and rebase onto main; on a PR branch that rebase fails (2026-10-06)
    paths:
      - "**.html"
  schedule:
    - cron: "17 9 * * *"   # 09:17 UTC daily — refreshes data-driven pages on their cadence
  workflow_dispatch:
    inputs:
      base:
        description: 'with head: bump the pages changed from base to head (merge-when-green.yml passes the merged range); empty: the daily refresh'
        required: false
        default: ''
      head:
        description: 'the commit the range ends at (the merge commit)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: sitemap-lastmod
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need the previous commit to diff changed HTML on push
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bump lastmod
        env:
          IN_BASE: ${{ github.event.inputs.base }}
          IN_HEAD: ${{ github.event.inputs.head }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$IN_BASE" ]; then
            # a hand start after a merge by the job token: the merge's own range, not HEAD~1 (a
            # collection job may have pushed since)
            for r in "$IN_BASE" "$IN_HEAD"; do
              printf '%s' "$r" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::base and head must be commit shas"; exit 1; }
              git cat-file -e "$r^{commit}" 2>/dev/null || git fetch -q --no-tags --depth=1 origin "$r"
            done
            files=$(git diff --name-only "$IN_BASE" "$IN_HEAD" -- '*.html' | tr '\n' ' ')
            echo "changed HTML in $IN_BASE..$IN_HEAD: ${files:-<none>}"
            if [ -n "$files" ]; then
              python scripts/update_sitemap.py --changed $files --base "$IN_BASE" --out /tmp/bumped.txt
            else
              echo "[sitemap] no HTML changes to map"; : > /tmp/bumped.txt
            fi
          elif [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then base="HEAD~1"; fi
            files=$(git diff --name-only "$base" HEAD -- '*.html' | tr '\n' ' ')
            echo "changed HTML: ${files:-<none>}"
            if [ -n "$files" ]; then
              python scripts/update_sitemap.py --changed $files --base "$base" --out /tmp/bumped.txt
            else
              echo "[sitemap] no HTML changes to map"; : > /tmp/bumped.txt
            fi
          else
            python scripts/update_sitemap.py --daily --out /tmp/bumped.txt
          fi

      # llms.txt is built from the same published pages: one list in
      # scripts/build_llms_txt.py, every URL checked live against the files and
      # the sitemaps. The --check step at the end of this job goes red when a
      # sitemap page is in neither its list nor its OMIT set.
      - name: Rebuild llms.txt
        run: python scripts/build_llms_txt.py

      - name: Commit if changed
        run: |
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          git add sitemap.xml llms.txt
          if git diff --staged --quiet; then
            echo "no sitemap change"
          else
            git commit -m "Bump sitemap lastmod, rebuild llms.txt $(date -u +%F)"
            git pull --rebase --autostash origin main || true
            git push
          fi

      # Bing/Yandex via IndexNow for exactly the URLs we just bumped. Best-effort:
      # never fails the job. If you run IndexNow from a separate workflow, delete this step.
      - name: Ping IndexNow for bumped URLs
        continue-on-error: true
        run: |
          if [ -s /tmp/bumped.txt ]; then
            urls=$(tr '\n' ' ' < /tmp/bumped.txt)
            echo "IndexNow: $urls"
            python scripts/indexnow_submit.py --urls $urls || true
          else
            echo "nothing bumped; skipping IndexNow"
          fi

      # After the commit, so a page nobody has placed yet never holds up the
      # lastmod bump; it still turns the run red until someone decides.
      - name: llms.txt lists every page
        run: python scripts/build_llms_txt.py --check
