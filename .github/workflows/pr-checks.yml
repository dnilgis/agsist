name: pr-checks

# The ship checks (scripts/dev/checks.sh) on every pull request to main, split
# so they finish in minutes instead of the better part of an hour:
#   node tests (1/4 .. 4/4)  checks.sh --only=node-test --shard=N/4
#                            (node --test --test-shard=N/4, a quarter of the files each)
#   other checks             checks.sh --skip-node (every other line of checks.sh)
#   all checks               green only when every job above is green; the one
#                            status to require on main
# checks.sh is the only list of checks: a line added there runs here with no
# change to this file (test/pr-checks.test.mjs holds the two together).
#
# The FSA files come from the private raw branch with PRIVATE_REPO_TOKEN, so a
# pull request from a fork (no secrets) fails at that step. Same-repo branches
# only; that is by design.
#
# No schedule: it runs when a pull request opens or moves, or by hand.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PW_VERSION: '1.56.1'
  JSQR_VERSION: '1.4.0'
  OMP_NUM_THREADS: '1'

jobs:
  node-tests:
    name: node tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/workflows/pr-checks.yml
      - name: Python packages
        run: pip install --quiet --disable-pip-version-check pillow==12.3.0 numpy==2.5.3 pandas==3.0.5 openpyxl==3.1.5 matplotlib==3.11.2 pypdf==6.17.0 requests==2.34.2 scipy==1.18.1 shapely==2.2.0 pyyaml==6.0.2 lxml==6.1.3 pdfplumber==0.11.10
      # pdftotext (poppler-utils), as fertilizer-coops.yml installs it: the price sheet
      # reader reads its -layout columns (pypdf is only the fallback), and the
      # fetch_coop_fert.py --selftest case "the PDF itself reads the same" needs it.
      - name: pdftotext
        run: command -v pdftotext || { sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils; }

      # The elevator desk and chaos-fix browser tests read the bids data
      # (dnilgis/bids, public) at BIDS_PATH, as they read the local clone beside
      # this one; without it they fail (elev-desk) or skip (chaosfix).
      - name: bids data
        run: |
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/dnilgis/bids "$RUNNER_TEMP/bids"
          git -C "$RUNNER_TEMP/bids" sparse-checkout set data
          # (the index file is not named here: build_feeds.py would count this job as its writer)
          ls "$RUNNER_TEMP/bids/data/merged" | grep -q . || { echo "::error::no boards in the bids clone's data/merged"; exit 1; }
          echo "bids $(git -C "$RUNNER_TEMP/bids" rev-parse --short HEAD)"
          echo "BIDS_PATH=$RUNNER_TEMP/bids/" >> "$GITHUB_ENV"

      # The browser tests look for Playwright at PLAYWRIGHT_PATH and Chromium at
      # CHROMIUM_PATH, and skip themselves when either is missing. A skip is not
      # a pass, so the last step here launches the browser and fails the job if
      # it cannot.
      - name: Cache the Playwright browser
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ env.PW_VERSION }}
      - name: Playwright, Chromium and jsqr
        run: |
          PW="$RUNNER_TEMP/pw"
          mkdir -p "$PW"
          npm install --no-save --no-audit --no-fund --prefix "$PW" "playwright@$PW_VERSION" "jsqr@$JSQR_VERSION"
          "$PW/node_modules/.bin/playwright" install --with-deps chromium
          CH=$(ls -d "$HOME"/.cache/ms-playwright/chromium-*/chrome-linux*/chrome | head -1)
          [ -x "$CH" ] || { echo "::error::no Chromium binary under ~/.cache/ms-playwright"; exit 1; }
          {
            echo "PLAYWRIGHT_PATH=$PW/node_modules/playwright/index.mjs"
            echo "CHROMIUM_PATH=$CH"
            echo "JSQR_PATH=$PW/node_modules/jsqr"
          } >> "$GITHUB_ENV"
      - name: Chromium launches
        run: |
          node --input-type=module -e '
            const { chromium } = await import(process.env.PLAYWRIGHT_PATH);
            const b = await chromium.launch({ executablePath: process.env.CHROMIUM_PATH });
            console.log("chromium", b.version()); await b.close();'

      - name: FSA files from raw
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: bash scripts/pull_raw.sh data/fsa
      - name: node tests, shard ${{ matrix.shard }} of 4
        env:
          TMPDIR: ${{ runner.temp }}
          # a skipped test fails the shard (and so "all checks"): a skip is not a pass
          AGSIST_NO_SKIPS: '1'
        run: bash scripts/dev/checks.sh --only=node-test --shard=${{ matrix.shard }}/4
      - name: Upload the test log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: node-tests-${{ matrix.shard }}-of-4
          path: ${{ runner.temp }}/agsist-checks/
          if-no-files-found: ignore

  other-checks:
    name: other checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/workflows/pr-checks.yml
      - name: Python packages
        run: pip install --quiet --disable-pip-version-check pillow==12.3.0 numpy==2.5.3 pandas==3.0.5 openpyxl==3.1.5 matplotlib==3.11.2 pypdf==6.17.0 requests==2.34.2 scipy==1.18.1 shapely==2.2.0 pyyaml==6.0.2 lxml==6.1.3 pdfplumber==0.11.10

      - name: FSA files from raw
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: bash scripts/pull_raw.sh data/fsa
      - name: every check but the node tests
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          bash scripts/dev/checks.sh --list --skip-node
          bash scripts/dev/checks.sh --skip-node

  all-checks:
    name: all checks
    if: always()
    needs: [node-tests, other-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every job passed
        env:
          NODE_TESTS: ${{ needs.node-tests.result }}
          OTHER_CHECKS: ${{ needs.other-checks.result }}
        run: |
          echo "node tests: $NODE_TESTS, other checks: $OTHER_CHECKS"
          [ "$NODE_TESTS" = success ] && [ "$OTHER_CHECKS" = success ]
