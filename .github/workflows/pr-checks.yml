name: pr-checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pick_base:
        description: 'replay the pick by hand: the ref to diff against (empty: every test)'
        type: string
        default: ''
  workflow_call:
    inputs:
      full:
        description: every test, no pick (main-checks.yml)
        type: boolean
        default: false
      ref:
        description: the commit to check out (main-checks.yml passes the rebuilt one)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PW_VERSION: '1.56.1'
  JSQR_VERSION: '1.4.0'
  TERSER_VERSION: '5.51.2'
  FFMPEG_TAG: 'autobuild-2026-09-30-13-08'
  FFMPEG_BUILD: 'n8.1.3-9-g29e619e767-linux64-gpl-8.1'
  FFMPEG_SHA256: '97ce978979194b5cf7e06a5e68020dbdaa7a4f3294c5452b6a1bc347100dbb79'
  OMP_NUM_THREADS: '1'

jobs:
  guard:
    name: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.pick.outputs.mode }}
      files: ${{ steps.pick.outputs.files }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          fetch-depth: 2
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.13'
      - name: origin/main
        run: git fetch -q --no-tags --depth=100 origin +refs/heads/main:refs/remotes/origin/main
      - name: the built files are not edited by hand, and their inputs are valid
        run: bash scripts/dev/checks.sh --only=built-guard,built-inputs
      - name: generated pages are built on main
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/generated_sets.py guard --base HEAD^1
      - name: no AI footer in the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/dev/ai_footer_check.py
      - name: the test pick
        id: pick
        env:
          FULL: ${{ inputs.full && '1' || '' }}
          PICK_BASE: ${{ github.event_name == 'workflow_dispatch' && inputs.pick_base || '' }}
        run: |
          if [ -n "$PICK_BASE" ]; then
            git fetch -q --no-tags --depth=100 origin "+refs/heads/$PICK_BASE:refs/remotes/origin/$PICK_BASE"
            git fetch -q --no-tags --deepen=100 origin
            python3 scripts/dev/test_map.py --select-base "origin/$PICK_BASE" --github-output
          elif [ "$FULL" = 1 ] || [ "${{ github.event_name }}" != pull_request ]; then
            echo "select: every test (${{ github.event_name }}, full run)"
            { echo "mode=all"; echo "files="; } >> "$GITHUB_OUTPUT"
          else
            python3 scripts/dev/test_map.py --select-base origin/main --github-output
          fi

  node-tests:
    name: node tests (${{ matrix.shard }}/8)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          fetch-depth: 2
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/workflows/pr-checks.yml
      - name: Cache the Python packages
        id: pysite
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            ${{ env.pythonLocation }}/lib/python3.13/site-packages
            ${{ env.pythonLocation }}/bin
          key: py-site-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('.github/workflows/pr-checks.yml') }}
      - name: Python packages
        if: steps.pysite.outputs.cache-hit != 'true'
        run: pip install --quiet --disable-pip-version-check pillow==12.3.0 numpy==2.5.3 pandas==3.0.5 openpyxl==3.1.5 matplotlib==3.11.2 pypdf==6.17.0 requests==2.34.2 scipy==1.18.1 shapely==2.2.0 pyyaml==6.0.2 lxml==6.1.3 pdfplumber==0.11.10 google-analytics-data==0.23.3 google-auth==2.62.0
      - name: pdftotext
        timeout-minutes: 5
        uses: ./.github/actions/pdftotext

      - name: Cache ffmpeg
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/ffmpeg-static
          key: ffmpeg-static-${{ env.FFMPEG_BUILD }}
      - name: ffmpeg
        timeout-minutes: 5
        run: |
          set -euo pipefail
          D="$HOME/ffmpeg-static"
          if [ ! -x "$D/ffprobe" ] || [ ! -x "$D/ffmpeg" ]; then
            F="ffmpeg-$FFMPEG_BUILD.tar.xz"
            curl -fsSL --retry 3 --max-time 180 -o "$RUNNER_TEMP/$F" "https://github.com/BtbN/FFmpeg-Builds/releases/download/$FFMPEG_TAG/$F"
            echo "$FFMPEG_SHA256  $RUNNER_TEMP/$F" | sha256sum -c -
            mkdir -p "$D"
            tar -xJf "$RUNNER_TEMP/$F" -C "$D" --strip-components=2 "ffmpeg-$FFMPEG_BUILD/bin/ffmpeg" "ffmpeg-$FFMPEG_BUILD/bin/ffprobe"
            rm -f "$RUNNER_TEMP/$F"
          fi
          echo "$D" >> "$GITHUB_PATH"
          "$D/ffprobe" -version | head -1

      - name: bids data
        run: |
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/dnilgis/bids "$RUNNER_TEMP/bids"
          git -C "$RUNNER_TEMP/bids" sparse-checkout set data
          ls "$RUNNER_TEMP/bids/data/merged" | grep -q . || { echo "::error::no boards in the bids clone's data/merged"; exit 1; }
          echo "bids $(git -C "$RUNNER_TEMP/bids" rev-parse --short HEAD)"
          echo "BIDS_PATH=$RUNNER_TEMP/bids/" >> "$GITHUB_ENV"

      - name: Cache the Playwright browser
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ env.PW_VERSION }}
      - name: Browser fonts
        timeout-minutes: 5
        uses: ./.github/actions/browser-fonts
      - name: Playwright, Chromium, jsqr and terser
        timeout-minutes: 10
        run: |
          PW="$RUNNER_TEMP/pw"
          mkdir -p "$PW"
          npm install --no-save --no-audit --no-fund --prefix "$PW" "playwright@$PW_VERSION" "jsqr@$JSQR_VERSION" "terser@$TERSER_VERSION"
          "$PW/node_modules/.bin/playwright" install chromium
          CH=$(ls -d "$HOME"/.cache/ms-playwright/chromium-*/chrome-linux*/chrome | head -1)
          [ -x "$CH" ] || { echo "::error::no Chromium binary under ~/.cache/ms-playwright"; exit 1; }
          miss=$(ldd "$CH" | grep "not found" || true)
          [ -z "$miss" ] || { echo "::error::Chromium is missing system libraries (the runner image changed): $miss"; exit 1; }
          {
            echo "PLAYWRIGHT_PATH=$PW/node_modules/playwright/index.mjs"
            echo "CHROMIUM_PATH=$CH"
            echo "JSQR_PATH=$PW/node_modules/jsqr"
            echo "TERSER_PATH=$PW/node_modules/terser"
          } >> "$GITHUB_ENV"
      - name: Chromium launches
        run: |
          node --input-type=module -e '
            const { chromium } = await import(process.env.PLAYWRIGHT_PATH);
            const b = await chromium.launch({ executablePath: process.env.CHROMIUM_PATH });
            console.log("chromium", b.version()); await b.close();'

      - name: FSA files and the Atlas drought pull from raw
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: bash scripts/pull_raw.sh data/fsa data/atlas/raw/drought.json data/cot-deep.json
      - name: origin/main and the references branch
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          git fetch -q --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          bash scripts/fetch_private.sh references
      - name: the replay's pick base
        if: github.event_name == 'workflow_dispatch' && inputs.pick_base != ''
        env:
          PICK_BASE: ${{ inputs.pick_base }}
        run: |
          git fetch -q --no-tags --depth=100 origin "+refs/heads/$PICK_BASE:refs/remotes/origin/$PICK_BASE"
          git fetch -q --no-tags --deepen=100 origin
      - name: node tests, shard ${{ matrix.shard }} of 8
        env:
          TMPDIR: ${{ runner.temp }}
          AGSIST_NO_SKIPS: '1'
          AGSIST_PREBUILD: '1'
          AGSIST_GEN_BASE: ${{ (github.event_name == 'pull_request' && !inputs.full) && 'HEAD^1' || (github.event_name == 'workflow_dispatch' && !inputs.full && github.ref != 'refs/heads/main') && 'origin/main' || '' }}
          AGSIST_PICK_BASE: ${{ (github.event_name == 'pull_request' && !inputs.full) && 'HEAD^1' || (github.event_name == 'workflow_dispatch' && inputs.pick_base != '' && !inputs.full) && format('origin/{0}', inputs.pick_base) || '' }}
        run: bash scripts/dev/checks.sh --only=node-test --shard=${{ matrix.shard }}/8
      - name: test file times
        if: always()
        run: |
          T=$(ls "$RUNNER_TEMP"/agsist-checks/nt-*.out.times 2>/dev/null | head -1)
          [ -n "$T" ] || { echo "no times written"; exit 0; }
          echo "$(wc -l < "$T") test files, $(awk '{s+=$1} END {print int(s/1000)}' "$T") s summed"
          C=$(grep -hE '^# (tests|suites|pass|fail|cancelled|skipped|todo) [0-9]+$' "${T%.times}" | tr '\n' ' ')
          echo "$C"
          echo "::notice title=node test counts, shard ${{ matrix.shard }}::$(wc -l < "$T") files; $C"
          echo "::notice title=node test times, shard ${{ matrix.shard }}::$(sort -rn "$T" | tr '\t\n' ': ')"
          sort -rn "$T"
      - name: Upload the test log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: node-tests-${{ matrix.shard }}-of-8
          path: ${{ runner.temp }}/agsist-checks/
          if-no-files-found: ignore

  other-checks:
    name: other checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          fetch-depth: 2
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/workflows/pr-checks.yml
      - name: Cache the Python packages
        id: pysite
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            ${{ env.pythonLocation }}/lib/python3.13/site-packages
            ${{ env.pythonLocation }}/bin
          key: py-site-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('.github/workflows/pr-checks.yml') }}
      - name: Python packages
        if: steps.pysite.outputs.cache-hit != 'true'
        run: pip install --quiet --disable-pip-version-check pillow==12.3.0 numpy==2.5.3 pandas==3.0.5 openpyxl==3.1.5 matplotlib==3.11.2 pypdf==6.17.0 requests==2.34.2 scipy==1.18.1 shapely==2.2.0 pyyaml==6.0.2 lxml==6.1.3 pdfplumber==0.11.10 google-analytics-data==0.23.3 google-auth==2.62.0

      - name: actionlint
        env:
          AL_VERSION: '1.7.12'
          AL_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/actionlint"; mkdir -p "$d"; cd "$d"
          base="https://github.com/rhysd/actionlint/releases/download/v${AL_VERSION}"
          tgz="actionlint_${AL_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$tgz" "$base/$tgz"
          curl -fsSL --retry 3 -o sums.txt "$base/actionlint_${AL_VERSION}_checksums.txt"
          echo "$AL_SHA256  $tgz" | sha256sum -c -
          grep "  $tgz\$" sums.txt | sha256sum -c -
          tar xzf "$tgz" actionlint
          cd "$GITHUB_WORKSPACE"
          rc=0
          "$d/actionlint" -version
          "$d/actionlint" -oneline .github/workflows/*.yml > "$d/out.txt" 2>&1 || rc=$?
          { echo '### actionlint'; echo "exit $rc"; echo '```'; head -c 60000 "$d/out.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat "$d/out.txt"
          exit $rc

      - name: FSA files from raw
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: bash scripts/pull_raw.sh data/fsa
      - name: origin/main
        run: git fetch -q --no-tags --depth=100 origin +refs/heads/main:refs/remotes/origin/main
      - name: every check but the node tests
        env:
          TMPDIR: ${{ runner.temp }}
          AGSIST_PREBUILD: '1'
          AGSIST_GEN_BASE: ${{ (github.event_name == 'pull_request' && !inputs.full) && 'HEAD^1' || (github.event_name == 'workflow_dispatch' && !inputs.full && github.ref != 'refs/heads/main') && 'origin/main' || '' }}
        run: |
          bash scripts/dev/checks.sh --list --skip-node
          bash scripts/dev/checks.sh --skip-node

  all-checks:
    name: all checks
    if: always()
    needs: [guard, node-tests, other-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every job passed
        env:
          GUARD: ${{ needs.guard.result }}
          NODE_TESTS: ${{ needs.node-tests.result }}
          OTHER_CHECKS: ${{ needs.other-checks.result }}
          PICK: ${{ needs.guard.outputs.mode }}
        run: |
          echo "guard: $GUARD, node tests ($PICK): $NODE_TESTS, other checks: $OTHER_CHECKS"
          [ "$GUARD" = success ] && [ "$NODE_TESTS" = success ] && [ "$OTHER_CHECKS" = success ]
