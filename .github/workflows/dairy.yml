name: Dairy prices

# Writes data/dairy-data.json and data/dairy-history.json for milk-prices.html,
# then bakes the page's figures and title from them (see the bake step).
# Source: USDA AMS "Announcement of Class and Component Prices" (posted about the
# 5th) plus the NASS all-milk price, and the AMS mailbox price report (3357,
# data/dairy-mailbox.json). No CME, no Barchart.
#
# AMS announces last month's class prices on or before the 5th (7 CFR 1000.53);
# August 2026 posted Sep 2. The old window, days 3-9 once a day, missed an
# announcement on the 1st or 2nd until the 3rd and depended on one scheduled run
# that GitHub can delay or drop. Now: twice a day on days 1-9, once on 28-31,
# plus the weekly catch-up. The script is idempotent: a re-run with
# nothing new commits nothing.
#
# FIRST RUN: dispatch this once with "probe" ticked. It saves what the AMS and
# NASS servers actually returned to data/dairy-raw/ and saves it on the raw branch (never deployed), so the real
# PDF layout can be read. Then dispatch again without probe.

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Probe only: save the raw AMS text and NASS response to data/dairy-raw/ on the raw branch"
        type: boolean
        default: false
      email:
        description: "Milk price day email: dry = render only; preview = Sig's test inbox; send = the list (refused unless this run read and checked the month)"
        type: choice
        options: [dry, preview, send]
        default: dry
  schedule:
    - cron: '37 15 1-9 * *'     # announcement window, days 1-9, morning
    - cron: '37 21 1-9 * *'     # and afternoon
    - cron: '37 15 28-31 * *'   # an early announcement at month end
    - cron: '11 14 * * 2'     # weekly catch-up, Tuesdays
    - cron: '23 16 15-27 * *' # mailbox price (scripts/fetch_mailbox.py): AMS posts it late in the month, about three months on

permissions:
  contents: write

concurrency:
  group: dairy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pypdf (fallback if pdftotext is missing)
        run: pip install pypdf==6.20.1
      # The Order 30 releases read only as -layout text (scripts/fetch_order30.py
      # refuses pypdf's scrambled column order); the Oct 28 probe found none on the runner.
      - name: pdftotext
        timeout-minutes: 5
        continue-on-error: true
        uses: ./.github/actions/pdftotext
      - name: Selftest
        run: |
          python scripts/fetch_dairy.py --selftest
          python scripts/fetch_mailbox.py --selftest
          python scripts/dairy_probe.py --selftest
          python scripts/fetch_dmc.py --selftest
          python scripts/fetch_order30.py --selftest
          python scripts/milk_miss.py --selftest
          python scripts/send_milk_month.py --selftest
      - name: Probe (raw source capture)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe }}
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: |
          python scripts/fetch_dairy.py --probe
          python scripts/fetch_mailbox.py --probe
          python scripts/fetch_dmc.py --probe || echo "::warning::DMC probe failed"
          python scripts/fetch_order30.py --probe || echo "::warning::Order 30 probe failed"
      # Raw captures go to the raw branch (never deployed), not main: scripts/push_raw.sh.
      # Runs even when the probe step failed part way, so what it did capture is kept.
      - name: Save the probe's raw files to the raw branch
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.probe }}
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_SOFT: '1'
        run: bash scripts/push_raw.sh "dairy probe" data/dairy-raw
      - name: Fetch and write data/dairy-data.json
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) }}
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: python scripts/fetch_dairy.py
      # The newest federal-order mailbox price (USDA AMS report 3357), dated.
      # Keep-last-good: a failed fetch or an unreadable sentence leaves
      # data/dairy-mailbox.json alone and only records why.
      - name: Fetch the mailbox price into data/dairy-mailbox.json
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) }}
        run: python scripts/fetch_mailbox.py
      # Upper Midwest Federal Order 30 from the market administrator's own
      # releases (scripts/fetch_order30.py): PPD, statistical uniform price,
      # Class I, advanced prices, SCC rate. Keep-last-good.
      - name: Fetch Order 30 into data/dairy-order30.json
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) }}
        run: python scripts/fetch_order30.py
      # What Read my check said for each month as it began, and the miss once
      # USDA announces it (scripts/milk_miss.py; only grows, never backfilled).
      - name: Record the futures miss log
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) }}
        run: python scripts/milk_miss.py
      # The page body, title and description carry the newest month from the
      # file just written (scripts/seed_static.py seed_milk, scripts/bake_seo.py
      # seo_milk). Until 2026-10-13 they were typed by hand and sat on August
      # while the file held September. Selftest first: bake_seo refuses to
      # write a title it cannot fit or source. Freshness runs both again daily,
      # which is what dashes a class month once the next one is due.
      - name: Bake milk-prices from the new data
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) }}
        run: |
          python scripts/bake_seo.py --selftest
          python scripts/test_milk_seed.py
          python scripts/seed_static.py --only milk
          python scripts/bake_seo.py --page milk-prices.html
      - name: Pillow, for the share image
        continue-on-error: true
        run: pip install --quiet pillow==12.3.0

      - name: Commit if changed (race-tolerant)
        env:
          PROBE: ${{ github.event_name == 'workflow_dispatch' && inputs.probe }}
        run: |
          set -e
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          FILES="data/dairy-data.json data/dairy-history.json data/dairy-mailbox.json data/dairy-miss.json data/dairy-order30.json"
          rm -rf /tmp/dairy && mkdir -p /tmp/dairy
          for f in $FILES; do
            [ -e "$f" ] && cp -r --parents "$f" /tmp/dairy/ || true
          done
          [ -n "$(ls -A /tmp/dairy)" ] || { echo "No output; nothing to commit."; exit 0; }
          BR="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3 4 5; do
            git fetch origin "$BR"
            git reset --hard "origin/$BR"
            mkdir -p data && cp -r /tmp/dairy/data/. data/
            # re-bake the page on the fresh checkout rather than copy it over,
            # so an edit to milk-prices.html pushed meanwhile is kept
            if [ "$PROBE" != "true" ]; then
              python scripts/seed_static.py --only milk
              python scripts/bake_seo.py --page milk-prices.html
              python scripts/build_share_images.py --only milk-prices || true
              git add milk-prices.html sitemap.xml img/og/milk-prices.jpg
            fi
            for f in $FILES; do [ -e "$f" ] && git add "$f" || true; done
            if git diff --staged --quiet; then echo "No change."; exit 0; fi
            git commit -m "Update dairy prices $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            if git push origin "HEAD:$BR"; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push race on attempt $i; re-syncing to origin/$BR..."
            sleep $((RANDOM % 4 + 2))
          done
          echo "Failed to push after 5 attempts."; exit 1

      # Milk price day (subs worker v5.58, topic milk-month): one email to the
      # readers who asked on /milk-prices, when this run read and checked the
      # month's AMS Class prices. Sig, Oct 28: on. DAIRY_MONTHLY_LIVE is the repo
      # variable and counts as 1 unless Sig sets it to 0. The script still refuses
      # unless status.class is ok from this run, the Class III formula lands on
      # the announced price, the month is the one due and the file is fresh; a
      # reader already mailed for the month is never mailed again.
      - name: Milk price day email
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) }}
        env:
          LIST_URL: ${{ secrets.LIST_URL }}
          LIST_TOKEN: ${{ secrets.LIST_TOKEN }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER || secrets.GMAIL_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || secrets.GMAIL_APP_PASS }}
          FROM_ADDR: ${{ secrets.FROM_ADDR }}
          SIG_TO: ${{ secrets.SIG_TO }}
          SIG_TEST_EMAILS: ${{ secrets.SIG_TEST_EMAILS }}
          DAIRY_MONTHLY_LIVE: ${{ vars.DAIRY_MONTHLY_LIVE == '0' && '0' || '1' }}
          PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.email == 'preview' && '1' || '' }}
          SEND: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.email == 'send')) && github.ref_name == 'main' && '1' || '' }}
        run: python3 scripts/send_milk_month.py
