name: Dairy prices

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Probe only: save the raw AMS text and NASS response to data/dairy-raw/ on the raw branch"
        type: boolean
        default: false
      email:
        description: "Milk price day email: dry = render only; preview = Sig's test inbox; send = the list (refused unless this run read and checked the month)"
        type: choice
        options: [dry, preview, send]
        default: dry
  schedule:
    - cron: '37 15 1-9 * *'
    - cron: '37 21 1-9 * *'
    - cron: '37 15 28-31 * *'
    - cron: '11 14 * * 2'
    - cron: '23 16 15-27 * *'
  workflow_run:
    workflows: ["Fetch Grain Bids", "Tick 12"]
    types: [completed]

permissions:
  contents: write

jobs:
  gate:
    if: (github.event.workflow_run.name != 'Fetch Grain Bids' || vars.CLOCK_LIVE != '1') && (github.event.workflow_run.name != 'Tick 12' || (contains(github.event.workflow_run.display_title, ' dairy.yml ') && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow dairy.yml --max-lag 76
          --cron "37 15 1-9 * *"
          --cron "37 21 1-9 * *"
          --cron "37 15 28-31 * *"
          --cron "11 14 * * 2"
          --cron "23 16 15-27 * *"

  build:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: dairy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pypdf (fallback if pdftotext is missing)
        run: pip install pypdf==6.20.1
      - name: pdftotext
        timeout-minutes: 5
        continue-on-error: true
        uses: ./.github/actions/pdftotext
      - name: Selftest
        run: |
          python scripts/fetch_dairy.py --selftest
          python scripts/fetch_mailbox.py --selftest
          python scripts/dairy_probe.py --selftest
          python scripts/fetch_dmc.py --selftest
          python scripts/fetch_order30.py --selftest
          python scripts/milk_miss.py --selftest
          python scripts/send_milk_month.py --selftest
      - name: Probe (raw source capture)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe }}
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: |
          rc=0
          python scripts/fetch_dairy.py --probe || rc=1
          python scripts/fetch_mailbox.py --probe || rc=1
          python scripts/fetch_dmc.py --probe || echo "::warning::DMC probe failed"
          python scripts/fetch_order30.py --probe || echo "::warning::Order 30 probe failed"
          exit $rc
      - name: Save the probe's raw files to the raw branch
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.probe }}
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_SOFT: '1'
        run: bash scripts/push_raw.sh "dairy probe" data/dairy-raw
      - name: Fetch and write data/dairy-data.json
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) }}
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: python scripts/fetch_dairy.py
      - name: Fetch the mailbox price into data/dairy-mailbox.json
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) }}
        run: python scripts/fetch_mailbox.py
      - name: Fetch DMC margins into data/dairy-dmc.json
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) }}
        timeout-minutes: 15
        continue-on-error: true
        run: python scripts/fetch_dmc.py
      - name: Licensed dairy herds into data/dairy-herds.json
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) }}
        timeout-minutes: 10
        continue-on-error: true
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: |
          python scripts/fetch_dairy_herds.py --selftest
          python scripts/fetch_dairy_herds.py
      - name: Fetch Order 30 into data/dairy-order30.json
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) }}
        run: python scripts/fetch_order30.py
      - name: Record the futures miss log
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) }}
        run: python scripts/milk_miss.py
      - name: Bake milk-prices from the new data
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) }}
        run: |
          python scripts/bake_seo.py --selftest
          python scripts/test_milk_seed.py
          python scripts/seed_static.py --only milk
          python scripts/bake_seo.py --page milk-prices.html
          python scripts/bake_faq.py
      - name: Pillow, for the share image
        continue-on-error: true
        run: pip install --quiet pillow==12.3.0

      - name: Commit if changed (race-tolerant)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) }}
        env:
          PROBE: ${{ github.event_name == 'workflow_dispatch' && inputs.probe }}
        run: |
          set -e
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          FILES="data/dairy-data.json data/dairy-history.json data/dairy-mailbox.json data/dairy-miss.json data/dairy-order30.json data/dairy-dmc.json data/dairy-herds.json"
          rm -rf /tmp/dairy && mkdir -p /tmp/dairy
          for f in $FILES; do
            [ -e "$f" ] && cp -r --parents "$f" /tmp/dairy/ || true
          done
          [ -n "$(ls -A /tmp/dairy)" ] || { echo "No output; nothing to commit."; exit 0; }
          BR="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3 4 5; do
            git fetch origin "$BR"
            git reset --hard "origin/$BR"
            mkdir -p data && cp -r /tmp/dairy/data/. data/
            if [ "$PROBE" != "true" ]; then
              python scripts/seed_static.py --only milk
              python scripts/bake_seo.py --page milk-prices.html
              python scripts/bake_faq.py
              python scripts/build_share_images.py --only milk-prices || true
              git add milk-prices.html sitemap.xml img/og/milk-prices.jpg
            fi
            for f in $FILES; do [ -e "$f" ] && git add "$f" || true; done
            if git diff --staged --quiet; then echo "No change."; exit 0; fi
            git commit -m "Update dairy prices $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            if git push origin "HEAD:$BR"; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push race on attempt $i; re-syncing to origin/$BR..."
            sleep $((RANDOM % 4 + 2))
          done
          echo "Failed to push after 5 attempts."; exit 1

      - name: Milk price day email
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) }}
        env:
          LIST_URL: ${{ secrets.LIST_URL }}
          LIST_TOKEN: ${{ secrets.LIST_TOKEN }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER || secrets.GMAIL_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || secrets.GMAIL_APP_PASS }}
          FROM_ADDR: ${{ secrets.FROM_ADDR }}
          SIG_TO: ${{ secrets.SIG_TO }}
          SIG_TEST_EMAILS: ${{ secrets.SIG_TEST_EMAILS }}
          DAIRY_MONTHLY_LIVE: ${{ vars.DAIRY_MONTHLY_LIVE == '0' && '0' || '1' }}
          PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.email == 'preview' && '1' || '' }}
          SEND: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.email == 'send')) && github.ref_name == 'main' && '1' || '' }}
        run: python3 scripts/send_milk_month.py
