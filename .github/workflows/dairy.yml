name: Dairy prices

# Writes data/dairy-data.json and data/dairy-history.json for milk-prices.html,
# then bakes the page's figures and title from them (see the bake step).
# Source: USDA AMS "Announcement of Class and Component Prices" (posted about the
# 5th) plus the NASS all-milk price, and the AMS mailbox price report (3357,
# data/dairy-mailbox.json). No CME, no Barchart.
#
# AMS announces last month's class prices on or before the 5th (7 CFR 1000.53);
# August 2026 posted Sep 2. The old window, days 3-9 once a day, missed an
# announcement on the 1st or 2nd until the 3rd and depended on one scheduled run
# that GitHub can delay or drop. Now: twice a day on days 1-9, once on 28-31,
# plus the weekly catch-up. The script is idempotent: a re-run with
# nothing new commits nothing.
#
# FIRST RUN: dispatch this once with "probe" ticked. It saves what the AMS and
# NASS servers actually returned to data/dairy-raw/ and commits it, so the real
# PDF layout can be read. Then dispatch again without probe.

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Probe only: save the raw AMS text and NASS response to data/dairy-raw/ and commit them"
        type: boolean
        default: false
  schedule:
    - cron: '37 15 1-9 * *'     # announcement window, days 1-9, morning
    - cron: '37 21 1-9 * *'     # and afternoon
    - cron: '37 15 28-31 * *'   # an early announcement at month end
    - cron: '11 14 * * 2'     # weekly catch-up, Tuesdays
    - cron: '23 16 15-27 * *' # mailbox price (scripts/fetch_mailbox.py): AMS posts it late in the month, about three months on

permissions:
  contents: write

concurrency:
  group: dairy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pypdf (fallback if pdftotext is missing)
        run: pip install pypdf==6.20.1
      - name: Selftest
        run: |
          python scripts/fetch_dairy.py --selftest
          python scripts/fetch_mailbox.py --selftest
      - name: Probe (raw source capture)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe }}
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: |
          python scripts/fetch_dairy.py --probe
          python scripts/fetch_mailbox.py --probe
      - name: Fetch and write data/dairy-data.json
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) }}
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: python scripts/fetch_dairy.py
      # The newest federal-order mailbox price (USDA AMS report 3357), dated.
      # Keep-last-good: a failed fetch or an unreadable sentence leaves
      # data/dairy-mailbox.json alone and only records why.
      - name: Fetch the mailbox price into data/dairy-mailbox.json
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) }}
        run: python scripts/fetch_mailbox.py
      # The page body, title and description carry the newest month from the
      # file just written (scripts/seed_static.py seed_milk, scripts/bake_seo.py
      # seo_milk). Until 2026-10-13 they were typed by hand and sat on August
      # while the file held September. Selftest first: bake_seo refuses to
      # write a title it cannot fit or source. Freshness runs both again daily,
      # which is what dashes a class month once the next one is due.
      - name: Bake milk-prices from the new data
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) }}
        run: |
          python scripts/bake_seo.py --selftest
          python scripts/test_milk_seed.py
          python scripts/seed_static.py --only milk
          python scripts/bake_seo.py --page milk-prices.html
      - name: Pillow, for the share image
        continue-on-error: true
        run: pip install --quiet pillow==12.3.0

      - name: Commit if changed (race-tolerant)
        env:
          PROBE: ${{ github.event_name == 'workflow_dispatch' && inputs.probe }}
        run: |
          set -e
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          FILES="data/dairy-data.json data/dairy-history.json data/dairy-mailbox.json data/dairy-raw"
          rm -rf /tmp/dairy && mkdir -p /tmp/dairy
          for f in $FILES; do
            [ -e "$f" ] && cp -r --parents "$f" /tmp/dairy/ || true
          done
          [ -n "$(ls -A /tmp/dairy)" ] || { echo "No output; nothing to commit."; exit 0; }
          BR="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3 4 5; do
            git fetch origin "$BR"
            git reset --hard "origin/$BR"
            mkdir -p data && cp -r /tmp/dairy/data/. data/
            # re-bake the page on the fresh checkout rather than copy it over,
            # so an edit to milk-prices.html pushed meanwhile is kept
            if [ "$PROBE" != "true" ]; then
              python scripts/seed_static.py --only milk
              python scripts/bake_seo.py --page milk-prices.html
              python scripts/build_share_images.py --only milk-prices || true
              git add milk-prices.html sitemap.xml img/og/milk-prices.jpg
            fi
            for f in $FILES; do [ -e "$f" ] && git add "$f" || true; done
            if git diff --staged --quiet; then echo "No change."; exit 0; fi
            git commit -m "Update dairy prices $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            if git push origin "HEAD:$BR"; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push race on attempt $i; re-syncing to origin/$BR..."
            sleep $((RANDOM % 4 + 2))
          done
          echo "Failed to push after 5 attempts."; exit 1
