name: climate indices

on:
  schedule:
    - cron: "37 14 9 * *"
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]
  workflow_dispatch:

permissions: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow climate-indices.yml --max-lag 360
          --cron "37 14 9 * *"

  indices:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-24.04
    concurrency:
      group: climate-indices
      cancel-in-progress: false
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: true
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - name: Offline first
        run: python3 scripts/fetch_climate_indices.py --selftest

      - name: Get the saved model inputs (private repo, private-data branch)
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_BRANCH: private-data
          RAW_SOFT: '1'
        run: |
          bash scripts/pull_raw.sh private/prf/seasonal-fc.json
          bash scripts/pull_raw.sh private/prf/climate-indices.json

      - name: Fetch
        id: fetch
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/fetch_climate_indices.py 2>&1 | tee climate.log

      - name: Save the climate indices (private repo, private-data branch)
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_BRANCH: private-data
          RAW_SOFT: '1'
        run: |
          [ -f private/prf/climate-indices.json ] || { echo "no file written"; exit 0; }
          python3 scripts/fetch_climate_indices.py --check
          bash scripts/push_raw.sh "climate indices" private/prf/climate-indices.json

      - name: Re-run the optimizer test with the indices
        run: |
          python3 scripts/fetch_climate_indices.py --check
          node scripts/prf_opt_backtest.mjs --quiet
          node --test test/prf-optimize.test.mjs
          python3 scripts/check_site_budget.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prf/opt.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "data: PRF optimizer test re-run"
          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            if git pull -q --rebase --autostash origin main && git push -q; then exit 0; fi
            sleep $((20 * i))
          done
          echo "push failed after 5 attempts"; exit 1

      - name: Say which source failed
        if: steps.fetch.outcome == 'failure'
        run: |
          grep -E "FAILED|refusing" climate.log || true
          echo "::warning::A climate index source failed; the published series was kept. See the Fetch step."
