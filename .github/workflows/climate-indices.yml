name: climate indices

# NOAA's PDO (NCEI) and AMO (PSL) monthly series, written to
# data/prf/climate-indices.json by scripts/fetch_climate_indices.py, then the
# PRF optimizer's walk-forward test (scripts/prf_opt_backtest.mjs) is re-run so
# data/prf/opt.json tests the "PDO with ENSO" and "AMO" tilts on the new data.
# Until this has run once, opt.json lists both as "not tested yet".
#
# Monthly on the 9th (NCEI posts the PDO early in the month), off the hour,
# and by hand. A source that fails keeps the series already published; the
# step is marked failed and nothing older replaces anything newer.
on:
  schedule:
    - cron: "37 14 9 * *"     # the 9th, 14:37 UTC
  # GitHub's scheduler drops scheduled fires (it never started land-data.yml on Nov 3, 2026;
  # scripts/cron_gate.py has the numbers). So this also runs after every "Fetch Grain Bids"
  # (cron-job.org, every 15 minutes), and the gate job lets the first run after each tick of the
  # cron above, by either trigger, do the work within 360 minutes
  # (six hours, the same day and well before the next tick).
  # Every other run skips in seconds. A chained run takes the scheduled path. A run by hand or
  # a push does not use up the tick (cron_gate.py MANUAL_DOES_NOT_SERVE): it may take narrower
  # inputs, and the chained run that follows is the same idempotent job.
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]
  workflow_dispatch:

permissions: {}

jobs:
  # One run per tick of the schedule (see on: above). Sparse: the skip costs seconds.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow climate-indices.yml --max-lag 360
          --cron "37 14 9 * *"

  indices:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-24.04
    concurrency:
      group: climate-indices
      cancel-in-progress: false
    timeout-minutes: 30
    permissions:
      contents: write          # commits the two data files below
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: true   # this job pushes
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - name: Offline first
        run: python3 scripts/fetch_climate_indices.py --selftest

      - name: Fetch
        id: fetch
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/fetch_climate_indices.py 2>&1 | tee climate.log

      - name: Re-run the optimizer test with the indices
        run: |
          python3 scripts/fetch_climate_indices.py --check
          node scripts/prf_opt_backtest.mjs --quiet
          node --test test/prf-optimize.test.mjs
          python3 scripts/check_site_budget.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prf/climate-indices.json data/prf/opt.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          ASOF=$(python3 -c "import json;d=json.load(open('data/prf/climate-indices.json'));print(', '.join('%s to %s'%(k,v['as_of']) for k,v in d['series'].items()))")
          git commit -q -m "data: climate indices ($ASOF), PRF optimizer test re-run"
          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            if git pull -q --rebase --autostash origin main && git push -q; then exit 0; fi
            sleep $((20 * i))
          done
          echo "push failed after 5 attempts"; exit 1

      - name: Say which source failed
        if: steps.fetch.outcome == 'failure'
        run: |
          grep -E "FAILED|refusing" climate.log || true
          echo "::warning::A climate index source failed; the published series was kept. See the Fetch step."
