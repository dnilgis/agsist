name: Bing reports (on request)
# Bing reports (on request).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bing-reports
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pull reports
        env:
          KEY: ${{ secrets.BING_API_KEY1 }}
        run: |
          set -eu
          [ -n "$KEY" ] || { echo "::error::BING_API_KEY1 secret is empty"; exit 1; }
          mkdir -p out
          SITE='https%3A%2F%2Fagsist.com%2F'
          for m in GetQueryStats GetPageStats GetRankAndTrafficStats GetCrawlStats GetCrawlIssues GetLinkCounts GetUrlSubmissionQuota; do
            code=$(curl -sS -o "out/$m.json" -w '%{http_code}' \
              "https://ssl.bing.com/webmaster/api.svc/json/$m?siteUrl=$SITE&apikey=$KEY" || echo 000)
            echo "$m: HTTP $code, $(wc -c < "out/$m.json" 2>/dev/null || echo 0) bytes"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bing-reports
          path: out/
          retention-days: 1
