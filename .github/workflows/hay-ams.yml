name: Hay market reports (AMS)

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Probe only: save the AMS hay listing and report text to data/hay-ams-raw/ on the raw branch"
        type: boolean
        default: false
      scan:
        description: "With probe: also try these report numbers (A-B, at most 1500), keep the ones titled hay"
        type: string
        default: ""
  schedule:
    - cron: '17 23 * * 1-5'
    - cron: '41 14 * * 6'
  workflow_run:
    workflows: ["Fetch Grain Bids", "Tick 14"]
    types: [completed]

permissions:
  contents: write

jobs:
  gate:
    if: (github.event.workflow_run.name != 'Fetch Grain Bids' || vars.CLOCK_LIVE != '1') && (github.event.workflow_run.name != 'Tick 14' || contains(github.event.workflow_run.display_title, ' hay-ams.yml '))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow hay-ams.yml --max-lag 360
          --cron "17 23 * * 1-5"
          --cron "41 14 * * 6"

  build:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: hay-ams
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pypdf (fallback if pdftotext is missing)
        run: pip install pypdf==6.20.1
      - name: Selftest
        run: python scripts/fetch_hay_ams.py --selftest
      - name: Measure which AMS hosts answer (DNS and one known report)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe }}
        run: bash scripts/ams_host_check.sh
      - name: Probe (raw source capture)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe }}
        env:
          SCAN: ${{ inputs.scan }}
        run: |
          if [ -n "$SCAN" ]; then python scripts/fetch_hay_ams.py --probe --scan "$SCAN"; else python scripts/fetch_hay_ams.py --probe; fi
      - name: Save the probe's raw files to the raw branch
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.probe }}
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_SOFT: '1'
        run: bash scripts/push_raw.sh "hay-ams probe" data/hay-ams-raw
      - name: Fetch and write data/hay/ams-hay.json
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) }}
        run: python scripts/fetch_hay_ams.py
      - name: USDA state cash grain and daily slaughter (My Market News)
        if: ${{ !cancelled() && !(github.event_name == 'workflow_dispatch' && inputs.probe) }}
        continue-on-error: true
        env:
          MARS_API_KEY: ${{ secrets.MARS_API_KEY }}
        run: |
          python scripts/fetch_state_grain_mars.py --selftest > /dev/null
          python scripts/fetch_slaughter_mars.py --selftest > /dev/null
          python scripts/fetch_state_grain_mars.py || echo "::warning::state grain read failed; last good file kept"
          python scripts/fetch_slaughter_mars.py || echo "::warning::slaughter read failed; last good file kept"
          python scripts/check_state_grain_ams.py
      - name: Commit if changed (race-tolerant)
        run: |
          set -e
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          FILES="data/hay/ams-hay.json data/hay-ams-raw/listing.json data/state-grain-ams.json data/slaughter.json"
          rm -rf /tmp/ha && mkdir -p /tmp/ha
          for f in $FILES; do
            [ -e "$f" ] && cp -r --parents "$f" /tmp/ha/ || true
          done
          [ -n "$(ls -A /tmp/ha)" ] || { echo "No output; nothing to commit."; exit 0; }
          BR="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3 4 5; do
            git fetch origin "$BR"
            git reset --hard "origin/$BR"
            mkdir -p data && cp -r /tmp/ha/data/. data/
            for f in $FILES; do [ -e "$f" ] && git add "$f" || true; done
            if git diff --staged --quiet; then echo "No change."; exit 0; fi
            git commit -m "Update AMS hay, state grain and slaughter $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            if git push origin "HEAD:$BR"; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push race on attempt $i; re-syncing to origin/$BR..."
            sleep $((RANDOM % 4 + 2))
          done
          echo "Failed to push after 5 attempts."; exit 1
