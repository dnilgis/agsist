name: Hay market reports (AMS)

# Writes data/hay/ams-hay.json for /hay-prices: this week's hay trades by
# state, grade and bale type, from public USDA AMS hay report PDFs, read by
# scripts/fetch_hay_ams.py. The reports are in scripts/hay_ams_sources.json.
# The page shows a "trades load after the first USDA read" box until this file
# exists. A report that fails a check keeps its last good issue.
#
# FIRST RUN: dispatch once with "probe" ticked (and "scan" set, e.g.
# 2800-3300, if the listing pages name few reports). It saves the AMS hay
# listing and the text of every report it finds to data/hay-ams-raw/ and
# saves them on the raw branch (never deployed). Check that text against the parser, add any new layout (hay
# auctions especially) as a selftest fixture, then run without probe.

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Probe only: save the AMS hay listing and report text to data/hay-ams-raw/ on the raw branch"
        type: boolean
        default: false
      scan:
        description: "With probe: also try these report numbers (A-B, at most 1500), keep the ones titled hay"
        type: string
        default: ""
  schedule:
    # State reports come out on their own days, most Thursday or Friday.
    - cron: '17 23 * * 1-5'
    - cron: '41 14 * * 6'

permissions:
  contents: write

concurrency:
  group: hay-ams
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pypdf (fallback if pdftotext is missing)
        run: pip install pypdf==6.20.1
      - name: Selftest
        run: python scripts/fetch_hay_ams.py --selftest
      - name: TEMP DNS check and ESMIS copies (probe only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe }}
        run: |
          for h in www.ams.usda.gov mymarketnews.ams.usda.gov marsapi.ams.usda.gov esmis.nal.usda.gov www.usda.gov usda.library.cornell.edu; do
            getent hosts "$h" >/dev/null && echo "DNS ok: $h" || echo "DNS FAIL: $h"
          done
          mkdir -p data/hay-ams-raw/esmis
          for u in https://esmis.nal.usda.gov/sites/default/release-files/ft84bb300/xk81mg59r/2227pm96c/AMS_3729.PDF https://esmis.nal.usda.gov/sites/default/release-files/kw52j807h/4x51j820j/76537q43x/AMS_2244.PDF; do
            f=data/hay-ams-raw/esmis/$(basename "$u" .PDF)-esmis.pdf
            curl -sS -m 60 -L -o "$f" -w "$u HTTP %{http_code} %{size_download}\n" "$u" || true
            [ -s "$f" ] && head -c 5 "$f" | grep -q '%PDF' && pdftotext -layout "$f" "${f%.pdf}.txt" && head -40 "${f%.pdf}.txt" || rm -f "$f"
          done
          getent hosts www.ams.usda.gov >/dev/null || { echo "::error::www.ams.usda.gov does not resolve from the runner; probe skipped"; exit 1; }
      - name: Probe (raw source capture)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe }}
        env:
          SCAN: ${{ inputs.scan }}
        run: |
          if [ -n "$SCAN" ]; then python scripts/fetch_hay_ams.py --probe --scan "$SCAN"; else python scripts/fetch_hay_ams.py --probe; fi
      - name: TEMP MARS report list (probe only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe }}
        continue-on-error: true
        env:
          MARS_API_KEY: ${{ secrets.MARS_API_KEY }}
        run: |
          mkdir -p data/hay-ams-raw/mars
          getent hosts marsapi.ams.usda.gov www.ams.usda.gov mymarketnews.ams.usda.gov || echo "DNS: no answer"
          [ -n "$MARS_API_KEY" ] && echo "MARS key: set" || echo "MARS key: EMPTY in this repo"
          curl -sS -m 60 -o data/hay-ams-raw/mars/viewreport-bls-ap.html -w "viewReport/bls-ap HTTP %{http_code}\n" https://mymarketnews.ams.usda.gov/viewReport/bls-ap || true
          grep -o -i '<title>[^<]*' data/hay-ams-raw/mars/viewreport-bls-ap.html | head -2 || true
          B=https://marsapi.ams.usda.gov/services/v1.2/reports
          curl -sS -m 120 -u "$MARS_API_KEY:" "$B" -o data/hay-ams-raw/mars/reports.json || true
          for s in bls-ap 2246 3729 2243 2244 2245 3723; do
            curl -sS -m 120 -u "$MARS_API_KEY:" "$B/$s?lastReports=1" -o "data/hay-ams-raw/mars/report-$s.json" || true
          done
          python3 - <<'EOF'
          import json, glob
          try:
              d = json.load(open("data/hay-ams-raw/mars/reports.json"))
          except Exception as e:
              print("reports list not read:", e); d = []
          rows = d if isinstance(d, list) else d.get("results") or []
          print("MARS reports listed:", len(rows))
          want = {"2246","3729","2243","2244","2245","3723","1215","2046","1917","2713","1860","2167","2039","1703","1825","2528"}
          for r in rows:
              blob = json.dumps(r).lower()
              if str(r.get("slug_id")) in want or "bls" in blob or "retail" in (r.get("report_title") or "").lower():
                  print("LIST", json.dumps(r)[:600])
          for f in sorted(glob.glob("data/hay-ams-raw/mars/report-*.json")):
              print("FILE", f, open(f, "rb").read(1500).decode("utf-8", "replace").replace("\n", " "))
          EOF
      # Raw captures go to the raw branch (never deployed), not main: scripts/push_raw.sh.
      # Runs even when the probe step failed part way, so what it did capture is kept. The listing stays on main too: the normal run reads it.
      - name: Save the probe's raw files to the raw branch
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.probe }}
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_SOFT: '1'
        run: bash scripts/push_raw.sh "hay-ams probe" data/hay-ams-raw
      - name: Fetch and write data/hay/ams-hay.json
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) }}
        run: python scripts/fetch_hay_ams.py
      - name: Commit if changed (race-tolerant)
        run: |
          set -e
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          FILES="data/hay/ams-hay.json data/hay-ams-raw/listing.json"
          rm -rf /tmp/ha && mkdir -p /tmp/ha
          for f in $FILES; do
            [ -e "$f" ] && cp -r --parents "$f" /tmp/ha/ || true
          done
          [ -n "$(ls -A /tmp/ha)" ] || { echo "No output; nothing to commit."; exit 0; }
          BR="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3 4 5; do
            git fetch origin "$BR"
            git reset --hard "origin/$BR"
            mkdir -p data && cp -r /tmp/ha/data/. data/
            for f in $FILES; do [ -e "$f" ] && git add "$f" || true; done
            if git diff --staged --quiet; then echo "No change."; exit 0; fi
            git commit -m "Update AMS hay reports $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            if git push origin "HEAD:$BR"; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push race on attempt $i; re-syncing to origin/$BR..."
            sleep $((RANDOM % 4 + 2))
          done
          echo "Failed to push after 5 attempts."; exit 1
