name: State yield pages

on:
  schedule:
    - cron: "23 13 17 * *"
  workflow_run:
    workflows: ["Build State Stats (USDA NASS)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upstream:
    if: github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.u.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/upstream-did-work/
          sparse-checkout-cone-mode: false
      - id: u
        uses: ./.github/actions/upstream-did-work

  build:
    needs: upstream
    if: needs.upstream.outputs.go == '1' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: yield-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build /yield/<state>
        run: |
          python scripts/build_state_yield_pages.py --selftest
          python scripts/build_state_yield_pages.py
      - name: Commit if changed
        run: |
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          python scripts/update_sitemap.py --add $(cat yield/_indexable.txt) --priority 0.6 --changefreq monthly
          git add yield sitemap.xml
          python scripts/generated_sets.py dependents yield --stage || true
          if git diff --staged --quiet; then echo "no change"; exit 0; fi
          git commit -m "pages: rebuild /yield state yield pages"
          for i in 1 2 3 4; do
            if python3 scripts/generated_sets.py pull-rebase yield && git push origin HEAD:main; then echo "pushed on attempt $i"; exit 0; fi
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main
            git reset -q --hard origin/main
            python scripts/build_state_yield_pages.py
            python scripts/update_sitemap.py --add $(cat yield/_indexable.txt) --priority 0.6 --changefreq monthly
            python3 scripts/generated_sets.py dependents yield --stage || true
            git add yield sitemap.xml
            if git diff --staged --quiet; then echo "no change on the new main"; exit 0; fi
            git commit -q -m "pages: rebuild /yield state yield pages"
            sleep $((10 * i))
          done
          echo "push failed after 4 attempts"; exit 1
