name: cash-bid-pages
# cash-bid-pages.

on:
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]
  schedule:
    - cron: "19 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the last rebuild is recent"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cash-bid-pages
  cancel-in-progress: false

env:
  MIN_GAP_MIN: "110"

jobs:
  gate:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      go: ${{ steps.age.outputs.go }}
    steps:
      - id: age
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          go=1
          last=$(gh api "repos/${GITHUB_REPOSITORY}/commits?sha=main&path=sitemap-cash-bids.xml&per_page=1" \
                   --jq '.[0].commit.committer.date' 2>/dev/null || true)
          if [ -n "$last" ] && [ "$FORCE" != "true" ]; then
            age=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 60 ))
            echo "pages last changed $last ($age min ago); gap $MIN_GAP_MIN min"
            [ "$age" -lt "$MIN_GAP_MIN" ] && go=0
          else
            echo "no earlier pages commit found (or force); building"
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: ${{ needs.gate.outputs.go == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Selftest (gate)
        run: python scripts/build_cash_bid_pages.py --selftest

      - name: Build pages from the network feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_cash_bid_pages.py --print-new /tmp/new-urls.txt

      - name: Sponsor slot list
        run: python scripts/stamp_rates.py

      - name: Rebuild county rain and Atlas town links
        run: |
          python scripts/build_county_rain.py
          python scripts/build_atlas_pages.py
          python scripts/build_place_pct.py

      - name: Rebuild the summary files
        continue-on-error: true
        run: python scripts/generated_sets.py dependents cash-bids rain farmland-atlas --stage

      - name: Share image
        continue-on-error: true
        run: |
          pip install --quiet pillow==12.3.0
          python3 scripts/build_share_images.py --only cash-bids

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          git add -A data/atlas/pct
          git add -A cash-bids data/pointers data/sponsor-slots.json sitemap-cash-bids.xml cash-bids.html basis.html data/state-basis data/basis-states.json data/elevator-counts.json data/search-index.json data/search-elevators.json data/search-places.json img/og/cash-bids.jpg rain sitemap-rain.xml farmland-atlas sitemap-atlas.xml
          if git diff --staged --quiet; then echo "no change"; echo "changed=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff --staged --shortstat
          git commit -q -m "pages: rebuild /cash-bids town pages from the elevator network"
          for i in 1 2 3 4; do
            git rebase --abort 2>/dev/null || true
            if python3 scripts/generated_sets.py pull-rebase cash-bids rain farmland-atlas --autostash && git push -q; then
              echo "changed=1" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep $((20 * i))
          done
          echo "push failed after 4 attempts"; exit 1

      - name: IndexNow ping (best-effort)
        if: steps.commit.outputs.changed == '1'
        continue-on-error: true
        run: |
          urls=$(cat /tmp/new-urls.txt; ls -d cash-bids/*/ | sed 's#^#https://agsist.com/#')
          python scripts/indexnow_submit.py --urls $(echo "$urls" | sort -u) || echo "IndexNow ping failed - harmless"
