name: MESH radar hail swaths — daily
# MESH radar hail swaths: daily.

on:
  schedule:
    - cron: '25 8 * * *'
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]
  workflow_dispatch:
    inputs:
      date:
        description: 'UTC day YYYY-MM-DD (default: yesterday)'
        required: false
      days:
        description: 'Backfill this many days counting back from date'
        required: false
        default: '1'

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow mesh.yml --max-lag 360
          --cron "25 8 * * *"

  mesh:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: mesh
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: System eccodes (GRIB2 decoder)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libeccodes0 libeccodes-data

      - name: Python deps
        run: pip install --quiet numpy==2.5.4 matplotlib==3.11.2 requests==2.34.2 xarray==2026.9.0 cfgrib==0.9.15.1 shapely==2.2.0

      - name: Offline selftest (contour engine)
        run: python scripts/fetch_mesh.py --selftest

      - name: Process day(s)
        env:
          IN_DATE: ${{ github.event.inputs.date }}
          IN_DAYS: ${{ github.event.inputs.days }}
        run: |
          END="$IN_DATE"
          N="$IN_DAYS"
          [ -z "$N" ] && N=1
          [ -z "$END" ] && END=$(date -u -d 'yesterday' +%F)
          printf '%s' "$END" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || { echo "::error::date must be YYYY-MM-DD"; exit 1; }
          printf '%s' "$N" | grep -Eq '^[0-9]{1,3}$' || { echo "::error::days must be a number"; exit 1; }
          FAILED=""
          for i in $(seq 0 $((N-1))); do
            D=$(date -u -d "$END - $i day" +%F)
            if python scripts/fetch_mesh.py "$D"; then
              echo "day $D ok"
            else
              echo "::warning::MESH day $D failed"
              FAILED="$FAILED $D"
            fi
          done
          if [ -n "$FAILED" ]; then
            echo "::error::MESH days failed:$FAILED — backfill with a manual"
            echo "::error::dispatch of this workflow (date=<the day>, days=1)."
            echo "MESH_FAILED_DAYS=$FAILED" >> "$GITHUB_ENV"
          fi

      - name: Refresh recent-reports layer (last 30 days)
        run: python scripts/fetch_hail.py --recent || echo "recent refresh failed — yearly data unaffected"

      - name: Generate storm-day pages
        run: python scripts/generate_hail_events.py || echo "storm pages failed - data unaffected"

      - name: Refresh state pages' storm-day lists
        run: python scripts/generate_hail_states.py || echo "state pages failed - data unaffected"

      - name: Rebuild the summary files
        run: python scripts/generated_sets.py dependents hail hail-map --stage || true

      - name: Commit if changed (conflict-armored)
        run: |
          git config user.name  "agsist-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes."
            exit 0
          fi
          git add -A
          git commit -m "mesh: radar hail swaths update"
          for i in 1 2 3; do
            if python3 scripts/generated_sets.py pull-rebase hail hail-map; then
              git push && exit 0
            fi
            echo "rebase conflict (attempt $i) — taking main's manifest and regenerating"
            git rebase --abort || true
            git fetch origin main
            git checkout origin/main -- data/hail/manifest.json || true
            python scripts/fetch_hail.py --recent || true
            python scripts/generate_hail_events.py || true
            python scripts/generate_hail_states.py || true
            python scripts/generated_sets.py dependents hail hail-map --stage || true
            git add -A
            git commit --amend --no-edit
          done
          echo "push failed after 3 attempts — re-run this workflow"
          exit 1

      - name: IndexNow ping (Bing learns about new pages in seconds)
        run: |
          Y=$(date -u -d 'yesterday' +%F)
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"agsist.com","key":"f4a81c26db974e0f92c35b7a6e10d8c4","keyLocation":"https://agsist.com/f4a81c26db974e0f92c35b7a6e10d8c4.txt","urlList":["https://agsist.com/hail-map","https://agsist.com/hail/","https://agsist.com/hail/'"$Y"'","https://agsist.com/sitemap.xml"]}' \
            || echo "IndexNow ping failed - harmless"

      - name: Fail if any day was lost
        if: env.MESH_FAILED_DAYS != ''
        run: |
          echo "These MESH days did not acquire:$MESH_FAILED_DAYS"
          echo "Backfill: Actions -> MESH -> Run workflow -> date=<day>, days=1"
          exit 1
