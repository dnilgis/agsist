name: Fetch Export Sales

on:
  schedule:
    # USDA FAS publishes Weekly Export Sales Thursday at 8:30am ET.
    #
    # THIS WAS ONE CRON A WEEK WITH NOTHING BEHIND IT. A scheduled run on this
    # platform is best effort -- measured on this repository over 2026-08-19 to
    # 08-26, data/bids.json delivered between 41% and 86% of the fires it asked
    # for -- so a single weekly attempt means a dropped run leaves the page a
    # week stale with nothing to notice it.
    #
    # Both DST cases, because 8:30am ET moves against UTC:
    #   EDT (Mar-Nov)  release 12:30 UTC -> 12:47
    #   EST (Nov-Mar)  release 13:30 UTC -> 13:47
    # (2026-10-09: two or three minutes off the quarter hours, where GitHub's
    # queue is most crowded.)
    # The original 14:30 (now 14:33) stays as the second attempt in both, and Friday
    # morning is the catch-all. Each is a no-op when the data has not moved.
    - cron: '47 12 * * 4'
    - cron: '47 13 * * 4'
    - cron: '33 14 * * 4'
    - cron: '20 13 * * 5'
  # Also after every "Fetch Grain Bids" (cron-job.org, every 15 minutes): GitHub
  # drops and delays the schedule above. The gate job below lets the first run
  # after each tick of the schedule do the work; see scripts/cron_gate.py.
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]
  workflow_dispatch:

# One run at a time, so a chained run and a late cron fire cannot both write.
concurrency:
  group: export-sales
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/cron_gate.py
          sparse-checkout-cone-mode: false
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow export_sales.yml --max-lag 120
          --cron "47 12 * * 4"
          --cron "47 13 * * 4"
          --cron "33 14 * * 4"
          --cron "20 13 * * 5"

  fetch-export-sales:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # fetch_export_sales.py now uses the FAS Open Data ESR API (JSON) and
        # only needs requests. beautifulsoup4 was for the old HTML-scraping
        # strategies, which USDA decommissioned on June 2, 2026.
        run: pip install requests

      # THE WITHHOLDING RULE, BEFORE THE FETCH. A corn figure from a finished
      # marketing year rendered on the homepage under this week's date for
      # months; the retirement that stops it is pure arithmetic and is checked
      # here in under a second.
      - name: Test the staleness rule this run depends on
        run: python scripts/fetch_export_sales.py --selftest

      - name: Fetch USDA FAS Export Sales
        # FAS_API_KEY is a free api.data.gov key (https://api.data.gov/signup),
        # stored as a repo secret. Without it the script preserves existing data.
        env:
          FAS_API_KEY: ${{ secrets.FAS_API_KEY }}
        run: python scripts/fetch_export_sales.py

      - name: Commit data/export-sales.json
        run: |
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          git add data/export-sales.json
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "chore: update export sales $(date -u +%F)"
            for i in 1 2 3 4 5; do
              if git push; then echo "pushed on attempt $i"; exit 0; fi
              echo "push rejected (attempt $i) — resyncing onto latest main"
              cp data/export-sales.json "$RUNNER_TEMP/export-sales.json"
              git fetch origin main
              git reset --hard origin/main
              cp "$RUNNER_TEMP/export-sales.json" data/export-sales.json
              git add data/export-sales.json
              if git diff --staged --quiet; then echo "remote already current"; exit 0; fi
              git commit -m "chore: update export sales $(date -u +%F)"
              sleep $(( (RANDOM % 4) + 1 ))
            done
            echo "::error::could not push export sales after 5 attempts"
            exit 1
          fi
