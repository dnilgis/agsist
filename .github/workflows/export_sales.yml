name: Fetch Export Sales
# Fetch Export Sales.

on:
  schedule:
    - cron: '47 12 * * 4'
    - cron: '47 13 * * 4'
    - cron: '33 14 * * 4'
    - cron: '20 13 * * 5'
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: export-sales
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow export_sales.yml --max-lag 120
          --cron "47 12 * * 4"
          --cron "47 13 * * 4"
          --cron "33 14 * * 4"
          --cron "20 13 * * 5"

  fetch-export-sales:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests==2.34.2

      - name: Test the staleness rule this run depends on
        run: python scripts/fetch_export_sales.py --selftest

      - name: Fetch USDA FAS Export Sales
        env:
          FAS_API_KEY: ${{ secrets.FAS_API_KEY }}
        run: python scripts/fetch_export_sales.py

      - name: Commit data/export-sales.json
        run: |
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          git add data/export-sales.json
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "chore: update export sales $(date -u +%F)"
            for i in 1 2 3 4 5; do
              if git push; then echo "pushed on attempt $i"; exit 0; fi
              echo "push rejected (attempt $i) — resyncing onto latest main"
              cp data/export-sales.json "$RUNNER_TEMP/export-sales.json"
              git fetch origin main
              git reset --hard origin/main
              cp "$RUNNER_TEMP/export-sales.json" data/export-sales.json
              git add data/export-sales.json
              if git diff --staged --quiet; then echo "remote already current"; exit 0; fi
              git commit -m "chore: update export sales $(date -u +%F)"
              sleep $(( (RANDOM % 4) + 1 ))
            done
            echo "::error::could not push export sales after 5 attempts"
            exit 1
          fi
