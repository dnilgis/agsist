name: IndexNow Submit

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - '**.md'
      - 'sitemap*.xml'
      - 'robots.txt'
  schedule:
    # The full sitemap once a week, Mondays 14:33 UTC = 09:33 CT; pushes send only what they changed
    - cron: '33 14 * * 1'
  workflow_dispatch:
    inputs:
      urls:
        description: 'Comma-separated URLs (leave empty to submit full sitemap)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: indexnow-submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true   # read-only token (permissions: contents: read); lets a push fetch its "before" commit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: IndexNow selftest (offline)
        run: python scripts/test_indexnow_submit.py

      # A push sends only the pages it changed that a sitemap lists. The weekly
      # run and a manual run with no URLs send every sitemap (robots.txt), in
      # batches of at most 10,000. If the push's "before" commit can't be read,
      # the push sends nothing and the weekly run covers it.
      - name: Submit to IndexNow
        env:
          MANUAL_URLS: ${{ github.event.inputs.urls }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$MANUAL_URLS" ]; then
            # shellcheck disable=SC2086
            URLS=$(echo "$MANUAL_URLS" | tr ',' ' ')
            python scripts/indexnow_submit.py --urls $URLS
          elif [ "$EVENT" = "push" ]; then
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
               || ! git fetch --quiet --depth=1 origin "$BEFORE"; then
              echo "[info] no earlier commit to compare with; the weekly run sends everything"
              exit 0
            fi
            git diff --name-only --diff-filter=AM "$BEFORE" HEAD -- '*.html' > /tmp/changed.txt
            n=$(wc -l < /tmp/changed.txt)
            echo "[info] $n changed page file(s)"
            # A push that touches thousands of pages is a template or menu change
            # (the same words on every page), not new content: Bing's IndexNow
            # report showed 53,000 to 62,000 URLs a day on Oct 14 and 15, 2026,
            # most of them unchanged for a reader. The weekly full run covers those.
            if [ "$n" -gt 1500 ]; then
              echo "[info] over 1,500 pages changed in one push: left to the weekly full submission"
              exit 0
            fi
            # shellcheck disable=SC2046
            python scripts/indexnow_submit.py --changed $(cat /tmp/changed.txt)
          else
            python scripts/indexnow_submit.py
          fi
