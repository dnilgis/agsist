# WASDE watch: grade the report as it lands.

name: WASDE watch — grade the report as it lands

on:
  schedule:
    - cron: "*/5 16-17 9-12 * *"
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]
  workflow_dispatch:
    inputs:
      date:
        description: "Release date to process, YYYY-MM-DD. Blank = the one that just landed."
        default: ""
      dry_run:
        description: "Read and print, write nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: wasde-watch
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        run: |
          D=$(date -u +%-d); H=$(date -u +%-H); W=$(date -u +%u); GO=0
          if [ "${{ github.event_name }}" != "workflow_run" ]; then GO=1
          elif [ "$D" -ge 9 ] && [ "$D" -le 12 ] && [ "$H" -ge 16 ] && [ "$H" -le 17 ]; then GO=1; fi
          echo "UTC day $D hour $H weekday $W -> go=$GO"; echo "go=$GO" >> "$GITHUB_OUTPUT"

  grade:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pdftotext
        timeout-minutes: 5
        uses: ./.github/actions/pdftotext

      - name: Test the reader this run is about to use
        run: |
          python scripts/report_bands.py --selftest
          python scripts/fetch_wasde.py --selftest
          python scripts/read_wasde_pdf.py --selftest
          python scripts/build_whats_priced_in.py --selftest
          python scripts/usda_current.py --selftest
          python scripts/nowcast_direction.py --selftest
          node --test test/wpi-numbers-strip.test.mjs
          python scripts/usda_dates.py --selftest

      - name: Fetch the WASDE PDF
        id: pdf
        env:
          WASDE_DATE: ${{ inputs.date }}
          WASDE_DRY:  ${{ inputs.dry_run }}
        run: |
          args=()
          [ -n "${WASDE_DATE:-}" ] && args+=(--date "$WASDE_DATE")
          python scripts/read_wasde_pdf.py --fetch "${args[@]}"
          if [ "${WASDE_DRY:-false}" != "true" ] && [ -n "$(git status --porcelain -- data/wasde-pdf)" ]; then echo "new=1" >> "$GITHUB_OUTPUT"; fi

      - name: Read the print
        id: read
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
          WASDE_DATE: ${{ inputs.date }}
          WASDE_DRY:  ${{ inputs.dry_run }}
        run: |
          args=()
          [ -n "${WASDE_DATE:-}" ] && args+=(--date "$WASDE_DATE")
          [ "${WASDE_DRY:-false}" = "true" ] && args+=(--dry-run)
          python scripts/fetch_wasde.py "${args[@]}" | tee /tmp/wasde.log
          if grep -q "^wrote " /tmp/wasde.log; then echo "filled=1" >> $GITHUB_OUTPUT; fi

      - name: Rebuild the page's data
        if: steps.read.outputs.filled == '1'
        run: |
          python scripts/nowcast_direction.py --grade
          python scripts/build_analyst_scorecard.py
          python scripts/build_whats_priced_in.py
          python scripts/prerender_wpi_scorecard.py || true
          python scripts/bake_seo.py --page usda-calendar.html || true

      - name: Update the WASDE archive from ESMIS
        id: archive
        if: ${{ inputs.dry_run != true }}
        continue-on-error: true
        timeout-minutes: 8
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_SOFT: '1'
        run: |
          rc=0; python3 scripts/backfill_wasde.py --update-due || rc=$?
          if [ "$rc" -eq 3 ]; then exit 0; fi
          [ "$rc" -eq 0 ] || exit "$rc"
          python3 scripts/read_wasde_text.py --selftest > /dev/null
          python3 scripts/backfill_wasde.py --selftest > /dev/null
          python3 scripts/build_wasde_history.py --selftest > /dev/null
          if ! RAW_SOFT= bash scripts/pull_raw.sh history/wasde; then
            echo "::warning::WASDE archive: the saved archive could not be read; the next run tries again"; exit 0
          fi
          python3 scripts/backfill_wasde.py --esmis --pages 2
          python3 scripts/backfill_wasde.py --esmis-files --newest 3
          bash scripts/push_raw.sh "wasde archive update" history/wasde
          python3 scripts/build_wasde_history.py | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "$(git status --porcelain -- data/wasde-history)" ]; then echo "new=1" >> "$GITHUB_OUTPUT"; fi

      - name: Commit
        if: steps.read.outputs.filled == '1' || steps.pdf.outputs.new == '1' || steps.archive.outputs.new == '1'
        run: |
          set -e
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          git add data/analyst-estimates.json data/wpi-history.json data/wasde.json data/wasde-pdf data/nowcast-direction.json \
                  data/analyst-scorecard.json data/whats-priced-in.json \
                  cot.html index.html usda-calendar.html 2>/dev/null || true
          if [ -d data/wasde-history ]; then git add data/wasde-history; fi
          if git diff --staged --quiet; then echo "No change."; exit 0; fi
          git commit -m "wasde: graded the $(date -u +%Y-%m-%d) print"
          for i in 1 2 3 4 5; do
            if git push; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push race on attempt $i; rebasing..."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || { echo "Rebase failed."; exit 1; }
            sleep $((RANDOM % 4 + 2))
          done
          echo "Failed to push after 5 attempts."; exit 1

      - name: Say what happened
        if: always()
        run: |
          {
            echo "### WASDE watch"
            echo ""
            echo '```'
            cat /tmp/wasde.log 2>/dev/null || echo "the reader did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
