name: Build NASS Series

on:
  schedule:
    - cron: "45 12 16 * *"
  workflow_run:
    workflows: ["Tick 09"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    if: github.event.workflow_run.name != 'Tick 09' || contains(github.event.workflow_run.display_title, ' nass-series.yml ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow nass-series.yml --max-lag 360
          --cron "45 12 16 * *"

  build:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: nass-series
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data/nass/*.json
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: |
          python scripts/build_nass_series.py --selftest
          python scripts/build_nass_series.py
      - name: Commit if changed (race-tolerant)
        run: |
          set -e
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          DIR="data/nass"
          [ -d "$DIR" ] || { echo "No output dir; nothing to commit."; exit 0; }
          rm -rf /tmp/nass && cp -r "$DIR" /tmp/nass
          BR="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3 4 5; do
            git fetch origin "$BR"
            git reset --hard "origin/$BR"
            mkdir -p "$DIR" && cp -r /tmp/nass/. "$DIR"/
            git add "$DIR"
            if git diff --staged --quiet; then echo "No change."; exit 0; fi
            git commit -m "Update NASS series $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if git push origin "HEAD:$BR"; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push race on attempt $i; re-syncing to origin/$BR..."
            sleep $((RANDOM % 4 + 2))
          done
          echo "Failed to push after 5 attempts."; exit 1

      - name: State yield history to the raw branch
        continue-on-error: true
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_SOFT: '1'
        run: |
          bash scripts/pull_raw.sh history/nass-yield/manifest.json || true
          python scripts/backfill_nass_yield.py || { echo "::warning::state yield history not fetched"; exit 0; }
          if ls history/nass-yield/*.csv.gz >/dev/null 2>&1; then
            bash scripts/push_raw.sh "nass yield history" history/nass-yield
          fi
