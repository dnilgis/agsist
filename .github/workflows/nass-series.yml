name: Build NASS Series

on:
  push:
    paths:
      - "scripts/build_nass_series.py"
  schedule:
    - cron: "45 12 16 * *"   # monthly, 16th 12:45 UTC — annual yields/acres + monthly price-received revisions
  # GitHub's scheduler drops scheduled fires (it never started land-data.yml on Nov 3, 2026;
  # scripts/cron_gate.py has the numbers). So this also runs after every "Fetch Grain Bids"
  # (cron-job.org, every 15 minutes), and the gate job lets the first run after each tick of the
  # cron above, by either trigger, do the work within 360 minutes
  # (six hours, the same day and well before the next tick).
  # Every other run skips in seconds. A chained run takes the scheduled path. A run by hand or
  # a push does not use up the tick (cron_gate.py MANUAL_DOES_NOT_SERVE): it may take narrower
  # inputs, and the chained run that follows is the same idempotent job.
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One run per tick of the schedule (see on: above). Sparse: the skip costs seconds.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow nass-series.yml --max-lag 360
          --cron "45 12 16 * *"

  build:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: nass-series
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data/nass/*.json
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: |
          python scripts/build_nass_series.py --selftest
          python scripts/build_nass_series.py
      - name: Commit if changed (race-tolerant)
        run: |
          set -e
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          DIR="data/nass"
          [ -d "$DIR" ] || { echo "No output dir; nothing to commit."; exit 0; }
          rm -rf /tmp/nass && cp -r "$DIR" /tmp/nass
          BR="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3 4 5; do
            git fetch origin "$BR"
            git reset --hard "origin/$BR"
            mkdir -p "$DIR" && cp -r /tmp/nass/. "$DIR"/
            git add "$DIR"
            if git diff --staged --quiet; then echo "No change."; exit 0; fi
            git commit -m "Update NASS series $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if git push origin "HEAD:$BR"; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push race on attempt $i; re-syncing to origin/$BR..."
            sleep $((RANDOM % 4 + 2))
          done
          echo "Failed to push after 5 attempts."; exit 1

      # Oct 29 (god's-eye bet 5): final state yields, corn and soybeans, every year Quick Stats
      # has, to the private raw branch at history/nass-yield/ for the re-test engine's
      # ratings-to-yield specs (scripts/backfill_nass_yield.py: about four calls; the first
      # pull is history-backfill.yml source=nass-yield). The 16th of each month catches
      # January's final yields with no new schedule. After the commit, and it never fails the run.
      - name: State yield history to the raw branch
        continue-on-error: true
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_SOFT: '1'
        run: |
          bash scripts/pull_raw.sh history/nass-yield/manifest.json || true
          python scripts/backfill_nass_yield.py || { echo "::warning::state yield history not fetched"; exit 0; }
          if ls history/nass-yield/*.csv.gz >/dev/null 2>&1; then
            bash scripts/push_raw.sh "nass yield history" history/nass-yield
          fi
