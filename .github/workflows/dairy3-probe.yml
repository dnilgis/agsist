name: dairy3 probe

# Temporary, fx/dairy3 only (removed before the PR): saves what FSA, the archive
# and NASS return as a run artifact. Commits nothing, sends nothing.
on:
  push:
    branches: [fx/dairy3]
    paths: ['.github/dairy3-probe/**', '.github/workflows/dairy3-probe.yml']

permissions:
  contents: read

# run 2: the artifact cannot be read from where the work is done, so the files go
# to the raw branch (never deployed) like the dairy probe's

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - name: pdftotext
        timeout-minutes: 5
        continue-on-error: true
        uses: ./.github/actions/pdftotext
      - name: Probe
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: python3 .github/dairy3-probe/probe.py
      - name: Save to the raw branch
        if: ${{ !cancelled() }}
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_SOFT: '1'
        run: |
          mkdir -p data/dairy-raw/dairy3/run3 && cp -r out/. data/dairy-raw/dairy3/run3/
          bash scripts/push_raw.sh "dairy3 probe run 3: archive copies of FSA mpp_prices.pdf" data/dairy-raw/dairy3/run3
