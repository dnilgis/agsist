name: Stats ingest (GA4 + Search Console + Bing, private)

on:
  schedule:
    - cron: '47 12 * * *'
  workflow_run:
    workflows: ["Fetch Grain Bids", "Tick 09"]
    types: [completed]
  workflow_dispatch:
    inputs:
      days:
        description: "Days to pull (1 to 500; 480 backfills about 16 months)"
        type: string
        default: "4"

permissions:
  contents: read

jobs:
  gate:
    if: (github.event.workflow_run.name != 'Fetch Grain Bids' || vars.CLOCK_LIVE != '1') && (github.event.workflow_run.name != 'Tick 09' || (contains(github.event.workflow_run.display_title, ' stats-ingest.yml ') && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow stats-ingest.yml --max-lag 360
          --cron "47 12 * * *"

  ingest:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: stats-ingest
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install google-auth (pinned)
        run: pip install --disable-pip-version-check 'google-auth==2.40.3' 'requests==2.32.3'

      - name: Selftest (offline, fake transports)
        run: python3 scripts/stats_ingest.py --selftest

      - name: Pull
        env:
          DAYS: ${{ inputs.days || '4' }}
          GA4_PROPERTY_ID:          ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT:      ${{ secrets.GA4_SERVICE_ACCOUNT }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE:                 ${{ vars.GSC_SITE }}
          BING_API_KEY1:            ${{ secrets.BING_API_KEY1 }}
          BING_API_KEY:             ${{ secrets.BING_API_KEY }}
          LIST_URL:                 ${{ secrets.LIST_URL }}
          LIST_TOKEN:               ${{ secrets.LIST_TOKEN }}
        run: |
          case "$DAYS" in ''|*[!0-9]*) echo "::error::days is a number"; exit 1;; esac
          python3 scripts/stats_ingest.py --days "$DAYS"

      - name: Save (private repo, private-data branch)
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_BRANCH: private-data
          RAW_SOFT: '1'
        run: bash scripts/push_raw.sh "stats ingest" private/stats
