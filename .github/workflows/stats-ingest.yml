name: Stats ingest (GA4 + Search Console + Bing, private)

# Daily raw numbers for later joining on date + page (Sig, Oct 23 2026: "all
# available tracking reporting, full ingestion and correlation"). Pulls GA4
# pages, sources, landing pages with query strings (the ?from= pitch links),
# events, devices and geo; Search Console query x page and device x country;
# and the Bing Webmaster snapshot. Writes private/stats/ and saves it to the
# private repo's private-data branch with scripts/push_raw.sh. Nothing is
# committed here and the log prints counts only, because this repo and its
# Actions logs are public. Same secrets as site-usage.yml and bing-reports.yml.
#
# Daily 12:47 UTC, off the hour, refreshing the last 4 days (GA4 and Search
# Console fill in late). Run by hand with days up to 500 to backfill.

on:
  schedule:
    - cron: '47 12 * * *'
  # GitHub's scheduler drops scheduled fires (it never started land-data.yml on Nov 3, 2026;
  # scripts/cron_gate.py has the numbers). So this also runs after every "Fetch Grain Bids"
  # (cron-job.org, every 15 minutes), and the gate job lets the first run after each tick of the
  # cron above, by either trigger, do the work within 360 minutes
  # (six hours, the same day and well before the next tick).
  # Every other run skips in seconds. A chained run takes the scheduled path. A run by hand or
  # a push does not use up the tick (cron_gate.py MANUAL_DOES_NOT_SERVE): it may take narrower
  # inputs, and the chained run that follows is the same idempotent job.
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]
  workflow_dispatch:
    inputs:
      days:
        description: "Days to pull (1 to 500; 480 backfills about 16 months)"
        type: string
        default: "4"

permissions:
  contents: read

jobs:
  # One run per tick of the schedule (see on: above). Sparse: the skip costs seconds.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow stats-ingest.yml --max-lag 360
          --cron "47 12 * * *"

  ingest:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: stats-ingest
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install google-auth (pinned)
        run: pip install --disable-pip-version-check 'google-auth==2.40.3' 'requests==2.32.3'

      - name: Selftest (offline, fake transports)
        run: python3 scripts/stats_ingest.py --selftest

      - name: Pull
        env:
          DAYS: ${{ inputs.days || '4' }}
          GA4_PROPERTY_ID:          ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT:      ${{ secrets.GA4_SERVICE_ACCOUNT }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE:                 ${{ vars.GSC_SITE }}
          BING_API_KEY1:            ${{ secrets.BING_API_KEY1 }}
          BING_API_KEY:             ${{ secrets.BING_API_KEY }}
          LIST_URL:                 ${{ secrets.LIST_URL }}
          LIST_TOKEN:               ${{ secrets.LIST_TOKEN }}
        run: |
          case "$DAYS" in ''|*[!0-9]*) echo "::error::days is a number"; exit 1;; esac
          python3 scripts/stats_ingest.py --days "$DAYS"

      - name: Save (private repo, private-data branch)
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_BRANCH: private-data
          RAW_SOFT: '1'
        run: bash scripts/push_raw.sh "stats ingest" private/stats
