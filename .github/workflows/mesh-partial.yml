name: MESH partial — last 24h live layer
# MESH partial: last 24h live layer.

on:
  workflow_dispatch:
  schedule:
    - cron: '5 * * 3-9 *'
    - cron: '5 15,21 * 1,2,10,11,12 *'

concurrency:
  group: mesh-partial
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  partial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - name: Install deps
        run: pip install requests==2.34.2 numpy==2.5.4 xarray==2026.9.0 cfgrib==0.9.15.1 matplotlib==3.11.2 shapely==2.2.0 --quiet
      - name: Fetch rolling 24h MESH
        run: python3 scripts/fetch_mesh.py --partial
      - name: Fetch hour-by-hour MESH (storm replay)
        run: python3 scripts/fetch_mesh.py --hours || echo "::warning::hourly MESH run failed; hours.json left as it was"
      - name: Commit and push (rebase armor)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/hail/mesh/today-partial.json 2>/dev/null || true
          git add -A data/hail/mesh/hours.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: MESH last-24h partial [skip ci]"
          for i in 1 2 3; do
            git push origin main && exit 0
            git pull --rebase origin main || { git rebase --abort; cp data/hail/mesh/today-partial.json /tmp/mesh.json 2>/dev/null; cp data/hail/mesh/hours.json /tmp/mesh-hours.json 2>/dev/null; git reset --hard origin/main; cp /tmp/mesh.json data/hail/mesh/today-partial.json 2>/dev/null; cp /tmp/mesh-hours.json data/hail/mesh/hours.json 2>/dev/null; git add -A data/hail/mesh/today-partial.json 2>/dev/null; git add -A data/hail/mesh/hours.json 2>/dev/null; git commit -m "data: MESH last-24h partial [skip ci]" || true; }
          done
          exit 1
