name: preship

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'components/**'
  workflow_dispatch:
    inputs:
      base:
        description: 'git ref to compare against (default HEAD~1)'
        required: false
        default: 'HEAD~1'
      head:
        description: 'commit to check (default: main as it is); merge-when-green.yml passes the merge commit'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: preship
  cancel-in-progress: false

jobs:
  preship:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.head || '' }}
          fetch-depth: 2
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium
        run: |
          npm i -D playwright@1.47.0
          npx playwright install --with-deps chromium

      - name: Pick the baseline
        id: base
        env:
          IN_BASE: ${{ github.event.inputs.base }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          B="$IN_BASE"
          [ -z "$B" ] && B="$PUSH_BEFORE"
          if [ -z "$B" ] || [ "$B" = "0000000000000000000000000000000000000000" ]; then B="HEAD~1"; fi
          if ! printf '%s' "$B" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/~^-]*$'; then
            echo "::error::base must be a git ref or sha"; exit 1
          fi
          if [ "$B" != "HEAD~1" ] && ! git cat-file -e "$B^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$B" || B="HEAD~1"
          fi
          echo "baseline: $B"
          echo "ref=$B" >> "$GITHUB_OUTPUT"

      - name: Voice lint (warning only)
        continue-on-error: true
        run: |
          python3 scripts/site_voice_lint.py --selftest
          python3 scripts/site_voice_lint.py --check

      - name: Run preship
        env:
          BASE_REF: ${{ steps.base.outputs.ref }}
        run: |
          node scripts/preship.mjs \
            --git-base "$BASE_REF" \
            --budget 20 \
            --json preship-report.json

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preship-report
          path: preship-report.json
          if-no-files-found: ignore
