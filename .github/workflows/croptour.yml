
name: bake crop tour

on:
  push:
    branches: [main]
    paths:
      - "data/crop-tour.json"
      - "data/yield-nowcast.json"
      - "crop-tour.html"
  schedule:
    - cron: "20 9 * * *"
    - cron: "30 1 17-22 8 *"
  workflow_run:
    workflows: ["WASDE watch — grade the report as it lands"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upstream:
    if: github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.u.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/upstream-did-work/
          sparse-checkout-cone-mode: false
      - id: u
        uses: ./.github/actions/upstream-did-work

  gate:
    needs: upstream
    if: needs.upstream.outputs.go == '1' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_run'
        with:
          sparse-checkout: |
            scripts/usda_current.py
            data/wasde.json
            crop-tour.html
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        if: github.event_name == 'workflow_run'
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          EV: ${{ github.event_name }}
        run: |
          if [ "$EV" = "workflow_run" ]; then python3 scripts/usda_current.py --gate croptour >> "$GITHUB_OUTPUT"; else echo "go=1" >> "$GITHUB_OUTPUT"; fi

  bake:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: bake-crop-tour
      cancel-in-progress: false
    env:
      TZ: America/Chicago
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Timezone database
        run: python3 -m pip install --quiet tzdata==2026.5

      - name: Check bake_seo
        run: python3 scripts/dev/quiet.py selftest-bake-seo -- python3 scripts/bake_seo.py --selftest

      - name: Check the baker
        run: python3 scripts/dev/quiet.py selftest-croptour -- python3 scripts/build_croptour.py --selftest

      - name: Bake the page
        run: python3 scripts/dev/quiet.py croptour -- python3 scripts/build_croptour.py

      - name: Bake the head
        run: python3 scripts/dev/quiet.py bake-seo -- python3 scripts/bake_seo.py --page crop-tour.html

      - name: Verify the page matches the data
        run: python3 scripts/dev/quiet.py croptour-check -- python3 scripts/build_croptour.py --check

      - name: Commit if anything moved
        run: |
          git config user.name  "agsist-bot"
          git config user.email "bot@agsist.com"
          git add crop-tour.html
          git diff --cached --quiet && { echo "nothing to bake"; exit 0; }
          phase=$(python3 -c "import json,datetime,zoneinfo;d=json.load(open('data/crop-tour.json'));t=datetime.datetime.now(zoneinfo.ZoneInfo('America/Chicago')).date().isoformat();b=d['benchmarks']['tour'].get('corn');print('scored' if b is not None else ('before' if t<d['tour']['start'] else ('during' if t<=d['tour']['end'] else 'waiting')))")
          git commit -m "crop tour: rebaked ($phase)"
          pushed=0
          for n in 1 2 3 4 5; do
            if git push; then pushed=1; break; fi
            echo "Push race on attempt $n; rebasing..."
            git pull --rebase --autostash origin main || { echo "Rebase failed."; exit 1; }
            sleep $((RANDOM % 4 + 2))
          done
          [ "$pushed" = 1 ] || { echo "Failed to push after 5 attempts."; exit 1; }
