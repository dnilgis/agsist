name: lrp

# USDA RMA Livestock Risk Protection data for /lrp (scripts/fetch_lrp.py).
#
# Source: RMA's ADM livestock daily zips,
#   https://pubfs-rma.fpac.usda.gov/pub/References/adm_livestock/<RY>/<RY>_ADMLivestockLrp_Daily_<YYYYMMDD>.zip
# every day's LRP offers (coverage prices, rates, cost per cwt, expected ending
# values, per product, type, length and level) from July 1 2013, and every
# actual ending value.
#
# Two places, on purpose:
#   * the lrp-history branch (never deployed by Pages) holds the full history,
#     one file per sales day, about 130 MB once complete;
#   * main gets data/lrp/ (today's offers, the actual ending values, meta,
#     and bt.json from scripts/lrp_backtest.mjs), a few hundred KB, inside
#     data/'s budget, plus lrp.html with the record baked in
#     (scripts/bake_lrp.mjs).
#
# mode watch (every 15 minutes in RMA's posting window, see below): one look
#   at the open years' folder listings and a HEAD on the newest file, against
#   state.json on lrp-history; seconds when nothing is new. Logged in
#   watch-log.json there. When a file is new, the lrp job reads it (history
#   for those years only) and publishes.
# mode history: read every daily zip not yet in the history (the first run
#   reads about 7,000 files and may need two runs; it stops starting downloads
#   after `minutes` and the next run carries on), then publish.
# mode publish: rebuild data/lrp/ from the history only.
# mode report: HEAD the latest 60 offer files (and 20 old-year ones) and write
#   their Last-Modified times beside the listing's to probe/post-times.json on
#   lrp-history. Dispatch:
#     gh api -X POST repos/dnilgis/agsist/actions/workflows/lrp.yml/dispatches -f ref=main -F 'inputs[mode]=report'
# The first look at RMA's sources (the probe of 2026-10-15) is kept
# on the lrp-history branch under probe/; it is not run from here any more, so
# raw captures never land on main again.
#
# WHEN TO LOOK. RMA's folder listing (July 2025 to October 2026, 298 offer
# files) puts each day's offers up at 2:17 pm Central at the earliest, 86% by
# 2:30, 95% by 3:00, all by 4:29 (scripts/fetch_lrp.py has the details). The
# listing's clock does not move with the time of year, so it is a local clock;
# the 8:35 am files right after the 8:25 am sales close say Central.
# 19:00-23:59 UTC is 2:00-6:59 pm CDT and 1:00-5:59 pm CST: the whole spread
# either way. Tuesday to Saturday at 15:00 UTC one more look catches an
# evening posting and the 8:35 am CT ending values.
#
# THE CLOCK IS "Fetch Grain Bids", NOT GITHUB'S SCHEDULER: GitHub delivered
# 3-10% of this repository's fast cron fires (scripts/cron_gate.py), while
# cron-job.org starts Fetch Grain Bids every 15 minutes. This runs after each
# one. The gate job's `if` drops every run outside 15:00-15:19 and
# 19:00-23:59 UTC without starting a runner; inside, scripts/cron_gate.py lrp
# stops it on weekends and once today's offers are in data/lrp/today.json.
# The crons are a thin fallback for a day cron-job.org is down.
# Nothing here is read by Fetch Grain Bids, and pushes made with GITHUB_TOKEN
# start no workflows, so nothing loops.
#
# Cost: about 21 gate runs a day (most a few seconds, billed a minute each),
# 3-5 watch runs on a weekday, and one or two full runs (about 4 minutes) when
# RMA posts: roughly 1,000 runner minutes a month, free on a public repository.
on:
  schedule:
    - cron: '41 19-23 * * 1-5'
    - cron: '11 15 * * 2-6'
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: "watch (one look; read anything new), history (read new RMA files, then publish), publish, or report (posting times)"
        type: choice
        options: [watch, history, publish, report]
        default: watch
      years:
        description: "Reinsurance years to read, e.g. 2014-2018 (blank = all)"
        required: false
        default: ""
      minutes:
        description: "Stop starting downloads after this many minutes"
        required: false
        default: "300"

permissions:
  contents: write

jobs:
  gate:
    # No runner at all for a Fetch Grain Bids run outside the two windows.
    if: >-
      github.event_name == 'schedule' || (github.event_name == 'workflow_run' && (
        contains(github.event.workflow_run.created_at, 'T15:0') ||
        contains(github.event.workflow_run.created_at, 'T15:1') ||
        contains(github.event.workflow_run.created_at, 'T19:') ||
        contains(github.event.workflow_run.created_at, 'T20:') ||
        contains(github.event.workflow_run.created_at, 'T21:') ||
        contains(github.event.workflow_run.created_at, 'T22:') ||
        contains(github.event.workflow_run.created_at, 'T23:')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      go: ${{ steps.gate.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            data/lrp/today.json
          sparse-checkout-cone-mode: false
      - id: gate
        run: python3 scripts/cron_gate.py lrp --lrp-file data/lrp/today.json

  watch:
    needs: gate
    if: >-
      !cancelled() && (needs.gate.outputs.go == '1' ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'watch' || inputs.mode == 'report')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: lrp
      cancel-in-progress: false
    outputs:
      new: ${{ steps.look.outputs.new }}
      years: ${{ steps.look.outputs.years }}
    env:
      PYTHONUNBUFFERED: "1"
      IN_MODE: ${{ inputs.mode || 'watch' }}
      HIST: ${{ github.workspace }}/../lrp-history
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/fetch_lrp.py
            test/fixtures/lrp/
          sparse-checkout-cone-mode: false

      - name: Selftest
        run: python3 scripts/fetch_lrp.py --selftest > /dev/null

      # Only state.json and the logs: no offers are downloaded for a look.
      - name: Check out the history state
        run: |
          git config --global user.name "agsist-probe"
          git config --global user.email "bot@agsist.com"
          git fetch -q --depth 1 --filter=blob:none origin lrp-history || { echo "::error::the lrp-history branch is missing"; exit 1; }
          git worktree add -q --no-checkout -B lrp-history "$HIST" FETCH_HEAD
          cd "$HIST"
          git sparse-checkout set --no-cone /state.json /watch-log.json /probe/post-times.json
          git checkout -q lrp-history

      - name: Look at RMA
        id: look
        run: |
          if [ "$IN_MODE" = "report" ]; then python3 scripts/fetch_lrp.py --post-times "$HIST"
          else python3 scripts/fetch_lrp.py --watch "$HIST"; fi

      # The log is a measurement: a failed push is a warning, never a stop.
      - name: Commit the log to lrp-history
        if: ${{ !cancelled() }}
        run: |
          cd "$HIST"
          git add -A
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "lrp $IN_MODE $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do
            if git push -q origin HEAD:lrp-history; then exit 0; fi
            sleep $((10 * i))
          done
          echo "::warning::could not push the watch log to lrp-history"

  lrp:
    needs: watch
    # A manual history or publish run, or a look that found a new file (then
    # history for the open years only, with a short time limit).
    if: >-
      !cancelled() && (needs.watch.outputs.new == '1' ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'history' || inputs.mode == 'publish')))
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: lrp
      cancel-in-progress: false
    env:
      PYTHONUNBUFFERED: "1"
      IN_MODE: ${{ (inputs.mode == 'publish' && 'publish') || 'history' }}
      IN_YEARS: ${{ inputs.years || needs.watch.outputs.years }}
      IN_MINUTES: ${{ inputs.minutes || '30' }}
      # outside the checkout, so the size budget never counts it
      HIST: ${{ github.workspace }}/../lrp-history
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Selftest
        run: |
          git config --global user.name "agsist-probe"
          git config --global user.email "bot@agsist.com"
          python scripts/fetch_lrp.py --selftest
          node --test test/lrp-backtest.test.mjs

      - name: Check the inputs
        run: |
          if [ -n "$IN_YEARS" ] && ! printf '%s' "$IN_YEARS" | grep -Eq '^[0-9]{4}(-[0-9]{4})?$'; then
            echo "::error::years must look like 2014 or 2014-2018"; exit 1; fi
          printf '%s' "$IN_MINUTES" | grep -Eq '^[0-9]+$' || { echo "::error::minutes must be a number"; exit 1; }

      - name: Check out the history branch
        run: |
          git fetch -q --depth 1 origin lrp-history || { echo "::error::the lrp-history branch is missing; push it first"; exit 1; }
          git worktree add -q -B lrp-history "$HIST" FETCH_HEAD

      # continue-on-error: whatever was read is committed below even if a
      # file fails a check; the last step then fails the run and says where.
      - name: Read new RMA files into the history
        id: history
        if: ${{ env.IN_MODE == 'history' }}
        continue-on-error: true
        timeout-minutes: 330
        run: |
          set -o pipefail
          python scripts/fetch_lrp.py --history "$HIST" --years "$IN_YEARS" --minutes "$IN_MINUTES" 2>&1 | tee lrp-history.log

      - name: Commit the history to lrp-history
        if: ${{ env.IN_MODE == 'history' }}
        run: |
          cd "$HIST"
          git add -A
          if git diff --cached --quiet; then echo "history: no change"; exit 0; fi
          N=$(git diff --cached --name-only | grep -c '^offers/' || true)
          git commit -q -m "lrp history $(date -u +%Y-%m-%dT%H:%M:%SZ): $N offer days"
          for i in 1 2 3; do
            if git push -q origin HEAD:lrp-history; then exit 0; fi
            sleep $((15 * i))
          done
          echo "::error::could not push lrp-history (only this workflow writes it; was it changed by hand?)"; exit 1

      - name: Publish data/lrp
        run: |
          python scripts/fetch_lrp.py --publish "$HIST" --out data/lrp
          node scripts/lrp_backtest.mjs --history "$HIST" --out data/lrp/bt.json
          node scripts/bake_lrp.mjs
          python scripts/check_site_budget.py

      - name: Commit to main
        run: |
          set -e
          P=data/lrp; MSG="data: lrp"
          [ -d "$P" ] || { echo "nothing written"; exit 0; }
          rm -rf /tmp/lrpout && mkdir -p /tmp/lrpout && cp -r "$P" /tmp/lrpout/out
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            rm -rf "$P" && mkdir -p "$(dirname "$P")" && cp -r /tmp/lrpout/out "$P"
            # /lrp carries the record baked in (scripts/bake_lrp.mjs), so it moves with the data
            node scripts/bake_lrp.mjs
            git add -A "$P" lrp.html
            if git diff --cached --quiet; then echo "no change"; exit 0; fi
            git commit -q -m "$MSG $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if git push -q origin HEAD:main; then exit 0; fi
            sleep $((15 * i))
          done
          echo "push failed after 5 attempts"; exit 1

      - name: Say if the history run failed
        if: ${{ steps.history.outcome == 'failure' }}
        run: |
          grep -E "CHECK FAILED|FAILED|UNREADABLE|Traceback|Error|did not answer|listing failed" lrp-history.log | head -40 || true
          tail -30 lrp-history.log || true
          echo "The same is in state.json on lrp-history: stats.stopped_on, stats.file_errors, stats.crashed."
          echo "::error::The history run failed; what was read before it is committed. See the step log."
          exit 1
