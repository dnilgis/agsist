name: lrp

on:
  schedule:
    - cron: '41 19-23 * * 1-5'
    - cron: '11 15 * * 2-6'
  workflow_run:
    workflows: ["Tick 03"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: "watch (one look; read anything new), history (read new RMA files, then publish), publish, or report (posting times)"
        type: choice
        options: [watch, history, publish, report]
        default: watch
      years:
        description: "Reinsurance years to read, e.g. 2014-2018 (blank = all)"
        required: false
        default: ""
      minutes:
        description: "Stop starting downloads after this many minutes"
        required: false
        default: "300"

permissions:
  contents: write

jobs:
  gate:
    if: >-
      (github.event.workflow_run.name != 'Tick 03' || contains(github.event.workflow_run.display_title, ' lrp.yml ')) && (
      github.event_name == 'schedule' || (github.event_name == 'workflow_run' && (
        contains(github.event.workflow_run.created_at, 'T15:0') ||
        contains(github.event.workflow_run.created_at, 'T15:1') ||
        contains(github.event.workflow_run.created_at, 'T19:') ||
        contains(github.event.workflow_run.created_at, 'T20:') ||
        contains(github.event.workflow_run.created_at, 'T21:') ||
        contains(github.event.workflow_run.created_at, 'T22:') ||
        contains(github.event.workflow_run.created_at, 'T23:'))))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      go: ${{ steps.gate.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            data/lrp/today.json
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: gate
        run: python3 scripts/cron_gate.py lrp --lrp-file data/lrp/today.json

  watch:
    needs: gate
    if: >-
      !cancelled() && (needs.gate.outputs.go == '1' ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'watch' || inputs.mode == 'report')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: lrp
      cancel-in-progress: false
    outputs:
      new: ${{ steps.look.outputs.new }}
      years: ${{ steps.look.outputs.years }}
    env:
      PYTHONUNBUFFERED: "1"
      IN_MODE: ${{ inputs.mode || 'watch' }}
      HIST: ${{ github.workspace }}/../lrp-history
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/fetch_lrp.py
            test/fixtures/lrp/
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - name: Selftest
        run: python3 scripts/fetch_lrp.py --selftest > /dev/null

      - name: Check out the history state
        run: |
          git config --global user.name "agsist-probe"
          git config --global user.email "bot@agsist.com"
          git fetch -q --depth 1 --filter=blob:none origin lrp-history || { echo "::error::the lrp-history branch is missing"; exit 1; }
          git worktree add -q --no-checkout -B lrp-history "$HIST" FETCH_HEAD
          cd "$HIST"
          git sparse-checkout set --no-cone /state.json /watch-log.json /probe/post-times.json
          git checkout -q lrp-history

      - name: Look at RMA
        id: look
        run: |
          if [ "$IN_MODE" = "report" ]; then python3 scripts/fetch_lrp.py --post-times "$HIST"
          else python3 scripts/fetch_lrp.py --watch "$HIST"; fi

      - name: Commit the log to lrp-history
        if: ${{ !cancelled() }}
        run: |
          cd "$HIST"
          git add -A
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "lrp $IN_MODE $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do
            if git push -q origin HEAD:lrp-history; then exit 0; fi
            sleep $((10 * i))
          done
          echo "::warning::could not push the watch log to lrp-history"

  lrp:
    needs: watch
    if: >-
      !cancelled() && (needs.watch.outputs.new == '1' ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'history' || inputs.mode == 'publish')))
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: lrp
      cancel-in-progress: false
    env:
      PYTHONUNBUFFERED: "1"
      IN_MODE: ${{ (inputs.mode == 'publish' && 'publish') || 'history' }}
      IN_YEARS: ${{ inputs.years || needs.watch.outputs.years }}
      IN_MINUTES: ${{ inputs.minutes || '30' }}
      HIST: ${{ github.workspace }}/../lrp-history
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Selftest
        run: |
          git config --global user.name "agsist-probe"
          git config --global user.email "bot@agsist.com"
          python scripts/fetch_lrp.py --selftest
          node --test test/lrp-backtest.test.mjs

      - name: Check the inputs
        run: |
          if [ -n "$IN_YEARS" ] && ! printf '%s' "$IN_YEARS" | grep -Eq '^[0-9]{4}(-[0-9]{4})?$'; then
            echo "::error::years must look like 2014 or 2014-2018"; exit 1; fi
          printf '%s' "$IN_MINUTES" | grep -Eq '^[0-9]+$' || { echo "::error::minutes must be a number"; exit 1; }

      - name: Check out the history branch
        run: |
          git fetch -q --depth 1 origin lrp-history || { echo "::error::the lrp-history branch is missing; push it first"; exit 1; }
          git worktree add -q -B lrp-history "$HIST" FETCH_HEAD

      - name: Read new RMA files into the history
        id: history
        if: ${{ env.IN_MODE == 'history' }}
        continue-on-error: true
        timeout-minutes: 330
        run: |
          set -o pipefail
          python scripts/fetch_lrp.py --history "$HIST" --years "$IN_YEARS" --minutes "$IN_MINUTES" 2>&1 | tee lrp-history.log

      - name: Commit the history to lrp-history
        if: ${{ env.IN_MODE == 'history' }}
        run: |
          cd "$HIST"
          git add -A
          if git diff --cached --quiet; then echo "history: no change"; exit 0; fi
          N=$(git diff --cached --name-only | grep -c '^offers/' || true)
          git commit -q -m "lrp history $(date -u +%Y-%m-%dT%H:%M:%SZ): $N offer days"
          for i in 1 2 3; do
            if git push -q origin HEAD:lrp-history; then exit 0; fi
            sleep $((15 * i))
          done
          echo "::error::could not push lrp-history (only this workflow writes it; was it changed by hand?)"; exit 1

      - name: Publish data/lrp
        run: |
          python scripts/fetch_lrp.py --publish "$HIST" --out data/lrp
          node scripts/lrp_backtest.mjs --history "$HIST" --out data/lrp/bt.json
          python scripts/lrp_sob_loss.py --history "$HIST" --out data/lrp/sob-loss.json || echo "::warning::lrp_sob_loss.py failed; sob-loss.json not rebuilt"
          if [ -f lrp.html ]; then node scripts/bake_lrp.mjs || echo "::warning::bake_lrp.mjs failed"; fi
          python scripts/check_site_budget.py

      - name: Pillow for the share images
        continue-on-error: true
        run: pip install --quiet pillow==12.3.0

      - name: Commit to main
        run: |
          set -e
          P=data/lrp; MSG="data: lrp"
          [ -d "$P" ] || { echo "nothing written"; exit 0; }
          rm -rf /tmp/lrpout && mkdir -p /tmp/lrpout && cp -r "$P" /tmp/lrpout/out
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            rm -rf "$P" && mkdir -p "$(dirname "$P")" && cp -r /tmp/lrpout/out "$P"
            if [ -f lrp.html ]; then
              node scripts/bake_lrp.mjs || echo "::warning::bake_lrp.mjs failed; lrp.html not rebaked"
              python3 scripts/build_share_images.py --only lrp || echo "::warning::LRP share images not redrawn"
              git add lrp.html
              [ -f lrp/record.html ] && git add lrp/record.html
              git add img/og/lrp.jpg img/og/lrp-record.jpg 2>/dev/null || true
            fi
            git add -A "$P"
            if git diff --cached --quiet; then echo "no change"; exit 0; fi
            git commit -q -m "$MSG $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if git push -q origin HEAD:main; then exit 0; fi
            sleep $((15 * i))
          done
          echo "push failed after 5 attempts"; exit 1

      - name: Say if the history run failed
        if: ${{ steps.history.outcome == 'failure' }}
        run: |
          grep -E "CHECK FAILED|FAILED|UNREADABLE|Traceback|Error|did not answer|listing failed" lrp-history.log | head -40 || true
          tail -30 lrp-history.log || true
          echo "The same is in state.json on lrp-history: stats.stopped_on, stats.file_errors, stats.crashed."
          echo "::error::The history run failed; what was read before it is committed. See the step log."
          exit 1
