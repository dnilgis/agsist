name: Bake farm-bill page
# Bake farm-bill page.

on:
  push:
    branches: [main]
    paths:
      - "**/farm-bill.json"
      - "**/build_farmbill.py"
      - ".github/workflows/farm-bill.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bake-farm-bill
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Locate files
        id: find
        run: |
          set -e
          SCRIPT=$(find . -name build_farmbill.py -not -path './.git/*' -not -path '*/node_modules/*' | head -1)
          JSON=$(find .   -name farm-bill.json   -not -path './.git/*' -not -path '*/node_modules/*' | head -1)
          HTML=$(find .   -name farm-bill.html   -not -path './.git/*' -not -path '*/node_modules/*' | head -1)
          if [ -z "$SCRIPT" ] || [ -z "$JSON" ] || [ -z "$HTML" ]; then
            echo "::error::Could not find all required files."
            echo "  build_farmbill.py = '$SCRIPT'"
            echo "  farm-bill.json    = '$JSON'"
            echo "  farm-bill.html    = '$HTML'"
            echo "Commit build_farmbill.py and farm-bill.json into the repo (any folder is fine)."
            exit 1
          fi
          echo "script=$SCRIPT" >> "$GITHUB_OUTPUT"
          echo "json=$JSON"     >> "$GITHUB_OUTPUT"
          echo "html=$HTML"     >> "$GITHUB_OUTPUT"
          echo "Found: script=$SCRIPT  json=$JSON  html=$HTML"

      - name: Bake static HTML from JSON
        run: |
          python3 "${{ steps.find.outputs.script }}" \
            --html "${{ steps.find.outputs.html }}" \
            --json "${{ steps.find.outputs.json }}"

      - name: Share image
        continue-on-error: true
        run: |
          pip install --quiet pillow==12.3.0
          python3 scripts/build_share_images.py --only farm-bill

      - name: Commit if changed
        run: |
          HTML="${{ steps.find.outputs.html }}"
          if [ -n "$(git status --porcelain "$HTML" img/og)" ]; then
            git config user.name  "agsist-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$HTML" img/og
            git commit -m "chore: bake farm-bill.html from farm-bill.json [skip ci]"
            pushed=0
            for n in 1 2 3 4 5; do
              if git push; then pushed=1; break; fi
              echo "Push race on attempt $n; rebasing..."
              git pull --rebase --autostash origin main || { echo "Rebase failed."; exit 1; }
              sleep $((RANDOM % 4 + 2))
            done
            [ "$pushed" = 1 ] || { echo "Failed to push after 5 attempts."; exit 1; }
          else
            echo "farm-bill.html already in sync — nothing to commit."
          fi
