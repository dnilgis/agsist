name: Feed manifest — every published number is accounted for

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'components/bids-*.js'
      - 'components/cash-bids.js'
      - '.github/workflows/**'
      - 'data/feeds.json'
  pull_request:
    paths: ['**.html', 'scripts/**', 'components/bids-*.js', 'components/cash-bids.js', 'data/feeds.json']
  schedule:
    - cron: '52 14 * * 2'
  workflow_dispatch:

concurrency:
  group: feeds-guard-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: America/Chicago

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The feed manifest is current and every claim in it has a source
        run: python3 scripts/test_feeds.py

      - name: The bid network merges correctly and cannot break the page
        run: node scripts/network-checks.mjs

      - name: The delivery filter hides nothing it cannot place
        run: node scripts/delivery-checks.mjs

      - name: The market clock matches CME's published grain hours
        run: node scripts/market-clock-checks.mjs

      - name: A broken bid network leaves the page exactly as it is today
        run: node scripts/network-safety-checks.mjs

      - name: Homepage bids card -- old crop and display town
        run: node scripts/homepage-bids-checks.mjs

      - name: Neither send loop can re-mail the whole list
        run: python3 scripts/test_send_loops.py

      - name: Basis history lands in a state a reader can ask for
        run: python3 scripts/test_basis_states.py
