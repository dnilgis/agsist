name: Rain Print Canada stations

# Rebuilds data/rain-print-ca/stations.json for Rain Print in Canada
# (components/rp-canada.js): the Canadian stations in NOAA's GHCN-Daily (ECCC
# climate stations and CoCoRaHS Canada gauges), how whole each year's record
# is, and each station's 1991-2020 monthly averages. Read from NOAA's public
# S3 copy (noaa-ghcn-pds). Monthly: a new year's letter appears after Jan 31.
# The page reads each year's days live from S3, so this list only ranks and
# names the stations; a stale list never changes a total.

on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 3 * *'   # the 3rd of each month
  # GitHub's scheduler drops scheduled fires (it never started land-data.yml on Nov 3, 2026;
  # scripts/cron_gate.py has the numbers). So this also runs after every "Fetch Grain Bids"
  # (cron-job.org, every 15 minutes), and the gate job lets the first run after each tick of the
  # cron above, by either trigger, do the work within 360 minutes
  # (six hours, the same day and well before the next tick).
  # Every other run skips in seconds. A chained run takes the scheduled path. A run by hand or
  # a push does not use up the tick (cron_gate.py MANUAL_DOES_NOT_SERVE): it may take narrower
  # inputs, and the chained run that follows is the same idempotent job.
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]

permissions:
  contents: write

jobs:
  # One run per tick of the schedule (see on: above). Sparse: the skip costs seconds.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow rp-canada-stations.yml --max-lag 360
          --cron "23 9 3 * *"

  build:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: rp-canada-stations
      cancel-in-progress: false
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Selftest
        run: python scripts/build_rp_canada.py --selftest
      - name: Build data/rain-print-ca/stations.json
        run: python scripts/build_rp_canada.py
      - name: Commit if changed (race-tolerant)
        run: |
          set -e
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          F="data/rain-print-ca/stations.json"
          rm -rf /tmp/rpca && mkdir -p /tmp/rpca && cp "$F" /tmp/rpca/
          BR="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3 4 5; do
            git fetch origin "$BR"
            git reset --hard "origin/$BR"
            cp /tmp/rpca/stations.json "$F"
            git add "$F"
            if git diff --staged --quiet; then echo "No change."; exit 0; fi
            git commit -m "Update Rain Print Canada stations $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            if git push origin "HEAD:$BR"; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push race on attempt $i; re-syncing to origin/$BR..."
            sleep $((RANDOM % 4 + 2))
          done
          echo "Failed to push after 5 attempts."; exit 1
