name: Rain Print Canada stations

on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 3 * *'
  workflow_run:
    workflows: ["Tick 07"]
    types: [completed]

permissions:
  contents: write

jobs:
  gate:
    if: github.event.workflow_run.name != 'Tick 07' || contains(github.event.workflow_run.display_title, ' rp-canada-stations.yml ')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow rp-canada-stations.yml --max-lag 360
          --cron "23 9 3 * *"

  build:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: rp-canada-stations
      cancel-in-progress: false
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Selftest
        run: python scripts/build_rp_canada.py --selftest
      - name: Build data/rain-print-ca/stations.json
        run: python scripts/build_rp_canada.py
      - name: Commit if changed (race-tolerant)
        run: |
          set -e
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          F="data/rain-print-ca/stations.json"
          rm -rf /tmp/rpca && mkdir -p /tmp/rpca && cp "$F" /tmp/rpca/
          BR="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3 4 5; do
            git fetch origin "$BR"
            git reset --hard "origin/$BR"
            cp /tmp/rpca/stations.json "$F"
            git add "$F"
            if git diff --staged --quiet; then echo "No change."; exit 0; fi
            git commit -m "Update Rain Print Canada stations $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            if git push origin "HEAD:$BR"; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push race on attempt $i; re-syncing to origin/$BR..."
            sleep $((RANDOM % 4 + 2))
          done
          echo "Failed to push after 5 attempts."; exit 1
