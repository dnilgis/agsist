name: Nebraska licensed storage

# Reads one Nebraska Public Service Commission "Location Capacity Report" (every grain warehouse
# location the PSC licenses and the bushels each may store) into data/licensed-storage/NE.json and
# joins each location to the AGSIST elevator ids (scripts/fetch_ne_capacity.py). The Nebraska
# cash-bid town pages show a matched elevator's licensed bushels, and the state page the report's
# totals, on their next build (cash-bid-pages.yml reads the file).
#
# BY HAND ONLY. The PSC posts a new report now and then under a dated file name. A schedule needs
# Sig's OK first (STANDING-DECISIONS, Oct 21); until then:
#   1. add the new PDF to references/sources.json as ne-psc-capacity-<yyyy-mm-dd>
#      (kind pdf, the psc.nebraska.gov URL), merged to main;
#   2. run this workflow with that id.
# The run refuses to write anything when the report does not add up: every location line must
# parse, the count must equal the report's "N LOCATIONS", the bushels its "TOTAL CAPACITY", and
# each licence's rows the subtotal printed on its last row.
on:
  workflow_dispatch:
    inputs:
      id:
        description: "Source id from references/sources.json, e.g. ne-psc-capacity-2026-10-28"
        required: true

permissions:
  contents: write

concurrency:
  group: ne-capacity
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IN_ID: ${{ inputs.id }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - name: Install poppler (pdftotext)
        timeout-minutes: 5
        uses: ./.github/actions/pdftotext

      - name: Check the input
        run: |
          printf '%s\n' "$IN_ID" | grep -Eq '^ne-psc-capacity-[0-9]{4}-[0-9]{2}-[0-9]{2}$' \
            || { echo "::error::id must look like ne-psc-capacity-2026-10-28"; exit 1; }

      - name: Selftest
        run: python3 scripts/fetch_ne_capacity.py --selftest

      - name: Fetch the report
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/refs"
          python3 scripts/fetch_refs.py --out "$RUNNER_TEMP/refs" --ids "$IN_ID"
          test -s "$RUNNER_TEMP/refs/refs/$IN_ID.txt" || { echo "::error::$IN_ID was not fetched (see the summary above)"; exit 1; }

      - name: Read, reconcile and join
        run: |
          python3 scripts/fetch_ne_capacity.py --txt "$RUNNER_TEMP/refs/refs/$IN_ID.txt" --ref "$IN_ID"
          python3 scripts/fetch_ne_capacity.py --check

      - name: Commit if changed
        run: |
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          git add data/licensed-storage/NE.json
          if git diff --staged --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: Nebraska licensed storage, $IN_ID"
          for i in 1 2 3 4; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase --autostash origin main && git push; then exit 0; fi
            sleep $((30 * i))
          done
          echo "::error::push failed after 4 attempts"; exit 1
