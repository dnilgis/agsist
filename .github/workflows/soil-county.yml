name: Soil by county

# Every county's NCCPI and prime farmland share from the USDA soil survey (SSURGO, Soil Data Access), once a month:
# data/soil/county-nccpi.json, data/soil/spread/<ST>.json and data/soil/manifest.json (scripts/soil_county.py).
# A state SDA does not answer keeps its last good rows; most states failing writes nothing.
# Run by hand for now: a monthly schedule is the owner's call (test/history-collect.test.mjs).

on:
  workflow_dispatch:
    inputs:
      states:
        description: "Only these states, e.g. IA,IL (empty: all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: soil-county
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      IN_STATES: ${{ inputs.states }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the input
        run: |
          printf '%s\n' "$IN_STATES" | grep -Eq '^([A-Z]{2}(,[A-Z]{2})*)?$' \
            || { echo "::error::states must look like IA,IL"; exit 1; }

      - name: Selftest
        run: python3 scripts/soil_county.py --selftest

      - name: Ask Soil Data Access
        timeout-minutes: 100
        run: |
          if [ -n "$IN_STATES" ]; then python3 scripts/soil_county.py --states "$IN_STATES"; else python3 scripts/soil_county.py; fi
          python3 scripts/soil_county.py --check

      - name: Commit if changed
        run: |
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          git add data/soil
          if git diff --staged --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: soil by county (USDA SSURGO)"
          for i in 1 2 3 4; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase --autostash origin main && git push; then exit 0; fi
            sleep $((30 * i))
          done
          echo "::error::push failed after 4 attempts"; exit 1
