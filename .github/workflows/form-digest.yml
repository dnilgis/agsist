name: Site forms digest

on:
  schedule:
    - cron: '41 * * * *'
  workflow_run:
    workflows: ["Tick 01"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the counts; send and mark nothing"
        type: boolean
        default: false

concurrency:
  group: ${{ github.event.workflow_run.name == 'Tick 01' && !contains(github.event.workflow_run.display_title, ' form-digest.yml ') && format('form-digest-{0}', github.run_id) || 'form-digest' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    if: github.event.workflow_run.name != 'Tick 01' || contains(github.event.workflow_run.display_title, ' form-digest.yml ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checks (gate)
        run: |
          python3 scripts/form_digest.py --selftest
          node scripts/test_form_worker.mjs
      - name: Run
        env:
          LIST_URL: ${{ secrets.LIST_URL }}
          LIST_TOKEN: ${{ secrets.LIST_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER || secrets.GMAIL_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || secrets.GMAIL_APP_PASS }}
          FROM_ADDR: ${{ secrets.FROM_ADDR }}
          FROM_NAME: ${{ secrets.FROM_NAME }}
          FORMS_TO: ${{ secrets.FORMS_TO }}
          SPONSOR_TO: ${{ secrets.SPONSOR_TO }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
        run: python3 scripts/form_digest.py
