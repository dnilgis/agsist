name: Import subscribers to KV (one-time)

on:
  workflow_dispatch:

permissions: {}

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Import
        env:
          LIST_URL: ${{ secrets.LIST_URL }}
          LIST_TOKEN: ${{ secrets.LIST_TOKEN }}
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
        run: |
          if [ -z "$LIST_URL" ] || [ -z "$LIST_TOKEN" ] || [ -z "$RECIPIENTS" ]; then
            echo "FATAL: need LIST_URL, LIST_TOKEN, RECIPIENTS secrets set first"; exit 1
          fi
          RESP=$(printf '%s' "$RECIPIENTS" | curl -sS -X POST -H "Authorization: Bearer $LIST_TOKEN" --data-binary @- "$LIST_URL/import")
          printf '%s' "$RESP" | grep -q '"ok":true' || { echo "import FAILED"; exit 1; }
          echo "import ok"
