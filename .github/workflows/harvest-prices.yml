name: Harvest price tracker

on:
  workflow_dispatch:
  schedule:
    - cron: '47 21 * * 1-6'
  workflow_run:
    workflows: ["Fetch Grain Bids", "Tick 14"]
    types: [completed]

concurrency:
  group: ${{ ((github.event.workflow_run.name == 'Fetch Grain Bids' && vars.CLOCK_LIVE == '1') || (github.event.workflow_run.name == 'Tick 14' && !(contains(github.event.workflow_run.display_title, ' harvest-prices.yml ') && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.repository.full_name == github.repository))) && format('harvest-prices-{0}', github.run_id) || 'harvest-prices' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    if: (github.event.workflow_run.name != 'Fetch Grain Bids' || vars.CLOCK_LIVE != '1') && (github.event.workflow_run.name != 'Tick 14' || (contains(github.event.workflow_run.display_title, ' harvest-prices.yml ') && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow harvest-prices.yml --max-lag 120
          --cron "47 21 * * 1-6"

  track:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - name: Install yfinance
        run: pip install yfinance==1.7.0 --quiet

      - name: Selftest
        run: python3 scripts/fetch_harvest_prices.py --selftest

      - name: Update discovery prices
        run: python3 scripts/fetch_harvest_prices.py

      - name: Share image
        continue-on-error: true
        run: |
          pip install --quiet pillow==12.3.0
          python3 scripts/build_share_images.py --only harvest-price-tracker

      - name: Commit and push (rebase armor, 3 tries)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/harvest-prices.json harvest-price-tracker.html img/og/harvest-price-tracker.jpg
          if git diff --cached --quiet; then
            echo "no discovery activity — nothing to commit"
            exit 0
          fi
          git commit -m "data: harvest/projected price update [skip ci]"
          for i in 1 2 3; do
            if git push origin main; then exit 0; fi
            echo "push rejected (attempt $i) — rebasing"
            git pull --rebase origin main || { git rebase --abort; cp data/harvest-prices.json /tmp/hp.json; cp harvest-price-tracker.html /tmp/hp.html; git reset --hard origin/main; cp /tmp/hp.json data/harvest-prices.json; cp /tmp/hp.html harvest-price-tracker.html; git add data/harvest-prices.json harvest-price-tracker.html; git commit -m "data: harvest/projected price update [skip ci]" || true; }
          done
          exit 1
