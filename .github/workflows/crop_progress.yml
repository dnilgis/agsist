name: Fetch Crop Progress

on:
  schedule:
    # USDA NASS publishes Crop Progress Monday at 4:00pm ET, and in season it is
    # the headline number on the conditions page.
    #
    # Same fault as export sales: one cron a week and nothing behind it, so a
    # dropped Monday run showed last week's condition ratings for a further
    # seven days. And 21:30 UTC is ninety minutes after the release in EDT.
    #
    #   EDT (Mar-Nov)  release 20:00 UTC -> 20:17
    #   EST (Nov-Mar)  release 21:00 UTC -> 21:17
    # (2026-10-09: two or three minutes off the quarter hours, where GitHub's
    # queue is most crowded.)
    # 21:33 stays as the second attempt in both; Tuesday midday is the
    # catch-all. Each is a no-op when the data has not moved.
    # 2026-10-14: after a Monday federal holiday NASS releases on TUESDAY at
    # 4pm ET (Columbus Day: Oct 13, 2026). Nothing ran Tuesday afternoon, so
    # the site showed the week ending Oct 4 until the next Monday. The three
    # afternoon fires now run Monday and Tuesday, and Wednesday midday is the
    # catch-all for a holiday week.
    - cron: '17 20 * * 1,2'
    - cron: '17 21 * * 1,2'
    - cron: '33 21 * * 1,2'
    - cron: '33 12 * * 2,3'
  # Also after every "Fetch Grain Bids" (cron-job.org, every 15 minutes): GitHub
  # drops and delays the schedule above. The gate job below lets the first run
  # after each tick of the schedule do the work; see scripts/cron_gate.py.
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]
  workflow_dispatch:

# One run at a time, so a chained run and a late cron fire cannot both write.
concurrency:
  group: crop-progress
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow crop_progress.yml --max-lag 120
          --cron "17 20 * * 1,2"
          --cron "17 21 * * 1,2"
          --cron "33 21 * * 1,2"
          --cron "33 12 * * 2,3"

  fetch-crop-progress:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Selftest (5-year average, state rows)
        run: python scripts/fetch_crop_progress.py --selftest

      - name: Fetch USDA NASS Crop Progress
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: python scripts/fetch_crop_progress.py

      # Re-bake /conditions from the file just written: the title, summary,
      # first-screen week line, stats line, table caption and harvest table
      # all come from data/crop-progress.json and data/conditions/conditions.json.
      # Until 2026-10-15 only the freshness job did this, and the page showed
      # "Corn 54%, week ending Oct 4" over a table for Oct 11.
      # test/conditions-week.test.mjs holds every line to one week.
      - name: Re-bake conditions.html from the data
        run: |
          python scripts/bake_seo.py --selftest
          python scripts/seed_static.py --only conditions
          python scripts/bake_seo.py --page conditions.html

      # Share image (og:image) for the pages this data feeds: scripts/build_share_images.py.
      # Best effort: a share card must never block the data commit.
      - name: Share image
        continue-on-error: true
        run: |
          pip install --quiet pillow==12.3.0
          python3 scripts/build_share_images.py --only conditions

      - name: Commit data/crop-progress.json
        run: |
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          git add data/crop-progress.json conditions.html img/og/conditions.jpg
          git diff --staged --quiet || git commit -m "chore: update crop progress $(date +%F)"
          git pull --rebase origin main
          git push

      # Oct 21 (Sig, insight machine): every state's weekly progress and condition, all crops,
      # for last year, this year and next (fall-seeded winter wheat), to the private raw branch
      # at history/nass-progress/ (scripts/backfill_nass_progress.py --current; the full
      # backfill is history-backfill.yml source=nass). After the commit, and it can never
      # fail the run: the page data above has already shipped.
      - name: Crop progress history to the raw branch
        continue-on-error: true
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_SOFT: '1'
        run: |
          python scripts/backfill_nass_progress.py --current || { echo "::warning::crop progress history not fetched"; exit 0; }
          if ls history/nass-progress/weekly/*.json >/dev/null 2>&1; then
            bash scripts/push_raw.sh "crop progress history" history/nass-progress
          fi
