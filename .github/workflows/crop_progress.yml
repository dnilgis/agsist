name: Fetch Crop Progress

on:
  schedule:
    - cron: '17 20 * * 1,2'
    - cron: '17 21 * * 1,2'
    - cron: '33 21 * * 1,2'
    - cron: '33 12 * * 2,3'
  workflow_run:
    workflows: ["Fetch Grain Bids", "Tick 13"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: ${{ ((github.event.workflow_run.name == 'Fetch Grain Bids' && vars.CLOCK_LIVE == '1') || (github.event.workflow_run.name == 'Tick 13' && !(contains(github.event.workflow_run.display_title, ' crop_progress.yml ') && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.repository.full_name == github.repository))) && format('crop-progress-{0}', github.run_id) || 'crop-progress' }}
  cancel-in-progress: false

jobs:
  gate:
    if: (github.event.workflow_run.name != 'Fetch Grain Bids' || vars.CLOCK_LIVE != '1') && (github.event.workflow_run.name != 'Tick 13' || (contains(github.event.workflow_run.display_title, ' crop_progress.yml ') && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow crop_progress.yml --max-lag 120
          --cron "17 20 * * 1,2"
          --cron "17 21 * * 1,2"
          --cron "33 21 * * 1,2"
          --cron "33 12 * * 2,3"

  fetch-crop-progress:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install poppler (pdftotext)
        continue-on-error: true
        timeout-minutes: 5
        uses: ./.github/actions/pdftotext

      - name: Selftest (5-year average, state rows)
        run: python scripts/fetch_crop_progress.py --selftest

      - name: Fetch USDA NASS Crop Progress
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: python scripts/fetch_crop_progress.py

      - name: Re-bake conditions.html from the data
        run: |
          python scripts/bake_seo.py --selftest
          python scripts/seed_static.py --only conditions
          python scripts/bake_seo.py --page conditions.html

      - name: Share image
        continue-on-error: true
        run: |
          pip install --quiet pillow==12.3.0
          python3 scripts/build_share_images.py --only conditions

      - name: Commit data/crop-progress.json
        run: |
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          git add data/crop-progress.json conditions.html img/og/conditions.jpg
          git diff --staged --quiet || git commit -m "chore: update crop progress $(date +%F)"
          pushed=0
          for n in 1 2 3 4 5; do
            if git push; then pushed=1; break; fi
            echo "Push race on attempt $n; rebasing..."
            git pull --rebase origin main || { echo "Rebase failed."; exit 1; }
            sleep $((RANDOM % 4 + 2))
          done
          [ "$pushed" = 1 ] || { echo "Failed to push after 5 attempts."; exit 1; }

      - name: Crop progress history to the raw branch
        continue-on-error: true
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_SOFT: '1'
        run: |
          python scripts/backfill_nass_progress.py --current || { echo "::warning::crop progress history not fetched"; exit 0; }
          if ls history/nass-progress/weekly/*.json >/dev/null 2>&1; then
            bash scripts/push_raw.sh "crop progress history" history/nass-progress
          fi
