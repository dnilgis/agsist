name: Fetch Crop Progress

on:
  schedule:
    # USDA NASS publishes Crop Progress Monday at 4:00pm ET, and in season it is
    # the headline number on the conditions page.
    #
    # Same fault as export sales: one cron a week and nothing behind it, so a
    # dropped Monday run showed last week's condition ratings for a further
    # seven days. And 21:30 UTC is ninety minutes after the release in EDT.
    #
    #   EDT (Mar-Nov)  release 20:00 UTC -> 20:17
    #   EST (Nov-Mar)  release 21:00 UTC -> 21:17
    # (2026-10-09: two or three minutes off the quarter hours, where GitHub's
    # queue is most crowded.)
    # 21:33 stays as the second attempt in both; Tuesday midday is the
    # catch-all. Each is a no-op when the data has not moved.
    - cron: '17 20 * * 1'
    - cron: '17 21 * * 1'
    - cron: '33 21 * * 1'
    - cron: '33 12 * * 2'
  # Also after every "Fetch Grain Bids" (cron-job.org, every 15 minutes): GitHub
  # drops and delays the schedule above. The gate job below lets the first run
  # after each tick of the schedule do the work; see scripts/cron_gate.py.
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]
  workflow_dispatch:

# One run at a time, so a chained run and a late cron fire cannot both write.
concurrency:
  group: crop-progress
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/cron_gate.py
          sparse-checkout-cone-mode: false
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow crop_progress.yml --max-lag 120
          --cron "17 20 * * 1"
          --cron "17 21 * * 1"
          --cron "33 21 * * 1"
          --cron "33 12 * * 2"

  fetch-crop-progress:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Selftest (5-year average, state rows)
        run: python scripts/fetch_crop_progress.py --selftest

      - name: Fetch USDA NASS Crop Progress
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: python scripts/fetch_crop_progress.py

      - name: Commit data/crop-progress.json
        run: |
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          git add data/crop-progress.json
          git diff --staged --quiet || git commit -m "chore: update crop progress $(date +%F)"
          git pull --rebase origin main
          git push
