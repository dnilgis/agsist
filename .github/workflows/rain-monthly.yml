name: Monthly county rain email
# Monthly county rain email.

# topic rain-month:<fips>; scripts/send_rain_month.py). Sig approved the list,
# The 2nd, 14:41 UTC (morning in Central), the one schedule Sig approved.
on:
  schedule:
    - cron: "41 14 2 * *"
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry = render only; preview = Sig only; send = the list (needs RAIN_MONTHLY_LIVE=1)'
        type: choice
        options: [dry, preview, send]
        default: dry
      month:
        description: 'YYYY-MM for dry or preview (empty: the month just ended; a send is always that month)'
        required: false
        default: ''
      fips:
        description: 'Sample county FIPS for dry or preview, comma-separated (empty: 55005,19169)'
        required: false
        default: ''
      fetch:
        description: 'Fetch the county rain data and rebuild the pages first'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow rain-monthly.yml --max-lag 360
          --cron "41 14 2 * *"

  fresh:
    needs: gate
    if: needs.gate.outputs.go == '1' && (github.event_name == 'schedule' || github.event_name == 'workflow_run' || inputs.fetch == true)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: county-rain
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Offline first
        run: |
          python scripts/fetch_county_rain.py --selftest
          python scripts/build_county_rain.py --selftest

      - name: Fetch
        id: fetch
        continue-on-error: true
        timeout-minutes: 45
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          python scripts/fetch_county_rain.py 2>&1 | tee county-rain.log

      - name: Share image
        continue-on-error: true
        run: |
          pip install --quiet pillow==12.3.0
          python3 scripts/build_share_images.py --only rain

      - name: Check the data, build the pages, check the budget
        run: |
          python scripts/fetch_county_rain.py --check
          python scripts/build_county_rain.py
          python scripts/build_county_rain.py --check
          python scripts/build_place_pct.py
          python scripts/cross_links.py --selftest
          python scripts/cross_links.py --stamp
          python scripts/check_seo.py
          python scripts/check_site_budget.py

      - name: Newsletter block
        continue-on-error: true
        run: |
          python scripts/build_newsletter_block.py --selftest
          python scripts/build_newsletter_block.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/atlas/pct
          git add -A data/rain data/pointers rain rain.html sitemap-rain.xml img/og/rain.jpg img/og/rain-??.jpg img/og/rain-cards.json prf farmland-atlas arc-plc 2>/dev/null || true
          git add -A data/newsletter 2>/dev/null || true
          python scripts/generated_sets.py dependents rain --stage || true
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          N=$(ls data/rain/*.json 2>/dev/null | wc -l)
          git commit -q -m "data: county rain ($N states)"
          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            if python3 scripts/generated_sets.py pull-rebase rain --autostash && git push -q; then exit 0; fi
            sleep $((20 * i))
          done
          echo "push failed after 5 attempts"; exit 1

      - name: Say which state failed
        if: steps.fetch.outcome == 'failure'
        run: |
          grep -E "FAILED|refusing|time cap" county-rain.log || true
          echo "::warning::A county rain state failed or the run hit its time cap; those states kept their published files. See the Fetch step."

  email:
    needs: [gate, fresh]
    if: always() && needs.gate.outputs.go == '1' && (needs.fresh.result == 'success' || needs.fresh.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: rain-monthly-email
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the sender first
        run: |
          python scripts/rain_month.py --selftest
          python scripts/send_rain_month.py --selftest

      - name: Monthly county rain (${{ (github.event_name == 'schedule' || github.event_name == 'workflow_run') && 'scheduled' || inputs.mode }})
        env:
          LIST_URL: ${{ secrets.LIST_URL }}
          LIST_TOKEN: ${{ secrets.LIST_TOKEN }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER || secrets.GMAIL_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || secrets.GMAIL_APP_PASS }}
          FROM_ADDR: ${{ secrets.FROM_ADDR }}
          SIG_TO: ${{ secrets.SIG_TO }}
          SIG_TEST_EMAILS: ${{ secrets.SIG_TEST_EMAILS }}
          RAIN_MONTHLY_LIVE: ${{ vars.RAIN_MONTHLY_LIVE }}
          PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'preview' && '1' || '' }}
          SEND: ${{ (((github.event_name == 'schedule' || github.event_name == 'workflow_run') && vars.RAIN_MONTHLY_LIVE == '1') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'send' && vars.RAIN_MONTHLY_LIVE == '1')) && '1' || '' }}
          ASKED_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'send' && '1' || '' }}
          MONTH: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'send' && inputs.month || '' }}
          FIPS: ${{ github.event_name == 'workflow_dispatch' && inputs.fips || '' }}
        run: |
          if [ "$ASKED_SEND" = 1 ] && [ "$SEND" != 1 ]; then
            echo "::error::mode send, but the repo variable RAIN_MONTHLY_LIVE is not 1: the list gets nothing. Nothing sent."
            exit 1
          fi
          ARGS=""
          if [ -n "$MONTH" ]; then ARGS="$ARGS --month $MONTH"; fi
          if [ -n "$FIPS" ]; then ARGS="$ARGS --fips $FIPS"; fi
          python3 scripts/send_rain_month.py $ARGS
