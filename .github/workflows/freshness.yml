name: Freshness — seed static prices, dateModified, sitemap lastmod

# Bakes the latest closes into the static HTML of the futures pages (so
# JS-blind AI crawlers see real numbers), stamps dateModified on the daily
# pages, and bumps sitemap <lastmod> — Google's recrawl signal.
#
# Runs after the market close and once pre-open on weekdays (fetch_prices.py
# has already written data/prices.json by then), plus on demand. Commits only
# when file contents actually changed.

on:
  schedule:
    - cron: '35 13 * * 1-5'   # 13:35 UTC — pre-open refresh (overnight session closes)
    - cron: '35 20 * * 1-5'   # 20:35 UTC — post-close (CBOT day session ends 19:20 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: freshness
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # pull whatever the 30-min prices workflow committed most recently
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Seed static content
        run: python scripts/seed_static.py

      # Titles and meta descriptions that carry a live answer instead of a
      # description of the tool. Selftest first: bake_seo refuses to write a
      # title it cannot fit, cannot source, or that carries a date already in
      # the past, and a page whose data is missing keeps what it has.
      - name: Bake answer-first titles
        run: |
          python scripts/bake_seo.py --selftest
          python scripts/bake_seo.py

      # FAQ structured data, regenerated from the visible FAQ. Six pages had
      # told Google they answered questions that appear nowhere on them --
      # /basis advertised "Is basis set by my local elevator?" while the page
      # asks "Is my elevator ripping me off?" -- because the markup was written
      # by hand once and the copy was edited afterwards.
      #
      # Must run AFTER anything that bakes live numbers into visible answers
      # (build_condyield, build_croptour), or it publishes one bake behind.
      # Here it is last, and cond-yield.yml runs it again at the end of its own
      # job so the markup is never stale between freshness runs.
      #
      # Selftest first: it refuses to write rather than publish an empty
      # question, template syntax, or an answer under 25 characters, and a page
      # with no visible FAQ is left alone rather than blanked.
      - name: Bake FAQ structured data
        run: |
          python scripts/bake_faq.py --selftest
          python scripts/bake_faq.py

      - name: Commit if changed
        run: |
          git config user.name  "agsist-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes — nothing to commit."
          else
            git add -A
            git commit -m "freshness: seed static prices, answer-first titles, dateModified, sitemap lastmod"
            git pull --rebase origin main
            git push
          fi
