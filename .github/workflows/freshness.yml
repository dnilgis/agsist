name: Freshness — seed static prices, dateModified, sitemap lastmod

on:
  schedule:
    - cron: '35 13 * * 1-5'
    - cron: '35 20 * * 1-5'
    - cron: '50 4 * * 2-6'
    - cron: '50 6 * * 2-6'
  workflow_run:
    workflows: ["Fetch Grain Bids", "Tick 10"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ ((github.event.workflow_run.name == 'Fetch Grain Bids' && vars.CLOCK_LIVE == '1') || (github.event.workflow_run.name == 'Tick 10' && !contains(github.event.workflow_run.display_title, ' freshness.yml '))) && format('freshness-{0}', github.run_id) || 'freshness' }}
  cancel-in-progress: false

jobs:
  gate:
    if: (github.event.workflow_run.name != 'Fetch Grain Bids' || vars.CLOCK_LIVE != '1') && (github.event.workflow_run.name != 'Tick 10' || contains(github.event.workflow_run.display_title, ' freshness.yml '))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow freshness.yml --max-lag 120
          --cron "35 13 * * 1-5"
          --cron "35 20 * * 1-5"
          --cron "50 4 * * 2-6"
          --cron "50 6 * * 2-6"

  seed:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Seed static content
        run: python scripts/seed_static.py

      - name: Bake answer-first titles
        run: |
          python scripts/bake_seo.py --selftest
          python scripts/bake_seo.py

      - name: Bake FAQ structured data
        run: |
          python scripts/bake_faq.py --selftest
          python scripts/bake_faq.py

      - name: Number consistency (report only)
        continue-on-error: true
        run: |
          python scripts/check_number_consistency.py --selftest
          python scripts/check_number_consistency.py

      - name: Commit if changed
        id: commit
        run: |
          git config user.name  "agsist-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes — nothing to commit."
            exit 0
          fi
          MSG="freshness: seed static prices, answer-first titles, dateModified, sitemap lastmod"
          git add -A
          git commit -q -m "$MSG"
          for i in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              git show --name-only --format= HEAD > /tmp/fresh-changed.txt
              echo "pushed=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push failed (attempt $i), baking again on the newest main"
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main
            git reset -q --hard origin/main
            python scripts/seed_static.py
            python scripts/bake_seo.py
            python scripts/bake_faq.py
            if git diff --quiet; then echo "nothing left to commit"; exit 0; fi
            git add -A
            git commit -q -m "$MSG"
            sleep $((i * 7))
          done
          exit 1

      - name: IndexNow ping for the pages this run changed (best-effort)
        if: steps.commit.outputs.pushed == '1'
        continue-on-error: true
        run: |
          files=$(grep -E '\.html$' /tmp/fresh-changed.txt || true)
          if [ -z "$files" ]; then echo "no page changed"; exit 0; fi
          python scripts/indexnow_submit.py --changed $files || echo "IndexNow ping failed - harmless"
