name: Cattle auction prices

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Probe only: save the AMS listing and raw auction reports to data/cattle-auction-raw/ on the raw branch"
        type: boolean
        default: false
      scan:
        description: "Probe only: also read the title of every AMS report number in these ranges (e.g. 1200-2300,3600-3700) to find barns the listing page will not give us"
        type: string
        default: ""
  schedule:
    - cron: '23 1 * * 2-6'
    - cron: '37 14 * * 1-5'
  workflow_run:
    workflows: ["Fetch Grain Bids", "Tick 05"]
    types: [completed]

permissions:
  contents: write

jobs:
  gate:
    if: (github.event.workflow_run.name != 'Fetch Grain Bids' || vars.CLOCK_LIVE != '1') && (github.event.workflow_run.name != 'Tick 05' || (contains(github.event.workflow_run.display_title, ' cattle-auction.yml ') && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow cattle-auction.yml --max-lag 360
          --cron "23 1 * * 2-6"
          --cron "37 14 * * 1-5"

  build:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: cattle-auction
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pypdf (fallback if pdftotext is missing)
        run: pip install pypdf==6.20.1
      - name: Selftest
        run: |
          python scripts/fetch_cattle_auction.py --selftest
          python scripts/fetch_cull_cows.py --selftest
          python scripts/build_feeder_index.py --selftest
      - name: Probe (raw source capture)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe }}
        env:
          SCAN: ${{ inputs.scan }}
        run: |
          if [ -n "$SCAN" ]; then
            python scripts/fetch_cattle_auction.py --probe --scan "$SCAN"
          else
            python scripts/fetch_cattle_auction.py --probe
          fi
      - name: Save the probe's raw files to the raw branch
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.probe }}
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_SOFT: '1'
        run: bash scripts/push_raw.sh "cattle-auction probe" data/cattle-auction-raw
      - name: Fetch and write data/cattle-auction.json and data/cull-cows.json
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) }}
        run: python scripts/fetch_cattle_auction.py
      - name: Build data/feeder-index.json
        if: ${{ !cancelled() && !(github.event_name == 'workflow_dispatch' && inputs.probe) }}
        continue-on-error: true
        env:
          MARS_API_KEY: ${{ secrets.MARS_API_KEY }}
        run: python scripts/build_feeder_index.py
      - name: Commit if changed (race-tolerant)
        run: |
          set -e
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          FILES="data/cattle-auction.json data/cull-cows.json data/cattle-auction-raw/listing.json data/feeder-index-store.json data/feeder-index.json"
          rm -rf /tmp/ca && mkdir -p /tmp/ca
          for f in $FILES; do
            [ -e "$f" ] && cp -r --parents "$f" /tmp/ca/ || true
          done
          [ -n "$(ls -A /tmp/ca)" ] || { echo "No output; nothing to commit."; exit 0; }
          BR="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3 4 5; do
            git fetch origin "$BR"
            git reset --hard "origin/$BR"
            mkdir -p data && cp -r /tmp/ca/data/. data/
            for f in $FILES; do [ -e "$f" ] && git add "$f" || true; done
            if git diff --staged --quiet; then echo "No change."; exit 0; fi
            git commit -m "Update cattle auction prices $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            if git push origin "HEAD:$BR"; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push race on attempt $i; re-syncing to origin/$BR..."
            sleep $((RANDOM % 4 + 2))
          done
          echo "Failed to push after 5 attempts."; exit 1

      - name: Barn receipts history to the raw branch
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) }}
        continue-on-error: true
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_SOFT: '1'
        run: |
          python scripts/history_append.py cattle || { echo "::warning::receipts history not written"; exit 0; }
          if [ -d history/cattle-auction ]; then
            bash scripts/push_raw.sh "cattle receipts history" history/cattle-auction
          fi
