name: fetch-wasde-pdf

on:
  workflow_dispatch:
    inputs:
      mmyy:
        description: "Report month and year, e.g. 1026 for October 2026"
        default: "1026"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: pdftotext
        timeout-minutes: 5
        uses: ./.github/actions/pdftotext
      - name: Download and read
        env:
          IN_MMYY: ${{ github.event.inputs.mmyy }}
        run: |
          set -u
          M="$IN_MMYY"
          if ! printf '%s' "$M" | grep -Eq '^[0-9]{4}$'; then echo "::error::mmyy must be 4 digits, e.g. 0925"; exit 1; fi
          mkdir -p data/wasde-pdf
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          ok=0
          for u in "https://www.usda.gov/oce/commodity/wasde/wasde$M.pdf" "https://www.usda.gov/sites/default/files/documents/wasde$M.pdf"; do
            code=$(curl -sSL -m 120 -A "$UA" -w '%{http_code}' -o /tmp/w.pdf "$u" || echo 000)
            echo "$u -> $code $(wc -c < /tmp/w.pdf)"
            if [ "$code" = "200" ] && head -c 4 /tmp/w.pdf | grep -q '%PDF'; then cp /tmp/w.pdf "data/wasde-pdf/wasde$M.pdf"; ok=1; break; fi
          done
          [ "$ok" = 1 ] || { echo "no PDF"; exit 0; }
          echo "saved data/wasde-pdf/wasde$M.pdf"
      - name: Commit
        run: |
          git config user.name "agsist-bot"; git config user.email "bot@agsist.com"
          git add data/wasde-pdf
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: WASDE PDF [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || { echo "Rebase failed."; exit 1; }
            if git push; then echo "Pushed on attempt $i."; exit 0; fi
            sleep 5
          done
          echo "Failed to push after 5 attempts."; exit 1
