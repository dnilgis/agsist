name: Fall nitrogen soil temperature

# Writes data/fall-nitrogen.json for /fall-nitrogen: measured soil temperature
# near 4 in from NOAA USCRN, USDA NRCS SCAN, the Iowa State Soil Moisture
# Network (IEM), the Kansas Mesonet and Wisconet (CC BY 4.0, credited on the
# page), read by scripts/fetch_fall_nitrogen.py.
# The page shows a designed empty state until this file exists.
#
# FIRST RUN: dispatch this once with "probe" ticked. It saves what each network
# returned to data/fall-nitrogen-raw/ (with summary.json saying what parsed) and
# saves it on the raw branch (never deployed), so the real formats can be checked against the parsers before a
# number is trusted. A network that fails its checks is left out; the others
# still write.

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Probe only: save raw network responses to data/fall-nitrogen-raw/ on the raw branch"
        type: boolean
        default: false
  schedule:
    - cron: '23 13 * 3-6,9-12 *'   # morning, Central: spring (planting soil temps, Sig Oct 29) and fall
    - cron: '47 22 * 3-6,9-12 *'   # evening refresh
  # GitHub's scheduler drops scheduled fires (it never started land-data.yml on Nov 3, 2026;
  # scripts/cron_gate.py has the numbers). So this also runs after every "Fetch Grain Bids"
  # (cron-job.org, every 15 minutes), and the gate job lets the first run after each tick of the
  # cron above, by either trigger, do the work within 360 minutes
  # (six hours, the same day and well before the next tick).
  # Every other run skips in seconds. A chained run takes the scheduled path. A run by hand or
  # a push does not use up the tick (cron_gate.py MANUAL_DOES_NOT_SERVE): it may take narrower
  # inputs, and the chained run that follows is the same idempotent job.
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]

permissions:
  contents: write

jobs:
  # One run per tick of the schedule (see on: above). Sparse: the skip costs seconds.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow fall-nitrogen.yml --max-lag 360
          --cron "23 13 * 3-6,9-12 *"
          --cron "47 22 * 3-6,9-12 *"

  build:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: fall-nitrogen
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Selftest
        run: python scripts/fetch_fall_nitrogen.py --selftest
      - name: Probe (raw source capture)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe }}
        run: python scripts/fetch_fall_nitrogen.py --probe
      # Raw captures go to the raw branch (never deployed), not main: scripts/push_raw.sh.
      # Runs even when the probe step failed part way, so what it did capture is kept.
      - name: Save the probe's raw files to the raw branch
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.probe }}
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_SOFT: '1'
        run: bash scripts/push_raw.sh "fall-nitrogen probe" data/fall-nitrogen-raw
      - name: Fetch and write data/fall-nitrogen.json
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) }}
        run: python scripts/fetch_fall_nitrogen.py
      # Not in probe mode: a probe writes no feed, and copying this run's
      # checkout of the page over a newer branch tip would undo later edits
      # (it did on Oct 28, fx/oct28adds).
      - name: Commit if changed (race-tolerant)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) }}
        run: |
          set -e
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          FILES="data/fall-nitrogen.json fall-nitrogen.html"
          rm -rf /tmp/fn && mkdir -p /tmp/fn
          for f in $FILES; do
            [ -e "$f" ] && cp -r --parents "$f" /tmp/fn/ || true
          done
          [ -n "$(ls -A /tmp/fn)" ] || { echo "No output; nothing to commit."; exit 0; }
          BR="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3 4 5; do
            git fetch origin "$BR"
            git reset --hard "origin/$BR"
            cp -r /tmp/fn/. .
            for f in $FILES; do [ -e "$f" ] && git add "$f" || true; done
            if git diff --staged --quiet; then echo "No change."; exit 0; fi
            git commit -m "Update fall nitrogen soil temperatures $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            if git push origin "HEAD:$BR"; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push race on attempt $i; re-syncing to origin/$BR..."
            sleep $((RANDOM % 4 + 2))
          done
          echo "Failed to push after 5 attempts."; exit 1
