name: Hail data refresh
# Hail data refresh.

on:
  schedule:
    - cron: '41 6 1 * *'      # 1st of each month, 07:00 UTC
  # cron above, by either trigger, do the work within 360 minutes
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow hail-data.yml --max-lag 360
          --cron "41 6 1 * *"

  refresh:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: hail-data
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch national hail LSRs
        run: python scripts/fetch_hail.py

      - name: Field Scout hail cells
        run: python scripts/build_field_scout_data.py

      - name: Commit updated hail data
        run: |
          git config user.name "agsist-bot"
          git config user.email "sig@agsist.com"
          git add data/hail data/field-scout
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: refresh national hail LSRs [skip ci]"
            git pull --rebase --autostash origin main || true
            git push
          fi
