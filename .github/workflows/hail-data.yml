name: Hail data refresh

on:
  schedule:
    - cron: '41 6 1 * *'
  workflow_run:
    workflows: ["Fetch Grain Bids", "Tick 05"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  gate:
    if: (github.event.workflow_run.name != 'Fetch Grain Bids' || vars.CLOCK_LIVE != '1') && (github.event.workflow_run.name != 'Tick 05' || contains(github.event.workflow_run.display_title, ' hail-data.yml '))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow hail-data.yml --max-lag 360
          --cron "41 6 1 * *"

  refresh:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: hail-data
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch national hail LSRs
        run: python scripts/fetch_hail.py

      - name: Field Scout hail cells
        run: python scripts/build_field_scout_data.py

      - name: Commit updated hail data
        run: |
          git config user.name "agsist-bot"
          git config user.email "sig@agsist.com"
          git add data/hail data/field-scout
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: refresh national hail LSRs [skip ci]"
            pushed=0
            for n in 1 2 3 4 5; do
              if git push; then pushed=1; break; fi
              echo "Push race on attempt $n; rebasing..."
              git pull --rebase --autostash origin main || { echo "Rebase failed."; exit 1; }
              sleep $((RANDOM % 4 + 2))
            done
            [ "$pushed" = 1 ] || { echo "Failed to push after 5 attempts."; exit 1; }
          fi
