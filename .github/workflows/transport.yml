name: transport

# Weekly AgTransport pull for /basis + /bushel-journey. AMS publishes the
# Grain Transportation Report Thursdays; Friday morning catches it settled.
# Selftest gates the fetch; fetch fails loud on any empty dataset.
# Then /grain-transport (scripts/fetch_grain_moves.py): barge, railcar, lock,
# late car, train speed, carload, inspection, ocean, vessel and river series,
# our weekly network basis and the freight-basis record. One source failing
# keeps its last good week and never blocks the basis files above.
on:
  schedule:
    - cron: '43 11 * * 5'   # Fridays ~06:43 CT
  # GitHub's scheduler drops scheduled fires (it never started land-data.yml on Nov 3, 2026;
  # scripts/cron_gate.py has the numbers). So this also runs after every "Fetch Grain Bids"
  # (cron-job.org, every 15 minutes), and the gate job lets the first run after each tick of the
  # cron above, by either trigger, do the work within 360 minutes
  # (six hours, the same day and well before the next tick).
  # Every other run skips in seconds. A chained run takes the scheduled path. A run by hand or
  # a push does not use up the tick (cron_gate.py MANUAL_DOES_NOT_SERVE): it may take narrower
  # inputs, and the chained run that follows is the same idempotent job.
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One run per tick of the schedule (see on: above). Sparse: the skip costs seconds.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow transport.yml --max-lag 360
          --cron "43 11 * * 5"

  fetch:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: transport
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Selftest (gate)
        run: python scripts/fetch_transport.py --selftest
      - name: Fetch
        run: python scripts/fetch_transport.py
      - name: Basis band check on the written file
        run: python scripts/test_basis_band.py
      - name: Grain on the move (selftest, then fetch)
        id: moves
        continue-on-error: true
        run: |
          python scripts/fetch_grain_moves.py --selftest
          python scripts/fetch_grain_moves.py
      - name: Commit
        run: |
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          git add data/transport/ grain-transport.html
          if git diff --staged --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: AgTransport basis + journey + grain on the move $(date -u +%F)"
          git pull --rebase --autostash origin main || true
          git push
