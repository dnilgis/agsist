name: transport

on:
  schedule:
    - cron: '43 11 * * 5'
  workflow_run:
    workflows: ["Fetch Grain Bids", "Tick 08"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    if: (github.event.workflow_run.name != 'Fetch Grain Bids' || vars.CLOCK_LIVE != '1') && (github.event.workflow_run.name != 'Tick 08' || (contains(github.event.workflow_run.display_title, ' transport.yml ') && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow transport.yml --max-lag 360
          --cron "43 11 * * 5"

  fetch:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: transport
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Selftest (gate)
        run: python scripts/fetch_transport.py --selftest
      - name: Fetch
        run: python scripts/fetch_transport.py
      - name: Basis band check on the written file
        run: python scripts/test_basis_band.py
      - name: Grain on the move (selftest, then fetch)
        id: moves
        continue-on-error: true
        run: |
          python scripts/fetch_grain_moves.py --selftest
          python scripts/fetch_grain_moves.py
      - name: Commit
        run: |
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          git add data/transport/ grain-transport.html
          if git diff --staged --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: AgTransport basis + journey + grain on the move $(date -u +%F)"
          pushed=0
          for n in 1 2 3 4 5; do
            if git push; then pushed=1; break; fi
            echo "Push race on attempt $n; rebasing..."
            git pull --rebase --autostash origin main || { echo "Rebase failed."; exit 1; }
            sleep $((RANDOM % 4 + 2))
          done
          [ "$pushed" = 1 ] || { echo "Failed to push after 5 attempts."; exit 1; }
