name: Planting date station normals

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Probe only: save raw NCEI files to data/planting-normals-raw/ on the raw branch"
        type: boolean
        default: false
  schedule:
    - cron: '23 9 2 2 *'
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow planting-normals.yml --max-lag 360
          --cron "23 9 2 2 *"

  build:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: planting-normals
      cancel-in-progress: false
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Selftest
        run: python scripts/fetch_planting_normals.py --selftest
      - name: Probe (raw source capture)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe }}
        run: python scripts/fetch_planting_normals.py --probe
      - name: Save the probe's raw files to the raw branch
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.probe }}
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_SOFT: '1'
        run: bash scripts/push_raw.sh "planting-normals probe" data/planting-normals-raw
      - name: Fetch and write data/planting/*.json
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) }}
        run: |
          python scripts/fetch_planting_normals.py
          python scripts/fetch_planting_normals.py --check
      - name: Commit if changed (race-tolerant)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) }}
        run: |
          set -e
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          [ -d data/planting ] || { echo "No output; nothing to commit."; exit 0; }
          rm -rf /tmp/pn && mkdir -p /tmp/pn && cp -r data/planting /tmp/pn/
          BR="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3 4 5; do
            git fetch origin "$BR"
            git reset --hard "origin/$BR"
            mkdir -p data && cp -r /tmp/pn/planting data/
            git add data/planting
            if git diff --staged --quiet; then echo "No change."; exit 0; fi
            git commit -m "Update planting date station normals $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            if git push origin "HEAD:$BR"; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push race on attempt $i; re-syncing to origin/$BR..."
            sleep $((RANDOM % 4 + 2))
          done
          echo "Failed to push after 5 attempts."; exit 1
