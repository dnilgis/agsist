name: Funds This Week (by hand)


on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry = render only; preview = Sig only; send = the Funds this week list'
        type: choice
        options: [dry, preview, send]
        default: dry

permissions:
  contents: read

concurrency:
  group: fetch-cot
  cancel-in-progress: false

jobs:
  funds-weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test the Funds this week sender and its loop
        run: |
          python scripts/send_cot_weekly.py --selftest
          python3 scripts/test_send_loops.py

      - name: Deep history from raw
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: bash scripts/pull_raw.sh data/cot-deep.json

      - name: Funds this week (${{ inputs.mode }})
        env:
          SMTP_HOST:    ${{ secrets.SMTP_HOST }}
          SMTP_PORT:    ${{ secrets.SMTP_PORT }}
          SMTP_USER:    ${{ secrets.SMTP_USER || secrets.GMAIL_USER }}
          SMTP_PASS:    ${{ secrets.SMTP_PASS || secrets.GMAIL_APP_PASS }}
          FROM_ADDR:    ${{ secrets.FROM_ADDR }}
          FROM_NAME:    ${{ secrets.FROM_NAME }}
          REPLY_TO:     ${{ secrets.REPLY_TO }}
          LIST_URL:     ${{ secrets.LIST_URL }}
          LIST_TOKEN:   ${{ secrets.LIST_TOKEN }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
          SIG_TO:       ${{ secrets.SIG_TO }}
          SIG_TEST_EMAILS: ${{ secrets.SIG_TEST_EMAILS }}
          PREVIEW:      ${{ inputs.mode == 'preview' && '1' || '' }}
          SEND:         ${{ inputs.mode == 'send' && '1' || '' }}
        run: python scripts/send_cot_weekly.py
