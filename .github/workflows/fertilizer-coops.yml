name: Fertilizer co-op posted prices

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Probe only: check robots.txt and read every co-op and pending candidate, save the pages to the raw branch; writes no prices"
        type: boolean
        default: false
  schedule:
    - cron: '41 13 * * 1-5'
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow fertilizer-coops.yml --max-lag 360
          --cron "41 13 * * 1-5"

  build:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: fertilizer-coops
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pdftotext
        timeout-minutes: 5
        uses: ./.github/actions/pdftotext
      - name: Install pypdf
        run: pip install pypdf==6.20.1
      - name: Selftest
        run: |
          python scripts/fetch_coop_fert.py --selftest
          python scripts/build_fert_prices.py --selftest
          python scripts/bake_fert_defaults.py --selftest
          python scripts/build_coop_places.py --selftest
      - name: Probe (robots and parse, no prices written)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe }}
        run: python scripts/fetch_coop_fert.py --probe
      - name: Save the probe's pages to the raw branch
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.probe }}
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_SOFT: '1'
        run: bash scripts/push_raw.sh "fertilizer-coops probe" data/coop-fert-raw
      - name: Fetch and write data/fertilizer-coops.json
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) }}
        run: python scripts/fetch_coop_fert.py

      - name: Install pillow for the share cards
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) }}
        continue-on-error: true
        run: pip install --quiet pillow==12.3.0

      - name: Commit if changed (race-tolerant)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) }}
        run: |
          set -e
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          FILES="data/fertilizer-coops.json data/fertilizer-coops-history.json"
          BAKED="data/fertilizer-prices.json fertilizer.html breakeven.html manure-value.html fast-facts.html img/og"
          rm -rf /tmp/fcoop && mkdir -p /tmp/fcoop
          for f in $FILES; do
            [ -e "$f" ] && cp --parents "$f" /tmp/fcoop/ || true
          done
          [ -n "$(ls -A /tmp/fcoop)" ] || { echo "No output; nothing to commit."; exit 0; }
          BR="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3 4 5; do
            git fetch origin "$BR"
            git reset --hard "origin/$BR"
            mkdir -p data && cp -r /tmp/fcoop/data/. data/
            bash scripts/fert_after_prices.sh
            for f in $FILES $BAKED; do [ -e "$f" ] && git add "$f" || true; done
            [ -e data/fert-coop-places.json ] && git add data/fert-coop-places.json || true
            if git diff --staged --quiet; then echo "No change."; exit 0; fi
            git commit -m "Fertilizer co-op posted prices $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            if git push origin "HEAD:$BR"; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push race on attempt $i; re-syncing to origin/$BR..."
            sleep $((RANDOM % 4 + 2))
          done
          echo "Failed to push after 5 attempts."; exit 1
