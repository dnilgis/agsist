name: Fetch COT Data
# Fetch COT Data.

on:
  schedule:
    - cron: '47 19 * * 5'
    - cron: '17 20 * * 5'
    - cron: '47 20 * * 5'
    - cron: '17 21 * * 5'
    - cron: '47 19 * * 1'
    - cron: '17 20 * * 1'
    - cron: '47 20 * * 1'
    - cron: '17 21 * * 1'
    - cron: '33 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-cot
  cancel-in-progress: false

jobs:
  fetch-cot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet yfinance==1.7.0 pandas==3.0.6

      - name: Fetch CFTC COT data
        run: python scripts/fetch_cot.py

      - name: Enrich COT data with prices
        run: python scripts/enrich_cot_prices.py

      - name: Prove the readers and the calendar
        continue-on-error: true
        run: |
          python scripts/cot_calendar.py
          python scripts/cot_deep.py --selftest

      - name: Deep history from raw
        id: rawpull
        continue-on-error: true
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: bash scripts/pull_raw.sh data/cot-deep.json

      - name: Append the week to the deep history
        id: deep
        continue-on-error: true
        run: python scripts/cot_deep.py --append

      - name: Save the deep history to raw
        if: steps.deep.outcome == 'success'
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_SOFT: '1'
        run: bash scripts/push_raw.sh "cot deep history" data/cot-deep.json

      - name: Prove the statistics
        continue-on-error: true
        run: python scripts/cot_analysis.py --selftest

      - name: Run the analysis
        continue-on-error: true
        run: python scripts/cot_analysis.py

      - name: Options positions
        continue-on-error: true
        run: |
          python scripts/cot_options.py --selftest
          python scripts/cot_options.py

      - name: Re-bake the COT head tags and crawler summary
        id: bake
        continue-on-error: true
        run: |
          cp cot.html /tmp/cot.prebake.html
          trap 'cp /tmp/cot.prebake.html cot.html; echo "bake failed - cot.html rolled back"' ERR
          set -e
          python scripts/bake_seo.py --selftest
          python scripts/bake_seo.py --page cot.html
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import prerender_wpi_scorecard as p
          orig, new, fname = p.bake_cot()
          if new != orig:
              with open(fname, "w", encoding="utf-8") as f:
                  f.write(new)
              print("Baked", fname)
          else:
              print(fname, "already in sync")
          PY
          trap - ERR

      - name: Share image
        continue-on-error: true
        run: |
          pip install --quiet pillow==12.3.0
          python3 scripts/build_share_images.py --only cot

      - name: Commit COT data
        id: commit
        run: |
          git config user.name  "AGSIST Bot"
          git config user.email "bot@agsist.com"
          cp data/cot.json          /tmp/cot.json
          cp data/cot-history.json  /tmp/cot-history.json
          cp cot.html               /tmp/cot.html
          cp img/og/cot.jpg         /tmp/cot-og.jpg        2>/dev/null || true
          cp data/cot-analysis.json /tmp/cot-analysis.json 2>/dev/null || true
          cp data/cot-options.json  /tmp/cot-options.json  2>/dev/null || true
          cp data/cot-questions.json /tmp/cot-questions.json 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/cot.json         data/cot.json
            cp /tmp/cot-history.json data/cot-history.json
            cp /tmp/cot.html         cot.html
            [ -f /tmp/cot-og.jpg ]        && cp /tmp/cot-og.jpg        img/og/cot.jpg
            [ -f /tmp/cot-analysis.json ] && cp /tmp/cot-analysis.json data/cot-analysis.json
            [ -f /tmp/cot-options.json ]  && cp /tmp/cot-options.json  data/cot-options.json
            [ -f /tmp/cot-questions.json ] && cp /tmp/cot-questions.json data/cot-questions.json
            git add data/cot.json data/cot-history.json cot.html img/og/cot.jpg
            git add data/cot-analysis.json 2>/dev/null || true
            git add data/cot-options.json 2>/dev/null || true
            git add data/cot-questions.json 2>/dev/null || true
            if git diff --staged --quiet; then
              echo "No COT changes today — nothing to commit (expected ~6 days/week)."
              exit 0
            fi
            git commit -m "chore: update COT data $(date +%F) [skip ci]"
            if git push; then
              echo "pushed (attempt $i)"
              exit 0
            fi
            echo "push failed (attempt $i) — remote moved, retrying after backoff"
            sleep $((RANDOM % 4 + 3))
          done
          echo "ERROR: could not push after 5 attempts"
          exit 1

      - name: Bake result
        if: steps.bake.outcome == 'failure'
        run: |
          echo "The COT data committed, but re-baking cot.html FAILED."
          echo "The title, meta descriptions and the crawler paragraph are"
          echo "still on the previous report. Fix the baker and re-run."
          exit 1

      - name: cot.html matches data/cot.json
        if: ${{ !cancelled() && steps.commit.outcome == 'success' }}
        run: python scripts/check_cot_baked.py

      - name: Deep history result
        if: ${{ !cancelled() && steps.rawpull.outcome == 'failure' }}
        run: |
          echo "data/cot-deep.json could not be unpacked from the private raw branch,"
          echo "so this week was not appended and data/cot-analysis.json was not rebuilt."
          exit 1
