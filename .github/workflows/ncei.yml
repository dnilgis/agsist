name: NCEI hail backfill
# Builds the long-term hail record (1955 -> cutoff) from NOAA NCEI Storm
# Events yearly CSVs into 1-degree spatial tiles the map fetches per lookup,
# plus national per-year counts. The map's "Long-term record" block
# feature-detects data/hail/ncei/index.json — it appears on the site the
# moment this workflow's first run commits.
#
# FIRST RUN: Actions -> this workflow -> Run workflow (leave inputs empty).
# Downloads ~66 year files; takes several minutes; commits ~10-20MB of
# static tiles once. Use limit_years: "2" first if you want a smoke test.
# After that: refreshes every January 15 (NCEI finalizes trailing data).

on:
  workflow_dispatch:
    inputs:
      limit_years:
        description: "Smoke test: only process the first N years"
        required: false
  schedule:
    - cron: '47 8 15 1 *'   # yearly, Jan 15 09:00 UTC
  # GitHub's scheduler drops scheduled fires (it never started land-data.yml on Nov 3, 2026;
  # scripts/cron_gate.py has the numbers). So this also runs after every "Fetch Grain Bids"
  # (cron-job.org, every 15 minutes), and the gate job lets the first run after each tick of the
  # cron above, by either trigger, do the work within 360 minutes
  # (six hours, the same day and well before the next tick).
  # Every other run skips in seconds. A chained run takes the scheduled path. A run by hand or
  # a push does not use up the tick (cron_gate.py MANUAL_DOES_NOT_SERVE): it may take narrower
  # inputs, and the chained run that follows is the same idempotent job.
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]

permissions:
  contents: write

jobs:
  # One run per tick of the schedule (see on: above). Sparse: the skip costs seconds.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow ncei.yml --max-lag 360
          --cron "47 8 15 1 *"

  backfill:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: ncei-backfill
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - name: Build tiles from NCEI Storm Events
        env:
          NCEI_LIMIT: ${{ inputs.limit_years }}
        run: python3 scripts/fetch_ncei_hail.py

      - name: Commit and push (rebase armor, 3 tries)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hail/ncei
          if git diff --cached --quiet; then
            echo "NCEI data unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "data: NCEI hail backfill tiles [skip ci]"
          for i in 1 2 3; do
            if git push origin main; then exit 0; fi
            echo "push rejected (attempt $i) — rebasing"
            git pull --rebase origin main || { git rebase --abort; git reset --hard origin/main; git add data/hail/ncei; git commit -m "data: NCEI hail backfill tiles [skip ci]" || true; }
          done
          echo "push failed after 3 attempts — re-run this workflow"
          exit 1
