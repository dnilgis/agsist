name: NCEI hail backfill

on:
  workflow_dispatch:
    inputs:
      limit_years:
        description: "Smoke test: only process the first N years"
        required: false
  schedule:
    - cron: '47 8 15 1 *'
  workflow_run:
    workflows: ["Fetch Grain Bids", "Tick 06"]
    types: [completed]

permissions:
  contents: write

jobs:
  gate:
    if: (github.event.workflow_run.name != 'Fetch Grain Bids' || vars.CLOCK_LIVE != '1') && (github.event.workflow_run.name != 'Tick 06' || contains(github.event.workflow_run.display_title, ' ncei.yml '))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow ncei.yml --max-lag 360
          --cron "47 8 15 1 *"

  backfill:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: ncei-backfill
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - name: Build tiles from NCEI Storm Events
        env:
          NCEI_LIMIT: ${{ inputs.limit_years }}
        run: python3 scripts/fetch_ncei_hail.py

      - name: Commit and push (rebase armor, 3 tries)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hail/ncei
          if git diff --cached --quiet; then
            echo "NCEI data unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "data: NCEI hail backfill tiles [skip ci]"
          for i in 1 2 3; do
            if git push origin main; then exit 0; fi
            echo "push rejected (attempt $i) — rebasing"
            git pull --rebase origin main || { git rebase --abort; git reset --hard origin/main; git add data/hail/ncei; git commit -m "data: NCEI hail backfill tiles [skip ci]" || true; }
          done
          echo "push failed after 3 attempts — re-run this workflow"
          exit 1
