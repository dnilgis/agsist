# Daily store copy; ok only in the log.
# secret needed: CF_KV_READ_TOKEN (skips with one line until set)
name: KV backup
on:
  schedule:
    - cron: '7 9 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: kv-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Secret check
        id: have
        env:
          CF_KV_READ_TOKEN: ${{ secrets.CF_KV_READ_TOKEN }}
        run: |
          if [ -n "$CF_KV_READ_TOKEN" ]; then echo "go=yes" >> "$GITHUB_OUTPUT"; else echo "kv-backup: secret not set yet"; fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        if: steps.have.outputs.go == 'yes'
        with:
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        if: steps.have.outputs.go == 'yes'
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - name: Backup
        if: steps.have.outputs.go == 'yes'
        env:
          CF_KV_READ_TOKEN: ${{ secrets.CF_KV_READ_TOKEN }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          Q="python3 scripts/dev/quiet.py"
          d=$(date -u +%Y-%m-%d)
          mkdir -p kv-backup
          $Q selftest -- python3 scripts/kv_backup.py --selftest
          $Q read-store -- python3 scripts/kv_backup.py "kv-backup/kv-$d.json.gz"
          cp "kv-backup/kv-$d.json.gz" kv-backup/latest.json.gz
          $Q save -- bash scripts/private_data.sh save-over "KV backup $d" "kv-backup/kv-$d.json.gz" kv-backup/latest.json.gz
