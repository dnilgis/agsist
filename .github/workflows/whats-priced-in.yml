name: Build What's Priced In

on:
  push:
    paths:
      - "data/wpi-estimates.json"
      - "data/wpi-history.json"
      - "scripts/build_whats_priced_in.py"
      - "data/analyst-estimates.json"
      - "scripts/report_bands.py"
  schedule:
    - cron: "20 11 * * *"   # 11:20 UTC daily — rolls the "next report" card over as dates pass
  # GitHub's scheduler drops scheduled fires (it never started land-data.yml on Nov 3, 2026;
  # scripts/cron_gate.py has the numbers). So this also runs after every "Fetch Grain Bids"
  # (cron-job.org, every 15 minutes), and the gate job lets the first run after each tick of the
  # cron above, by either trigger, do the work within 360 minutes
  # (six hours, the same day and well before the next tick).
  # Every other run skips in seconds. A chained run takes the scheduled path. A run by hand or
  # a push does not use up the tick (cron_gate.py MANUAL_DOES_NOT_SERVE): it may take narrower
  # inputs, and the chained run that follows is the same idempotent job.
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One run per tick of the schedule (see on: above). Sparse: the skip costs seconds.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow whats-priced-in.yml --max-lag 360
          --cron "20 11 * * *"

  build:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: whats-priced-in
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # THE RULE BEFORE THE BUILD. Both builders now share one definition of
      # "in line" (scripts/report_bands.py); before they had one each and
      # disagreed on the page about one number. Two seconds, no network.
      - name: Test the shared scoring rule
        run: python scripts/report_bands.py --selftest

      # THE CALENDAR RUNS OUT ON A DATE. This is the daily job, so it is the one
      # that will actually be seen. Amber from 75 days out, red only once the
      # calendar has genuinely run out -- at which point the card on this very
      # page is already reading "no upcoming report", so red is a report rather
      # than a warning. Deliberately NOT allowed to block the build in the
      # run-up: a December problem must not stop November's page being built.
      - name: How much WASDE calendar is left
        run: python scripts/usda_dates.py --selftest && python scripts/usda_dates.py
      # THE TWO COPIES OF THE REPORT STRIP, COMPARED.
      # "Every number on this report" is rendered by the page's JS and again by
      # the prerenderer for the baked copy. This runs both on the same rows and
      # fails on a byte of difference, and checks that neither renderer calls a
      # helper that lives in the page's other script block -- a borrowed helper
      # throws inside the fetch's .catch and blanks the panel with no error
      # anywhere visible. Offline, under a second.
      - name: The baked strip and the live strip must agree
        run: node --test test/wpi-numbers-strip.test.mjs

      - name: Build whats-priced-in.json
        run: |
          # THE ARITHMETIC BEFORE THE PUBLISH. build_report_numbers decides the
          # bullish / bearish / in-line verdict printed beside every figure on
          # the report strip, and the page renders that verdict without checking
          # it. Hand-worked cases, offline, under a second.
          python scripts/report_bands.py --selftest
          python scripts/build_whats_priced_in.py --selftest
          python scripts/build_whats_priced_in.py
      - name: Commit if changed (race-tolerant)
        run: |
          set -e
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          FILE="data/whats-priced-in.json"
          [ -f "$FILE" ] || { echo "No output file; nothing to commit."; exit 0; }
          cp "$FILE" /tmp/wpi.json
          BR="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3 4 5; do
            git fetch origin "$BR"
            git reset --hard "origin/$BR"
            cp /tmp/wpi.json "$FILE"
            python scripts/prerender_wpi_scorecard.py || true   # bake pages; never block the data commit
            # The calendar's title names the next WASDE. This job runs every day,
            # weekends too, so the title rolls the morning after a report.
            python scripts/bake_seo.py --page usda-calendar.html || true
            git add "$FILE" cot.html index.html usda-calendar.html
            if git diff --staged --quiet; then echo "No change."; exit 0; fi
            git commit -m "Update what's priced in $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if git push origin "HEAD:$BR"; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push race on attempt $i; re-syncing to origin/$BR..."
            sleep $((RANDOM % 4 + 2))
          done
          echo "Failed to push after 5 attempts."; exit 1

      # The bake runs behind "|| true" so a bad bake can never block the data
      # commit. That also means a bake that quietly stopped working leaves the
      # pages stale forever under a green run -- whats-priced-in.html was two
      # days stale on 2026-09-12 and nothing said so. --check already existed;
      # no workflow called it. It runs here, AFTER the commit, blocking nothing.
      - name: The pages must match the data
        if: always()
        run: |
          git fetch origin "${GITHUB_REF_NAME:-main}"
          git reset --hard "origin/${GITHUB_REF_NAME:-main}"
          python scripts/prerender_wpi_scorecard.py --check

