name: Land data (parcel services + transfers)

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Probe only: save the raw transfer pages and files to the raw branch"
        type: boolean
        default: false
      probe_states:
        description: "Probe only: state codes to probe, space separated (CT MA FL); empty probes every state"
        type: string
        default: ""
      task:
        description: "vt (Vermont transfers only, then the summaries and sale pages), nj (New Jersey only, the same way), fl (Florida only, from the prepared files, to agsist-data), services, discover (services + county search in every discover state), discover:MN,IA (only those states), transfers (or sales), all, wi-newest (Wisconsin months not on file yet, plus the newest again), wi-transfers (every Wisconsin month; wi-transfers:N for the newest N), or wi-explore (WI screens to a side branch); layers or layers-discover (dispatch only: check the services the Field Scout on-and-around card reads, save their answers to the raw branch); comp-live (dispatch only: open the live comp report and say whether owner, soil and crop history came back); soil-probe, soil:IL, soil:IN, soil:WI or soil-attrs (dispatch only: section soil for each keyed farm sale, BLM PLSS and USDA SSURGO, answers to the raw branch only); soilr-probe, soilr-all or soilr:IL, soilr:IN, soilr:WI (dispatch only: the same from the gridded soil map and the Cropland Data Layer)"
        type: string
        default: "services"
  schedule:
    - cron: '23 9 3 * *'
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow land-data.yml --max-lag 360
          --cron "23 9 3 * *"

  build:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-24.04
    concurrency:
      group: land-data
      cancel-in-progress: false
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install openpyxl (xlsx transfer files)
        run: pip install openpyxl==3.1.5 numpy==2.5.4 pyarrow==26.0.0
      - name: Selftests
        run: |
          python3 scripts/dev/quiet.py selftest-probe-land-services -- python scripts/probe_land_services.py --selftest
          python3 scripts/dev/quiet.py selftest-fetch-land-sales -- python scripts/fetch_land_sales.py --selftest
          python3 scripts/dev/quiet.py selftest-land-keys -- python scripts/land_keys.py --selftest
          python3 scripts/dev/quiet.py selftest-land-names -- python scripts/land_names.py --selftest
          python3 scripts/dev/quiet.py selftest-land-keep-stamp-only -- python scripts/land_keep_stamp_only.py --selftest
          python3 scripts/dev/quiet.py selftest-comp-report-live -- python scripts/comp_report_live.py --selftest
          python3 scripts/dev/quiet.py selftest-wi-retr-browser -- python scripts/wi_retr_browser.py --selftest
          python3 scripts/dev/quiet.py selftest-probe-field-layers -- python scripts/probe_field_layers.py --selftest
          python3 scripts/dev/quiet.py selftest-build-land-summary -- python scripts/build_land_summary.py --selftest
          python3 scripts/dev/quiet.py selftest-land-soil -- python scripts/land_soil.py --selftest
          python3 scripts/dev/quiet.py selftest-land-soil-raster -- python scripts/land_soil_raster.py --selftest
          OMP_NUM_THREADS=1 python3 scripts/dev/quiet.py selftest-build-land-index -- python scripts/build_land_index.py --selftest
      - name: pdftotext for the probe
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe }}
        timeout-minutes: 5
        continue-on-error: true
        uses: ./.github/actions/pdftotext
      - name: Probe transfer sources (raw capture)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe }}
        run: |
          command -v pdftotext >/dev/null || echo "no pdftotext; layouts saved as PDF only"
          S="$(echo "${{ inputs.probe_states }}" | tr -cd 'A-Za-z ')"
          python scripts/fetch_land_sales.py --probe $S
      - name: Wisconsin RETR screens in a browser (explore only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'wi-explore' }}
        run: |
          python3 -m venv "$RUNNER_TEMP/pw"
          "$RUNNER_TEMP/pw/bin/pip" install -q playwright==1.56.0
          "$RUNNER_TEMP/pw/bin/python" -m playwright install --with-deps chromium >/dev/null
          "$RUNNER_TEMP/pw/bin/python" scripts/wi_retr_browser.py --explore "$RUNNER_TEMP/wi-explore"
      - name: Keep the explore screens
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.task == 'wi-explore' }}
        run: |
          D="$RUNNER_TEMP/wi-explore"; [ -d "$D" ] || exit 0
          B="${GITHUB_REF_NAME}-explore"
          cd "$RUNNER_TEMP" && rm -rf ex && mkdir ex && cd ex && git init -q && git checkout -q -b "$B"
          cp -r "$D" wi-explore && find wi-explore -size +40M -delete
          git -c user.name="AGSIST Bot" -c user.email=bot@agsist.com add -A
          git -c user.name="AGSIST Bot" -c user.email=bot@agsist.com commit -qm "WI RETR explore $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:$B"
      - name: Check parcel services
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) && (github.event_name == 'schedule' || github.event_name == 'workflow_run' || inputs.task == 'services' || inputs.task == 'discover' || startsWith(inputs.task, 'discover:') || inputs.task == 'all') }}
        run: |
          T="${{ inputs.task }}"
          case "$T" in
            discover:*) python3 scripts/dev/quiet.py parcel-services -- python scripts/probe_land_services.py "--discover=$(echo "${T#discover:}" | tr -cd 'A-Za-z,')" ;;
            discover|all) python3 scripts/dev/quiet.py parcel-services -- python scripts/probe_land_services.py --discover ;;
            *) python3 scripts/dev/quiet.py parcel-services -- python scripts/probe_land_services.py ;;
          esac
      - name: Check Field Scout layer services
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.task == 'layers' || inputs.task == 'layers-discover') }}
        run: |
          if [ "${{ inputs.task }}" = "layers-discover" ]; then python scripts/probe_field_layers.py --discover; else python scripts/probe_field_layers.py; fi
      - name: Check the live comp report
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'comp-live' }}
        run: |
          python3 -m venv "$RUNNER_TEMP/pwc"
          "$RUNNER_TEMP/pwc/bin/pip" install -q playwright==1.56.0
          "$RUNNER_TEMP/pwc/bin/python" -m playwright install --with-deps chromium >/dev/null
          "$RUNNER_TEMP/pwc/bin/python" scripts/comp_report_live.py
      - name: Section soil for the keyed farm sales
        if: ${{ github.event_name == 'workflow_dispatch' && startsWith(inputs.task, 'soil') && !startsWith(inputs.task, 'soilr') && inputs.task != 'soil-attrs' }}
        timeout-minutes: 140
        run: |
          T="${{ inputs.task }}"
          if [ "$T" = "soil-probe" ]; then
            for S in IL IN WI; do python scripts/land_soil.py --fetch "$S" --limit 12 --minutes 10 || echo "::warning::$S soil probe failed"; done
          else
            S=$(echo "${T#soil:}" | tr -cd 'A-Za-z' | tr a-z A-Z)
            python scripts/land_soil.py --fetch "$S" --minutes 125 || echo "::warning::$S soil fetch failed"
          fi
      - name: Map unit NCCPI for the saved section answers
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'soil-attrs' }}
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          . scripts/private_remote.sh
          D="$RUNNER_TEMP/rawsoil"
          git clone -q --depth 1 --filter=blob:none --sparse --branch raw "$REMOTE" "$D" 2>&1 | hide || true
          git -C "$D" sparse-checkout set data/land-raw/soil 2>&1 | hide || true
          mkdir -p data/land-raw/soil && cp "$D"/data/land-raw/soil/*-soil.json.gz data/land-raw/soil/ || { echo "::warning::no saved section answers"; exit 0; }
          python scripts/land_soil.py --attrs || echo "::warning::map unit attributes failed"
      - name: Section soil from the gridded soil map
        if: ${{ github.event_name == 'workflow_dispatch' && startsWith(inputs.task, 'soilr') }}
        timeout-minutes: 140
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
          GDAL_HTTP_MAX_RETRY: '5'
          GDAL_HTTP_RETRY_DELAY: '2'
          CPL_VSIL_CURL_ALLOWED_EXTENSIONS: .tif
        run: |
          python3 -m venv "$RUNNER_TEMP/soilr"
          "$RUNNER_TEMP/soilr/bin/pip" install -q numpy==2.2.6 rasterio==1.4.3 pyproj==3.7.1 pystac-client==0.8.6 planetary-computer==1.0.0
          . scripts/private_remote.sh
          D="$RUNNER_TEMP/rawsoil"
          git clone -q --depth 1 --filter=blob:none --sparse --branch raw "$REMOTE" "$D" 2>&1 | hide || true
          git -C "$D" sparse-checkout set data/land-raw/soil 2>&1 | hide || true
          mkdir -p data/land-raw/soil && cp "$D"/data/land-raw/soil/*-soil.json.gz data/land-raw/soil/ 2>/dev/null || echo "::warning::no saved polygon answers"
          T="${{ inputs.task }}"
          if [ "$T" = "soilr-probe" ]; then
            for S in IL IN WI; do "$RUNNER_TEMP/soilr/bin/python" scripts/land_soil_raster.py --fetch "$S" --limit 40 --minutes 10 || echo "::warning::$S raster probe failed"; done
          elif [ "$T" = "soilr-all" ]; then
            for S in IL IN WI; do "$RUNNER_TEMP/soilr/bin/python" scripts/land_soil_raster.py --fetch "$S" --minutes 40 || echo "::warning::$S raster soil failed"; done
          else
            S=$(echo "${T#soilr:}" | tr -cd 'A-Za-z' | tr a-z A-Z)
            "$RUNNER_TEMP/soilr/bin/python" scripts/land_soil_raster.py --fetch "$S" --minutes 125 || echo "::warning::$S raster soil failed"
          fi
          rm -f data/land-raw/soil/*-soil.json.gz
      - name: Florida sales (agsist-data)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) && (github.event_name == 'schedule' || github.event_name == 'workflow_run' || inputs.task == 'transfers' || inputs.task == 'sales' || inputs.task == 'all' || inputs.task == 'fl') }}
        continue-on-error: true
        timeout-minutes: 30
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          AGSIST_DATA_TOKEN: ${{ secrets.AGSIST_DATA_TOKEN }}
          RAW_SOFT: '1'
        run: |
          python3 scripts/dev/quiet.py fl-files -- bash scripts/pull_raw.sh data/land-src/fl
          [ -f data/land-src/fl/index.json ] || { echo "::warning::Florida prepared files not here; agsist-data left as it was"; exit 0; }
          python3 scripts/dev/quiet.py fl-checkout -- bash scripts/agsist_data.sh checkout "$RUNNER_TEMP/agsist-data" || { echo "::warning::agsist-data not reached; Florida not updated"; exit 0; }
          mkdir -p "$RUNNER_TEMP/agsist-data/land"
          python3 scripts/dev/quiet.py transfers-fl -- python scripts/fetch_land_sales.py FL --from data/land-src/fl --to "$RUNNER_TEMP/agsist-data/land" || { echo "::warning::Florida sales were not written"; exit 0; }
          python3 scripts/dev/quiet.py fl-sync -- bash scripts/agsist_data.sh sync --soft --from "$RUNNER_TEMP/agsist-data" land/fl
      - name: Florida files for the builders
        if: ${{ !cancelled() }}
        run: |
          if [ -f "$RUNNER_TEMP/agsist-data/land/fl/index.json" ]; then ln -sfn "$RUNNER_TEMP/agsist-data/land" data/land-hosted; echo "Florida county files linked for the builders"; else echo "no Florida county files in this run"; fi
      - name: Build transfers
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) && (github.event_name == 'schedule' || github.event_name == 'workflow_run' || inputs.task == 'transfers' || inputs.task == 'sales' || inputs.task == 'all') }}
        run: python3 scripts/dev/quiet.py transfers -- python scripts/fetch_land_sales.py MN IL IN VT NJ || echo "::warning::no state's transfers were written"
      - name: Vermont transfers only
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.probe && inputs.task == 'vt' }}
        run: python3 scripts/dev/quiet.py transfers-vt -- python scripts/fetch_land_sales.py VT || echo "::warning::Vermont transfers were not written"
      - name: New Jersey deeds only
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.probe && inputs.task == 'nj' }}
        timeout-minutes: 45
        run: python3 scripts/dev/quiet.py transfers-nj -- python scripts/fetch_land_sales.py NJ || echo "::warning::New Jersey deeds were not written"
      - name: Wisconsin transfer returns (browser)
        continue-on-error: true
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) && (github.event_name == 'schedule' || github.event_name == 'workflow_run' || inputs.task == 'transfers' || inputs.task == 'sales' || inputs.task == 'all' || inputs.task == 'wi-newest' || inputs.task == 'wi-transfers' || startsWith(inputs.task, 'wi-transfers:')) }}
        run: |
          python3 -m venv "$RUNNER_TEMP/pw"
          "$RUNNER_TEMP/pw/bin/pip" install -q playwright==1.56.0
          "$RUNNER_TEMP/pw/bin/python" -m playwright install --with-deps chromium >/dev/null
          T="${{ inputs.task }}"
          M=$(echo "$T" | sed -n 's/^wi-transfers:\([0-9][0-9]*\)$/\1/p')
          if [ "$T" = "wi-transfers" ] || [ -n "$M" ]; then NEW=""; MERGE=""; else NEW="--newest-only"; MERGE="--merge"; fi
          python3 scripts/dev/quiet.py wi-reports -- "$RUNNER_TEMP/pw/bin/python" scripts/wi_retr_browser.py --fetch "$RUNNER_TEMP/wi" --months "${M:-120}" $NEW || echo "::warning::Wisconsin monthly reports were not read"
          if [ -f "$RUNNER_TEMP/wi/build/wi-retr.csv" ]; then
            python3 scripts/dev/quiet.py transfers-wi -- python scripts/fetch_land_sales.py --from "$RUNNER_TEMP/wi/build" WI $MERGE || echo "::warning::Wisconsin transfers were not written"
          fi
      - name: Keep timestamp-only changes out of the build
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.probe || startsWith(inputs.task, 'soil'))) }}
        run: python3 scripts/dev/quiet.py keep-stamp-only -- python3 scripts/land_keep_stamp_only.py data/land
      - name: Build Atlas sale summaries
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.probe || startsWith(inputs.task, 'soil'))) }}
        run: python3 scripts/dev/quiet.py land-summaries -- python scripts/build_land_summary.py
      - name: Build the farmland sale index
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.probe || startsWith(inputs.task, 'soil'))) }}
        run: OMP_NUM_THREADS=1 python3 scripts/dev/quiet.py land-index -- python scripts/build_land_index.py
      - name: Build the farm sale pages
        id: pages
        continue-on-error: true
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.probe || startsWith(inputs.task, 'soil'))) }}
        run: python3 scripts/dev/quiet.py land-pages -- python scripts/build_land_sales.py
      - name: Save raw answers to the raw branch
        if: ${{ !cancelled() }}
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_SOFT: '1'
        run: |
          [ -d data/land-raw ] && bash scripts/push_raw.sh "land-data raw answers" data/land-raw || echo "nothing raw"
          rm -rf data/land-raw
          rm -rf data/land-src
          rm -f data/land-hosted
      - name: Site budget
        run: python scripts/check_site_budget.py
      - name: Commit if changed (race-tolerant)
        if: ${{ !(github.event_name == 'workflow_dispatch' && startsWith(inputs.task, 'soil')) }}
        env:
          PAGES: ${{ steps.pages.outcome }}
        run: |
          set -e
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          rm -rf /tmp/ld && mkdir -p /tmp/ld
          [ -d data/land ] && cp -r --parents data/land /tmp/ld/ || true
          if [ "$PAGES" = "success" ]; then [ -d land-sales ] && cp -r --parents land-sales data/land-sales sitemap-land-sales.xml /tmp/ld/ || true; fi
          [ -n "$(ls -A /tmp/ld)" ] || { echo "No output; nothing to commit."; exit 0; }
          BR="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3 4 5; do
            git fetch origin "$BR"
            git reset --hard "origin/$BR"
            mkdir -p data && cp -r /tmp/ld/data/. data/
            [ -d /tmp/ld/land-sales ] && cp -r /tmp/ld/land-sales . && cp /tmp/ld/sitemap-land-sales.xml . || true
            python3 scripts/land_keep_stamp_only.py data/land
            git add data/land
            [ -d land-sales ] && git add land-sales data/land-sales sitemap-land-sales.xml || true
            python3 scripts/generated_sets.py dependents land-sales --stage || true
            if git diff --staged --quiet; then echo "No change."; exit 0; fi
            git commit -m "Update land data $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            if git push origin "HEAD:$BR"; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push race on attempt $i; re-syncing to origin/$BR..."
            sleep $((RANDOM % 4 + 2))
          done
          echo "Failed to push after 5 attempts."; exit 1
      - name: The farm sale pages were refused
        if: ${{ steps.pages.outcome == 'failure' }}
        run: |
          echo "::error::The farm sale pages were not built (see that step); data/land was committed, the pages kept their last good copy"
          exit 1
