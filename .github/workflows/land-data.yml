name: Land data (parcel services + transfers)

# Field Scout's land card. Two jobs in one workflow:
#  - parcel services: scripts/probe_land_services.py rechecks every free public parcel
#    service in data/land/parcel-services.json (fields, a test query, and that a web page
#    may read it) and, with "discover", searches for county services in MN, IA, IL.
#    Only this marks a service verified. Coverage counts print as annotations.
#  - transfers: scripts/fetch_land_sales.py builds data/land/<st>/<county fips>.json from
#    the state's own public transfer data (IL MyDec open data; WI eRETR monthly reports; VT property
#    transfer tax returns, the statewide file VCGI publishes, since Oct 29, 2026; MN eCRV
#    once a free file is reachable). Probe also saves sources not built yet (Oct 18: Indiana sales
#    disclosure files, Scott County IA ag sales, South Dakota and Ohio county sales lists, Nebraska's
#    sales file rules); each gets a parser only after its saved columns are read. It refuses a state whose columns it cannot find by name.
#    Wisconsin's files come from DOR's public My Tax Account screen, which needs a browser:
#    scripts/wi_retr_browser.py opens it in headless Chromium (one session, one file at a time,
#    a pause between files) and reads each month's XML report as it arrives.
#    task=wi-transfers rebuilds Wisconsin from every offered month; wi-newest (and the monthly
#    run, transfers, sales, all) reads only the months not on file plus the newest again and
#    merges them in. The commit step skips files whose only change is a timestamp.
#
# FIRST RUN: dispatch with probe ticked. It saves the state data pages, their file links
# and the head of the first files to data/land-raw/ on the raw branch (never deployed), so
# the columns can be read before trusting a number. Then dispatch with task=all.

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Probe only: save the raw transfer pages and files to the raw branch"
        type: boolean
        default: false
      task:
        description: "vt (Vermont transfers only, then the summaries and sale pages), services, discover (services + county search in every discover state), discover:MN,IA (only those states), transfers (or sales), all, wi-newest (Wisconsin months not on file yet, plus the newest again), wi-transfers (every Wisconsin month; wi-transfers:N for the newest N), or wi-explore (WI screens to a side branch); layers or layers-discover (dispatch only: check the services the Field Scout on-and-around card reads, save their answers to the raw branch); comp-live (dispatch only: open the live comp report and say whether owner, soil and crop history came back); soil-probe, soil:IL, soil:IN, soil:WI or soil-attrs (dispatch only: section soil for each keyed farm sale, BLM PLSS and USDA SSURGO, answers to the raw branch only); soilr-probe or soilr:IL, soilr:IN, soilr:WI (dispatch only: the same from the gridded soil map and the Cropland Data Layer)"
        type: string
        default: "services"
  # Sig approved Oct 17, 2026: monthly on the 3rd
  # (parcel services probe, Illinois transfers from the weekly MyDec data, Wisconsin newest-only)
  schedule:
    - cron: '23 9 3 * *'

permissions:
  contents: write

concurrency:
  group: land-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install openpyxl (xlsx transfer files)
        run: pip install openpyxl==3.1.5 numpy==2.5.4 pyarrow==26.0.0
      - name: Selftests
        run: |
          python scripts/probe_land_services.py --selftest
          python scripts/fetch_land_sales.py --selftest
          python scripts/land_keys.py --selftest
          python scripts/land_keep_stamp_only.py --selftest
          python scripts/comp_report_live.py --selftest
          python scripts/wi_retr_browser.py --selftest
          python scripts/probe_field_layers.py --selftest
          python scripts/build_land_summary.py --selftest
          python scripts/land_soil.py --selftest
          python scripts/land_soil_raster.py --selftest
          OMP_NUM_THREADS=1 python scripts/build_land_index.py --selftest
      - name: pdftotext for the probe
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe }}
        timeout-minutes: 5
        continue-on-error: true  # without it the layouts are saved as PDF only
        uses: ./.github/actions/pdftotext
      - name: Probe transfer sources (raw capture)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe }}
        run: |
          command -v pdftotext >/dev/null || echo "no pdftotext; layouts saved as PDF only"
          python scripts/fetch_land_sales.py --probe
      - name: Wisconsin RETR screens in a browser (explore only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'wi-explore' }}
        run: |
          python3 -m venv "$RUNNER_TEMP/pw"
          "$RUNNER_TEMP/pw/bin/pip" install -q playwright==1.56.0
          "$RUNNER_TEMP/pw/bin/python" -m playwright install --with-deps chromium >/dev/null
          "$RUNNER_TEMP/pw/bin/python" scripts/wi_retr_browser.py --explore "$RUNNER_TEMP/wi-explore"
      # The screens go to a side branch (<branch>-explore, never deployed) so they can be read
      # where Actions artifacts and logs cannot be downloaded.
      - name: Keep the explore screens
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.task == 'wi-explore' }}
        run: |
          D="$RUNNER_TEMP/wi-explore"; [ -d "$D" ] || exit 0
          B="${GITHUB_REF_NAME}-explore"
          cd "$RUNNER_TEMP" && rm -rf ex && mkdir ex && cd ex && git init -q && git checkout -q -b "$B"
          cp -r "$D" wi-explore && find wi-explore -size +40M -delete
          git -c user.name="AGSIST Bot" -c user.email=bot@agsist.com add -A
          git -c user.name="AGSIST Bot" -c user.email=bot@agsist.com commit -qm "WI RETR explore $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:$B"
      - name: Check parcel services
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) && (github.event_name == 'schedule' || inputs.task == 'services' || inputs.task == 'discover' || startsWith(inputs.task, 'discover:') || inputs.task == 'all') }}
        run: |
          T="${{ inputs.task }}"
          case "$T" in
            discover:*) python scripts/probe_land_services.py "--discover=$(echo "${T#discover:}" | tr -cd 'A-Za-z,')" ;;
            discover|all) python scripts/probe_land_services.py --discover ;;
            *) python scripts/probe_land_services.py ;;
          esac
      # Dispatch only (never on the schedule): the public services behind Field Scout's
      # "on and around this field" card. Answers go to data/land-raw/layers (raw branch),
      # the summary to data/land/field-layers-check.json.
      - name: Check Field Scout layer services
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.task == 'layers' || inputs.task == 'layers-discover') }}
        run: |
          if [ "${{ inputs.task }}" = "layers-discover" ]; then python scripts/probe_field_layers.py --discover; else python scripts/probe_field_layers.py; fi
      # Dispatch only: the live comp report's owner, soil and crop history (the sandbox cannot reach them).
      # Notices only; nothing is written.
      - name: Check the live comp report
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'comp-live' }}
        run: |
          python3 -m venv "$RUNNER_TEMP/pwc"
          "$RUNNER_TEMP/pwc/bin/pip" install -q playwright==1.56.0
          "$RUNNER_TEMP/pwc/bin/python" -m playwright install --with-deps chromium >/dev/null
          "$RUNNER_TEMP/pwc/bin/python" scripts/comp_report_live.py
      # Dispatch only (never on the schedule): soil for each keyed farm sale's section (property panel
      # step 6, a test before any page shows it). BLM PLSS sections, USDA SSURGO through Soil Data Access.
      # The answers go to data/land-raw/soil (raw branch, below); nothing is committed, no page changes.
      - name: Section soil for the keyed farm sales
        if: ${{ github.event_name == 'workflow_dispatch' && startsWith(inputs.task, 'soil') && !startsWith(inputs.task, 'soilr') && inputs.task != 'soil-attrs' }}
        timeout-minutes: 140
        run: |
          T="${{ inputs.task }}"
          if [ "$T" = "soil-probe" ]; then
            for S in IL IN WI; do python scripts/land_soil.py --fetch "$S" --limit 12 --minutes 10 || echo "::warning::$S soil probe failed"; done
          else
            S=$(echo "${T#soil:}" | tr -cd 'A-Za-z' | tr a-z A-Z)
            python scripts/land_soil.py --fetch "$S" --minutes 125 || echo "::warning::$S soil fetch failed"
          fi
      # soil-attrs: the corn and soybean NCCPI for every map unit already saved (reads the saved
      # section answers back from the raw branch, only that folder).
      - name: Map unit NCCPI for the saved section answers
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'soil-attrs' }}
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          . scripts/private_remote.sh
          D="$RUNNER_TEMP/rawsoil"
          git clone -q --depth 1 --filter=blob:none --sparse --branch raw "$REMOTE" "$D" 2>&1 | hide || true
          git -C "$D" sparse-checkout set data/land-raw/soil 2>&1 | hide || true
          mkdir -p data/land-raw/soil && cp "$D"/data/land-raw/soil/*-soil.json.gz data/land-raw/soil/ || { echo "::warning::no saved section answers"; exit 0; }
          python scripts/land_soil.py --attrs || echo "::warning::map unit attributes failed"
      # soilr-probe or soilr:<ST>: the same sections from the gridded soil map (gNATSGO valu1 corn and
      # soybean NCCPI, 10 m) and the Cropland Data Layer, read by window from the Planetary Computer
      # copies (no statewide download). The saved polygon answers are read back for the raster check.
      - name: Section soil from the gridded soil map
        if: ${{ github.event_name == 'workflow_dispatch' && startsWith(inputs.task, 'soilr') }}
        timeout-minutes: 140
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
          GDAL_HTTP_MAX_RETRY: '5'
          GDAL_HTTP_RETRY_DELAY: '2'
          CPL_VSIL_CURL_ALLOWED_EXTENSIONS: .tif
        run: |
          python3 -m venv "$RUNNER_TEMP/soilr"
          "$RUNNER_TEMP/soilr/bin/pip" install -q numpy==2.2.6 rasterio==1.4.3 pyproj==3.7.1 pystac-client==0.8.6 planetary-computer==1.0.0
          . scripts/private_remote.sh
          D="$RUNNER_TEMP/rawsoil"
          git clone -q --depth 1 --filter=blob:none --sparse --branch raw "$REMOTE" "$D" 2>&1 | hide || true
          git -C "$D" sparse-checkout set data/land-raw/soil 2>&1 | hide || true
          mkdir -p data/land-raw/soil && cp "$D"/data/land-raw/soil/*-soil.json.gz data/land-raw/soil/ 2>/dev/null || echo "::warning::no saved polygon answers"
          T="${{ inputs.task }}"
          if [ "$T" = "soilr-probe" ]; then
            for S in IL IN WI; do "$RUNNER_TEMP/soilr/bin/python" scripts/land_soil_raster.py --fetch "$S" --limit 40 --minutes 10 || echo "::warning::$S raster probe failed"; done
          else
            S=$(echo "${T#soilr:}" | tr -cd 'A-Za-z' | tr a-z A-Z)
            "$RUNNER_TEMP/soilr/bin/python" scripts/land_soil_raster.py --fetch "$S" --minutes 125 || echo "::warning::$S raster soil failed"
          fi
          rm -f data/land-raw/soil/*-soil.json.gz
      - name: Build transfers
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) && (github.event_name == 'schedule' || inputs.task == 'transfers' || inputs.task == 'sales' || inputs.task == 'all') }}
        # IN: Indiana sales disclosure forms, the newest six yearly files from STATS Indiana (about 45 MB each)
        # VT: the statewide transfer return file (Parquet, about 85 MB); the dated copy goes to the raw branch below
        run: python scripts/fetch_land_sales.py MN IL IN VT || echo "::warning::no state's transfers were written"
      - name: Vermont transfers only
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.probe && inputs.task == 'vt' }}
        run: python scripts/fetch_land_sales.py VT || echo "::warning::Vermont transfers were not written"
      - name: Wisconsin transfer returns (browser)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) && (github.event_name == 'schedule' || inputs.task == 'transfers' || inputs.task == 'sales' || inputs.task == 'all' || inputs.task == 'wi-newest' || inputs.task == 'wi-transfers' || startsWith(inputs.task, 'wi-transfers:')) }}
        run: |
          python3 -m venv "$RUNNER_TEMP/pw"
          "$RUNNER_TEMP/pw/bin/pip" install -q playwright==1.56.0
          "$RUNNER_TEMP/pw/bin/python" -m playwright install --with-deps chromium >/dev/null
          # wi-transfers rebuilds every offered month (wi-transfers:N only the newest N, a quick check);
          # the monthly run and the other tasks read only the months not on file, plus the newest again,
          # and merge them into data/land/wi.
          T="${{ inputs.task }}"
          M=$(echo "$T" | sed -n 's/^wi-transfers:\([0-9][0-9]*\)$/\1/p')
          if [ "$T" = "wi-transfers" ] || [ -n "$M" ]; then NEW=""; MERGE=""; else NEW="--newest-only"; MERGE="--merge"; fi
          "$RUNNER_TEMP/pw/bin/python" scripts/wi_retr_browser.py --fetch "$RUNNER_TEMP/wi" --months "${M:-120}" $NEW || echo "::warning::Wisconsin monthly reports were not read"
          if [ -f "$RUNNER_TEMP/wi/build/wi-retr.csv" ]; then
            python scripts/fetch_land_sales.py --from "$RUNNER_TEMP/wi/build" WI $MERGE || echo "::warning::Wisconsin transfers were not written"
          fi
      # The Farmland Atlas sale summaries (data/land/<st>/summary.json) from the county files just
      # written, or the committed ones when this run fetched nothing. Offline; refuses a summary
      # that carries a source name. Same command builds them locally.
      - name: Build Atlas sale summaries
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.probe || startsWith(inputs.task, 'soil'))) }}
        run: python scripts/build_land_summary.py
      # The farmland sale index (data/land/index.json; a section of /land-sales/ since Oct 29, 2026) from the same county
      # files. Offline; refuses output that carries a source name.
      - name: Build the farmland sale index
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.probe || startsWith(inputs.task, 'soil'))) }}
        run: OMP_NUM_THREADS=1 python scripts/build_land_index.py
      # The farm sale pages (/land-sales/: one per IL and WI county, the monthly update, the hub and its
      # sitemap) and their data (data/land-sales/, names only under data/land/names/, robots-blocked).
      # Offline; refuses to write a buyer or seller name outside data/land/.
      - name: Build the farm sale pages
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.probe || startsWith(inputs.task, 'soil'))) }}
        run: python scripts/build_land_sales.py
      - name: Save raw answers to the raw branch
        if: ${{ !cancelled() }}
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_SOFT: '1'
        run: |
          [ -d data/land-raw ] && bash scripts/push_raw.sh "land-data raw answers" data/land-raw || echo "nothing raw"
          # the raw answers live on the raw branch now; out of the tree before the site budget counts it
          rm -rf data/land-raw
      - name: Site budget
        run: python scripts/check_site_budget.py
      - name: Commit if changed (race-tolerant)
        if: ${{ !(github.event_name == 'workflow_dispatch' && startsWith(inputs.task, 'soil')) }}
        run: |
          set -e
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          rm -rf /tmp/ld && mkdir -p /tmp/ld
          [ -d data/land ] && cp -r --parents data/land /tmp/ld/ || true
          [ -d land-sales ] && cp -r --parents land-sales data/land-sales sitemap-land-sales.xml /tmp/ld/ || true
          [ -n "$(ls -A /tmp/ld)" ] || { echo "No output; nothing to commit."; exit 0; }
          BR="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3 4 5; do
            git fetch origin "$BR"
            git reset --hard "origin/$BR"
            mkdir -p data && cp -r /tmp/ld/data/. data/
            [ -d /tmp/ld/land-sales ] && cp -r /tmp/ld/land-sales . && cp /tmp/ld/sitemap-land-sales.xml . || true
            python3 scripts/land_keep_stamp_only.py data/land   # a file whose only change is a timestamp is not data
            git add data/land
            [ -d land-sales ] && git add land-sales data/land-sales sitemap-land-sales.xml || true
            if git diff --staged --quiet; then echo "No change."; exit 0; fi
            git commit -m "Update land data $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            if git push origin "HEAD:$BR"; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push race on attempt $i; re-syncing to origin/$BR..."
            sleep $((RANDOM % 4 + 2))
          done
          echo "Failed to push after 5 attempts."; exit 1
