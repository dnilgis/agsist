name: farmland-atlas-pages

on:
  workflow_run:
    workflows: ["farmland-atlas", "Land data (parcel services + transfers)", "Chapter 12 filings", "Farm credit by Fed district"]
    types: [completed]
  schedule:
    - cron: "41 11 * * 3"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upstream:
    if: github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.u.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/upstream-did-work/
          sparse-checkout-cone-mode: false
      - id: u
        uses: ./.github/actions/upstream-did-work

  build:
    needs: upstream
    if: needs.upstream.outputs.go == '1' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    concurrency:
      group: farmland-atlas-pages
      cancel-in-progress: false
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the card renderer
        run: |
          pip install --quiet playwright==1.63.0 pillow==12.3.0
          python -m playwright install --with-deps chromium

      - name: Selftest (gate)
        run: |
          python scripts/build_atlas_pages.py --selftest
          python scripts/build_atlas_cards.py --selftest

      - name: Build pages
        run: python scripts/build_atlas_pages.py

      - name: Check out the share images
        env:
          AGSIST_DATA_TOKEN: ${{ secrets.AGSIST_DATA_TOKEN }}
        run: bash scripts/agsist_data.sh checkout "$RUNNER_TEMP/agsist-data"

      - name: Draw share images
        run: python scripts/build_atlas_cards.py --out "$RUNNER_TEMP/agsist-data/farmland-atlas/og"

      - name: Push share images to agsist-data
        env:
          AGSIST_DATA_TOKEN: ${{ secrets.AGSIST_DATA_TOKEN }}
        run: bash scripts/agsist_data.sh sync --from "$RUNNER_TEMP/agsist-data" farmland-atlas/og

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          git add -A farmland-atlas data/pointers sitemap-atlas.xml
          git reset -q -- farmland-atlas/compare.html farmland-atlas/sheet.html || true
          python scripts/generated_sets.py dependents farmland-atlas --stage || true
          if git diff --staged --quiet; then echo "no change"; echo "changed=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "pages: rebuild Farmland Atlas county and state pages"
          for i in 1 2 3 4; do
            git rebase --abort 2>/dev/null || true
            if python3 scripts/generated_sets.py pull-rebase farmland-atlas --autostash && git push; then
              echo "changed=1" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep $((30 * i))
          done
          echo "push failed after 4 attempts"; exit 1

      - name: IndexNow ping (best-effort)
        if: steps.commit.outputs.changed == '1'
        continue-on-error: true
        run: |
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"agsist.com","key":"f4a81c26db974e0f92c35b7a6e10d8c4","keyLocation":"https://agsist.com/f4a81c26db974e0f92c35b7a6e10d8c4.txt","urlList":["https://agsist.com/farmland-atlas/states/","https://agsist.com/sitemap-atlas.xml"]}' \
            || echo "IndexNow ping failed - harmless"
