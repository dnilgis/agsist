name: ARC/PLC signup reminder

on:
  schedule:
    - cron: '10 14,17,20 * 11,12,2,3 *'
  workflow_run:
    workflows: ["Fetch Grain Bids", "Tick 11"]
    types: [completed]
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic to mail, e.g. arcplc:2026-12-11 (blank = whatever is due today)"
        type: string
        default: ""
      dry_run:
        description: "Report counts and a preview; send and mark nothing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  gate:
    if: (github.event.workflow_run.name != 'Fetch Grain Bids' || vars.CLOCK_LIVE != '1') && (github.event.workflow_run.name != 'Tick 11' || (contains(github.event.workflow_run.display_title, ' arcplc-reminder.yml ') && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow arcplc-reminder.yml --max-lag 170
          --cron "10 14,17,20 * 11,12,2,3 *"

  remind:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: arcplc-reminder
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
          sparse-checkout: |
            scripts
            arc-plc
            workers
            .github
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checks (gate)
        run: python3 scripts/send_notice.py --selftest
      - name: Send
        env:
          LIST_URL: ${{ secrets.LIST_URL }}
          LIST_TOKEN: ${{ secrets.LIST_TOKEN }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER || secrets.GMAIL_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || secrets.GMAIL_APP_PASS }}
          FROM_ADDR: ${{ secrets.FROM_ADDR }}
          REPLY_TO: ${{ secrets.REPLY_TO }}
          EVENT: ${{ github.event_name }}
          TOPIC: ${{ inputs.topic }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set --
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_run" ] || [ "$DRY" = "false" ]; then set -- --send; fi
          if [ -n "$TOPIC" ]; then set -- "$@" --topic "$TOPIC" --any-day; fi
          python3 scripts/send_notice.py "$@"
