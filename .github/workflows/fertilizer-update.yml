# Fertilizer price refresh — Sig's self-serve form.
# Actions tab > "Fertilizer — update dealer prices" > Run workflow > type the
# new $/ton numbers (leave a box BLANK for "no change") > Run.
# The script shifts every product's `prev` to the last sheet, stamps the date,
# and refuses probable typos (>60% moves) unless force=yes.
name: "Fertilizer — update dealer prices"

on:
  workflow_dispatch:
    inputs:
      urea:   { description: "Urea 46-0-0 $/ton (blank = no change)",        required: false }
      potash: { description: "Potash 0-0-60 $/ton",                          required: false }
      map_s:  { description: "MAP + Sulfur 12-40-0-10S $/ton",               required: false }
      ams:    { description: "Amm. Sulfate 21-0-0-24S $/ton",                required: false }
      kmag:   { description: "K-Mag Premium $/ton",                          required: false }
      lime:   { description: "Pell Lime $/ton",                              required: false }
      force:  { description: "Type yes ONLY to override the typo guard",     required: false, default: "" }

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Selftest gate
        run: python3 scripts/update_fertilizer.py --selftest

      - name: Apply prices
        # Inputs reach the shell only through env, and each must be a number.
        env:
          IN_UREA: ${{ inputs.urea }}
          IN_POTASH: ${{ inputs.potash }}
          IN_MAP_S: ${{ inputs.map_s }}
          IN_AMS: ${{ inputs.ams }}
          IN_KMAG: ${{ inputs.kmag }}
          IN_LIME: ${{ inputs.lime }}
          IN_FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          ARGS=()
          add() {
            [ -z "$2" ] && return 0
            if ! printf '%s' "$2" | grep -Eq '^[0-9]+(\.[0-9]+)?$'; then
              echo "::error::$1 must be a number of dollars per ton"; exit 1
            fi
            ARGS+=("$1" "$2")
          }
          add --urea "$IN_UREA"
          add --potash "$IN_POTASH"
          add --map-s "$IN_MAP_S"
          add --ams "$IN_AMS"
          add --kmag "$IN_KMAG"
          add --lime "$IN_LIME"
          if [ "$IN_FORCE" = "yes" ]; then ARGS+=(--force); fi
          if [ ${#ARGS[@]} -eq 0 ]; then echo "No prices entered — nothing to do."; exit 1; fi
          python3 scripts/update_fertilizer.py "${ARGS[@]}"

      # /manure-value and the Fast Facts manure table carry today's numbers in
      # the HTML (for readers without JavaScript and for search). Rewrite them
      # from the new prices so the baked copy and the live copy agree.
      - name: Bake manure values
        run: node scripts/bake_manure_value.mjs

      - name: Commit
        run: |
          git config user.name  "AGSIST Bot"
          git config user.email "bot@agsist.com"
          git add data/fertilizer.json data/fertilizer-history.json manure-value.html fast-facts.html
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "🧪 Fertilizer prices — $(date -u +'%Y-%m-%d')"
          git pull --rebase --autostash origin main || true
          git push origin main
