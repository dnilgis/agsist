name: Hail alert check

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Evaluate and report without sending"
        type: boolean
        default: false
      date:
        description: "Override swath date (YYYY-MM-DD)"
        required: false
  workflow_run:
    workflows: ["MESH radar hail swaths — daily"]
    types: [completed]

permissions:
  contents: read

jobs:
  upstream:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.u.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/upstream-did-work/
          sparse-checkout-cone-mode: false
      - id: u
        uses: ./.github/actions/upstream-did-work

  check:
    needs: upstream
    runs-on: ubuntu-latest
    concurrency:
      group: alert-check
      cancel-in-progress: false
    if: needs.upstream.outputs.go == '1' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - name: Neither send loop can re-mail the whole list
        run: python3 scripts/test_send_loops.py

      - name: Install geometry lib
        run: pip install shapely==2.2.0 --quiet

      - name: Check watch areas and send alerts
        env:
          LIST_URL: ${{ secrets.LIST_URL }}
          LIST_TOKEN: ${{ secrets.LIST_TOKEN }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER || secrets.GMAIL_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || secrets.GMAIL_APP_PASS }}
          FROM_ADDR: ${{ secrets.FROM_ADDR }}
          FROM_NAME: ${{ secrets.FROM_NAME }}
          REPLY_TO: ${{ secrets.REPLY_TO }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
          ALERT_DATE: ${{ inputs.date }}
        run: python3 scripts/check_alerts.py
