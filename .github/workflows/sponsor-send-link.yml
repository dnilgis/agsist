name: Sponsor report link email

run-name: ${{ inputs.dry_run && 'Sponsor report link email (dry run)' || 'Sponsor report link email' }}

on:
  workflow_dispatch:
    inputs:
      sponsor:
        description: "Sponsor id (the slug in links.json, e.g. rootlot)"
        type: string
        required: true
      resend:
        description: "Send again even if this sponsor's link was already sent"
        type: boolean
        default: false
      dry_run:
        description: "Check the link and the address; send and record nothing"
        type: boolean
        default: false

concurrency:
  group: sponsor-send-link
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checks (gate)
        run: python3 scripts/sponsor_send_link.py --selftest

      - name: Sponsor links and contacts from the private repo
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_BRANCH: private-data
        run: bash scripts/pull_raw.sh private/sponsors

      - name: Send the link
        id: send
        env:
          SPONSOR_ID: ${{ inputs.sponsor }}
          RESEND: ${{ inputs.resend == true && '1' || '0' }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER || secrets.GMAIL_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || secrets.GMAIL_APP_PASS }}
          FROM_ADDR: ${{ secrets.FROM_ADDR }}
          FROM_NAME: ${{ secrets.FROM_NAME }}
          SPONSOR_TO: ${{ secrets.SPONSOR_TO }}
        run: python3 scripts/sponsor_send_link.py

      - name: Save the sent marker
        if: steps.send.outputs.sent == '1'
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_BRANCH: private-data
        run: |
          bash scripts/push_raw.sh "sponsor link sent" private/sponsors/sent && exit 0
          echo "::error::SENT, marker not saved: the email already went out. Do not rerun without resend."
          exit 1
