name: Sponsor report link email
# One sponsor's report link, emailed to that sponsor with a copy to Sig (Sig, Nov 5, 2026).
# By hand only: no schedule. scripts/sponsor_send_link.py reads the signed link from
# private/sponsors/links.json (written by sponsor-report.yml) and the address from
# private/sponsors/contacts.json (<id>.to), both on private-data. A sent marker is saved to
# private/sponsors/sent/<id>.json, so a second run skips unless resend is true.
# The log names ids and counts only: never an address, a name or the link.
# Secrets: PRIVATE_REPO_TOKEN, SMTP_*, FROM_ADDR, FROM_NAME, SPONSOR_TO (Sig's copy, as sponsor-apply.yml).

run-name: ${{ inputs.dry_run && 'Sponsor report link email (dry run)' || 'Sponsor report link email' }}

on:
  workflow_dispatch:
    inputs:
      sponsor:
        description: "Sponsor id (the slug in links.json, e.g. rootlot)"
        type: string
        required: true
      resend:
        description: "Send again even if this sponsor's link was already sent"
        type: boolean
        default: false
      dry_run:
        description: "Check the link and the address; send and record nothing"
        type: boolean
        default: false

concurrency:
  group: sponsor-send-link
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checks (gate)
        run: python3 scripts/sponsor_send_link.py --selftest

      - name: Sponsor links and contacts from the private repo
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_BRANCH: private-data
        run: bash scripts/pull_raw.sh private/sponsors

      - name: Send the link
        id: send
        env:
          SPONSOR_ID: ${{ inputs.sponsor }}
          RESEND: ${{ inputs.resend == true && '1' || '0' }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER || secrets.GMAIL_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || secrets.GMAIL_APP_PASS }}
          FROM_ADDR: ${{ secrets.FROM_ADDR }}
          FROM_NAME: ${{ secrets.FROM_NAME }}
          SPONSOR_TO: ${{ secrets.SPONSOR_TO }}
        run: python3 scripts/sponsor_send_link.py

      # Hard on purpose: if the marker does not land after a send, the run is red, so nobody reruns
      # it and mails the sponsor twice without resend. Runs only after a send (the step output sent=1).
      - name: Save the sent marker
        if: steps.send.outputs.sent == '1'
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_BRANCH: private-data
        run: |
          bash scripts/push_raw.sh "sponsor link sent" private/sponsors/sent && exit 0
          echo "::error::SENT, marker not saved: the email already went out. Do not rerun without resend."
          exit 1
