name: Fetch NASS (RETIRED)

# RETIRED 2026-08-11 (audit panel): this workflow and nass-series.yml both
# wrote data/nass/{corn,soy,wheat}-{yield,acres,price}.json with INCOMPATIBLE
# shapes — this one raw comma-formatted strings ("410,000"), nass-series.yml
# proper numbers with unit division. Whichever ran last won; when this one
# won, the USDA Data Explorer's acres table rendered NaN in every cell.
# nass-series.yml (16th monthly + dispatch) is the single writer now — it is
# strictly better: numeric, selftested, and also builds the *-us national
# series the charts prefer.
#
# This file is a tombstone so a stray manual dispatch cannot resurrect the
# conflict. Delete it (and scripts/fetch_nass.py) via the web UI at leisure —
# both are on the deletion list.

on:
  workflow_dispatch:

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "fetch-nass is retired — data/nass/ is owned by nass-series.yml."
          echo "Dispatch 'NASS long series' instead."
