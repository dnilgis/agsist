name: Schedule guard — the briefing's own shape

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily.yml'
      - '.github/workflows/prices.yml'
      - '.github/workflows/schedule-guard.yml'
      - '.github/workflows/weekend-heartbeat.yml'
      - 'scripts/test_daily_schedule.py'
      - 'scripts/test_briefing_gate.py'
  pull_request:
    paths:
      - '.github/workflows/daily.yml'
      - '.github/workflows/weekend-heartbeat.yml'
      - 'scripts/test_daily_schedule.py'
  schedule:
    - cron: '37 14 * * 1'
  workflow_dispatch:

concurrency:
  group: schedule-guard-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: America/Chicago

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test dependencies
        run: python3 -m pip install --quiet pyyaml

      - name: The gate, driven through every event shape
        run: python3 scripts/test_briefing_gate.py

      - name: The schedule's shape
        run: python3 scripts/test_daily_schedule.py
