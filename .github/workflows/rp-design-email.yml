name: Rain Print design email
# "Email me this design" on /rain-print (scripts/rp_design_email.py, Sig
# 2026-10-20): the link to the reader's own design at once, and one reminder
# the next day unless a paid order matches it, then nothing. The subs worker
# (v5.43, POST /rp-remind) keeps each ask 7 days and starts this job on every
# new one through the GitHub API (worker secret GH_DISPATCH_TOKEN). The log
# prints counts only.
#
# HOURLY (Sig OK'd Oct 21, 2026) so "one reminder tomorrow" goes on time; a run
# with nothing due sends nothing. The worker asks for a dry run (every email to
# Sig, nothing marked) unless its variable RP_DESIGN_EMAIL_LIVE is "1"; an hourly
# run is live only when the repository variable RP_DESIGN_EMAIL_LIVE is "1" too.
# Secrets: LIST_URL, LIST_TOKEN, SMTP_USER, SMTP_PASS (or GMAIL_USER,
# GMAIL_APP_PASS). Optional: SMTP_HOST, SMTP_PORT, FROM_ADDR, SIG_TO.

on:
  schedule:
    - cron: '23 * * * *'
  # GitHub's scheduler drops scheduled fires (it never started land-data.yml on Nov 3, 2026;
  # scripts/cron_gate.py has the numbers). So this also runs after every "Fetch Grain Bids"
  # (cron-job.org, every 15 minutes), and the gate job lets the first run after each tick of the
  # cron above, by either trigger, do the work within 50 minutes
  # (closing before the next tick of the schedule).
  # Every other run skips in seconds. A chained run takes the scheduled path. A run by hand or
  # a push does not use up the tick (cron_gate.py MANUAL_DOES_NOT_SERVE): it may take narrower
  # inputs, and the chained run that follows is the same idempotent job.
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Send each new ask's emails to Sig only and mark nothing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # One run per tick of the schedule (see on: above). Sparse: the skip costs seconds.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow rp-design-email.yml --max-lag 50
          --cron "23 * * * *"

  run:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: rp-design-email
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Checks (gate)
        run: |
          python3 scripts/rp_design_email.py --selftest
          node scripts/test_rp_remind_worker.mjs
      - name: Run
        env:
          LIST_URL: ${{ secrets.LIST_URL }}
          LIST_TOKEN: ${{ secrets.LIST_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER || secrets.GMAIL_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || secrets.GMAIL_APP_PASS }}
          FROM_ADDR: ${{ secrets.FROM_ADDR }}
          RP_FROM_NAME: ${{ vars.RP_FROM_NAME }}
          SIG_TO: ${{ secrets.SIG_TO }}
          DRY_RUN: ${{ ((github.event_name == 'schedule' || github.event_name == 'workflow_run') && vars.RP_DESIGN_EMAIL_LIVE == '1') && '' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) && '' || '1' }}
        run: python3 scripts/rp_design_email.py
