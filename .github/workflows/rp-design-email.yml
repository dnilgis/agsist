name: Rain Print design email
# Rain Print design email.

on:
  schedule:
    - cron: '23 * * * *'
  # cron above, by either trigger, do the work within 50 minutes
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Send each new ask's emails to Sig only and mark nothing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow rp-design-email.yml --max-lag 50
          --cron "23 * * * *"

  run:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: rp-design-email
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Checks (gate)
        run: |
          python3 scripts/rp_design_email.py --selftest
          node scripts/test_rp_remind_worker.mjs
      - name: Run
        env:
          LIST_URL: ${{ secrets.LIST_URL }}
          LIST_TOKEN: ${{ secrets.LIST_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER || secrets.GMAIL_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || secrets.GMAIL_APP_PASS }}
          FROM_ADDR: ${{ secrets.FROM_ADDR }}
          RP_FROM_NAME: ${{ vars.RP_FROM_NAME }}
          SIG_TO: ${{ secrets.SIG_TO }}
          DRY_RUN: ${{ !(((github.event_name == 'schedule' || github.event_name == 'workflow_run') && vars.RP_DESIGN_EMAIL_LIVE == '1') || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)) && '1' || '' }}
        run: python3 scripts/rp_design_email.py
