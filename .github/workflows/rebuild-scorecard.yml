name: Rebuild Call Scorecard

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-scorecard
  cancel-in-progress: false

jobs:
  rebuild:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install feedparser==6.0.14 requests==2.34.2

      - name: Prove the grading rule before rebuilding on it
        run: |
          python scripts/contract_calendar.py
          python scripts/test_grade_calls.py

      - name: Rebuild the scorecard
        run: python scripts/build_scorecard.py

      - name: Bake the numbers into usda-calendar.html
        run: python scripts/prerender_wpi_scorecard.py

      - name: Commit and push
        run: |
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          git add data/scorecard.json usda-calendar.html || true
          git diff --staged --quiet || git commit -m "Rebuild call scorecard — session-aware grading"
          pushed=0
          for n in 1 2 3 4 5; do
            if git push; then pushed=1; break; fi
            echo "Push race on attempt $n; rebasing..."
            git pull --rebase origin main || { echo "Rebase failed."; exit 1; }
            sleep $((RANDOM % 4 + 2))
          done
          [ "$pushed" = 1 ] || { echo "Failed to push after 5 attempts."; exit 1; }
