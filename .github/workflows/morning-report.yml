name: Morning report

on:
  schedule:
    - cron: '40 11,12 * * *'
  workflow_run:
    workflows: ["Tick 04"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the email to the log (counts only); send nothing"
        type: boolean
        default: false

concurrency:
  group: ${{ github.event.workflow_run.name == 'Tick 04' && !contains(github.event.workflow_run.display_title, ' morning-report.yml ') && format('morning-report-{0}', github.run_id) || 'morning-report' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    if: github.event.workflow_run.name != 'Tick 04' || contains(github.event.workflow_run.display_title, ' morning-report.yml ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go == '1' && steps.c.outputs.go == '1' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            scripts/morning_report.py
            scripts/form_digest.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow morning-report.yml --max-lag 180
          --cron "40 11 * * *"
          --cron "40 12 * * *"
      - id: c
        run: python3 scripts/morning_report.py --gate

  report:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
          sparse-checkout: |
            /scripts/
            /data/*.json
            /test/fixtures/today-bids-index-*.json.gz
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checks (gate)
        run: |
          python3 scripts/morning_report.py --selftest
          python3 scripts/form_digest.py --selftest
      - name: Earlier mornings' counts
        uses: actions/cache/restore@v4
        with:
          path: .morning-report
          key: morning-report-counts-${{ github.run_id }}
          restore-keys: morning-report-counts-
      - name: Install the GA4 client
        run: pip install --quiet google-analytics-data==0.23.3 google-auth==2.62.0
      - name: Get the job health file (private repo)
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_BRANCH: private-data
          RAW_SOFT: '1'
        run: bash scripts/pull_raw.sh private/data/cron-health.json
      - name: Get the re-test engine summary (private repo)
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_BRANCH: private-data
          RAW_SOFT: '1'
        run: bash scripts/pull_raw.sh private/ledger/tests/latest.json
      - name: Get the to-do list (private repo)
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_BRANCH: private-data
          RAW_SOFT: '1'
        run: bash scripts/pull_raw.sh private/todo.md
      - name: Build and send
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT: ${{ secrets.GA4_SERVICE_ACCOUNT }}
          GITHUB_TOKEN: ${{ github.token }}
          BIDS_READ_TOKEN: ${{ secrets.BIDS_READ_TOKEN }}
          STRIPE_READ_KEY: ${{ secrets.STRIPE_READ_KEY }}
          LIST_URL: ${{ secrets.LIST_URL }}
          LIST_TOKEN: ${{ secrets.LIST_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER || secrets.GMAIL_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || secrets.GMAIL_APP_PASS }}
          FROM_ADDR: ${{ secrets.FROM_ADDR }}
          FROM_NAME: ${{ secrets.FROM_NAME }}
          FORMS_TO: ${{ secrets.FORMS_TO }}
          SPONSOR_TO: ${{ secrets.SPONSOR_TO }}
          TODO_EDIT_URL: ${{ vars.TODO_EDIT_URL }}
          SNAPSHOT: .morning-report/counts.json
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
        run: python3 scripts/morning_report.py
      - name: Reader counts by area to the private-data branch
        if: ${{ !cancelled() && inputs.dry_run != true }}
        continue-on-error: true
        env:
          LIST_URL: ${{ secrets.LIST_URL }}
          LIST_TOKEN: ${{ secrets.LIST_TOKEN }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_BRANCH: private-data
          RAW_SOFT: '1'
        run: |
          python3 scripts/reader_area_counts.py || { echo "::warning::reader counts by area not taken"; exit 0; }
          if ls private/data/reader-area/*/*.json >/dev/null 2>&1; then
            bash scripts/push_raw.sh "reader counts by area" private/data/reader-area
          fi
      - name: Keep today's counts
        if: always() && inputs.dry_run != true
        uses: actions/cache/save@v4
        with:
          path: .morning-report
          key: morning-report-counts-${{ github.run_id }}

  change-ledger:
    needs: gate
    if: needs.gate.outputs.go == '1' && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    concurrency:
      group: bid-change-ledger
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
          sparse-checkout: |
            /scripts/
            /data/ids/
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Yesterday's bid changes to the private-data branch
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          NIGHTLY: '1'
          MAX_MINUTES: '30'
          RAW_SOFT: '1'
        run: |
          python3 scripts/bid_change_ledger.py --selftest > /dev/null || { echo "::warning::bid change ledger selftest failed; not run"; exit 0; }
          bash scripts/bid_change_ledger.sh || echo "::warning::bid change ledger did not finish; the next morning carries on from the saved state"

  insight-retest:
    needs: gate
    if: needs.gate.outputs.go == '1' && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    concurrency:
      group: insight-retest
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
          sparse-checkout: |
            /scripts/
            /data/ids/
            /data/nass/corn-yield*
            /data/basis/changes-*
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numpy
        run: pip install --quiet --disable-pip-version-check numpy==2.5.4
      - name: Re-test the registered relationships (private-data branch only)
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_SOFT: '1'
        run: |
          python3 scripts/insight_engine.py --selftest > /dev/null || { echo "::warning::re-test engine selftest failed; not run"; exit 0; }
          bash scripts/insight_engine.sh || echo "::warning::re-test engine did not finish; it catches up on a later morning"
