name: Regrade Archive Pages

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regrade-archive
  cancel-in-progress: false

jobs:
  regrade:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install feedparser==6.0.14 requests==2.34.2

      - name: Prove the rule before rewriting 185 files with it
        run: |
          python scripts/contract_calendar.py
          python scripts/test_grade_calls.py
          python scripts/regrade_archive.py --selftest

      - name: Regrade the archive JSON
        run: python scripts/regrade_archive.py | tee /tmp/regrade.txt

      - name: Re-render only the pages that changed
        run: |
          DATES=$(grep -oE '^  \[(fix |drop)\] [0-9]{4}-[0-9]{2}-[0-9]{2}' /tmp/regrade.txt \
                  | awk '{print $NF}' | sort -u)
          if [ -z "$DATES" ]; then echo "nothing changed; no pages to render"; exit 0; fi
          echo "re-rendering: $DATES"
          python scripts/rebuild_archive_html.py $DATES

      - name: The pages must now agree with the record
        run: python scripts/regrade_archive.py --check

      - name: Commit and push
        run: |
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          git add data/daily-archive daily || true
          git diff --staged --quiet || git commit -m "Regrade archive pages to the session-aware rule"
          pushed=0
          for n in 1 2 3 4 5; do
            if git push; then pushed=1; break; fi
            echo "Push race on attempt $n; rebasing..."
            git pull --rebase origin main || { echo "Rebase failed."; exit 1; }
            sleep $((RANDOM % 4 + 2))
          done
          [ "$pushed" = 1 ] || { echo "Failed to push after 5 attempts."; exit 1; }
