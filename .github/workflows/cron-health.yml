name: Cron health

# DID THE JOBS READERS DEPEND ON ACTUALLY RUN?
#
# GitHub's scheduler delivered 13.7% of this repository's scheduled fires over
# 2026-10-02 to 10-09, and a dropped fire leaves nothing behind: no red run,
# just a page that stops moving. The COT watcher missed its whole window three
# days running before anyone saw it. scripts/cron_health.py checks each
# time-critical workflow against its own clock and writes cron-health.json.
# This run goes red when a critical one is late.
#
# It runs after every "Fetch Grain Bids" (cron-job.org, every 15 minutes) and
# its gate keeps that to one check every half hour. The cron is the fallback.
# If cron-job.org itself stops, this goes quiet with it; that is what the
# fallback cron is for, and why Fetch Grain Bids is the first row it checks.
#
# It also measures what GitHub Pages publishes (scripts/check_site_budget.py):
# a warn row past 850 MB and a red one past 900 MB, before the 1 GB limit where
# Pages stops deploying and the site freezes. A folder-budgets row warns at 90%
# of any folder's budget there (red past it).
#
# Watching the watchers (2026-10-20): daily-site-check.yml and this workflow
# are rows, and a stale cron-health.json (older than 8 h) is a red row
# that daily-site-check.yml, on GitHub's cron rather than cron-job.org, reports.
#
# THE PRIVATE REPO (2026-10-20, Sig). No page reads the file, so it is saved to
# the private repo dnilgis/agsistretired (branch private-data,
# private/data/cron-health.json), not main. The PRIVATE_REPO_TOKEN secret also
# feeds two rows: private-repo-key (red when the key fails; warns when it
# expires within 14 days, from the github-authentication-token-expiration
# header) and private-raw-saves (warns when no save has reached the private raw
# branch for 80 h). The morning email shows both. Saved only when a status
# changes or every six hours.

on:
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]
  schedule:
    - cron: '26 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cron-health
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/cron_gate.py
          sparse-checkout-cone-mode: false
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow cron-health.yml --max-lag 30
          --cron "26,56 * * * *"

  check:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Prove the checks
        run: |
          python3 scripts/cron_gate.py --selftest
          python3 scripts/check_site_budget.py --selftest
          python3 scripts/cron_health.py --selftest

      # The last saved file: its age is the cron-health.json row, and the new
      # one is saved only when a status changed. Missing, the check still runs
      # (that row reads unknown, the save goes ahead).
      - name: Get the last health file (private repo)
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_BRANCH: private-data
          RAW_SOFT: '1'
        run: bash scripts/pull_raw.sh private/data/cron-health.json

      - name: Check every clock
        id: h
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: python3 scripts/cron_health.py --out private/data/cron-health.json

      - name: Save
        if: steps.h.outputs.commit == '1'
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_BRANCH: private-data
          RAW_SOFT: '1'
        run: bash scripts/push_raw.sh "cron health" private/data/cron-health.json

      - name: Late
        if: steps.h.outputs.red == '1'
        run: |
          echo "::error::Time-critical check failed (a workflow past its clock, or published-size over budget): ${{ steps.h.outputs.late }}"
          echo "See private/data/cron-health.json (private repo, branch private-data) or the log above for which tick was missed and why."
          exit 1
