name: Cron health

on:
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]
  schedule:
    - cron: '26 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cron-health
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
      late: ${{ steps.late.outputs.go }}
      rehearse: ${{ steps.rehearse.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow cron-health.yml --max-lag 30
          --cron "26,56 * * * *"
      - id: late
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow cron-health.yml --max-lag 45
          --cron "15 12,13 * * *"
      - id: rehearse
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow cron-health.yml --max-lag 45
          --cron "41 0 * * *"

  daily-late:
    needs: gate
    if: needs.gate.outputs.late == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            /scripts/
            /data/daily-sent/
            /.github/workflows/daily.yml
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - name: Has today's Daily gone out
        env:
          GH_TOKEN:           ${{ github.token }}
          LIST_URL:           ${{ secrets.LIST_URL }}
          LIST_TOKEN:         ${{ secrets.LIST_TOKEN }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          OWNER_TO:           ${{ secrets.SIG_TO }}
          SMTP_HOST:          ${{ secrets.SMTP_HOST }}
          SMTP_PORT:          ${{ secrets.SMTP_PORT }}
          SMTP_USER:          ${{ secrets.SMTP_USER || secrets.GMAIL_USER }}
          SMTP_PASS:          ${{ secrets.SMTP_PASS || secrets.GMAIL_APP_PASS }}
          FROM_ADDR:          ${{ secrets.FROM_ADDR }}
          TZ: America/Chicago
        run: python3 scripts/daily_late.py check

  daily-rehearsal:
    needs: gate
    if: needs.gate.outputs.rehearse == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install feedparser==6.0.14 requests==2.34.2 pillow==12.3.0 pyyaml==6.0.2
      - name: Rehearse tomorrow's Daily
        env:
          OWNER_TO:  ${{ secrets.SIG_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER || secrets.GMAIL_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || secrets.GMAIL_APP_PASS }}
          FROM_ADDR: ${{ secrets.FROM_ADDR }}
          TZ: America/Chicago
        run: python scripts/daily_rehearsal.py

  check:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - name: Prove the checks
        run: |
          python3 scripts/cron_gate.py --selftest
          python3 scripts/check_site_budget.py --selftest
          python3 scripts/cron_health.py --selftest
          python3 scripts/delivery_check.py --selftest
          python3 scripts/send_cap.py --selftest

      - name: Get the last health file (private repo)
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_BRANCH: private-data
          RAW_SOFT: '1'
        run: bash scripts/pull_raw.sh private/data/cron-health.json

      - name: Check every clock
        id: h
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ENGINE_MODE: ${{ vars.ENGINE_MODE }}
          CUSTOMRATES_NOTICE_LIVE: ${{ vars.CUSTOMRATES_NOTICE_LIVE }}
          DAIRY_MONTHLY_LIVE: ${{ vars.DAIRY_MONTHLY_LIVE }}
          FUNDS_WEEKLY_LIVE: ${{ vars.FUNDS_WEEKLY_LIVE }}
          LANDSALES_MONTHLY_LIVE: ${{ vars.LANDSALES_MONTHLY_LIVE }}
          RAIN_MONTHLY_LIVE: ${{ vars.RAIN_MONTHLY_LIVE }}
          RP_BUYER_EMAIL_LIVE: ${{ vars.RP_BUYER_EMAIL_LIVE }}
          RP_DESIGN_EMAIL_LIVE: ${{ vars.RP_DESIGN_EMAIL_LIVE }}
          SEND_DAILY_CAP: ${{ vars.SEND_DAILY_CAP }}
          BREVO_MONTHLY: ${{ vars.BREVO_MONTHLY }}
          BREVO_RENEW_DAY: ${{ vars.BREVO_RENEW_DAY }}
        run: python3 scripts/cron_health.py --out private/data/cron-health.json

      - name: Save
        if: steps.h.outputs.commit == '1'
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_BRANCH: private-data
          RAW_SOFT: '1'
        run: bash scripts/push_raw.sh "cron health" private/data/cron-health.json

      - name: Late
        if: steps.h.outputs.red == '1'
        run: |
          echo "::error::Time-critical check failed (a workflow past its clock, a reader email not delivered, or published-size over budget): ${{ steps.h.outputs.late }}"
          echo "See private/data/cron-health.json (private repo, branch private-data) or the log above for which tick was missed and why."
          exit 1
