name: fetch-fsa-arcplc

on:
  workflow_dispatch:
  schedule:
    - cron: "37 13 * * 1"
  workflow_run:
    workflows: ["Tick 10"]
    types: [completed]
permissions:
  contents: write
jobs:
  gate:
    if: github.event.workflow_run.name != 'Tick 10' || contains(github.event.workflow_run.display_title, ' fetch-fsa-arcplc.yml ')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow fetch-fsa-arcplc.yml --max-lag 360
          --cron "37 13 * * 1"

  fetch:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - name: Find and download the program data files
        run: |
          set -u
          mkdir -p data/fsa
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          PAGE="https://www.fsa.usda.gov/resources/programs/arc-plc/program-data"
          curl -sSL --retry 4 --retry-delay 30 --retry-all-errors -m 60 -A "$UA" "$PAGE" -o /tmp/pd.html
          echo "page bytes: $(wc -c < /tmp/pd.html)"
          grep -o -i -E 'href="[^"]+"' /tmp/pd.html | sed 's/href="//;s/"$//' | sort -u > /tmp/all.txt
          echo "--- every link mentioning 2025, 2026 or 2027:"; grep -E '202[5-7]' /tmp/all.txt || true
          grep -i -E '\.(xlsx|xls|csv|pdf)([?#].*)?$|/media/|/documents/|/files/' /tmp/all.txt > /tmp/links.txt || true
          echo "--- file links:"; wc -l < /tmp/links.txt
          grep -i -E 'arc.?co|bench|ta_yield|trend|plc_county|county.?yield|erp|effective|mya|t.?yield' /tmp/links.txt | grep -E '202[3-7]' > /tmp/want.txt || true
          echo "--- downloading:"; cat /tmp/want.txt
          : > data/fsa/manifest.tsv
          while read -r l; do
            case "$l" in http*) u="$l";; /*) u="https://www.fsa.usda.gov$l";; *) u="https://www.fsa.usda.gov/$l";; esac
            f="data/fsa/$(basename "${u%%\?*}" | sed 's/%20/_/g; s/[^A-Za-z0-9._-]/_/g')"
            if curl -sSL --retry 3 --retry-delay 20 --retry-all-errors -m 120 -A "$UA" "$u" -o "$f"; then
              printf '%s\t%s\t%s\t%s\n' "$(date -u +%FT%TZ)" "$f" "$(wc -c < "$f")" "$u" >> data/fsa/manifest.tsv
              echo "ok $f $(wc -c < "$f")"
            else echo "FAILED $u"; fi
          done < /tmp/want.txt
          for p in data/fsa/*; do
            case "$p" in *.xlsx|*.xls|*.pdf|*.csv|*.zip|*/manifest.tsv) continue;; esac
            if head -c 200 "$p" | grep -qi '<!doctype html'; then
              grep -o -i -E 'https://www\.fsa\.usda\.gov/sites/default/files/[^"<> ]+\.(xlsx|xls|csv|pdf|zip)' "$p" | sort -u | while read -r u; do
                n="data/fsa/$(basename "$u" | sed 's/%20/_/g; s/%28/(/g; s/%29/)/g; s/[^A-Za-z0-9._-]/_/g')"
                if curl -sSL --retry 3 --retry-delay 20 --retry-all-errors -m 120 -A "$UA" "$u" -o "$n"; then
                  printf '%s\t%s\t%s\t%s\n' "$(date -u +%FT%TZ)" "$n" "$(wc -c < "$n")" "$u" >> data/fsa/manifest.tsv; echo "file $n $(wc -c < "$n")"
                fi
              done
              rm -f "$p"
            fi
          done
          grep -v -E '\tdata/fsa/[^\t.]+\t' data/fsa/manifest.tsv > /tmp/m && mv /tmp/m data/fsa/manifest.tsv || true
          cat data/fsa/manifest.tsv
      - name: Commit
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          git config user.name "agsist-bot"; git config user.email "bot@agsist.com"
          bash scripts/push_raw.sh "FSA ARC/PLC files" data/fsa
          git add data/fsa/manifest.tsv
          if git diff --cached --quiet; then echo "no change on main"; exit 0; fi
          git commit -m "data: FSA ARC/PLC program data files manifest [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || { echo "Rebase failed."; exit 1; }
            if git push; then echo "Pushed on attempt $i."; exit 0; fi
            sleep 5
          done
          echo "Failed to push after 5 attempts."; exit 1
