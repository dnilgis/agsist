name: Analytics Guard on Generated Pages

# 2026-10-01. The upload kit puts the privacy guard on the root pages, the
# generators and components/analytics.html. The ~3,450 generated pages
# (farmland-atlas/, daily/, rent/) are too many for a web upload, so this job
# applies the same one-line replacement inside the repository and commits it.
# It runs by itself when build/ga_guard_pages.py is uploaded, and can be run
# again by hand from the Actions tab. Running it twice changes nothing.

on:
  push:
    paths:
      - "build/ga_guard_pages.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ga-guard-pages
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply the guard and commit (race-tolerant)
        run: |
          set -e
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          BR="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3 4 5; do
            git fetch origin "$BR"
            git reset --hard "origin/$BR"
            python build/ga_guard_pages.py
            git add farmland-atlas daily rent
            if git diff --staged --quiet; then echo "No change."; python build/ga_guard_pages.py --check; exit 0; fi
            git commit -m "Analytics guard on generated pages $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if git push origin "HEAD:$BR"; then echo "Pushed on attempt $i."; python build/ga_guard_pages.py --check; exit 0; fi
            echo "Push race on attempt $i; re-syncing to origin/$BR..."
            sleep $((RANDOM % 4 + 2))
          done
          echo "Failed to push after 5 attempts."; exit 1
