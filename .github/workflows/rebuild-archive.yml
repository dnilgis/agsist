name: Rebuild Archive HTML (one-time)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-archive
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install feedparser==6.0.14 requests==2.34.2

      - name: Rebuild all archive pages
        run: python scripts/rebuild_archive_html.py

      - name: Commit and push
        run: |
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          git add daily/
          git diff --staged --quiet || git commit -m "🔧 Rebuild archive HTML — markdown fix + GA4 backfill"
          pushed=0
          for n in 1 2 3 4 5; do
            if git push; then pushed=1; break; fi
            echo "Push race on attempt $n; rebasing..."
            git pull --rebase origin main || { echo "Rebase failed."; exit 1; }
            sleep $((RANDOM % 4 + 2))
          done
          [ "$pushed" = 1 ] || { echo "Failed to push after 5 attempts."; exit 1; }
