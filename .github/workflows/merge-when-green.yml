name: merge-when-green
# merge-when-green.

on:
  workflow_run:
    workflows: [pr-checks]
    types: [completed]
  pull_request_target:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: merge-when-green
  cancel-in-progress: false

jobs:
  merge:
    name: merge when green
    if: github.event_name != 'pull_request_target' || github.event.label.name == 'merge-when-green'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Python packages
        run: pip install --quiet --disable-pip-version-check pyyaml==6.0.2
      - name: merge the green ones
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/dev/merge_when_green.py
