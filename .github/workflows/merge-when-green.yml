name: merge-when-green

on:
  workflow_run:
    workflows: [pr-checks]
    types: [completed]
  pull_request_target:
    types: [labeled]
  # a service worker note that reached main by a hand merge: the bot sets the number on its next pass
  push:
    branches: [main]
    paths: ['.github/sw-next/**']
  workflow_dispatch:
    inputs:
      dry_run:
        description: print what it would do (comments, engine pushes, merges, the service worker commit); change nothing
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: merge-when-green
  cancel-in-progress: false

jobs:
  merge:
    name: merge when green
    if: github.event_name != 'pull_request_target' || github.event.label.name == 'merge-when-green'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.13'
      - name: Python packages
        run: pip install --quiet --disable-pip-version-check pyyaml==6.0.2
      - name: merge the green ones
        env:
          GH_TOKEN: ${{ github.token }}
          # the engine repository: read the same-named branch, push the squash to its default branch (never force)
          ENGINE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
        run: python3 scripts/dev/merge_when_green.py
