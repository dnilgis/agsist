name: Build National Basis Map

# NO LONGER ON A SCHEDULE, ON PURPOSE.
#
# This job used to check out the repo and read the committed data/bids.json.
# That file is now the SLIM browser copy - a few hundred bids, only the ones
# the futures pages can select - and a national basis map built from it would
# average two or three elevators per state and look entirely plausible.
#
# build_basis_map.py refuses to run on it (it checks the `full` flag in the
# file, not the filename), so the old schedule would simply have gone red
# twice an hour. The map is now built inside fetch_bids.yml, in the same job
# as the fetch, while the full file still exists on the runner.
#
# Kept as dispatch-only because the refusal message is the documentation: run
# it by hand and it tells you exactly why it will not build.

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bids-and-basis
  cancel-in-progress: false

jobs:
  build-basis-map:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build basis map from latest cash bids
        run: python scripts/build_basis_map.py

      - name: Commit basis-map.json if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/basis-map.json
          if git diff --cached --quiet; then
            echo "No basis change — nothing to commit."
          else
            git commit -m "Update national basis map [skip ci]"
            git pull --rebase --autostash origin main || true
            git push
          fi
