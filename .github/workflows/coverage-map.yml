name: Coverage map — the elevator directory, drawn

# /list-your-elevator#coverage (was /elevators) shows every grain elevator AGSIST tracks: green where we read the
# elevator's own board, grey where it is still in the queue. The source of
# truth is dnilgis/bids, which publishes its directory to GitHub Pages, so this
# repository holds no copy of the elevator list — it renders one.
#
# Daily, at 7:38 Central, off the hour. GitHub's scheduler is most congested at
# :00 and this repository has measured what that costs.

on:
  schedule:
    - cron: '38 12 * * *'
  # GitHub's scheduler drops scheduled fires (it never started land-data.yml on Nov 3, 2026;
  # scripts/cron_gate.py has the numbers). So this also runs after every "Fetch Grain Bids"
  # (cron-job.org, every 15 minutes), and the gate job lets the first run after each tick of the
  # cron above, by either trigger, do the work within 360 minutes
  # (six hours, the same day and well before the next tick).
  # Every other run skips in seconds. A chained run takes the scheduled path. A run by hand or
  # a push does not use up the tick (cron_gate.py MANUAL_DOES_NOT_SERVE): it may take narrower
  # inputs, and the chained run that follows is the same idempotent job.
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_coverage_map.mjs'
      - 'list-your-elevator.html'

env:
  TZ: America/Chicago

jobs:
  # One run per tick of the schedule (see on: above). Sparse: the skip costs seconds.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow coverage-map.yml --max-lag 360
          --cron "38 12 * * *"

  build:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: coverage-map
      cancel-in-progress: false
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Hand-worked answers first. If the bucketing is wrong, the map is
      # wrong quietly, so this runs before anything talks to the network.
      - name: Selftest the builder
        run: node scripts/build_coverage_map.mjs --selftest

      # The builder refuses to write an empty map rather than committing one:
      # a directory that comes back with no elevators is a fetch that failed,
      # and an empty coverage map is worse than yesterday's. It also refuses a
      # partial pass. bids' directory records ONE fetch pass, and a source that
      # pass did not reach comes back indistinguishable from an elevator with
      # no reader; publishing that undercounts the green. The builder samples a
      # few passes, keeps the best, and fails this step rather than write a
      # number it cannot stand behind. A red X here means yesterday's map is
      # still up, which is the intended outcome.
      - name: Build the coverage data from the bids directory
        run: node scripts/build_coverage_map.mjs

      - name: Commit
        run: |
          git config user.name  "agsist-bot"
          git config user.email "bot@agsist.com"
          git add data/elevator-coverage.json data/elevator-coverage-counts.json
          if git diff --cached --quiet; then
            echo "coverage unchanged"
            exit 0
          fi
          n=$(node -e "console.log(require('./data/elevator-coverage.json').counts.read)")
          k=$(node -e "console.log(require('./data/elevator-coverage.json').counts.known)")
          r=$(node -e "console.log(require('./data/elevator-coverage.json').counts.readers)")
          u=$(node -e "console.log(require('./data/elevator-coverage.json').counts.unreported)")
          git commit -m "coverage: $n of $r readers answered, $u did not, $k in the queue [skip ci]"
          for i in 1 2 3; do
            git push && break
            git pull --rebase --autostash && sleep 3
          done
