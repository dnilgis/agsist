name: Render audit — what a farmer's browser actually gets
# Render audit: what a farmer's browser actually gets.

on:
  schedule:
    - cron: '40 11 * * *'
  workflow_dispatch:
    inputs:
      pages:
        description: 'Space-separated paths (blank = the default set). "--all" audits every URL in sitemap.xml.'
        required: false
        default: ''
      base:
        description: 'Base URL to audit'
        required: false
        default: 'https://agsist.com'

concurrency:
  group: render-audit
  cancel-in-progress: false

env:
  TZ: America/Chicago

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install a real browser
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Audit
        id: audit
        continue-on-error: true
        env:
          IN_PAGES: ${{ inputs.pages }}
          IN_BASE: ${{ inputs.base || 'https://agsist.com' }}
        run: |
          if ! printf '%s' "$IN_BASE" | grep -Eq '^https://[A-Za-z0-9.-]+(:[0-9]+)?/?$'; then
            echo "::error::base must be https://host"; exit 1
          fi
          ARGS=()
          if [ -n "$IN_PAGES" ]; then
            read -r -a PAGES <<< "$IN_PAGES"
            for p in "${PAGES[@]}"; do
              if [ "$p" = "--all" ]; then ARGS+=(--all)
              elif printf '%s' "$p" | grep -Eq '^/?[A-Za-z0-9._/-]*$'; then ARGS+=(--page "$p")
              else echo "::error::not a page path"; exit 1; fi
            done
          fi
          node scripts/audit-site.mjs --base "$IN_BASE" "${ARGS[@]}"

      - name: Keep the record
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_BRANCH: private-data
          RAW_SOFT: '1'
        run: |
          HIGH=$(python3 -c "import json;print(json.load(open('private/data/audit.json'))['high'])" 2>/dev/null || echo "?")
          bash scripts/push_raw.sh "audit: $HIGH high finding(s)" private/data/audit.json

      - name: Email, if the site is broken
        if: steps.audit.outcome == 'failure'
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER || secrets.GMAIL_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || secrets.GMAIL_APP_PASS }}
          FROM_ADDR: ${{ secrets.FROM_ADDR }}
          ALERT_TO:  ${{ secrets.ALERT_TO }}
        run: |
          python3 - <<'PY'
          import json, os, smtplib, ssl
          from email.message import EmailMessage
          try:
              d = json.load(open("private/data/audit.json"))
          except Exception:
              raise SystemExit(0)
          high = [f for f in d.get("findings", []) if f["sev"] == "high"]
          if not high:
              raise SystemExit(0)
          host = (os.environ.get("SMTP_HOST") or "").strip()
          to   = (os.environ.get("ALERT_TO") or "").strip()
          if not host or not to:
              print("::warning::no SMTP settings — audit findings not emailed")
              raise SystemExit(0)
          body = ["The render audit found %d high finding(s) on %s.\n" % (len(high), d["base"])]
          for f in high[:25]:
              body.append("  %-16s %-12s %s" % (f["page"], f["kind"], f["detail"]))
          body.append("\nFull report: the run summary in Actions, and private/data/audit.json in the private repo.")
          m = EmailMessage()
          m["Subject"] = "agsist: render audit found %d problem(s)" % len(high)
          sender = (os.environ.get("FROM_ADDR") or "").strip() or (os.environ.get("SMTP_USER") or "").strip() or to
          if "@" not in sender:
              print("::warning::FROM_ADDR is required when SMTP_USER is not an address; audit findings not emailed")
              raise SystemExit(0)
          m["From"] = sender
          m["To"] = to
          text = "\n".join(body)
          try:
              import sys; sys.path.insert(0, "scripts")
              import email_links
              text = email_links.scrub_text(text)
          except ImportError:
              text = text.replace(".workers.dev", " worker")
          m.set_content(text)
          try:
              port = int(os.environ.get("SMTP_PORT") or 587)
              s = smtplib.SMTP(host, port, timeout=30)
              s.starttls(context=ssl.create_default_context())
              s.login(os.environ["SMTP_USER"], os.environ["SMTP_PASS"])
              s.send_message(m); s.quit()
              print("emailed the audit findings")
          except Exception as e:
              print("::warning::could not send the audit email (%s)" % type(e).__name__)
          PY

      - name: Go red if the site is broken
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::error::the render audit found high-severity problems — see the job summary"
          exit 1
