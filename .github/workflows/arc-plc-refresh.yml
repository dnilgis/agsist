
name: ARC/PLC refresh

on:
  schedule:
    - cron: "23 22 * * 1"
    - cron: "23 6 12 12 *"
    - cron: "23 6 16 3 *"
  workflow_run:
    workflows: ["WASDE watch — grade the report as it lands"]
    types: [completed]
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Take a new futures snapshot first"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  upstream:
    if: github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.u.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/upstream-did-work/
          sparse-checkout-cone-mode: false
      - id: u
        uses: ./.github/actions/upstream-did-work

  gate:
    needs: upstream
    if: needs.upstream.outputs.go == '1' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      go: ${{ steps.g.outputs.go }}
      snap: ${{ steps.g.outputs.snap }}
    steps:
      - id: g
        env:
          EV: ${{ github.event_name }}
          SNAP_IN: ${{ inputs.snapshot }}
        run: |
          D=$(date -u +%-d); H=$(date -u +%-H); GO=1; SNAP=1
          if [ "$EV" = "workflow_run" ]; then
            SNAP=0
            if [ "$D" -lt 9 ] || [ "$D" -gt 13 ] || [ "$H" -lt 16 ] || [ "$H" -gt 19 ]; then GO=0; fi
          fi
          [ "$EV" = "workflow_dispatch" ] && [ "$SNAP_IN" = "false" ] && SNAP=0
          echo "event $EV, UTC day $D hour $H -> go=$GO snap=$SNAP"
          echo "go=$GO" >> "$GITHUB_OUTPUT"; echo "snap=$SNAP" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: arc-plc-refresh
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install openpyxl==3.1.5 pypdf==6.17.0
      - name: FSA files from raw
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: bash scripts/pull_raw.sh data/fsa
      - name: Selftest
        run: python scripts/build_arc_plc.py --selftest

      - name: Pillow, for the share image
        continue-on-error: true
        run: pip install --quiet pillow==12.3.0

      - name: Build and commit
        id: commit
        env:
          SNAP: ${{ needs.gate.outputs.snap }}
        run: |
          set -e
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          for i in 1 2 3 4 5; do
            if [ "$SNAP" = "1" ]; then python scripts/build_arc_plc.py --snapshot-prices; else python scripts/build_arc_plc.py; fi
            python scripts/build_share_images.py --only arc-plc || true
            python scripts/generated_sets.py dependents arc-plc --stage || true
            git add -A -- arc-plc.html arc-plc data/pointers data/arc-plc.json data/arc-plc data/arc-plc-prices.json data/breakeven \
                          embed/arc-plc.html sitemap-arc-plc.xml llms.txt components/arc-plc-form.js img/og/arc-plc.jpg
            if git diff --staged --quiet; then echo "No change."; exit 0; fi
            git commit -q -m "arc-plc: rebuilt $(date -u +%Y-%m-%d)"
            if git push; then
              echo "Pushed on attempt $i."
              git show --name-only --format= HEAD > /tmp/arc-changed.txt
              echo "pushed=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push race on attempt $i; building again on the new main..."
            git fetch -q origin main
            git reset -q --hard origin/main
            sleep $((RANDOM % 6 + 3))
          done
          echo "Failed to push after 5 attempts."; exit 1

      - name: IndexNow ping for the pages this run changed (best-effort)
        if: steps.commit.outputs.pushed == '1'
        continue-on-error: true
        run: |
          files=$(grep -E '\.html$' /tmp/arc-changed.txt || true)
          if [ -z "$files" ]; then echo "no page changed"; exit 0; fi
          python scripts/indexnow_submit.py --changed $files || echo "IndexNow ping failed - harmless"
