name: conditions

# Weekly NASS crop-condition percentile build for /conditions. NASS publishes
# Crop Progress Mondays 4 PM ET; Tuesday 01:12 UTC (~8 PM ET Monday) catches it.
# Selftest gates; in-season zero-data fails loud; NASS throttle gets backoff.
on:
  schedule:
    - cron: '12 1 * * 2'    # Tuesdays 01:12 UTC = Monday evening CT
    # After a Monday federal holiday (Columbus Day, Labor Day) NASS releases on
    # Tuesday, and the Monday-night run finds nothing new. This catch-up run
    # picks it up; on a normal week it finds no change and commits nothing.
    - cron: '12 1 * * 3'    # Wednesdays 01:12 UTC = Tuesday evening CT
  # 2026-10-16: GitHub dropped the Wednesday fire after Columbus Day. Now this
  # also runs whenever data/crop-progress.json is on a newer week than
  # data/conditions/conditions.json: right after "Fetch Crop Progress", and
  # every two hours for five days off "Fetch Grain Bids" (scripts/cron_gate.py
  # behind). A run with nothing to chase stops at the gate in seconds.
  workflow_run:
    workflows: ["Fetch Crop Progress", "Fetch Grain Bids"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: conditions
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            data/crop-progress.json
            data/conditions/conditions.json
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          TRIGGER_WORKFLOW: ${{ github.event.workflow_run.name }}
        run: python3 scripts/cron_gate.py conditions

  fetch:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Selftest (gate)
        run: python scripts/fetch_conditions.py --selftest
      - name: Fetch
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: python scripts/fetch_conditions.py
      # Re-bake /conditions from the file just written: the title, summary,
      # first-screen week line, stats line, table caption and harvest table
      # all come from data/crop-progress.json and data/conditions/conditions.json.
      # Until 2026-10-15 only the freshness job did this, and the page showed
      # "Corn 54%, week ending Oct 4" over a table for Oct 11.
      # test/conditions-week.test.mjs holds every line to one week.
      - name: Re-bake conditions.html from the data
        run: |
          python scripts/bake_seo.py --selftest
          python scripts/seed_static.py --only conditions
          python scripts/bake_seo.py --page conditions.html

      - name: Commit
        run: |
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          git add data/conditions/ conditions.html
          if git diff --staged --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: crop condition percentiles $(date -u +%F)"
          git pull --rebase --autostash origin main || true
          git push
