name: Hay prices

# Writes data/hay/hay-prices.json for /hay-prices and stamps the newest month
# into hay-prices.html: USDA NASS prices received for alfalfa, other and all
# hay, $ per ton, monthly by state (Agricultural Prices, through Quick Stats).
# Read by scripts/fetch_hay_prices.py. The page shows an empty state until the
# file exists. A failed check writes nothing and fails the job.
#
# FIRST RUN: dispatch this once with "probe" ticked. It saves a trimmed copy of
# what NASS returned and a summary to data/hay-raw/ and saves them on the raw branch (never deployed), so the
# series names, units and counts can be checked before trusting a number.

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Probe only: save the raw NASS rows and a summary to data/hay-raw/ on the raw branch"
        type: boolean
        default: false
  schedule:
    # Agricultural Prices comes out near the end of each month, 3 pm Eastern.
    # Read the last days of the month and the first of the next; a run with
    # nothing new changes nothing.
    - cron: '23 20 27-31 * *'
    - cron: '23 14 1,2 * *'
  # GitHub's scheduler drops scheduled fires (it never started land-data.yml on Nov 3, 2026;
  # scripts/cron_gate.py has the numbers). So this also runs after every "Fetch Grain Bids"
  # (cron-job.org, every 15 minutes), and the gate job lets the first run after each tick of the
  # cron above, by either trigger, do the work within 360 minutes
  # (six hours, the same day and well before the next tick).
  # Every other run skips in seconds. A chained run takes the scheduled path. A run by hand or
  # a push does not use up the tick (cron_gate.py MANUAL_DOES_NOT_SERVE): it may take narrower
  # inputs, and the chained run that follows is the same idempotent job.
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]

permissions:
  contents: write

jobs:
  # One run per tick of the schedule (see on: above). Sparse: the skip costs seconds.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow hay-prices.yml --max-lag 360
          --cron "23 20 27-31 * *"
          --cron "23 14 1,2 * *"

  build:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: hay-prices
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Selftest
        run: python scripts/fetch_hay_prices.py --selftest
      - name: Probe (raw source capture)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe }}
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: python scripts/fetch_hay_prices.py --probe
      # Raw captures go to the raw branch (never deployed), not main: scripts/push_raw.sh.
      # Runs even when the probe step failed part way, so what it did capture is kept.
      - name: Save the probe's raw files to the raw branch
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.probe }}
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_SOFT: '1'
        run: bash scripts/push_raw.sh "hay-prices probe" data/hay-raw
      - name: Fetch and write data/hay/hay-prices.json
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) }}
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: python scripts/fetch_hay_prices.py
      - name: Commit if changed (race-tolerant)
        run: |
          set -e
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          FILES="data/hay"
          rm -rf /tmp/hp && mkdir -p /tmp/hp
          for f in $FILES; do
            [ -e "$f" ] && cp -r --parents "$f" /tmp/hp/ || true
          done
          [ -n "$(ls -A /tmp/hp)" ] || { echo "No output; nothing to commit."; exit 0; }
          BR="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3 4 5; do
            git fetch origin "$BR"
            git reset --hard "origin/$BR"
            cp -r /tmp/hp/. ./
            # re-stamp the page on the fresh checkout rather than copying an
            # older copy of it over whatever main has now
            [ -e data/hay/hay-prices.json ] && python scripts/fetch_hay_prices.py --stamp
            for f in $FILES hay-prices.html; do [ -e "$f" ] && git add "$f" || true; done
            if git diff --staged --quiet; then echo "No change."; exit 0; fi
            git commit -m "Update hay prices $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            if git push origin "HEAD:$BR"; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push race on attempt $i; re-syncing to origin/$BR..."
            sleep $((RANDOM % 4 + 2))
          done
          echo "Failed to push after 5 attempts."; exit 1
