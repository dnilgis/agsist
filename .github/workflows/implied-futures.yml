name: Implied futures shadow test

on:
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: "Take a tick now even outside the session hours (saved like any other)"
        type: boolean
        default: false
      replay:
        description: "Rebuild this Central day (YYYY-MM-DD) from the bids and prices git history instead"
        type: string
        default: ""
      summary:
        description: "Only print the summary of everything saved so far"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: implied-futures
  cancel-in-progress: false

jobs:
  tick:
    if: >-
      github.event_name == 'workflow_dispatch' || ((vars.IMPLIED_FUTURES_LIVE || 'on') != '0' && (
        contains(github.event.workflow_run.created_at, 'T13:') ||
        contains(github.event.workflow_run.created_at, 'T14:') ||
        contains(github.event.workflow_run.created_at, 'T15:') ||
        contains(github.event.workflow_run.created_at, 'T16:') ||
        contains(github.event.workflow_run.created_at, 'T17:') ||
        contains(github.event.workflow_run.created_at, 'T18:') ||
        contains(github.event.workflow_run.created_at, 'T19:')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            /scripts/
            /test/fixtures/implied-futures/
            /data/prices.json
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Selftest (real board rows, no network)
        run: python3 scripts/implied_futures.py --selftest
      - name: The boards (dnilgis/bids, public)
        if: ${{ !inputs.summary }}
        env:
          REPLAY: ${{ inputs.replay }}
        run: |
          set -e
          if [ -n "$REPLAY" ]; then
            case "$REPLAY" in [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;; *) echo "::error::replay is a date, YYYY-MM-DD"; exit 1;; esac
            SINCE=$(date -u -d "$REPLAY -1 day" +%Y-%m-%d)
            git clone -q --no-checkout --shallow-since="$SINCE" https://github.com/dnilgis/bids.git /tmp/bids
            git clone -q --filter=blob:none --no-checkout --shallow-since="$SINCE" https://github.com/dnilgis/agsist.git /tmp/agsist
          else
            git clone -q --depth 1 --filter=blob:none --sparse https://github.com/dnilgis/bids.git /tmp/bids
            git -C /tmp/bids sparse-checkout set data sources
          fi
      - name: Today's saved ticks (private raw branch)
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          REPLAY: ${{ inputs.replay }}
          SUMMARY: ${{ inputs.summary && '1' || '' }}
        run: |
          set -u
          . scripts/private_remote.sh
          ok=0
          for i in 1 2 3; do
            if out=$(git fetch -q --depth 1 "$REMOTE" raw 2>&1); then ok=1; break; fi
            echo "::warning::git fetch raw failed: $(printf '%s' "$out" | tail -3 | tr '\n' ' ' | hide)"
            sleep $((10 * i))
          done
          [ "$ok" = 1 ] || { echo "::error::could not read the raw branch on $WHERE; not ticking, so nothing saved is overwritten"; exit 1; }
          mkdir -p data/implied-futures
          if [ -n "$SUMMARY" ]; then
            if git cat-file -e FETCH_HEAD:data/implied-futures 2>/dev/null; then git archive FETCH_HEAD -- data/implied-futures | tar -x; fi
          else
            DAY=${REPLAY:-$(TZ=America/Chicago date +%Y-%m-%d)}
            F="data/implied-futures/$DAY.jsonl"
            if [ -n "$REPLAY" ]; then echo "replay: $F is rebuilt whole"
            elif git cat-file -e "FETCH_HEAD:$F" 2>/dev/null; then git show "FETCH_HEAD:$F" > "$F"; echo "raw: $(wc -l < "$F") line(s) already saved today"
            else echo "raw: nothing saved yet today"; fi
          fi
      - name: Tick
        if: ${{ !inputs.summary }}
        env:
          FORCE: ${{ inputs.force && '--force' || '' }}
          REPLAY: ${{ inputs.replay }}
        run: |
          set -e
          if [ -n "$REPLAY" ]; then
            python3 scripts/implied_futures.py --replay "$REPLAY" --bids-git /tmp/bids --bids-ref origin/HEAD \
              --prices-git /tmp/agsist --prices-ref origin/HEAD --out data/implied-futures
          else
            python3 scripts/implied_futures.py --tick --bids /tmp/bids --prices data/prices.json --out data/implied-futures $FORCE
          fi
      - name: Save to the private raw branch
        if: ${{ !inputs.summary }}
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_SOFT: '1'
        run: bash scripts/push_raw.sh "implied futures" data/implied-futures
      - name: Summary so far
        if: ${{ inputs.summary }}
        run: |
          python3 scripts/implied_futures.py --summary data/implied-futures | tee -a "$GITHUB_STEP_SUMMARY"
