name: RMA price discovery

on:
  workflow_dispatch:
    inputs:
      probe:
        description: 'Probe only — report what RMA has and write nothing'
        type: boolean
        default: false
      year:
        description: 'Crop year (blank = current)'
        required: false
  schedule:
    - cron: '10 22 * * *'
  workflow_run:
    workflows: ["Tick 14"]
    types: [completed]

permissions:
  contents: write

jobs:
  gate:
    if: github.event.workflow_run.name != 'Tick 14' || contains(github.event.workflow_run.display_title, ' rma-prices.yml ')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow rma-prices.yml --max-lag 360
          --cron "10 22 * * *"

  pull:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: rma-prices
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Selftest
        run: python3 scripts/test_rma_prices.py

      - name: Pull RMA price discovery
        env:
          IN_PROBE: ${{ inputs.probe }}
          IN_YEAR: ${{ inputs.year }}
        run: |
          ARGS=()
          if [ "$IN_PROBE" = "true" ]; then ARGS+=(--probe); fi
          if [ -n "$IN_YEAR" ]; then
            printf '%s' "$IN_YEAR" | grep -Eq '^[0-9]{4}$' || { echo "::error::year must be 4 digits"; exit 1; }
            ARGS+=(--year "$IN_YEAR")
          fi
          python3 scripts/fetch_rma_prices.py "${ARGS[@]}"

      - name: Bake "in discovery right now" onto the tracker
        if: ${{ inputs.probe != true }}
        continue-on-error: true
        run: python3 scripts/bake_discovery_now.py

      - name: Split the mirror per state for the tracker
        if: ${{ inputs.probe != true }}
        run: |
          python3 scripts/split_rma_prices.py --selftest
          python3 scripts/split_rma_prices.py

      - name: Commit and push (rebase armor, 3 tries)
        if: ${{ inputs.probe != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rma-prices.json data/rma-prices data/rma-discovery-now.json harvest-price-tracker.html
          if git diff --cached --quiet; then
            echo "RMA figures unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "data: RMA price discovery refresh [skip ci]"
          for i in 1 2 3; do
            if git push origin main; then exit 0; fi
            echo "push rejected (attempt $i) — rebasing"
            git rebase --abort 2>/dev/null || true
            git pull --rebase origin main || {
              git rebase --abort 2>/dev/null || true
              cp data/rma-prices.json /tmp/rp.json
              cp data/rma-discovery-now.json /tmp/rn.json
              rm -rf /tmp/rps && cp -r data/rma-prices /tmp/rps
              git reset --hard origin/main
              cp /tmp/rp.json data/rma-prices.json
              cp /tmp/rn.json data/rma-discovery-now.json
              rm -rf data/rma-prices && cp -r /tmp/rps data/rma-prices
              git add data/rma-prices.json data/rma-prices data/rma-discovery-now.json harvest-price-tracker.html
              git commit -m "data: RMA price discovery refresh [skip ci]" || true
            }
          done
          exit 1
