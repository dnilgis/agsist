name: Share images
# Share images.

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'data/farm-bill.json'
      - 'scripts/share_cards.py'
      - 'scripts/build_share_images.py'
      - 'scripts/test_share_images.py'
      - '.github/workflows/share-images.yml'
  schedule:
    - cron: '23 12 * * *'
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow share-images.yml --max-lag 360
          --cron "23 12 * * *"

  cards:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: share-images
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pillow
        run: pip install --quiet pillow==12.3.0

      - name: Draw the cards
        run: |
          python scripts/build_share_images.py --selftest
          python scripts/build_share_images.py

      - name: Every indexable page has a good share image
        run: python scripts/test_share_images.py

      - name: Commit if changed
        run: |
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          git add -A img/og
          git add -- *.html
          if git diff --staged --quiet; then echo "no change"; exit 0; fi
          git diff --staged --stat | tail -3
          git commit -q -m "share images: redraw from the data"
          for i in 1 2 3 4; do
            git rebase --abort 2>/dev/null || true
            if git pull -q --rebase --autostash origin main && git push -q; then exit 0; fi
            sleep $((15 * i))
          done
          echo "push failed after 4 attempts"; exit 1
