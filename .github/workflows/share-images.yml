name: Share images

# Every page's share image (og:image) is drawn from its own data by
# scripts/build_share_images.py. The data workflows redraw the cards their data
# feeds (fertilizer-coops, farm-bill, cash-bid-pages, cot, crop_progress,
# yield-panel, dairy, harvest-prices, arc-plc-refresh, county-rain,
# price-stats, state-stats; daily.yml draws the daily card). This workflow is
# the catch-all and the guard:
#   * on a push to main that changes a root page or the card code (a person's
#     edit: bot commits do not start workflows), redraw and commit;
#   * once a day, redraw everything (dates roll: the next WASDE, for one);
#   * every run checks that every indexable page has a share image that
#     exists, is 1200x630, is under 120 KB and has an alt.

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'data/farm-bill.json'
      - 'scripts/share_cards.py'
      - 'scripts/build_share_images.py'
      - 'scripts/test_share_images.py'
      - '.github/workflows/share-images.yml'
  schedule:
    - cron: '23 12 * * *'
  # GitHub's scheduler drops scheduled fires (it never started land-data.yml on Nov 3, 2026;
  # scripts/cron_gate.py has the numbers). So this also runs after every "Fetch Grain Bids"
  # (cron-job.org, every 15 minutes), and the gate job lets the first run after each tick of the
  # cron above, by either trigger, do the work within 360 minutes
  # (six hours, the same day and well before the next tick).
  # Every other run skips in seconds. A chained run takes the scheduled path. A run by hand or
  # a push does not use up the tick (cron_gate.py MANUAL_DOES_NOT_SERVE): it may take narrower
  # inputs, and the chained run that follows is the same idempotent job.
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One run per tick of the schedule (see on: above). Sparse: the skip costs seconds.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow share-images.yml --max-lag 360
          --cron "23 12 * * *"

  cards:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: share-images
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pillow
        run: pip install --quiet pillow==12.3.0

      - name: Draw the cards
        run: |
          python scripts/build_share_images.py --selftest
          python scripts/build_share_images.py

      - name: Every indexable page has a good share image
        run: python scripts/test_share_images.py

      - name: Commit if changed
        run: |
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          git add -A img/og
          git add -- *.html
          if git diff --staged --quiet; then echo "no change"; exit 0; fi
          git diff --staged --stat | tail -3
          git commit -q -m "share images: redraw from the data"
          for i in 1 2 3 4; do
            git rebase --abort 2>/dev/null || true
            if git pull -q --rebase --autostash origin main && git push -q; then exit 0; fi
            sleep $((15 * i))
          done
          echo "push failed after 4 attempts"; exit 1
