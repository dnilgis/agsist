name: List cleanup
# Daily: drop addresses that bounced for good, fix obvious domain typos
# (gmail.comb, gmial.com) on the Daily and hail lists, and email Sig what
# changed. Mondays it emails a summary even when nothing changed.
# The log shows counts only; addresses go only into the email.
#
# Removing an address by hand: workflow inputs show on the PUBLIC run page,
# so there is no input for it. Put the addresses (comma separated) in the
# repo secret LIST_REMOVE (Settings > Secrets and variables > Actions), run
# this workflow by hand with dry_run off, then clear the secret. Scheduled
# runs ignore LIST_REMOVE, so a reader who signs up again later stays on.
#
# Unsubscribe emails (Gmail's Unsubscribe button mails news@agsist.com): read
# from the same inbox as the bounces. If news@ forwards to a different mailbox
# than the sending login, set the secrets UNSUB_IMAP_USER and UNSUB_IMAP_PASS
# (and UNSUB_IMAP_HOST if it is not Gmail); left empty, the SMTP login is used.
on:
  schedule:
    - cron: "23 13 * * *"
  # GitHub's scheduler drops scheduled fires (it never started land-data.yml on Nov 3, 2026;
  # scripts/cron_gate.py has the numbers). So this also runs after every "Fetch Grain Bids"
  # (cron-job.org, every 15 minutes), and the gate job lets the first run after each tick of the
  # cron above, by either trigger, do the work within 360 minutes
  # (six hours, the same day and well before the next tick).
  # Every other run skips in seconds. A chained run takes the scheduled path. A run by hand or
  # a push does not use up the tick (cron_gate.py MANUAL_DOES_NOT_SERVE): it may take narrower
  # inputs, and the chained run that follows is the same idempotent job.
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only, change nothing"
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  # One run per tick of the schedule (see on: above). Sparse: the skip costs seconds.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow list-hygiene.yml --max-lag 360
          --cron "23 13 * * *"

  clean:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: list-hygiene
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/list_hygiene.py --selftest
      - run: python3 scripts/list_hygiene.py ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        env:
          LIST_URL: ${{ secrets.LIST_URL }}
          LIST_TOKEN: ${{ secrets.LIST_TOKEN }}
          UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER || secrets.GMAIL_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || secrets.GMAIL_APP_PASS }}
          FROM_ADDR: ${{ secrets.FROM_ADDR }}
          FROM_NAME: ${{ secrets.FROM_NAME }}
          REPORT_TO: ${{ secrets.REPLY_TO }}
          UNSUB_IMAP_HOST: ${{ secrets.UNSUB_IMAP_HOST }}
          UNSUB_IMAP_USER: ${{ secrets.UNSUB_IMAP_USER }}
          UNSUB_IMAP_PASS: ${{ secrets.UNSUB_IMAP_PASS }}
          REMOVE: ${{ github.event_name == 'workflow_dispatch' && secrets.LIST_REMOVE || '' }}
