name: List cleanup
# Daily: drop addresses that bounced for good, fix obvious domain typos
# (gmail.comb, gmial.com) on the Daily and hail lists, and email Sig what
# changed. Mondays it emails a summary even when nothing changed.
# The log shows counts only; addresses go only into the email.
#
# Removing an address by hand: workflow inputs show on the PUBLIC run page,
# so there is no input for it. Put the addresses (comma separated) in the
# repo secret LIST_REMOVE (Settings > Secrets and variables > Actions), run
# this workflow by hand with dry_run off, then clear the secret. Scheduled
# runs ignore LIST_REMOVE, so a reader who signs up again later stays on.
#
# Unsubscribe emails (Gmail's Unsubscribe button mails news@agsist.com): read
# from the same inbox as the bounces. If news@ forwards to a different mailbox
# than the sending login, set the secrets UNSUB_IMAP_USER and UNSUB_IMAP_PASS
# (and UNSUB_IMAP_HOST if it is not Gmail); left empty, the SMTP login is used.
on:
  schedule:
    - cron: "23 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only, change nothing"
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: list-hygiene
  cancel-in-progress: false
jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/list_hygiene.py --selftest
      - run: python3 scripts/list_hygiene.py ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        env:
          LIST_URL: ${{ secrets.LIST_URL }}
          LIST_TOKEN: ${{ secrets.LIST_TOKEN }}
          UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER || secrets.GMAIL_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || secrets.GMAIL_APP_PASS }}
          FROM_ADDR: ${{ secrets.FROM_ADDR }}
          FROM_NAME: ${{ secrets.FROM_NAME }}
          REPORT_TO: ${{ secrets.REPLY_TO }}
          UNSUB_IMAP_HOST: ${{ secrets.UNSUB_IMAP_HOST }}
          UNSUB_IMAP_USER: ${{ secrets.UNSUB_IMAP_USER }}
          UNSUB_IMAP_PASS: ${{ secrets.UNSUB_IMAP_PASS }}
          REMOVE: ${{ github.event_name == 'workflow_dispatch' && secrets.LIST_REMOVE || '' }}
