name: List cleanup
# List cleanup.

on:
  schedule:
    - cron: "23 13 * * *"
  # cron above, by either trigger, do the work within 360 minutes
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only, change nothing"
        type: boolean
        default: true
      accept_suppression:
        description: "Apply a bounce suppression the daily limit held back"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow list-hygiene.yml --max-lag 360
          --cron "23 13 * * *"

  clean:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    concurrency:
      group: list-hygiene
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/list_hygiene.py --selftest
      - name: Clean the lists
        env:
          LIST_URL: ${{ secrets.LIST_URL }}
          LIST_TOKEN: ${{ secrets.LIST_TOKEN }}
          UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER || secrets.GMAIL_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || secrets.GMAIL_APP_PASS }}
          FROM_ADDR: ${{ secrets.FROM_ADDR }}
          FROM_NAME: ${{ secrets.FROM_NAME }}
          REPORT_TO: ${{ secrets.REPLY_TO }}
          UNSUB_IMAP_HOST: ${{ secrets.UNSUB_IMAP_HOST }}
          UNSUB_IMAP_USER: ${{ secrets.UNSUB_IMAP_USER }}
          UNSUB_IMAP_PASS: ${{ secrets.UNSUB_IMAP_PASS }}
          REMOVE: ${{ github.event_name == 'workflow_dispatch' && secrets.LIST_REMOVE || '' }}
          BOUNCE_EVENTS_OUT: ${{ runner.temp }}/bounce-events.json
        run: python3 scripts/list_hygiene.py ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
      - name: Fold hard bounces
        if: ${{ !cancelled() }}
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
          LIST_URL: ${{ secrets.LIST_URL }}
          LIST_TOKEN: ${{ secrets.LIST_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER || secrets.GMAIL_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || secrets.GMAIL_APP_PASS }}
          FROM_ADDR: ${{ secrets.FROM_ADDR }}
          FROM_NAME: ${{ secrets.FROM_NAME }}
          REPORT_TO: ${{ secrets.REPLY_TO }}
          GH_TOKEN: ${{ github.token }}
          BOUNCE_EVENTS_IN: ${{ runner.temp }}/bounce-events.json
          UNSUPPRESS: ${{ github.event_name == 'workflow_dispatch' && secrets.LIST_UNSUPPRESS || '' }}
          BOUNCE_ACCEPT: ${{ (github.event_name == 'workflow_dispatch' && inputs.accept_suppression) && '1' || '' }}
        run: python3 scripts/bounces.py --fold ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
