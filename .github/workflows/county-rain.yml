name: county rain

# /rain, /rain/<state> and /rain/<state>/<county>: rain so far this year in
# every US county with a NOAA station that reported enough days.
#   scripts/fetch_county_rain.py  RCC-ACIS, one MultiStnData call per state
#                                 (plus one for last year) -> data/rain/<st>.json
#   scripts/build_county_rain.py  the pages and sitemap-rain.xml
# Both happen here, in one commit: a push made with this workflow's token does
# not start other workflows, so nothing else would build the pages.
#
# Every day 13:23 UTC (morning in Central; Sig, Oct 23 2026: before that, once a week).
# NOAA's daily reports come in a few days late, so each run re-reads the whole
# year and the pages say the last day each station reported.
# January: every run fetches the finished year (through Dec 31), so late
# reports still land all month; the new year's pages start Feb 1. Jan 2 14:41
# stays as its own run, a day after the year ends, in case the 13:23 run is
# dropped. RCC-ACIS cannot be reached from the sandbox this was built in; the
# first real fetch is a workflow_dispatch on main.
#
# GitHub's scheduler never started this on Nov 2, 2026 (it delivers a small share of
# scheduled fires; scripts/cron_gate.py has the numbers). So it also runs after every
# "Fetch Grain Bids" (cron-job.org, every 15 minutes), and the gate job lets exactly one run
# per tick of the two crons below do the work: the first run after the tick, by either
# trigger, within 720 minutes (by 01:23 UTC, 19:23 Central, still the same Central day; a
# chain that comes back in the afternoon still rebuilds the day's pages, and yesterday's tick
# is never served just before today's). Every other run skips in seconds. A run started by
# hand (one state, a past year) does not use up the tick (cron_gate.py
# MANUAL_DOES_NOT_SERVE). The January rain year email below marks each address once.
on:
  schedule:
    - cron: "23 13 * * *"      # every day 13:23 UTC
    - cron: "41 14 2 1 *"      # Jan 2 14:41 UTC, the finished year
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]
  workflow_dispatch:
    inputs:
      states:
        description: 'Comma-separated state codes (leave empty for every state)'
        required: false
        default: ''
      year:
        description: 'Year (leave empty: this year, or last year in January)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # One run per tick (see the top). Sparse: the skip costs seconds.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow county-rain.yml --max-lag 720
          --cron "23 13 * * *"
          --cron "41 14 2 1 *"

  rain:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    # The queue (shared with rain-monthly.yml's fresh job) is on this job only: a chained run
    # that skips never waits in it, and never replaces a pending run of the other workflow.
    concurrency:
      group: county-rain
      cancel-in-progress: false
    # 90, not 60 (Nov 1, 2026): Fetch took 33 min and Context 20 on Oct 31 and Nov 1
    # (9 and 9 on Oct 29), which left the push about 5 minutes before the job was cancelled.
    # 105, not 90 (Nov 4, 2026, fx/rainwx): the weather step adds up to 15 minutes.
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Offline first
        run: |
          python3 scripts/dev/quiet.py selftest-fetch-county-rain -- python scripts/fetch_county_rain.py --selftest
          python3 scripts/dev/quiet.py selftest-fetch-rain-context -- python scripts/fetch_rain_context.py --selftest
          python3 scripts/dev/quiet.py selftest-fetch-rain-weather -- python scripts/fetch_rain_weather.py --selftest
          python3 scripts/dev/quiet.py selftest-build-county-rain -- python scripts/build_county_rain.py --selftest
          python3 scripts/dev/quiet.py selftest-send-rain-year -- python scripts/send_rain_year.py --selftest

      # The script stops itself at 40 minutes (each state is one or two calls,
      # each call has a timeout and three retries). A state that fails keeps
      # its published file; whatever did come back is still built below.
      - name: Fetch
        id: fetch
        continue-on-error: true
        timeout-minutes: 45
        env:
          PYTHONUNBUFFERED: "1"
          STATES: ${{ github.event.inputs.states }}
          YEAR: ${{ github.event.inputs.year }}
        run: |
          set -o pipefail
          ARGS=""
          if [ -n "$STATES" ]; then ARGS="$ARGS --states $STATES"; fi
          if [ -n "$YEAR" ]; then ARGS="$ARGS --year $YEAR"; fi
          # shellcheck disable=SC2086
          rc=0
          python3 scripts/dev/quiet.py rain-fetch -- python scripts/fetch_county_rain.py $ARGS || rc=$?
          cp "$RUNNER_TEMP/quiet/rain-fetch.log" county-rain.log 2>/dev/null || true
          exit $rc

      # Two more lines per county page (scripts/fetch_rain_context.py): the PRISM county
      # average against NOAA's gridded normal, and where this year sits in the station's own
      # record. Best effort, 20-minute cap: a state that fails keeps its last context file,
      # and the pages print the lines only when the context is from this same fetch.
      - name: Context (county average, on record)
        continue-on-error: true
        timeout-minutes: 25
        env:
          PYTHONUNBUFFERED: "1"
          STATES: ${{ github.event.inputs.states }}
        run: |
          if [ -n "$STATES" ]; then python3 scripts/dev/quiet.py rain-context -- python scripts/fetch_rain_context.py --states "$STATES"; else python3 scripts/dev/quiet.py rain-context -- python scripts/fetch_rain_context.py; fi

      # The other measured weather at each page's station (scripts/fetch_rain_weather.py): corn GDDs
      # from May 1 against the station's own 1991-2020 average, the hottest and coldest day, freezes,
      # and the month's warmest or coldest day of note, into data/rain/wx/<st>.json (one small file a
      # state, read by the page's weather fold). Best effort, 12-minute cap: about 3 calls a state, plus
      # a one-time read of each station's 1991-2020 days into data/rain/wxnorm (7 minutes a run at most;
      # the rest waits for the next day). A state that fails keeps its last file, and the pages use a
      # file only when it is from this same fetch.
      - name: Weather (GDDs, extremes, freezes)
        continue-on-error: true
        timeout-minutes: 15
        env:
          PYTHONUNBUFFERED: "1"
          STATES: ${{ github.event.inputs.states }}
        run: |
          if [ -n "$STATES" ]; then python3 scripts/dev/quiet.py rain-weather -- python scripts/fetch_rain_weather.py --states "$STATES"; else python3 scripts/dev/quiet.py rain-weather -- python scripts/fetch_rain_weather.py; fi

      # Share images (og:image): the US county map for /rain and one map per
      # state for its state and county pages (img/og/rain.jpg, img/og/rain-<st>.jpg),
      # drawn by scripts/build_share_images.py from data/rain. Before the pages,
      # because build_county_rain.py puts each image's hash in its URL.
      # Best effort: a share card must never block the data commit.
      # The cards are redrawn on Mondays only (Sig, Oct 23 2026); any other day they stay byte for
      # byte as drawn (the script decides, America/Chicago), so the pages' og:image
      # hash does not move; each card's own "Jan 1 to <day>" keeps it true, and the
      # alt saved with it in img/og/rain-cards.json is the one the pages print.
      - name: Share image
        continue-on-error: true
        run: |
          pip install --quiet pillow==12.3.0
          python3 scripts/dev/quiet.py share-image -- python3 scripts/build_share_images.py --only rain

      - name: Check the data, build the pages, check the budget
        run: |
          python3 scripts/dev/quiet.py rain-check -- python scripts/fetch_county_rain.py --check
          python3 scripts/dev/quiet.py rain-pages -- python scripts/build_county_rain.py
          python3 scripts/dev/quiet.py rain-pages-check -- python scripts/build_county_rain.py --check
          # /here reads which page kinds each county has (data/atlas/pct k flags); a new rain page changes them
          python3 scripts/dev/quiet.py place-pct -- python scripts/build_place_pct.py
          # the PRF, Atlas and ARC/PLC county pages link this county's rain page when it is live,
          # else the state rain page: re-stamp those links now that the rain set may have moved
          python3 scripts/dev/quiet.py selftest-cross-links -- python scripts/cross_links.py --selftest
          python3 scripts/dev/quiet.py cross-links -- python scripts/cross_links.py --stamp
          python3 scripts/dev/quiet.py seo-check -- python scripts/check_seo.py
          python scripts/check_site_budget.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Keep only what this run fetched (the rain data and its share images); build every page again on a
          # fresh main each try, so the pages always match main's other inputs (Nov 2, 2026: the -X theirs
          # rebase kept this run's ~55-minute-old "Cash bids by town near" lines, and build_county_rain.py
          # --check failed on main, 31 pages, until the next town rebuild). Nothing is rebased, so nothing
          # conflicts. Same shape as dairy.yml's commit loop.
          SAVE=$RUNNER_TEMP/rain-save; rm -rf "$SAVE"; mkdir -p "$SAVE/og"
          cp -r data/rain "$SAVE/rain"
          cp img/og/rain.jpg img/og/rain-??.jpg img/og/rain-cards.json "$SAVE/og/" 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            rm -rf data/rain && cp -r "$SAVE/rain" data/rain
            cp "$SAVE"/og/* img/og/ 2>/dev/null || true
            python3 scripts/dev/quiet.py rain-pages -- python scripts/build_county_rain.py
            python3 scripts/dev/quiet.py rain-pages-check -- python scripts/build_county_rain.py --check
            python3 scripts/dev/quiet.py place-pct -- python scripts/build_place_pct.py
            python3 scripts/dev/quiet.py cross-links -- python scripts/cross_links.py --stamp
            git add -A data/atlas/pct
            git add -A data/rain data/pointers rain rain.html sitemap-rain.xml img/og/rain.jpg img/og/rain-??.jpg img/og/rain-cards.json prf farmland-atlas arc-plc 2>/dev/null || true
            # the summary files that read the rain pages, on this main (BUILD-RULES 61; fail soft, rule 53)
            python scripts/generated_sets.py dependents rain --stage || true
            if git diff --cached --quiet; then echo "no change"; exit 0; fi
            N=$(ls data/rain/*.json 2>/dev/null | wc -l)
            git commit -q -m "data: county rain ($N states)"
            if git push -q origin HEAD:main; then echo "pushed on attempt $i"; exit 0; fi
            sleep $((20 * i))
          done
          echo "push failed after 5 attempts"; exit 1

      # The January full-year rain email (subs worker v5.28, topic
      # rainyear:<year>:<fips>, asked on the county rain pages). January only,
      # after the finished year is committed, so the email and the page match.
      # Each address is mailed once (marked after the send); the later daily
      # runs in January catch late stations. Not on Jan 1 (send_rain_year.py
      # FIRST_DAY): the first send is Jan 2. No new schedule: it rides this one.
      - name: Rain year emails (January only)
        env:
          LIST_URL: ${{ secrets.LIST_URL }}
          LIST_TOKEN: ${{ secrets.LIST_TOKEN }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}   # the private copy of the list when the worker is blocked (scripts/list_source.py)
          UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER || secrets.GMAIL_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || secrets.GMAIL_APP_PASS }}
          FROM_ADDR: ${{ secrets.FROM_ADDR }}
          REPLY_TO: ${{ secrets.REPLY_TO }}
        run: |
          if [ "$(TZ=America/Chicago date +%m)" != "01" ]; then echo "not January: no rain year emails"; exit 0; fi
          python3 scripts/send_rain_year.py --send

      - name: Say which state failed
        if: steps.fetch.outcome == 'failure'
        run: |
          S=$(grep -oE "^[A-Z]{2}: (FAILED|refusing)" county-rain.log | cut -c1-2 | sort -u | tr "\n" " " || true)
          echo "states that kept their published files: ${S:-none named}"
          grep -q "time cap" county-rain.log && echo "the run hit its time cap" || true
          echo "::warning::A county rain state failed or the run hit its time cap; those states kept their published files. See the Fetch step."
