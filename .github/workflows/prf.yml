name: prf

# The data behind /prf: USDA RMA's Pasture, Rangeland, Forage rainfall index.
#
#   fetch   scripts/fetch_prf.py   the Actuarial Data Master (rates, county base
#                                  values, limits, dates; about 1.2 GB, no key)
#                                  and RMA's index service, one call per grid
#   check   scripts/check_prf_rma.mjs   prices a dozen policies from the files
#                                  just written and asks RMA's own tool for the
#                                  same ones. A difference stops the run before
#                                  the commit: the site keeps what it had.
#
# A refresh asks only for the years still open and takes about ten minutes. A
# full run asks for every grid's whole history (about 13,400 calls) and is
# needed once a year, when the new crop year's ADM arrives at the end of August;
# fetch_prf.py does it by itself when the crop year changes.
#
# Weekly, because RMA publishes an interval's final index roughly once a month
# and on no fixed day. Off the hour (rule 27).
#
# The run log is also pushed to the `prf-log` branch as prf-run.log, because
# run logs cannot be read from the sandbox this is maintained in.
on:
  schedule:
    - cron: "23 10 * * 3"      # Wednesdays, 10:23 UTC
  workflow_dispatch:
    inputs:
      full:
        description: "Refetch every grid's whole history (type: yes)"
        required: false
        default: ""
      year:
        description: "Crop year of the ADM. Blank = newest that exists."
        required: false
        default: ""
      limit:
        description: "Trial: only the first N grids, written to data/prf-trial and NOT committed"
        required: false
        default: ""
      check_random:
        description: "How many random policies to set against RMA's tool (default 8)"
        required: false
        default: ""
      from_staging:
        description: "Do not fetch. Take the files the last fetch left on the prf-staging branch and go straight to the check (type: yes)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: prf
  cancel-in-progress: false

jobs:
  prf:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pillow, for the share image
        run: pip install pillow==11.0.0

      - name: The arithmetic and the fetcher, offline, before anything is asked
        run: |
          python scripts/fetch_prf.py --selftest
          python scripts/send_prf_notice.py --selftest
          python scripts/stamp_prf.py --selftest
          node scripts/prf_facts.mjs --selftest
          node --test test/prf-math.test.mjs test/prf-check.test.mjs test/prf-page.test.mjs test/prf-county-pages.test.mjs

      # A FETCH IS 13,400 CALLS TO RMA AND MUST NOT BE THROWN AWAY BY A LATER STEP.
      # The first two full runs (2026-10-12) each fetched everything, failed the
      # check on this repo's own arithmetic, committed nothing, and so asked RMA
      # for all of it again. Every fetch is now left on the prf-staging branch
      # before the check runs, and from_staging: yes starts from there.
      - name: Take the staged files instead of fetching
        if: github.event.inputs.from_staging == 'yes'
        run: |
          set -o pipefail
          git fetch -q --depth 1 origin prf-staging
          rm -rf data/prf && mkdir -p data
          git archive FETCH_HEAD data/prf | tar -x
          rm -f data/prf/check.json
          python - <<'PY' | tee prf-run.log
          import json
          m = json.load(open('data/prf/meta.json'))
          print("from prf-staging: built %s, crop year %d, %d grids, complete to %d" % (
              m['built'], m['crop_year'], m['counts']['grids'], m['years']['last_complete']))
          PY

      - name: Fetch
        if: github.event.inputs.from_staging != 'yes'
        env:
          IN_FULL: ${{ github.event.inputs.full }}
          IN_YEAR: ${{ github.event.inputs.year }}
          IN_LIMIT: ${{ github.event.inputs.limit }}
        run: |
          set -o pipefail
          ARGS=()
          if [ "$IN_FULL" = "yes" ]; then ARGS+=(--full); fi
          if [ -n "$IN_YEAR" ]; then
            printf '%s' "$IN_YEAR" | grep -Eq '^[0-9]{4}$' || { echo "::error::year must be 4 digits"; exit 1; }
            ARGS+=(--year "$IN_YEAR")
          fi
          if [ -n "$IN_LIMIT" ]; then
            printf '%s' "$IN_LIMIT" | grep -Eq '^[0-9]+$' || { echo "::error::limit must be a number"; exit 1; }
            ARGS+=(--limit "$IN_LIMIT")
          fi
          python scripts/fetch_prf.py "${ARGS[@]}" 2>&1 | tee prf-run.log

      - name: Leave the fetch on the prf-staging branch
        if: github.event.inputs.limit == '' && github.event.inputs.from_staging != 'yes'
        run: |
          rm -rf /tmp/prf-stage && mkdir -p /tmp/prf-stage/data
          cp -r data/prf /tmp/prf-stage/data/prf
          rm -f /tmp/prf-stage/data/prf/check.json
          cd /tmp/prf-stage
          git init -q -b prf-staging
          git config user.name "agsist-probe"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "prf fetch $(date -u +%Y-%m-%dT%H:%M:%SZ) run ${{ github.run_id }}, not yet checked"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" prf-staging

      - name: Against RMA's own tool
        if: github.event.inputs.limit == ''
        env:
          IN_CHECK_RANDOM: ${{ github.event.inputs.check_random }}
        run: |
          set -o pipefail
          N="$IN_CHECK_RANDOM"
          if [ -n "$N" ] && ! printf '%s' "$N" | grep -Eq '^[0-9]+$'; then echo "::error::check_random must be a number"; exit 1; fi
          node scripts/check_prf_rma.mjs --random "${N:-8}" --detail prf-check-detail.json 2>&1 | tee -a prf-run.log

      # Everything the pages print comes from the files above: the national and
      # state figures (prf_facts.mjs), the dates, counts and check line on /prf
      # (stamp_prf.py), the 48 state pages and the explainer, the 3,070 county pages
      # and sitemap-prf.xml (build_prf_counties.py), and the share image.
      - name: Figures, page, state pages, share image
        if: github.event.inputs.limit == ''
        run: |
          set -o pipefail
          node scripts/prf_facts.mjs 2>&1 | tee -a prf-run.log
          python scripts/stamp_prf.py 2>&1 | tee -a prf-run.log
          python scripts/build_prf_states.py 2>&1 | tee -a prf-run.log
          node scripts/prf_county_facts.mjs --selftest
          python scripts/build_prf_counties.py 2>&1 | tee -a prf-run.log
          python scripts/build_prf_card.py 2>&1 | tee -a prf-run.log
          node scripts/prf_facts.mjs --check && python scripts/stamp_prf.py --check && python scripts/build_prf_states.py --check && python scripts/build_prf_counties.py --check

      - name: Site budget
        if: github.event.inputs.limit == ''
        run: |
          set -o pipefail
          python scripts/check_site_budget.py 2>&1 | tee -a prf-run.log

      - name: Commit
        if: github.event.inputs.limit == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # when USDA's numbers moved, the PRF pages' sitemap dates move with them
          if [ -n "$(git status --porcelain data/prf/g data/prf/y data/prf/s)" ]; then
            python - <<'PY'
          import re, datetime
          day = datetime.date.today().isoformat()
          s = open('sitemap.xml').read()
          s = re.sub(r'(<loc>https://agsist\.com/prf(?:/[a-z-]+)?</loc><lastmod>)[0-9-]+(</lastmod>)', lambda m: m.group(1) + day + m.group(2), s)
          open('sitemap.xml', 'w').write(s)
          PY
            echo "changed=1" >> "$GITHUB_ENV"
          fi
          git add -A data/prf data/pointers prf.html prf img/og/prf.jpg sitemap.xml sitemap-prf.xml
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          C=$(python - <<'PY'
          import json
          m = json.load(open('data/prf/meta.json'))
          c = json.load(open('data/prf/check.json'))
          o = m['years']['open']
          print("crop year %d, %d grids, %d counties, complete to %d, open %s; RMA check %d of %d reached agree" % (
              m['crop_year'], m['counts']['grids'], m['counts']['counties'], m['years']['last_complete'],
              ",".join(sorted(o)) or "none", c['agreed'], c['reached']))
          PY
          )
          git commit -q -m "data: prf ($C)"
          # other workflows commit to main all day; rebase and retry
          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            if git pull -q --rebase --autostash origin main && git push -q; then exit 0; fi
            sleep $((30 * i))
          done
          echo "push failed after 5 attempts"; exit 1

      - name: Tell search engines the PRF pages changed
        if: env.changed == '1' && github.event.inputs.limit == ''
        run: |
          python - <<'PY' > urls.txt
          import re
          print("\n".join(re.findall(r'<loc>(https://agsist\.com/prf(?:/[a-z-]+)?)</loc>', open('sitemap.xml').read())))
          # the county pages, from their own sitemap (3,070 URLs, under the 10,000 a request takes)
          print("\n".join(re.findall(r'<loc>(https://agsist\.com/prf/[a-z-]+/[a-z0-9-]+)</loc>', open('sitemap-prf.xml').read())))
          PY
          python scripts/indexnow_submit.py --urls $(cat urls.txt) || echo "IndexNow ping failed - harmless"

      # The PRF grid index email (subs worker v5.29, topic prf:<grid>, asked on
      # /prf and the PRF county pages). After the fetch passed RMA's own check and
      # was committed, so the email and the pages carry the same index. Each
      # interval goes to an address once (marked with the interval after the
      # send). No new schedule: it rides this one.
      - name: PRF grid index emails
        if: github.event.inputs.limit == ''
        env:
          LIST_URL: ${{ secrets.LIST_URL }}
          LIST_TOKEN: ${{ secrets.LIST_TOKEN }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}   # the private copy of the list when the worker is blocked (scripts/list_source.py)
          UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER || secrets.GMAIL_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || secrets.GMAIL_APP_PASS }}
          FROM_ADDR: ${{ secrets.FROM_ADDR }}
          REPLY_TO: ${{ secrets.REPLY_TO }}
        run: python3 scripts/send_prf_notice.py --send

      - name: Publish the run log to the prf-log branch
        if: always()
        run: |
          mkdir -p /tmp/prf-log && cd /tmp/prf-log
          cp "$GITHUB_WORKSPACE/prf-run.log" . 2>/dev/null || echo "no log was written" > prf-run.log
          cp "$GITHUB_WORKSPACE/data/prf/meta.json" . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/data/prf/check.json" . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/prf-check-detail.json" . 2>/dev/null || true
          if [ -d "$GITHUB_WORKSPACE/data/prf-trial" ]; then cp -r "$GITHUB_WORKSPACE/data/prf-trial" .; fi
          echo "run ${{ github.run_id }} ${{ job.status }} $(date -u +%Y-%m-%dT%H:%M:%SZ)" > status.txt
          git init -q -b prf-log
          git config user.name "agsist-probe"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "prf run log $(date -u +%Y-%m-%dT%H:%M:%SZ) run ${{ github.run_id }} (${{ job.status }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" prf-log
