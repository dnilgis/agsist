name: Bid change ledger (dispatch only)
# Bid change ledger (dispatch only).

on:
  workflow_dispatch:
    inputs:
      snapshots:
        description: "Rebuild the Aug 20 to Oct 16 daily bid snapshots while walking those days"
        type: boolean
        default: true
      max_minutes:
        description: "Stop starting new days after this many minutes; what is done is saved"
        type: string
        default: "300"

permissions:
  contents: read

concurrency:
  group: bid-change-ledger
  cancel-in-progress: false

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            /scripts/
            /data/ids/
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Selftests (no network)
        run: |
          python3 scripts/bid_change_ledger.py --selftest
          python3 scripts/bid_snapshots.py --selftest
      - name: Walk the bids history
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          SNAPSHOTS: ${{ inputs.snapshots && '1' || '' }}
          MAX_MINUTES: ${{ inputs.max_minutes }}
          RAW_SOFT: '1'
        run: |
          case "$MAX_MINUTES" in ''|*[!0-9]*) echo "::error::max_minutes is a number"; exit 1;; esac
          bash scripts/bid_change_ledger.sh
