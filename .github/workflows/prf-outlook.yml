name: prf outlook

on:
  schedule:
    - cron: "47 15 * * 4"
    - cron: "17 11 * * 5"
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow prf-outlook.yml --max-lag 360
          --cron "47 15 * * 4"
          --cron "17 11 * * 5"

  outlook:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: prf-outlook
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Offline first
        run: |
          python scripts/fetch_prf_outlook.py --selftest
          node --test test/prf-outlook.test.mjs

      - name: Fetch
        id: fetch
        continue-on-error: true
        timeout-minutes: 8
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          python scripts/fetch_prf_outlook.py 2>&1 | tee prf-outlook.log

      - name: The file is well formed, and inside the size budget
        run: |
          python scripts/fetch_prf_outlook.py --check
          python scripts/check_site_budget.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prf/outlook.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          ISSUED=$(python -c "import json;d=json.load(open('data/prf/outlook.json'));print(', '.join('%s %s'%(k,(d.get(k) or {}).get('issued') or (d.get(k) or {}).get('map_date') or 'none') for k in ('seasonal','monthly','enso','drought')))")
          git commit -q -m "data: prf outlook ($ISSUED)"
          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            if git pull -q --rebase --autostash origin main && git push -q; then exit 0; fi
            sleep $((20 * i))
          done
          echo "push failed after 5 attempts"; exit 1

      - name: Say which source failed
        if: steps.fetch.outcome == 'failure'
        run: |
          grep -E "FAILED|kept the published|refusing" prf-outlook.log || true
          echo "::warning::A PRF outlook source failed; the published section was kept. See the Fetch step."
