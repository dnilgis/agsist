name: Monthly land sale email
# Monthly land sale email.

# scripts/land_alert.py). The owner approved the list, the sender and this schedule on Oct 23, 2026.
# Signups on (Oct 27, 2026). The ask tells a
# The 3rd, 15:47 UTC (the schedule the owner approved): after land-data.yml (the 3rd, 09:23 UTC,
on:
  schedule:
    - cron: "47 15 3 * *"
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry = render only; preview = Sig only; send = the list (needs LANDSALES_MONTHLY_LIVE=1)'
        type: choice
        options: [dry, preview, send]
        default: dry
      month:
        description: 'YYYY-MM for dry or preview (empty: the month just ended; a send is always that month)'
        required: false
        default: ''
      sample:
        description: 'Samples for dry or preview, ZIP:miles comma-separated (empty: 54728:25,61920:25)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
      catchup: ${{ steps.land.outputs.catchup }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow land-alert.yml --max-lag 360
          --cron "47 15 3 * *"
      - id: land
        if: ${{ github.event_name == 'workflow_run' && steps.g.outputs.go != '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SINCE=$(date -u -d '-30 min' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/$GITHUB_REPOSITORY/commits?sha=main&path=data/land&since=$SINCE&per_page=20" --jq '[.[] | select(.commit.message | startswith("Update land data"))] | length' 2>/dev/null || echo 0)
          if [ "${n:-0}" -gt 0 ] 2>/dev/null; then
            echo "catchup=1" >> "$GITHUB_OUTPUT"; echo "catch-up: a land data commit on main since $SINCE"
          else
            echo "catchup=0" >> "$GITHUB_OUTPUT"
          fi

  email:
    needs: gate
    if: needs.gate.outputs.go == '1' || needs.gate.outputs.catchup == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: land-alert-email
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the sender first
        run: |
          python scripts/land_alert.py --selftest
          python scripts/send_land_alert.py --selftest

      - name: Florida county files (agsist-data)
        env:
          AGSIST_DATA_TOKEN: ${{ secrets.AGSIST_DATA_TOKEN }}
        run: |
          if bash scripts/agsist_data.sh checkout "$RUNNER_TEMP/agsist-data" >/dev/null && [ -f "$RUNNER_TEMP/agsist-data/land/fl/index.json" ]; then
            ln -sfn "$RUNNER_TEMP/agsist-data/land" data/land-hosted; echo "Florida county files linked"
          else
            echo "::warning::Florida county files not reached; Florida readers wait for the next run"
          fi

      - name: Monthly land sale email (${{ (github.event_name == 'schedule' || github.event_name == 'workflow_run') && 'scheduled' || inputs.mode }})
        env:
          LIST_URL: ${{ secrets.LIST_URL }}
          LIST_TOKEN: ${{ secrets.LIST_TOKEN }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER || secrets.GMAIL_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || secrets.GMAIL_APP_PASS }}
          FROM_ADDR: ${{ secrets.FROM_ADDR }}
          SIG_TO: ${{ secrets.SIG_TO }}
          SIG_TEST_EMAILS: ${{ secrets.SIG_TEST_EMAILS }}
          LANDSALES_MONTHLY_LIVE: ${{ vars.LANDSALES_MONTHLY_LIVE }}
          PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'preview' && '1' || '' }}
          SEND: ${{ (((github.event_name == 'schedule' || github.event_name == 'workflow_run') && vars.LANDSALES_MONTHLY_LIVE == '1') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'send' && vars.LANDSALES_MONTHLY_LIVE == '1')) && '1' || '' }}
          ASKED_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'send' && '1' || '' }}
          MONTH: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'send' && inputs.month || '' }}
          SAMPLE: ${{ github.event_name == 'workflow_dispatch' && inputs.sample || '' }}
          CATCH_UP: ${{ needs.gate.outputs.go != '1' && needs.gate.outputs.catchup == '1' && '1' || '' }}
        run: |
          if [ "$ASKED_SEND" = 1 ] && [ "$SEND" != 1 ]; then
            echo "::error::mode send, but the repo variable LANDSALES_MONTHLY_LIVE is not 1: the list gets nothing. Nothing sent."
            exit 1
          fi
          ARGS=""
          if [ "$CATCH_UP" = 1 ] && [ "$SEND" = 1 ]; then ARGS="--catch-up"; fi
          if [ -n "$MONTH" ]; then ARGS="$ARGS --month $MONTH"; fi
          if [ -n "$SAMPLE" ]; then ARGS="$ARGS --sample $SAMPLE"; fi
          python3 scripts/send_land_alert.py $ARGS
