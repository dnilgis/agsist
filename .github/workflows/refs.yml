name: refs

# Reference library: primary sources (RMA policies and bulletins, extension
# fact sheets, vendor data sheets) that back numbers on agsist.com.
#
# Why Actions: the sandbox we build in cannot open USDA, RMA, extension or
# vendor sites. GitHub's runners can. So this downloads every source listed in
# references/sources.json into the `references` branch, which Pages never
# deploys:
#   refs/<id>.pdf|html   the original
#   refs/<id>.txt        readable text (pdftotext -layout, or page text)
#   index.json           status, bytes, sha256, fetched_utc, pages per source
# Read one anywhere:
#   git fetch origin references && git show origin/references:refs/<id>.txt
#
# A source that fails is listed (index.json, the run summary, a warning) and
# keeps its last good copy; the run does not fail over it.
#
# Dispatch (all, or a few ids):
#   gh workflow run refs.yml --ref main
#   gh workflow run refs.yml --ref main -f ids=rma-pm-20-064,uw-a2809-2026
#
# Monthly on the 3rd at 09:23 UTC. Polite: one request at a time, 1.5 s apart.
#
# Sources of kind "rendered" (pages built by JavaScript) open in headless
# Chromium. Playwright and the browser are installed only when the run
# includes one (blank ids = all, so the monthly run does), into a venv in
# RUNNER_TEMP; the plain fetch needs nothing but Python. A page that shows a
# bot check is never saved, rendered or not.
on:
  schedule:
    - cron: '23 9 3 * *'
  workflow_dispatch:
    inputs:
      ids:
        description: "Comma-separated source ids from references/sources.json (blank = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: refs
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      IN_IDS: ${{ inputs.ids || '' }}
      # outside the checkout, so the site budget never counts it
      REFS: ${{ github.workspace }}/../references
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/fetch_refs.py
            references/sources.json
          sparse-checkout-cone-mode: false

      - name: Install poppler (pdftotext)
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq poppler-utils >/dev/null
          pdftotext -v 2>&1 | head -1

      - name: Check the input
        run: |
          # an empty input means every source; grep sees no line at all for "", so test it only when set
          if [ -n "$IN_IDS" ] && ! printf '%s\n' "$IN_IDS" | grep -Eq '^[a-z0-9,-]+$'; then
            echo "::error::ids must be source ids separated by commas"; exit 1; fi

      - name: Does this run need a browser?
        id: need
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          rows = json.load(open("references/sources.json"))["sources"]
          want = {i.strip() for i in os.environ.get("IN_IDS", "").split(",") if i.strip()}
          hit = [r["id"] for r in rows if r["kind"] == "rendered" and (not want or r["id"] in want)]
          print("browser=" + ("true" if hit else "false"))
          PY
          cat "$GITHUB_OUTPUT"

      - name: Install Playwright and Chromium
        if: ${{ steps.need.outputs.browser == 'true' }}
        run: |
          python3 -m venv "$RUNNER_TEMP/pw"
          "$RUNNER_TEMP/pw/bin/pip" install -q playwright==1.56.0
          "$RUNNER_TEMP/pw/bin/python" -m playwright install --with-deps chromium >/dev/null
          echo "PY=$RUNNER_TEMP/pw/bin/python" >> "$GITHUB_ENV"
          echo "REFS_REQUIRE_BROWSER=1" >> "$GITHUB_ENV"

      # With a browser installed the selftest also renders a local fixture
      # page and must pass that (REFS_REQUIRE_BROWSER=1).
      - name: Selftest
        run: |
          "${PY:-python3}" scripts/fetch_refs.py --selftest
          "${PY:-python3}" scripts/fetch_refs.py --check

      # THE MAIN CHECKOUT IS SPARSE, AND A NEW WORKTREE COPIES ITS SPARSE
      # PATTERNS (git 2.38+). The first run (2026-10-15) got a references
      # worktree with nothing checked out, and `git add -A` refused refs/ and
      # index.json as "outside of your sparse-checkout definition": the
      # commit step failed with every fetch done. So: add it without a
      # checkout, turn sparse off for that worktree only, then check out.
      # (--no-checkout alone would leave an empty index and the commit would
      # delete README.md; the reset fills it.)
      - name: Check out the references branch
        run: |
          git config --global user.name "agsist-bot"
          git config --global user.email "bot@agsist.com"
          git fetch -q --depth 1 origin references || { echo "::error::the references branch is missing; push it first"; exit 1; }
          git worktree add -q --no-checkout -B references "$REFS" FETCH_HEAD
          git -C "$REFS" sparse-checkout disable
          git -C "$REFS" reset -q --hard
          test -f "$REFS/README.md" || { echo "::error::references worktree came out empty (no README.md)"; exit 1; }

      - name: Fetch the sources
        timeout-minutes: 75
        run: '"${PY:-python3}" scripts/fetch_refs.py --out "$REFS" --ids "$IN_IDS"'

      # Only this workflow writes the branch and runs one at a time, but a
      # hand edit (the README) can land in between: retry on the newest tip.
      # Every git failure is printed as a ::warning:: with git's own words,
      # because the job log is not always readable from where we look.
      - name: Commit to references
        if: ${{ !cancelled() }}
        run: |
          set -u
          g() { local out; if out=$(git "$@" 2>&1); then return 0; fi
                echo "::warning::git $1 failed: $(printf '%s' "$out" | tail -5 | tr '\n' ' ')"; return 1; }
          cd "$REFS"
          [ -f index.json ] || { echo "::warning::no index.json: the fetch wrote nothing"; exit 1; }
          mkdir -p refs
          g add -A || exit 1
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          rm -rf /tmp/refsout && mkdir -p /tmp/refsout
          cp -r refs index.json /tmp/refsout/
          for i in 1 2 3 4 5; do
            g fetch -q --depth 1 origin references || { sleep $((10 * i)); continue; }
            g reset -q --hard FETCH_HEAD || exit 1
            rm -rf refs index.json && cp -r /tmp/refsout/refs /tmp/refsout/index.json .
            test -f README.md || { echo "::warning::README.md missing after reset; not committing"; exit 1; }
            g add -A || exit 1
            if git diff --cached --quiet; then echo "no change"; exit 0; fi
            g commit -q -m "refs $(date -u +%Y-%m-%dT%H:%M:%SZ)${IN_IDS:+: $IN_IDS}" || exit 1
            if out=$(git push -q origin HEAD:references 2>&1); then echo "pushed $(git rev-parse --short HEAD)"; exit 0; fi
            # the whole answer, not a tail: on Oct 17 the tail hid which file push protection named
            echo "::group::git push output (try $i)"; printf '%s\n' "$out"; echo "::endgroup::"
            echo "::warning::git push failed: $(printf '%s' "$out" | grep -iE 'GH0|rule|secret|refs/[a-z0-9-]+\.' | head -8 | tr '\n' ' ')"
            # Push protection names each file with a key in it. Leave those
            # pages out (rows marked failed) and push the rest of the run.
            flagged=$(printf '%s\n' "$out" | grep -oE 'refs/[a-z0-9][a-z0-9-]*\.(html|txt|pdf)' \
                      | sed -E 's#^refs/##; s#\.(html|txt|pdf)$##' | sort -u | paste -sd, -)
            if [ -n "$flagged" ]; then
              echo "::warning::push protection flagged $flagged; left out of this commit"
              python3 "$GITHUB_WORKSPACE/scripts/fetch_refs.py" --drop --out /tmp/refsout --ids "$flagged" \
                --reason "push protection found a key-shaped string in this page; not saved" || exit 1
              continue
            fi
            sleep $((10 * i))
          done
          echo "::error::could not push the references branch after 5 tries (see the warnings above)"; exit 1
