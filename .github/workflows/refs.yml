name: refs

on:
  schedule:
    - cron: '23 9 3 * *'
  workflow_run:
    workflows: ["Fetch Grain Bids", "Tick 07"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ids:
        description: "Comma-separated source ids from references/sources.json (blank = all)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  gate:
    if: (github.event.workflow_run.name != 'Fetch Grain Bids' || vars.CLOCK_LIVE != '1') && (github.event.workflow_run.name != 'Tick 07' || (contains(github.event.workflow_run.display_title, ' refs.yml ') && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow refs.yml --max-lag 360
          --cron "23 9 3 * *"

  fetch:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-24.04
    concurrency:
      group: refs
      cancel-in-progress: false
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      IN_IDS: ${{ inputs.ids || '' }}
      REFS: ${{ github.workspace }}/../references
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/fetch_refs.py
            scripts/private_remote.sh
            references/sources.json
            /.github/actions/engine/
            /.github/actions/pdftotext/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - name: Install poppler (pdftotext)
        timeout-minutes: 5
        uses: ./.github/actions/pdftotext

      - name: Check the input
        run: |
          if [ -n "$IN_IDS" ] && ! printf '%s\n' "$IN_IDS" | grep -Eq '^[a-z0-9,-]+$'; then
            echo "::error::ids must be source ids separated by commas"; exit 1; fi

      - name: Does this run need a browser?
        id: need
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          rows = json.load(open("references/sources.json"))["sources"]
          want = {i.strip() for i in os.environ.get("IN_IDS", "").split(",") if i.strip()}
          hit = [r["id"] for r in rows if r["kind"] == "rendered" and (not want or r["id"] in want)]
          print("browser=" + ("true" if hit else "false"))
          PY
          cat "$GITHUB_OUTPUT"

      - name: Install Playwright and Chromium
        if: ${{ steps.need.outputs.browser == 'true' }}
        run: |
          python3 -m venv "$RUNNER_TEMP/pw"
          "$RUNNER_TEMP/pw/bin/pip" install -q playwright==1.56.0
          "$RUNNER_TEMP/pw/bin/python" -m playwright install --with-deps chromium >/dev/null
          echo "PY=$RUNNER_TEMP/pw/bin/python" >> "$GITHUB_ENV"
          echo "REFS_REQUIRE_BROWSER=1" >> "$GITHUB_ENV"

      - name: Selftest
        run: |
          "${PY:-python3}" scripts/fetch_refs.py --selftest
          "${PY:-python3}" scripts/fetch_refs.py --check

      - name: Check out the references branch
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          git config --global user.name "agsist-bot"
          git config --global user.email "bot@agsist.com"
          . scripts/private_remote.sh
          git fetch -q --depth 1 "$REMOTE" references || { echo "::error::the references branch is missing on $WHERE, or the key cannot read it"; exit 1; }
          git worktree add -q --no-checkout -B references "$REFS" FETCH_HEAD
          git -C "$REFS" sparse-checkout disable
          git -C "$REFS" reset -q --hard
          test -f "$REFS/README.md" || { echo "::error::references worktree came out empty (no README.md)"; exit 1; }

      - name: Fetch the sources
        timeout-minutes: 75
        run: '"${PY:-python3}" scripts/fetch_refs.py --out "$REFS" --ids "$IN_IDS" --budget-min 60'

      - name: Commit to references
        if: ${{ !cancelled() }}
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -u
          . scripts/private_remote.sh
          g() { local out; if out=$(git "$@" 2>&1); then return 0; fi
                echo "::warning::git $1 failed: $(printf '%s' "$out" | tail -5 | tr '\n' ' ' | hide)"; return 1; }
          cd "$REFS"
          [ -f index.json ] || { echo "::warning::no index.json: the fetch wrote nothing"; exit 1; }
          mkdir -p refs
          g add -A || exit 1
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          rm -rf /tmp/refsout && mkdir -p /tmp/refsout
          cp -r refs index.json /tmp/refsout/
          for i in 1 2 3 4 5; do
            g fetch -q --depth 1 "$REMOTE" references || { sleep $((10 * i)); continue; }
            g reset -q --hard FETCH_HEAD || exit 1
            rm -rf refs index.json && cp -r /tmp/refsout/refs /tmp/refsout/index.json .
            test -f README.md || { echo "::warning::README.md missing after reset; not committing"; exit 1; }
            g add -A || exit 1
            if git diff --cached --quiet; then echo "no change"; exit 0; fi
            g commit -q -m "refs $(date -u +%Y-%m-%dT%H:%M:%SZ)${IN_IDS:+: $IN_IDS}" || exit 1
            if out=$(git push -q "$REMOTE" HEAD:references 2>&1); then echo "pushed $(git rev-parse --short HEAD) to references on $WHERE"; exit 0; fi
            out=$(printf '%s\n' "$out" | hide)
            echo "::group::git push output (try $i)"; printf '%s\n' "$out"; echo "::endgroup::"
            echo "::warning::git push failed: $(printf '%s' "$out" | grep -iE 'GH0|rule|secret|refs/[a-z0-9-]+\.' | head -8 | tr '\n' ' ')"
            flagged=$(printf '%s\n' "$out" | grep -oE 'refs/[a-z0-9][a-z0-9-]*\.(html|txt|pdf)' \
                      | sed -E 's#^refs/##; s#\.(html|txt|pdf)$##' | sort -u | paste -sd, -)
            if [ -n "$flagged" ]; then
              echo "::warning::push protection flagged $flagged; left out of this commit"
              python3 "$GITHUB_WORKSPACE/scripts/fetch_refs.py" --drop --out /tmp/refsout --ids "$flagged" \
                --reason "push protection found a key-shaped string in this page; not saved" || exit 1
              continue
            fi
            sleep $((10 * i))
          done
          echo "::error::could not push the references branch after 5 tries (see the warnings above)"; exit 1
