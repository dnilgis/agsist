name: CCC loan rates

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Probe only: save the raw FSA pages and county files to data/ccc-loan-raw/ on the raw branch"
        type: boolean
        default: false
  schedule:
    - cron: '23 14 1-5 * *'
    - cron: '23 14 15 * *'
  workflow_run:
    workflows: ["Tick 11"]
    types: [completed]

permissions:
  contents: write

jobs:
  gate:
    if: github.event.workflow_run.name != 'Tick 11' || contains(github.event.workflow_run.display_title, ' ccc-loan.yml ')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow ccc-loan.yml --max-lag 360
          --cron "23 14 1-5 * *"
          --cron "23 14 15 * *"

  build:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: ccc-loan
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pypdf (fallback if pdftotext is missing)
        run: pip install pypdf==6.20.1
      - name: Selftest
        run: python scripts/fetch_ccc_loan.py --selftest
      - name: Probe (raw source capture)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe }}
        run: python scripts/fetch_ccc_loan.py --probe
      - name: Save the probe's raw files to the raw branch
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.probe }}
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_SOFT: '1'
        run: bash scripts/push_raw.sh "ccc-loan probe" data/ccc-loan-raw
      - name: Fetch and write data/ccc-loan.json
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) }}
        run: python scripts/fetch_ccc_loan.py
      - name: Commit if changed (race-tolerant)
        run: |
          set -e
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          FILES="data/ccc-loan.json data/ccc-loan"
          rm -rf /tmp/cl && mkdir -p /tmp/cl
          for f in $FILES; do
            [ -e "$f" ] && cp -r --parents "$f" /tmp/cl/ || true
          done
          [ -n "$(ls -A /tmp/cl)" ] || { echo "No output; nothing to commit."; exit 0; }
          BR="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3 4 5; do
            git fetch origin "$BR"
            git reset --hard "origin/$BR"
            mkdir -p data && cp -r /tmp/cl/data/. data/
            for f in $FILES; do [ -e "$f" ] && git add "$f" || true; done
            if git diff --staged --quiet; then echo "No change."; exit 0; fi
            git commit -m "Update CCC loan rates $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            if git push origin "HEAD:$BR"; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push race on attempt $i; re-syncing to origin/$BR..."
            sleep $((RANDOM % 4 + 2))
          done
          echo "Failed to push after 5 attempts."; exit 1
