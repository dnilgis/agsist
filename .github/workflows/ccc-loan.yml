name: CCC loan rates

# Writes data/ccc-loan.json (the monthly CCC commodity loan interest rate) and
# data/ccc-loan/<ST>.json (2026 county loan rates for corn and soybeans) for
# /commodity-loan. Public FSA pages, read by scripts/fetch_ccc_loan.py. The
# page shows an empty state and asks for the rate until this file exists.
#
# FIRST RUN: dispatch this once with "probe" ticked. It saves what FSA returned
# to data/ccc-loan-raw/ and saves it on the raw branch (never deployed), so the real page and file layouts can be
# checked against the parsers before trusting a number.

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Probe only: save the raw FSA pages and county files to data/ccc-loan-raw/ on the raw branch"
        type: boolean
        default: false
  schedule:
    - cron: '23 14 1-5 * *'   # FSA posts the month's rates in the first business days
    - cron: '23 14 15 * *'    # mid-month check for county file changes
  # GitHub's scheduler drops scheduled fires (it never started land-data.yml on Nov 3, 2026;
  # scripts/cron_gate.py has the numbers). So this also runs after every "Fetch Grain Bids"
  # (cron-job.org, every 15 minutes), and the gate job lets the first run after each tick of the
  # cron above, by either trigger, do the work within 360 minutes
  # (six hours, the same day and well before the next tick).
  # Every other run skips in seconds. A chained run takes the scheduled path. A run by hand or
  # a push does not use up the tick (cron_gate.py MANUAL_DOES_NOT_SERVE): it may take narrower
  # inputs, and the chained run that follows is the same idempotent job.
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]

permissions:
  contents: write

jobs:
  # One run per tick of the schedule (see on: above). Sparse: the skip costs seconds.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow ccc-loan.yml --max-lag 360
          --cron "23 14 1-5 * *"
          --cron "23 14 15 * *"

  build:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: ccc-loan
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pypdf (fallback if pdftotext is missing)
        run: pip install pypdf==6.20.1
      - name: Selftest
        run: python scripts/fetch_ccc_loan.py --selftest
      - name: Probe (raw source capture)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe }}
        run: python scripts/fetch_ccc_loan.py --probe
      # Raw captures go to the raw branch (never deployed), not main: scripts/push_raw.sh.
      # Runs even when the probe step failed part way, so what it did capture is kept.
      - name: Save the probe's raw files to the raw branch
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.probe }}
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_SOFT: '1'
        run: bash scripts/push_raw.sh "ccc-loan probe" data/ccc-loan-raw
      - name: Fetch and write data/ccc-loan.json
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) }}
        run: python scripts/fetch_ccc_loan.py
      - name: Commit if changed (race-tolerant)
        run: |
          set -e
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          FILES="data/ccc-loan.json data/ccc-loan"
          rm -rf /tmp/cl && mkdir -p /tmp/cl
          for f in $FILES; do
            [ -e "$f" ] && cp -r --parents "$f" /tmp/cl/ || true
          done
          [ -n "$(ls -A /tmp/cl)" ] || { echo "No output; nothing to commit."; exit 0; }
          BR="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3 4 5; do
            git fetch origin "$BR"
            git reset --hard "origin/$BR"
            mkdir -p data && cp -r /tmp/cl/data/. data/
            for f in $FILES; do [ -e "$f" ] && git add "$f" || true; done
            if git diff --staged --quiet; then echo "No change."; exit 0; fi
            git commit -m "Update CCC loan rates $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            if git push origin "HEAD:$BR"; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push race on attempt $i; re-syncing to origin/$BR..."
            sleep $((RANDOM % 4 + 2))
          done
          echo "Failed to push after 5 attempts."; exit 1
