name: Prediction bot — call and grade

on:
  schedule:
    - cron: '41 19 * * 1-5'
    - cron: '41 20 * * 1-5'
    - cron: '41 22 * * 1-5'
    - cron: '41 23 * * 1-5'
  workflow_run:
    workflows: ["Fetch Grain Bids", "Tick 03"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: America/Chicago

jobs:
  gate:
    if: (github.event.workflow_run.name != 'Fetch Grain Bids' || vars.CLOCK_LIVE != '1') && (github.event.workflow_run.name != 'Tick 03' || contains(github.event.workflow_run.display_title, ' predictions.yml '))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go == '1' && '1' || steps.p.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            data/predictions.json
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow predictions.yml --max-lag 50
          --cron "41 19 * * 1-5"
          --cron "41 20 * * 1-5"
          --cron "41 22 * * 1-5"
          --cron "41 23 * * 1-5"
      - id: p
        if: steps.g.outputs.go != '1'
        run: python3 scripts/cron_gate.py predict

  call:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: prediction-bot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --quiet yfinance==1.7.0 pandas==3.0.6

      - name: Prove the rule and the calendars
        run: |
          python scripts/contract_calendar.py
          python scripts/cot_calendar.py
          python scripts/prediction_bot.py --selftest

      - name: Deep history from raw
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: bash scripts/pull_raw.sh data/cot-deep.json

      - name: Grade matured calls, make today's calls, rebuild the backtest
        run: python scripts/prediction_bot.py --live

      - name: Track record
        run: |
          if git clone -q --depth 1 --filter=blob:none --sparse https://github.com/dnilgis/agsist-data.git "$RUNNER_TEMP/ad" \
             && git -C "$RUNNER_TEMP/ad" sparse-checkout set forecasts; then
            python scripts/build_track_record.py --data "$RUNNER_TEMP/ad" || echo "::warning title=Track record::not updated"
          else
            echo "::warning title=Track record::public record not reachable; not updated"
          fi

      - name: Commit and push
        run: |
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          git add data/predictions.json data/predictions-backtest.json usda-calendar.html
          if git diff --staged --quiet; then
            echo "No change."
            exit 0
          fi
          git commit -m "Prediction bot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep $((i * 7))
          done
          echo "::error title=Prediction bot::push failed three times"
          exit 1

      - name: Entry-day watch
        if: always()
        run: python scripts/prediction_bot.py --watch
