name: Prediction bot — call and grade

# The statistical prediction bot (scripts/prediction_bot.py, rule set bot-v1.1).
# Once per weekly CFTC report, at the first close a reader could trade on it,
# it makes one direction call per crop (corn, soybeans, Chicago wheat, KC
# wheat), graded at the entry close of the report four weeks later. Each run
# also grades matured calls and recomputes the walk-forward backtest. Writes:
#   data/predictions.json           calls, graded record, backtest summary
#   data/predictions-backtest.json  every backtest call, for re-deriving it
#
# The briefing (daily.yml, 6 AM Central) prints the latest call from
# predictions.json as "BOT CALL"; /scorecard and the homepage card read it.
#
# Two fires, both off :00/:15/:30/:45 (the shape this repo has measured as the
# one GitHub delivers), both before the 7 PM CT evening reopen: after it,
# Yahoo's daily bar holds overnight trades and the bot refuses to call or grade.
# Calls are keyed by crop and report, so a second run makes no new call.
#   22:41 UTC Mon-Fri = 5:41 PM CDT / 4:41 PM CST
#   23:41 UTC Mon-Fri = 6:41 PM CDT / 5:41 PM CST (retry)

on:
  schedule:
    - cron: '41 22 * * 1-5'
    - cron: '41 23 * * 1-5'   # retry, before the 7 PM CT reopen in both seasons
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prediction-bot
  cancel-in-progress: false

env:
  TZ: America/Chicago

jobs:
  call:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --quiet yfinance pandas

      # The rule before the run: grading, the refusal of a target at or behind
      # its entry, the session count, the contract choice, the binomial and
      # the no-look-ahead mutation test. No network, about a second.
      - name: Prove the rule and the calendars
        run: |
          python scripts/contract_calendar.py
          python scripts/cot_calendar.py
          python scripts/prediction_bot.py --selftest

      - name: Grade matured calls, make today's calls, rebuild the backtest
        run: python scripts/prediction_bot.py --live

      - name: Commit and push
        run: |
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          git add data/predictions.json data/predictions-backtest.json
          if git diff --staged --quiet; then
            echo "No change."
            exit 0
          fi
          git commit -m "Prediction bot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep $((i * 7))
          done
          echo "::error title=Prediction bot::push failed three times"
          exit 1
