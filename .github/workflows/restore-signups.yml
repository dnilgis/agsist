name: Add the signups kept during the worker block (one-time)
# Add the signups kept during the worker block (one-time).

on:
  workflow_dispatch:
    inputs:
      file:
        description: "File under private/ on feedbag private-data"
        default: "pending-signups.jsonl"

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - name: Add
        env:
          LIST_URL: ${{ secrets.LIST_URL }}
          UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PENDING_FILE: ${{ inputs.file }}
        run: python3 scripts/restore_signups.py
