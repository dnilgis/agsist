name: storage

# Grain storage capacity vs production (the storage section of /basis).
# Capacity and final production land each January. The fall measure
# (Sept 1 stocks + this year's corn, soybean and sorghum forecast, over
# capacity) moves with each Crop Production report: Sept 1 stocks are out
# Sept 30, state forecasts around the 10th-12th of Oct and Nov.
on:
  schedule:
    - cron: "35 7 20 1 *"      # Jan 20 yearly, after Grain Stocks + Annual Production
    - cron: "35 7 1,14 10 *"   # Oct 1 (Sept 1 stocks) and Oct 14 (October forecast)
    - cron: "35 7 14 11 *"     # Nov 14 (November forecast)
  workflow_dispatch:
    inputs:
      probe:
        description: "Probe only: print what NASS returns for the history series (Sept 1 / Dec 1 stocks, US rows); writes nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: storage
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Selftest (gate)
        run: python scripts/fetch_storage.py --selftest
      - name: Probe (prints the history series, writes nothing)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe }}
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: python scripts/fetch_storage.py --probe
      - name: Fetch
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) }}
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: python scripts/fetch_storage.py
      # data/storage/history.json is written only when our 2000-2025 averages
      # land near farmdoc daily's published ones; otherwise the old file stays.
      - name: Commit if changed (race-tolerant)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/st && mkdir -p /tmp/st && cp -r data/storage /tmp/st/
          BR="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3 4 5; do
            git fetch origin "$BR"
            git reset --hard "origin/$BR"
            mkdir -p data/storage && cp -r /tmp/st/storage/. data/storage/
            git add -A data/storage
            if git diff --staged --quiet; then echo "No change."; exit 0; fi
            git commit -m "data: grain storage capacity vs production"
            if git push origin "HEAD:$BR"; then echo "Pushed on attempt $i."; exit 0; fi
            echo "Push race on attempt $i; re-syncing"
            sleep $((RANDOM % 4 + 2))
          done
          echo "Failed to push after 5 attempts."; exit 1
