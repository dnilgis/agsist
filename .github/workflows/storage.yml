name: storage

# Grain storage capacity vs production (the storage section of /basis).
# Capacity and final production land each January. The fall measure
# (Sept 1 stocks + this year's corn, soybean and sorghum forecast, over
# capacity) moves with each Crop Production report: Sept 1 stocks are out
# Sept 30, state forecasts around the 10th-12th of Oct and Nov.
on:
  schedule:
    - cron: "35 7 20 1 *"      # Jan 20 yearly, after Grain Stocks + Annual Production
    - cron: "35 7 1,14 10 *"   # Oct 1 (Sept 1 stocks) and Oct 14 (October forecast)
    - cron: "35 7 14 11 *"     # Nov 14 (November forecast)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: storage
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Selftest (gate)
        run: python scripts/fetch_storage.py --selftest
      - name: Fetch
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: python scripts/fetch_storage.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/storage 2>/dev/null || true
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: grain storage capacity vs production"
          git pull --rebase --autostash origin main || true
          git push
