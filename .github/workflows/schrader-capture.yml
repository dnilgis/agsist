name: schrader-capture

on:
  schedule:
    - cron: "43 19 * * 1"
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]
  workflow_dispatch:
    inputs:
      backfill:
        description: "Also walk the state archive and save older auction pages (one-time, resumes)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow schrader-capture.yml --max-lag 360
          --cron "43 19 * * 1"

  capture:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.backfill && 150 || 10 }}
    permissions:
      contents: read
    concurrency:
      group: schrader-capture
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - name: Selftest
        run: python3 scripts/capture_schrader.py --selftest && python3 scripts/read_schrader.py --selftest
      - name: Capture the sold feed and result pages
        run: python3 scripts/capture_schrader.py
      - name: Save to the raw branch
        if: ${{ !cancelled() }}
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: bash scripts/push_raw.sh "schrader capture" land/schrader/capture
      - name: Read the auction results into a facts-only file
        run: python3 scripts/read_schrader.py --latest --out results/schrader-new.json
      - uses: actions/upload-artifact@v4
        with:
          name: schrader-results
          path: results/schrader-new.json
          retention-days: 1
          if-no-files-found: error
      - name: Backfill older auction pages from the archive
        if: ${{ inputs.backfill == true }}
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          rc=0
          out=$(bash scripts/pull_raw.sh land/schrader/backfill/state.json 2>&1) || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            if printf '%s' "$out" | grep -q "is not on the raw branch"; then
              echo "first backfill run: starting fresh"
            else
              echo "::error::could not read the raw branch; not starting"; exit 1
            fi
          fi
          rc=0
          python3 scripts/capture_schrader.py --backfill || rc=$?
          bash scripts/push_raw.sh "schrader backfill" land/schrader/backfill || rc=1
          exit "$rc"
      - name: Read the saved backfill pages into a facts-only file
        continue-on-error: true
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          bash scripts/pull_raw.sh land/schrader/backfill/auctions
          python3 scripts/read_schrader.py --capture land/schrader/backfill --out results/schrader-backfill.json
      - uses: actions/upload-artifact@v4
        with:
          name: schrader-backfill-results
          path: results/schrader-backfill.json
          retention-days: 1
          if-no-files-found: ignore

  commit:
    needs: [gate, capture]
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: schrader-commit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/download-artifact@v4
        with:
          name: schrader-results
          path: results
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: schrader-backfill-results
          path: results
      - name: Check and merge the auction results
        run: |
          if [ -f results/schrader-backfill.json ]; then python3 scripts/read_schrader.py --merge results/schrader-backfill.json; fi
          python3 scripts/read_schrader.py --merge results/schrader-new.json
      - name: Commit the auction results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/land/auctions/schrader.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: Schrader auction results $(date -u +%F) [skip ci]"
          pushed=0
          for n in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then pushed=1; break; fi
            echo "Push race on attempt $n; rebasing..."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || { echo "Rebase failed."; exit 1; }
            sleep $((RANDOM % 4 + 2))
          done
          [ "$pushed" = 1 ] || { echo "Failed to push after 5 attempts."; exit 1; }

  firms-seen:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      archive_for: ${{ steps.s.outputs.archive_for }}
    steps:
      - id: s
        name: Firms whose archive pages are not saved yet
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          need=""
          for f in wieman horning martins; do
            if out=$(GH_TOKEN="$PRIVATE_REPO_TOKEN" gh api -X GET "repos/dnilgis/feedbag/contents/land/$f/archive-complete.json?ref=raw" --silent 2>&1); then continue; fi
            case "$out" in
              *"HTTP 404"*) need="$need${need:+,}$f" ;;
              *) echo "::warning::archive state for $f not readable; current page only this run" ;;
            esac
          done
          echo "archive_for=$need" >> "$GITHUB_OUTPUT"

  firms:
    needs: [gate, firms-seen]
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    concurrency:
      group: land-firms-capture
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - name: Selftest
        run: python3 scripts/capture_land_firms.py --selftest > /dev/null
      - name: Capture the firms' results pages
        env:
          ARCHIVE_FOR: ${{ needs.firms-seen.outputs.archive_for }}
        run: python3 scripts/capture_land_firms.py --archive-for "$ARCHIVE_FOR"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: land-firms-capture
          path: land/
          retention-days: 1
          if-no-files-found: error

  firms-save:
    needs: [gate, firms]
    if: needs.gate.outputs.go == '1' && (!cancelled())
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: land-firms-save
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/download-artifact@v4
        with:
          name: land-firms-capture
          path: land
      - name: Save to the raw branch
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: bash scripts/push_raw.sh "land firms capture" land/wieman land/younger land/horning land/martins

  firms-read:
    needs: [gate, firms-save]
    if: needs.gate.outputs.go == '1' && (!cancelled())
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - name: Selftest
        run: python3 scripts/read_land_firms.py --selftest > /dev/null
      - name: Pull the saved pages from the raw branch
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: bash scripts/pull_raw.sh land/wieman land/younger land/horning land/martins
      - name: Read the results into facts-only files
        run: python3 scripts/read_land_firms.py --all --out-dir results/firms
      - uses: actions/upload-artifact@v4
        with:
          name: land-firms-results
          path: results/firms
          retention-days: 1
          if-no-files-found: error

  firms-commit:
    needs: [gate, firms-read]
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: land-firms-commit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/download-artifact@v4
        with:
          name: land-firms-results
          path: results/firms
      - name: Check and merge the firms' auction results
        run: python3 scripts/read_land_firms.py --merge-dir results/firms
      - name: Commit the firms' auction results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/land/auctions/
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: land auction firms results $(date -u +%F) [skip ci]"
          pushed=0
          for n in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then pushed=1; break; fi
            echo "Push race on attempt $n; rebasing..."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || { echo "Rebase failed."; exit 1; }
            sleep $((RANDOM % 4 + 2))
          done
          [ "$pushed" = 1 ] || { echo "Failed to push after 5 attempts."; exit 1; }
