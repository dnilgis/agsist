name: schrader-capture
# schrader-capture.

on:
  schedule:
    - cron: "43 19 * * 1"
  # cron above, by either trigger, do the work within 360 minutes
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow schrader-capture.yml --max-lag 360
          --cron "43 19 * * 1"

  capture:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: schrader-capture
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - name: Selftest
        run: python3 scripts/capture_schrader.py --selftest && python3 scripts/read_schrader.py --selftest
      - name: Capture the sold feed and result pages
        run: python3 scripts/capture_schrader.py
      - name: Save to the raw branch
        if: ${{ !cancelled() }}
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: bash scripts/push_raw.sh "schrader capture" land/schrader/capture
      - name: Read the auction results
        run: python3 scripts/read_schrader.py --latest
      - name: Commit the auction results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/land/auctions/schrader.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: Schrader auction results $(date -u +%F) [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
