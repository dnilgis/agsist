name: Fetch Outlooks (NOAA + USDM)

on:
  schedule:
    - cron: '43 */2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-outlooks
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run fetcher
        run: python3 scripts/fetch_outlooks.py

      - name: Commit if anything changed
        run: |
          git config user.name  "agsist-bot"
          git config user.email "sig@agsist.com"
          git add data/outlooks/
          if git diff --cached --quiet; then
            echo "no changes — skipping commit"
            exit 0
          fi
          git commit -m "outlooks: refresh NOAA + USDM ($(date -u +%FT%TZ))"
          pushed=0
          for n in 1 2 3 4 5; do
            if git push; then pushed=1; break; fi
            echo "Push race on attempt $n; rebasing..."
            git pull --rebase --autostash origin main || { echo "Rebase failed."; exit 1; }
            sleep $((RANDOM % 4 + 2))
          done
          [ "$pushed" = 1 ] || { echo "Failed to push after 5 attempts."; exit 1; }
