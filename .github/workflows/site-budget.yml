name: Site size budget

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-budget
  cancel-in-progress: true

jobs:
  budget:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - name: Prove the check
        run: python3 scripts/check_site_budget.py --selftest

      - name: Measure what Pages publishes
        run: |
          set +e
          python3 scripts/check_site_budget.py > /tmp/budget.txt
          rc=$?
          set -e
          cat /tmp/budget.txt
          {
            echo "## Site size budget"
            echo
            echo '```'
            cat /tmp/budget.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep '^WARNING:' /tmp/budget.txt | while IFS= read -r line; do echo "::warning title=Site size budget::${line#WARNING: }"; done
          if [ "$rc" -ne 0 ]; then
            grep '^OVER:' /tmp/budget.txt | while IFS= read -r line; do echo "::error title=Site size budget::${line#OVER: }"; done
            exit 1
          fi
