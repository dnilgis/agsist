name: Report day — USDA vs the trade email

on:
  workflow_run:
    workflows:
      - "WASDE watch — grade the report as it lands"
      - "Build What's Priced In"
      - "Tick 03"
    types: [completed]
  schedule:
    - cron: "47 16 * * 1-5"
    - cron: "13 18 * * 1-5"
  workflow_dispatch:
    inputs:
      send_email:
        description: "Email the list? A manual run is a dry run unless this is ticked."
        type: boolean
        default: false

env:
  TZ: America/Chicago

permissions:
  contents: read

jobs:
  upstream:
    if: github.event.workflow_run.conclusion != 'skipped' && (github.event.workflow_run.name != 'Tick 03' || contains(github.event.workflow_run.display_title, ' report-day.yml '))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.u.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/upstream-did-work/
          sparse-checkout-cone-mode: false
      - id: u
        uses: ./.github/actions/upstream-did-work

  gate:
    needs: upstream
    if: needs.upstream.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        run: |
          D=$(date -u +%-d); H=$(date -u +%-H); W=$(date -u +%u); GO=0
          if [ "${{ github.event_name }}" != "workflow_run" ]; then GO=1
          elif [ "${{ github.event.workflow_run.name }}" != "Fetch Grain Bids" ] && [ "${{ github.event.workflow_run.name }}" != "Tick 03" ] || { [ "$W" -le 5 ] && [ "$H" -ge 16 ] && [ "$H" -le 19 ]; }; then GO=1; fi
          echo "UTC day $D hour $H weekday $W -> go=$GO"; echo "go=$GO" >> "$GITHUB_OUTPUT"

  send:
    needs: gate
    if: ${{ needs.gate.outputs.go == '1' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    concurrency:
      group: report-day-email
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0
          filter: blob:none
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the sender and its loop
        run: |
          python scripts/send_report_day.py --selftest
          python scripts/gmail_limit.py --selftest
          python3 scripts/test_send_loops.py

      - name: Send the report-day email
        env:
          SMTP_HOST:    ${{ secrets.SMTP_HOST }}
          SMTP_PORT:    ${{ secrets.SMTP_PORT }}
          SMTP_USER:    ${{ secrets.SMTP_USER || secrets.GMAIL_USER }}
          SMTP_PASS:    ${{ secrets.SMTP_PASS || secrets.GMAIL_APP_PASS }}
          FROM_ADDR:    ${{ secrets.FROM_ADDR }}
          REPLY_TO:     ${{ secrets.REPLY_TO }}
          LIST_URL:     ${{ secrets.LIST_URL }}
          LIST_TOKEN:   ${{ secrets.LIST_TOKEN }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
          SEND_DAILY_CAP: ${{ vars.SEND_DAILY_CAP }}
          DRY_RUN:      ${{ (github.event_name == 'workflow_dispatch' && inputs.send_email != true) && '1' || '' }}
        run: python scripts/send_report_day.py
