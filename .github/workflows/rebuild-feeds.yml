name: Rebuild Feed Manifest
# Rebuild Feed Manifest.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-feeds
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate the manifest
        run: python3 scripts/build_feeds.py

      - name: And prove it against its own guard before committing
        run: python3 scripts/test_feeds.py

      - name: Commit and push
        run: |
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          git add data/feeds.json || true
          git diff --staged --quiet || git commit -m "Rebuild feed manifest [skip ci]"
          git pull --rebase origin main
          git push
