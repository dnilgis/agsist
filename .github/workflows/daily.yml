name: Generate Daily Briefing

# One briefing at a time, ever: a scheduled run overlapping a manual dispatch
# could double-generate and DOUBLE-EMAIL the list. Queue, never cancel — a
# canceled half-published run is worse than a late one.
concurrency:
  group: daily-briefing
  cancel-in-progress: false

# THE BRIEFING IS A CENTRAL-TIME PRODUCT, SO IT RUNS ON CENTRAL TIME.
# generate_daily.py asks datetime.now() what day it is and what the season is.
# On a UTC runner, a job that starts at 02:38 UTC believes it is tomorrow — and
# on 2026-08-28 one did, dating Saturday's briefing while it was still Friday
# evening in Wisconsin. One environment variable makes every naive clock in
# every script agree with the reader. `generated_at` is written timezone-aware
# in UTC and is unaffected.
env:
  TZ: America/Chicago

on:
  schedule:
    # ── REPLACED AGAIN 2026-08-31. THE NET WAS THE WRONG SHAPE. ────────────
    #
    # WHAT I BUILT ON 2026-08-29 AND WHY IT FAILED.
    #
    # Twelve fires every fifteen minutes across a two-and-a-half hour window,
    # on the theory that twelve chances beat one. Measured over the two
    # mornings that followed, in true UTC:
    #
    #     Sun 08-30   ONE run, committed 14:56Z — 86 minutes after 13:30,
    #                 the LAST fire of the net. The eleven earlier fires
    #                 produced nothing at all.
    #     Mon 08-31   NOTHING by 13:02Z (08:02 Central), by which time ten of
    #                 the twelve fires were already due.
    #
    # Meanwhile prices.yml delivered every one of its writes that same
    # morning. The difference is not luck, and this repository had already
    # written it down — at the top of .github/workflows/prices.yml:
    #
    #     "GitHub's scheduled-cron is best-effort and silently DROPS
    #      high-frequency (every-30-min) runs ... Low-frequency, off-:00
    #      minutes (GitHub honors these far more reliably than */30)."
    #
    # And in the standing decisions, measured on the sibling repo 2026-08-26:
    # a ten-minute cron delivered one to three runs an hour against six asked,
    # while an hourly cron outside the window delivered every one. The fix
    # there was ONE fire whose job loops internally. **Do not "fix" the
    # schedule by asking more often.**
    #
    # The net asked more often. Ten of its twelve fires sat on :00, :15, :30
    # and :45 — the busiest minutes of the hour, which GitHub's own docs name
    # as the ones to avoid. It was the exact pattern this repo had already
    # measured and rejected, rebuilt by hand.
    #
    # WHAT REPLACES IT: three launches, and a job that waits.
    #
    # Each fire is off-:00, off-:15/:30/:45, and at least 80 minutes from its
    # neighbour — the shape prices.yml uses and GitHub honours. Each one, on
    # its own, covers the whole morning: the gate below no longer decides once
    # and exit, it LOOPS until the publish window opens. So one delivered fire
    # out of three is a briefing on time, and all three being delivered costs
    # two cheap skips.
    #
    #   19 10  = 05:19 CDT / 04:19 CST — ahead of the 05:45 floor either season
    #   41 11  = 06:41 CDT / 05:41 CST — recovery if the first was dropped
    #   23 13  = 08:23 CDT / 07:23 CST — last resort, still a morning briefing
    - cron: '19 10 * * *'
    - cron: '41 11 * * *'
    - cron: '23 13 * * *'
    # v4.6: Friday post-close regeneration. 20:00 UTC Fri = 3:00 PM Central
    # (CDT) / 2:00 PM Central (CST). CBOT grain settles 1:20 PM CT, CME
    # livestock 1:00 PM CT, NYMEX crude 1:30 PM CT, so this is safely past
    # every settlement and locked_prices reflects actual Friday closes. It
    # replaces the morning file on purpose and does NOT wait — see the gate.
    - cron: '0 20 * * 5'
  # ── `on: push` WAS HERE AND IT COULD NEVER HAVE FIRED. REMOVED 2026-09-01.
  #
  # Added on 2026-08-31 as "the heartbeat that is not a cron", on the reasoning
  # that pushes are not scheduled and so are not dropped. That much is true.
  # What is also true, from GitHub's own documentation:
  #
  #   "When you use the repository's GITHUB_TOKEN to perform tasks, events
  #    triggered by the GITHUB_TOKEN ... will not create a new workflow run.
  #    ... this behavior prevents you from accidentally creating recursive
  #    workflow runs."
  #
  # `prices.yml` checks out with `token: ${{ secrets.GITHUB_TOKEN }}` and
  # pushes with those credentials. Every one of its commits — eight for eight
  # on the morning of 08-31, and again every thirty minutes on 09-01 — was
  # therefore invisible to this trigger. The briefing did not miss its morning
  # because the heartbeat was unreliable. The heartbeat did not exist.
  #
  # It is REMOVED rather than left in place, because a dead trigger sitting in
  # a file is how this survived a whole morning looking healthy.
  #
  # What replaces it is at the bottom of prices.yml's fetch loop: a
  # `workflow_dispatch` with `heartbeat=true`, sent after every successful
  # push. From the same documentation page:
  #
  #   "workflow_dispatch and repository_dispatch events always create workflow
  #    runs."
  #
  # Always. Including from GITHUB_TOKEN. That is the only door in this
  # repository that a bot can actually knock on.

  workflow_dispatch:
    inputs:
      send_email:
        description: "Email the live subscriber list? Manual runs default to NO — a dry run that generates, gates, and publishes but sends nothing. Scheduled runs always send."
        type: boolean
        default: false
      heartbeat:
        description: "Sent by the price loop, not by a person. A heartbeat NEVER waits and NEVER overrides the morning floor — it behaves exactly as the old push trigger was meant to. Leave this false when you are the one clicking Run workflow."
        type: boolean
        default: false

jobs:
  # If a manual run already generated today's briefing, the scheduled morning
  # run skips regeneration entirely. The Friday 20:00 UTC post-close regen is
  # exempt (hour >= 14) — it exists to overwrite the morning file on purpose.
  # Manual dispatches always run.
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.g.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: g
        run: |
          # THE GATE WAITS NOW. IT USED TO DECIDE ONCE AND EXIT.
          #
          # That is the whole change. A fire that arrived at 05:19 Central used
          # to look at the clock, see it was before the 05:45 floor, print
          # "a later fire takes this one" and stop — which was true only while
          # there WERE later fires. There are three a day now, hours apart, so
          # the run that arrives early has to hold the window open itself.
          #
          # It loops for up to two and a half hours, asking the same three
          # questions every twelve minutes, and exits the moment one of them
          # answers. Twelve minutes because the whole point is to stop asking
          # GitHub for things every fifteen.
          set -uo pipefail

          EVENT="${{ github.event_name }}"
          BRANCH="${{ github.event.repository.default_branch || 'main' }}"

          # A DISPATCH FROM THE PRICE LOOP IS NOT A PERSON AT A KEYBOARD.
          # It arrives every thirty minutes all morning, so it must obey the
          # floor and the published check exactly as the push trigger was meant
          # to. Only a human clicking Run workflow gets to override them.
          HEARTBEAT="${{ github.event.inputs.heartbeat || 'false' }}"
          [ "$EVENT" = "workflow_dispatch" ] && [ "$HEARTBEAT" = "true" ] && EVENT="heartbeat"

          # THE WAIT IS CAPPED AT FORTY MINUTES, DOWN FROM 150. Not a tuning
          # tweak — the old budget could hold `concurrency: daily-briefing` for
          # two and a half hours, and GitHub keeps at most ONE pending run per
          # group and CANCELS the rest. A gate that sleeps through the morning
          # would have cancelled the very recovery launches it was there to
          # back up. Forty minutes covers the 05:19 launch's wait to the 05:45
          # floor with room to spare, and with a heartbeat every thirty minutes
          # nothing needs to wait longer than that anyway.
          DEADLINE=$(( $(date +%s) + 40 * 60 ))
          FLOOR=0545

          say() { echo "$(date +%H:%M) Central — $*"; }

          # ASK THE REMOTE, NOT THE CHECKOUT.
          # A scheduled run checks out the SHA it was TRIGGERED at, so a run
          # still in flight when this one starts would look at a tree from
          # before that run pushed, decide today's briefing did not exist, and
          # generate it a second time. (send_daily.py's day-flag would still
          # stop the second EMAIL — but a regenerated briefing overwrites the
          # published one, which is its own kind of wrong.) The remote is the
          # only place that knows whether today is done, and it is re-asked on
          # every pass of the loop, not once at the start.
          published() {
            git fetch --quiet --depth=1 origin "$BRANCH" 2>/dev/null || true
            git cat-file -e "FETCH_HEAD:data/daily-archive/$1.json" 2>/dev/null && return 0
            [ -f "data/daily-archive/$1.json" ] && return 0
            return 1
          }

          decide() { echo "skip=$1" >> "$GITHUB_OUTPUT"; }

          # EVERY CLOCK HERE IS CENTRAL. TZ is set on the workflow.
          while :; do
            DAY=$(date +%F)          # the reader's day, not the runner's
            HHMM=$(date +%H%M)
            H=$(date +%H)
            DOW=$(date +%u)          # 1=Mon ... 5=Fri

            # A MANUAL RUN NEVER WAITS AND NEVER SKIPS. It is somebody standing
            # at the keyboard wanting a briefing now.
            if [ "$EVENT" != "schedule" ] && [ "$EVENT" != "heartbeat" ]; then
              say "GENERATING: manual $EVENT, $DAY"
              decide 0; exit 0
            fi

            # THE FRIDAY POST-CLOSE REGENERATION NEVER WAITS EITHER. It exists
            # to overwrite the morning file with settled prices, so "already
            # published" is its precondition, not its reason to stop.
            if [ "$H" -ge 14 ] && [ "$DOW" = "5" ] && [ "$H" -lt 18 ]; then
              say "GENERATING: Friday post-close regeneration, $DAY"
              decide 0; exit 0
            fi

            # A DELAYED MORNING FIRE IS NOT A REGENERATION. Before this guard,
            # ANY scheduled fire arriving after 14:00 was allowed to regenerate
            # and re-email; that is how a fire delivered ten hours late
            # republished Thursday's briefing at 3:55 PM.
            if [ "$H" -ge 14 ]; then
              say "SKIPPING: $DAY, arrived at $(date +%H:%M) Central on day $DOW — a delayed fire, not a regeneration"
              decide 1; exit 0
            fi

            if published "$DAY"; then
              say "SKIPPING: $DAY is already published — a backup launch doing its job"
              decide 1; exit 0
            fi

            # TOO EARLY, NOT TOO LATE. Publishing before 05:45 Central locks
            # prices against a feed the pre-dawn prices launch has not yet
            # refreshed, and puts the briefing in front of a reader who is
            # asleep. So we WAIT for the floor rather than hand the morning to
            # a later fire that may never be delivered.
            if [ "$HHMM" -lt "$FLOOR" ]; then
              # A HEARTBEAT NEVER WAITS. Holding a runner for an hour on every
              # price commit would cost more than the whole briefing; there is
              # another one along in thirty minutes and one of them will be
              # past the floor.
              if [ "$EVENT" = "heartbeat" ]; then
                say "SKIPPING: heartbeat before the ${FLOOR} floor — the next one takes it"
                decide 1; exit 0
              fi
              now=$(date +%s)
              if [ "$now" -ge "$DEADLINE" ]; then
                say "SKIPPING: still before the $FLOOR floor and out of budget — a later launch takes this one"
                decide 1; exit 0
              fi
              say "waiting: $(date +%H:%M) is before the ${FLOOR} floor; $(( (DEADLINE - now) / 60 ))m of budget left"
              sleep 720
              continue
            fi

            say "GENERATING: $DAY, event=$EVENT"
            decide 0; exit 0
          done

  generate:
    needs: gate
    if: needs.gate.outputs.skip != '1'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install feedparser requests pillow

      # The gate's own selftest runs first. It regression-locks the two holes that
      # let the 2026-08-08 briefing publish a 16.9% lean hog rally (2.9x the
      # exchange daily limit) and a 5.4% corn break that was September's close
      # measured against December's: a gate that silently stops catching things
      # is worse than no gate, because the RESULT line still says CLEAN.
      - name: GATE 0 — feed gate selftest
        run: python scripts/test_preflight_limits.py

      # The schedule is machinery too. This asserts the backup fires still
      # exist and are spread, and that the gate asks the remote rather than its
      # own checkout — the two things that keep a dropped fire from becoming a
      # missed briefing without letting a backup republish a live one.
      # ── GATE 0b IS GONE FROM HERE. MOVED 2026-09-01. ────────────────────
      #
      # `scripts/test_daily_schedule.py` checks the SHAPE OF THE SCHEDULE —
      # cron spacing, the gate's branching, whether the email condition travels
      # with the trigger. None of that can change between one morning and the
      # next unless somebody edits a workflow file. It is a design check.
      #
      # It ran here, `bash -e`, in front of the generation. So on 2026-09-01
      # it failed and took the briefing down with it — three manual runs, all
      # red at 26-30 seconds, no briefing published, no email sent. It had
      # passed the previous morning and passed for the wrong reason; see the
      # note in the test itself.
      #
      # A GUARD ABOUT THE SCHEDULE MUST NOT BE ABLE TO STOP THE BRIEFING.
      # This is not softening it (rule 2): it still runs, it still fails loudly,
      # and it now runs at the only moment its answer can change — when a
      # workflow file is edited — plus once a week. It lives in
      # `.github/workflows/schedule-guard.yml`.
      #
      # GATE 0 above stays exactly where it is. That one is about TODAY'S
      # NUMBERS, and a bad number must stop the briefing.

      - name: GATE 1 — feed pre-flight (repair ZC=F roll contamination; block on unrepairable feed)
        run: python scripts/preflight_prices.py data/prices.json --repair

      - name: Generate daily briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_daily.py

      # Grade yesterday's call deterministically (direction AND level) from the
      # actual closes, overriding any LLM-assigned outcome — so the public scorecard
      # can never show a miss as a win. Before the critic + GATE 2 so they see truth.
      - name: Grade yesterday's call
        run: python scripts/grade_calls.py data/daily.json

      # v4.0: Critic pass — runs after generate, before schema validation.
      # Sends the briefing back to Claude as the editor, scores 1-10 on each
      # of 17 rules (8 IMPACT + voice, forward test, thread coherence + spread
      # quality + YC honesty + level coherence + one-number coherence +
      # markdown-not-HTML + macro anchoring). If 2+ rules score below 7 OR
      # voice<5 OR forward test<5 OR level coherence<7 OR markdown<7, rewrites
      # the weakest target and re-saves daily.json + archive HTML.
      #
      # continue-on-error: true means a critic API failure (network, bad response,
      # rate limit) does NOT block the briefing from shipping. The original
      # generator output is what gets validated and committed.
      #
      # v4.2 (Phase 2 C5): the critic itself now retries up to 3 times with
      # exponential backoff before giving up. continue-on-error remains as
      # belt-and-suspenders for catastrophic failures.
      #
      # v4.6 (2026-05-18): critic Rule 9 voice-failure list extended with
      # CNBC drama verbs (explode, crater, surge, soar, plunge, slash, etc.)
      # to match generator v4.6.0's editorial-hardening upgrade.
      #
      # First few days: consider adding `--dry-run` to the run command to see
      # what the critic flags before letting it rewrite anything. Remove the
      # flag once you trust the scoring calibration.
      - name: Run critic pass
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        continue-on-error: true
        run: python scripts/critique_briefing.py

      # v4.2 (Phase 2 C7): post-critic ops alert. Reads daily.json's
      # critic_pass.final_scores; emails sig@farmers1st.com if any rule
      # scored below 7, if rewrites were applied, or if the critic step
      # failed silently. Quiet success = no email. Catches the silent-drift
      # failure mode that continue-on-error: true otherwise hides.
      #
      # Requires GMAIL_USER + GMAIL_APP_PASS repo secrets. If unset, the
      # script logs the alert content to the workflow log instead of failing.
      #
      # always() runs this even if previous steps failed — that's the point.
      # if: always() so the alert reports generator failures too.
      # ── GATE 2 ── deterministic pre-publish gate. Prose vs locked_prices vs the
      # clean feed: blocks locked-price drift, level contradictions, drama without a
      # real move, calendar errors, fabricated sections. HARD block (no continue-on-error)
      # so a failure stops the job before commit — nothing stale or wrong gets published.
      - name: GATE 2 — pre-publish briefing gate
        run: python scripts/briefing_gate.py data/daily.json --prices data/prices.json

      - name: Notify critic status
        if: always()
        env:
          GMAIL_USER:     ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
        run: python scripts/notify_critic_status.py
        continue-on-error: true

      - name: Validate schema
        # Fails the workflow if daily.json drifts from canonical field
        # names or contains filler content like "Unknown" attributions.
        # On failure, yesterday's briefing stays live until the next
        # successful run. GitHub emails the workflow owner on failure.
        #
        # NOTE (v4.2): daily.json supports new optional fields:
        #   the_takeaway, subject_line, named_week (top-level)
        #   vs_yesterday (per-section)
        # Schema knows about these — generator will start emitting them
        # as the prompt is updated.
        run: python scripts/daily_schema.py data/daily.json

      - name: Generate RSS feed
        continue-on-error: true        # RSS is an enhancement; a feed error must never block the publish
        run: python scripts/generate_rss.py

      # Strategic ladder (2026-06-12): public call scorecard, rebuilt from the
      # archive JSONs after every briefing. Honest by construction — outcomes
      # come straight from each day's yesterdays_call block, misses included.
      # continue-on-error: the scorecard is an enhancement. A failure here
      # must NEVER block the briefing from publishing.
      - name: Build call scorecard
        continue-on-error: true
        run: python scripts/build_scorecard.py

      # Bake the fresh scorecard + WPI numbers into their pages' static HTML
      # (same crawler rationale as bake_homepage). Marker-based, idempotent.
      # continue-on-error: a bake failure must never block the briefing.
      - name: Prerender WPI + scorecard pages
        continue-on-error: true
        run: python scripts/prerender_wpi_scorecard.py

      # Static-bake today's briefing + The Read into index.html so AI crawlers
      # (GPTBot, ClaudeBot, PerplexityBot — none execute JS) and Googlebot's
      # first pass see the actual content. Client JS hydrates live data on top.
      # continue-on-error: if index.html's markup ever drifts from the bake
      # anchors, bake_homepage.py exits 3 — that must show as a red step, not
      # stop the briefing publish. The homepage still works via JS hydration.
      - name: Bake briefing into homepage
        continue-on-error: true
        run: python scripts/bake_homepage.py

      # Audit fix 2026-06-12: each new /daily/YYYY-MM-DD archive page gets a
      # sitemap entry the moment it publishes (Google discovery for the
      # briefing archive). Guarded: weekend/holiday runs that don't write an
      # archive HTML page add nothing. Idempotent: the Friday post-close
      # regeneration re-run is a no-op for an already-listed URL.
      # Shareable daily card (data/social/card-<date>.png + card-latest.png).
      # Runs only after GATE 2 passed, so a card is never rendered from a blocked
      # briefing. Best-effort by design: a promo image must never be the reason
      # the briefing fails to publish (the script also self-traps to exit 0).
      - name: Build social card
        continue-on-error: true
        run: python scripts/build_social_card.py

      - name: Add today's archive page to sitemap
        continue-on-error: true        # sitemap update must never block the briefing publish
        run: |
          d=$(date -u +%Y-%m-%d)
          if [ -f "daily/${d}.html" ]; then
            python scripts/update_sitemap.py --add "https://agsist.com/daily/${d}"
          else
            echo "no daily/${d}.html — skipping sitemap add"
          fi

      - name: Commit and push
        run: |
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          # data/prices.json is here because step 'preflight' runs
          # preflight_prices.py --repair on it. Without it staged, the repair
          # was computed and thrown away every run, and the browser-facing
          # file kept shipping the contaminated continuous quotes.
          git add data/daily.json data/daily-archive/ daily/ feed.xml sitemap.xml data/scorecard.json index.html data/social/ whats-priced-in.html scorecard.html cot.html ag-odds.html data/prices.json
          git diff --staged --quiet || git commit -m "AGSIST Daily — $(date -u +%Y-%m-%d)"
          # AUDIT 2026-08-11: three attempts — this is the repo's highest-
          # stakes push (a rejection here silently skips the daily email for
          # a fully generated, gated briefing while 11:20/11:25 workflows
          # race the same files).
          # 2026-08-15 audit: without the abort, a rebase CONFLICT leaves
          # .git/rebase-merge in place and attempts 2 and 3 die instantly on
          # "Pulling is not possible because you have unmerged files" — so the
          # retries were dead weight for the one failure they exist for. The
          # step then fails, the send step is skipped by its implicit
          # success(), and a fully generated, GATE-2-passed briefing is
          # neither published nor emailed with nothing saying why. Every other
          # pusher in this repo (cot, mesh, ncei, harvest-prices) aborts first.
          for i in 1 2 3; do
            git rebase --abort 2>/dev/null || true   # clear any half-finished rebase
            if git pull --rebase --autostash origin main && git push; then
              echo "push ok on attempt $i"; break
            fi
            echo "push attempt $i failed; retrying in 20s"; sleep 20
            [ "$i" = "3" ] && { git rebase --abort 2>/dev/null || true; exit 1; }
          done

      # Email the finished briefing as a clean, reforwardable copy. Runs only after
      # GATE 2 passed (hard block above stops the job on failure) and the commit
      # succeeded — so a blocked or stale briefing is never emailed. send_daily.py
      # re-checks generated_at==today and price_validation_clean as belt-and-suspenders.
      # Default recipient is the subscriber list (RECIPIENTS secret, or live from the subs worker via LIST_URL).
      #
      # THE EMAIL TRAP, defused (2026-08-11): this step used to have no `if:`,
      # so ANY successful run — including a manual workflow_dispatch fired to
      # test something — emailed the real subscriber list. Now a manual run is
      # a dry run unless the dispatcher explicitly ticks send_email. Scheduled
      # runs are unaffected (event_name == 'schedule' short-circuits true).
      #
      # `github.event_name == 'push'` was removed from these two conditions on
      # 2026-09-01 along with the push trigger itself. The heartbeat from the
      # price loop arrives as a workflow_dispatch carrying `send_email=true`,
      # so it still emails; a person clicking Run workflow still gets a dry run
      # unless they tick the box. THE TWO HALVES MUST TRAVEL TOGETHER — a
      # trigger that publishes but is missing from the email condition gives an
      # up-to-date page and an empty inbox, which is the complaint that started
      # all of this.
      #
      # `push` WAS ADDED HERE THE MOMENT THE PUSH TRIGGER WAS. Without it, a
      # briefing generated by the push heartbeat would publish to the site and
      # send nothing — a page that is up to date and an inbox that is empty,
      # which is precisely the complaint that started all of this. The two
      # changes belong together and neither is safe alone.
      #
      # It cannot double-send: send_daily.py sets a day flag through the subs
      # worker and fails closed, and the gate above refuses any run on a day
      # that is already published.
      - name: Send daily email
        if: ${{ github.event_name == 'schedule' || inputs.send_email == true }}
        env:
          # new sender env names; falls back to the legacy GMAIL_* secrets so
          # either set works. RECIPIENTS is ignored when LIST_URL is set
          # (list pulled live from the subs worker).
          SMTP_USER:    ${{ secrets.SMTP_USER || secrets.GMAIL_USER }}
          SMTP_PASS:    ${{ secrets.SMTP_PASS || secrets.GMAIL_APP_PASS }}
          RECIPIENTS:   ${{ secrets.RECIPIENTS }}
          LIST_URL:     ${{ secrets.LIST_URL }}
          LIST_TOKEN:   ${{ secrets.LIST_TOKEN }}
          UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
          FROM_NAME:    ${{ secrets.FROM_NAME }}
          REPLY_TO:     ${{ secrets.REPLY_TO }}
        run: python scripts/send_daily.py

      # ── THE FORWARDING BRIEF, MOVED HERE 2026-08-29 ───────────────────────
      #
      # This is the email Sig reads and forwards by hand. It used to live in
      # morning-brief.yml on its own cron, `6 12 * * 1-5` — 7:06 AM Central in
      # summer, weekdays only. It was never 6:30 and it has never fired on a
      # Saturday, which is why nothing arrived on the morning he asked about.
      #
      # morning-brief.yml's own header recommended this move: "If you want to
      # combine the two workflows, just add the 'Send brief' step to your
      # existing daily workflow." Doing it solves three things at once —
      #
      #   * it lands whenever the briefing lands, so it inherits the whole net
      #     of backup fires instead of having one cron of its own to drop;
      #   * it cannot double-send, because the run that publishes is the only
      #     run that sends, and the gate already stops a second publish.
      #     send_morning_brief.py has NO day-flag of its own — it would happily
      #     send twelve times on a twelve-fire net — so this is not a nicety;
      #   * DST stops mattering, for the same reason it stopped mattering for
      #     the briefing: the schedule is a net and the gate is Central.
      #
      # THE WEEKEND SKIP IS GONE, at Sig's word on 2026-08-29. It made sense
      # while this ran on its own weekday-only cron; it made none once it
      # followed a briefing that publishes seven days a week. The send guard
      # inside the script — refuse to mail a briefing that failed validation —
      # is untouched.
      #
      # continue-on-error: a forwarding email that fails must not fail the run
      # that already published the briefing and mailed the list.
      - name: Send the forwarding brief to Sig
        if: ${{ github.event_name == 'schedule' || inputs.send_email == true }}
        continue-on-error: true
        env:
          GMAIL_USER:     ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
        run: python scripts/send_morning_brief.py
