name: Generate Daily Briefing

run-name: ${{ github.event_name == 'workflow_dispatch' && format('Generate Daily Briefing (manual, send_email={0}, heartbeat={1}, test_to_sig={2})', inputs.send_email, inputs.heartbeat, inputs.test_to_sig) || 'Generate Daily Briefing' }}

concurrency:
  group: daily-briefing
  cancel-in-progress: false

env:
  TZ: America/Chicago

on:
  schedule:
    - cron: '19 10 * * *'
    - cron: '41 11 * * *'
    - cron: '23 13 * * *'
    - cron: '0 20 * * 5'

  workflow_dispatch:
    inputs:
      send_email:
        description: "Email the live subscriber list? Manual runs default to NO: a dry run that generates, gates and publishes but sends nothing. It never marks the day done: the next scheduled run or heartbeat before 2 p.m. CT writes today's issue again and sends it. Scheduled runs always send."
        type: boolean
        default: false
      heartbeat:
        description: "Sent by the price loop, not by a person. A heartbeat NEVER waits and NEVER overrides the morning floor — it behaves exactly as the old push trigger was meant to. Leave this false when you are the one clicking Run workflow."
        type: boolean
        default: false
      test_to_sig:
        description: "Send the newest Daily to Sig only (SIG_TEST_EMAILS, else SIG_TO), read from the private copy of the list as when the worker is blocked. Generates nothing, publishes nothing, sets no day flag; the morning run still goes to everyone."
        type: boolean
        default: false
      format:
        description: "The Daily email's format. v2 = the rebuilt Daily (scripts/daily_v2.py, live since Oct 22 2026). current = the old format, the one-input rollback. A scheduled run reads the repo variable DAILY_FORMAT (unset = v2), so setting that variable to current rolls the morning send back too."
        type: choice
        options: [v2, current]
        default: v2

jobs:
  print-of-day:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_to_sig == true && inputs.send_email == true && inputs.format != 'current' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      pick: ${{ steps.live.outputs.pick }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pick the place and draw its print
        id: draw
        continue-on-error: true
        run: |
          pip install -q pillow==12.3.0
          npm install --silent --prefix "$RUNNER_TEMP/pw" playwright@1.56.1 >/dev/null
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium >/dev/null
          d=$(TZ=America/Chicago date +%F)
          python3 scripts/print_of_day.py --date "$d" --out "$RUNNER_TEMP/pick.json"
          PLAYWRIGHT_PATH="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node scripts/render_print_of_day.mjs "$RUNNER_TEMP/pick.json" "daily/img/print-$d.png"
          python3 scripts/print_of_day.py --compress "daily/img/print-$d.png"
          echo "date=$d" >> "$GITHUB_OUTPUT"
      - name: Put the picture on agsist.com and wait until it is served
        id: live
        if: ${{ steps.draw.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_FROM_ACTIONS: ${{ vars.PAGES_FROM_ACTIONS }}
        run: |
          d="${{ steps.draw.outputs.date }}"; f="daily/img/print-$d.png"
          cp "$f" "$RUNNER_TEMP/print.png"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin main && git checkout -q -B pod origin/main && mkdir -p daily/img && cp "$RUNNER_TEMP/print.png" "$f" \
              && git add "$f" && { git diff --cached --quiet || git commit -q -m "Daily print of the day $d"; } \
              && git push -q origin HEAD:main && break
            echo "push attempt $i failed; retrying"; sleep 15
            [ "$i" = "3" ] && exit 1
          done
          bash .github/pages-kick.sh
          url="https://agsist.com/$f"
          for i in $(seq 1 40); do
            if curl -fsS -o "$RUNNER_TEMP/live.png" "$url" && cmp -s "$RUNNER_TEMP/live.png" "$RUNNER_TEMP/print.png"; then
              python3 -c "import json,sys; p=json.load(open(sys.argv[1])); p['image_url']=sys.argv[2]; print('pick='+json.dumps(p,separators=(',',':')))" "$RUNNER_TEMP/pick.json" "$url" >> "$GITHUB_OUTPUT"
              echo "live: $url"; exit 0
            fi
            sleep 15
          done
          echo "::warning::the print of the day was not served by agsist.com within 10 minutes; the email leaves the slot out"

  test-to-sig:
    needs: [print-of-day]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.test_to_sig == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The list source and link checks
        run: |
          python3 scripts/list_source.py --selftest
          python3 scripts/email_links.py --selftest
      - name: The print of the day and the saved fact check (v2)
        if: ${{ inputs.format != 'current' }}
        continue-on-error: true
        env:
          PICK: ${{ needs.print-of-day.outputs.pick }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          if [ -n "$PICK" ]; then printf '%s' "$PICK" > "$RUNNER_TEMP/print-of-day.json"; else echo "no print of the day: the slot is left out"; fi
          d=$(ls data/daily-archive/????-??-??.json | sort | tail -1 | xargs basename | cut -c1-10)
          bash scripts/fetch_private.sh raw || exit 0
          f=$(git ls-tree --name-only origin/raw daily-fact-check/ | grep "/$d-" | sort -t- -k4,4n | tail -1)
          if [ -n "$f" ]; then git show "origin/raw:$f" > "$RUNNER_TEMP/fact-check.json"; echo "saved fact check: $f"; else echo "no saved fact check for $d"; fi
      - name: Send the Daily to Sig only, from the private copy of the list
        if: ${{ github.event_name == 'schedule' || inputs.send_email == true }}
        env:
          TEST_TO_SIG:  '1'
          DAILY_FORMAT: ${{ inputs.format || vars.DAILY_FORMAT || 'v2' }}
          PRINT_OF_DAY: ${{ runner.temp }}/print-of-day.json
          FACT_CHECK_JSON: ${{ runner.temp }}/fact-check.json
          LIST_SOURCE:  backup
          LOCAL_BIDS:   '1'
          SMTP_HOST:    ${{ secrets.SMTP_HOST }}
          SMTP_PORT:    ${{ secrets.SMTP_PORT }}
          SMTP_USER:    ${{ secrets.SMTP_USER || secrets.GMAIL_USER }}
          SMTP_PASS:    ${{ secrets.SMTP_PASS || secrets.GMAIL_APP_PASS }}
          FROM_ADDR:    ${{ secrets.FROM_ADDR }}
          LIST_URL:     ${{ secrets.LIST_URL }}
          LIST_TOKEN:   ${{ secrets.LIST_TOKEN }}
          UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
          FROM_NAME:    ${{ secrets.FROM_NAME }}
          REPLY_TO:     ${{ secrets.REPLY_TO }}
          SIG_TEST_EMAILS: ${{ secrets.SIG_TEST_EMAILS }}
          SIG_TO:       ${{ secrets.SIG_TO }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: python scripts/send_daily.py

  gate:
    if: ${{ inputs.test_to_sig != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.g.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          LIST_URL:           ${{ secrets.LIST_URL }}
          LIST_TOKEN:         ${{ secrets.LIST_TOKEN }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -uo pipefail

          EVENT="${{ github.event_name }}"
          BRANCH="${{ github.event.repository.default_branch || 'main' }}"

          HEARTBEAT="${{ github.event.inputs.heartbeat || 'false' }}"
          [ "$EVENT" = "workflow_dispatch" ] && [ "$HEARTBEAT" = "true" ] && EVENT="heartbeat"

          DEADLINE=$(( $(date +%s) + 40 * 60 ))
          FLOOR=0545

          say() { echo "$(date +%H:%M) Central — $*"; }

          published() {
            git fetch --quiet --depth=1 origin "$BRANCH" 2>/dev/null || true
            git cat-file -e "FETCH_HEAD:data/daily-archive/$1.json" 2>/dev/null && return 0
            [ -f "data/daily-archive/$1.json" ] && return 0
            return 1
          }

          on_remote() {
            git cat-file -e "FETCH_HEAD:$1" 2>/dev/null && return 0
            [ -f "$1" ] && return 0
            return 1
          }

          decide() { echo "skip=$1" >> "$GITHUB_OUTPUT"; }

          while :; do
            DAY=$(date +%F)
            HHMM=$(date +%H%M)
            H=$(date +%H)
            DOW=$(date +%u)          # 1=Mon ... 5=Fri

            if [ "$EVENT" != "schedule" ] && [ "$EVENT" != "heartbeat" ]; then
              say "GENERATING: manual $EVENT, $DAY"
              decide 0; exit 0
            fi

            if [ "$EVENT" = "schedule" ] && [ "$H" -ge 14 ] && [ "$DOW" = "5" ] && [ "$H" -lt 18 ]; then
              say "GENERATING: Friday post-close regeneration, $DAY"
              decide 0; exit 0
            fi

            if [ "$EVENT" = "heartbeat" ] && [ "$H" -ge 14 ]; then
              say "SKIPPING: heartbeat at $(date +%H:%M) Central — the post-close regeneration is the Friday cron's job, not every price push's"
              decide 1; exit 0
            fi

            if [ "$H" -ge 14 ]; then
              say "SKIPPING: $DAY, arrived at $(date +%H:%M) Central on day $DOW — a delayed fire, not a regeneration"
              decide 1; exit 0
            fi

            if published "$DAY"; then
              if on_remote "data/daily-sent/$DAY.json"; then
                say "SKIPPING: $DAY is already published and sent, a backup launch doing its job"
                decide 1; exit 0
              fi
              python3 scripts/daily_retry.py retry "$DAY"; rc=$?
              if [ "$rc" = "1" ]; then
                say "SKIPPING: $DAY went to the list (the day flag is set); only its sent copy is missing"
                decide 1; exit 0
              fi
              if [ "$rc" != "0" ]; then
                say "SKIPPING: $DAY is published, not marked sent, and the day flag cannot be read; never risk a second send"
                decide 1; exit 0
              fi
              say "RETRYING: $DAY is published but never went to the list; writing it again"
            fi

            if [ "$HHMM" -lt "$FLOOR" ]; then
              if [ "$EVENT" = "heartbeat" ]; then
                say "SKIPPING: heartbeat before the ${FLOOR} floor — the next one takes it"
                decide 1; exit 0
              fi
              now=$(date +%s)
              if [ "$now" -ge "$DEADLINE" ]; then
                say "SKIPPING: still before the $FLOOR floor and out of budget — a later launch takes this one"
                decide 1; exit 0
              fi
              say "waiting: $(date +%H:%M) is before the ${FLOOR} floor; $(( (DEADLINE - now) / 60 ))m of budget left"
              sleep 720
              continue
            fi

            say "GENERATING: $DAY, event=$EVENT"
            decide 0; exit 0
          done

  generate:
    needs: gate
    if: needs.gate.outputs.skip != '1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install feedparser==6.0.14 requests==2.34.2 pillow==12.3.0

      - name: Print of the day, drawn and put on agsist.com
        id: podraw
        if: ${{ (github.event_name == 'schedule' || inputs.send_email == true) && (inputs.format || vars.DAILY_FORMAT || 'v2') == 'v2' }}
        continue-on-error: true
        timeout-minutes: 7
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_FROM_ACTIONS: ${{ vars.PAGES_FROM_ACTIONS }}
        run: |
          npm install --silent --prefix "$RUNNER_TEMP/pw" playwright@1.56.1 >/dev/null
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium >/dev/null
          d=$(TZ=America/Chicago date +%F); f="daily/img/print-$d.png"
          python3 scripts/print_of_day.py --date "$d" --out "$RUNNER_TEMP/pick.json"
          PLAYWRIGHT_PATH="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node scripts/render_print_of_day.mjs "$RUNNER_TEMP/pick.json" "$f"
          python3 scripts/print_of_day.py --compress "$f"
          cp "$f" "$RUNNER_TEMP/print.png"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$f"
          git diff --cached --quiet || git commit -q -m "Daily print of the day $d"
          pushed=0
          for n in 1 2 3 4 5; do
            if git push -q; then pushed=1; break; fi
            echo "Push race on attempt $n; rebasing..."
            git pull -q --rebase --autostash origin main || { echo "Rebase failed."; exit 1; }
            sleep $((RANDOM % 4 + 2))
          done
          [ "$pushed" = 1 ] || { echo "Failed to push after 5 attempts."; exit 1; }
          bash .github/pages-kick.sh
          echo "file=$f" >> "$GITHUB_OUTPUT"

      - name: Code self-tests (report only, never hold the send)
        id: selftests
        continue-on-error: true
        timeout-minutes: 8
        env:
          OWNER_TO:     ${{ secrets.SIG_TO }}
          SMTP_HOST:    ${{ secrets.SMTP_HOST }}
          SMTP_PORT:    ${{ secrets.SMTP_PORT }}
          SMTP_USER:    ${{ secrets.SMTP_USER || secrets.GMAIL_USER }}
          SMTP_PASS:    ${{ secrets.SMTP_PASS || secrets.GMAIL_APP_PASS }}
          FROM_ADDR:    ${{ secrets.FROM_ADDR }}
          GH_TOKEN:     ${{ github.token }}
        run: python scripts/daily_selftests.py

      - name: GATE 1 — feed pre-flight (repair ZC=F roll contamination; block on unrepairable feed)
        id: g1
        run: python scripts/preflight_prices.py data/prices.json --repair

      - name: Only on AGSIST facts
        continue-on-error: true
        run: python scripts/daily_edge.py

      - name: Get the editorial notes (private repo)
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_BRANCH: private-data
          RAW_SOFT: '1'
        run: bash scripts/pull_raw.sh private/data/editorial-notes.md

      - name: Generate daily briefing
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIEFING_MODEL: ${{ vars.BRIEFING_MODEL }}
        run: python scripts/generate_daily.py

      - name: Run critic pass
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIEFING_MODEL: ${{ vars.BRIEFING_MODEL }}
        continue-on-error: true
        run: python scripts/critique_briefing.py

      - name: GATE 2f, fact check against the source data
        id: g2f
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FACT_CHECK_MODEL: ${{ vars.FACT_CHECK_MODEL }}
          FACT_CHECK_MODE: block
        run: |
          echo "fact check: model=${FACT_CHECK_MODEL:-claude_models.REVIEWER} mode=$FACT_CHECK_MODE"
          rm -f "$RUNNER_TEMP/fact-check.json"
          python scripts/fact_check_briefing.py

      - name: Save the fact check to the raw branch
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_SOFT: '1'
        run: |
          f="$RUNNER_TEMP/fact-check.json"
          if [ ! -s "$f" ]; then echo "::warning::no fact-check.json from this run; nothing saved"; exit 0; fi
          d="daily-fact-check/$(TZ=America/Chicago date +%F)-${{ github.run_id }}-${{ github.run_attempt }}.json"
          mkdir -p daily-fact-check && cp "$f" "$d"
          bash scripts/push_raw.sh "daily fact check" "$d" || echo "::warning::fact check not saved to raw (the briefing is unaffected)"
          rm -rf daily-fact-check
          exit 0

      - name: GATE 2h, a failing headline is rewritten until it passes
        id: g2h
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIEFING_MODEL: ${{ vars.BRIEFING_MODEL }}
          OWNER_TO:     ${{ secrets.SIG_TO }}
          SMTP_HOST:    ${{ secrets.SMTP_HOST }}
          SMTP_PORT:    ${{ secrets.SMTP_PORT }}
          SMTP_USER:    ${{ secrets.SMTP_USER || secrets.GMAIL_USER }}
          SMTP_PASS:    ${{ secrets.SMTP_PASS || secrets.GMAIL_APP_PASS }}
          FROM_ADDR:    ${{ secrets.FROM_ADDR }}
          GH_TOKEN:     ${{ github.token }}
        run: python scripts/headline_fix.py data/daily.json --prices data/prices.json

      - name: GATE 2c, unsourced cause lines reworded before the gate
        continue-on-error: true
        run: |
          [ -f scripts/cause_fix.py ] || { echo "cause_fix.py not in this checkout yet"; exit 0; }
          python scripts/cause_fix.py data/daily.json

      - name: GATE 2 — pre-publish briefing gate
        id: g2
        run: python scripts/briefing_gate.py data/daily.json --prices data/prices.json

      - name: Notify critic status
        if: always()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER || secrets.GMAIL_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || secrets.GMAIL_APP_PASS }}
          FROM_ADDR: ${{ secrets.FROM_ADDR }}
        run: python scripts/notify_critic_status.py
        continue-on-error: true

      - name: Validate schema
        id: schema
        run: python scripts/daily_schema.py data/daily.json

      - name: GATE 2v, the email's number check before publishing
        id: g2v
        env:
          DAILY_FORMAT: ${{ inputs.format || vars.DAILY_FORMAT || 'v2' }}
        run: python scripts/daily_retry.py prepublish

      - name: Generate RSS feed
        continue-on-error: true
        run: python scripts/generate_rss.py

      - name: Prerender WPI pages
        continue-on-error: true
        run: python scripts/prerender_wpi_scorecard.py

      - name: Bake briefing into homepage
        continue-on-error: true
        run: python scripts/bake_homepage.py

      - name: Build social card
        continue-on-error: true
        env:
          SOCIAL_CARD_DIR: ${{ runner.temp }}/social/data/social
        run: python scripts/build_social_card.py

      - name: Copy social card to agsist-data
        continue-on-error: true
        timeout-minutes: 4
        env:
          AGSIST_DATA_TOKEN: ${{ secrets.AGSIST_DATA_TOKEN }}
          AGSIST_DATA_TRIES: "2"
        run: |
          bash scripts/agsist_data.sh sync --keep --from "$RUNNER_TEMP/social" data/social
          python3 scripts/share_host.py wait index.html --wait 150

      - name: Add today's archive page to sitemap
        continue-on-error: true
        run: |
          d=$(date -u +%Y-%m-%d)
          if [ -f "daily/${d}.html" ]; then
            python scripts/update_sitemap.py --add "https://agsist.com/daily/${d}"
          else
            echo "no daily/${d}.html — skipping sitemap add"
          fi

      - name: Chart of the day, drawn (never holds the send)
        id: chartdraw
        if: ${{ (github.event_name == 'schedule' || inputs.send_email == true) && (inputs.format || vars.DAILY_FORMAT || 'v2') == 'v2' }}
        continue-on-error: true
        timeout-minutes: 4
        run: |
          f=$(python3 -c "import json; print((json.load(open('data/daily.json')).get('chart_of_day') or {}).get('image') or '')")
          [ -n "$f" ] || { echo "no chart of the day today"; exit 0; }
          if [ ! -f "$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" ]; then
            npm install --silent --prefix "$RUNNER_TEMP/pw" playwright@1.56.1 >/dev/null
            "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium >/dev/null
          fi
          PLAYWRIGHT_PATH="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" node scripts/render_daily_chart.mjs data/daily.json "$f"
          python3 scripts/print_of_day.py --compress "$f"
          cp "$f" "$RUNNER_TEMP/chart.png"
          echo "file=$f" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_FROM_ACTIONS: ${{ vars.PAGES_FROM_ACTIONS }}
        run: |
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          git add data/daily.json data/daily-edge.json data/daily-archive/ daily/ daily.html feed.xml sitemap.xml sitemap-news.xml index.html index1.html usda-calendar.html cot.html data/prices.json
          git diff --staged --quiet || git commit -m "AGSIST Daily — $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase --autostash origin main && git push; then
              echo "push ok on attempt $i"; break
            fi
            echo "push attempt $i failed; retrying in 20s"; sleep 20
            [ "$i" = "3" ] && { git rebase --abort 2>/dev/null || true; exit 1; }
          done
          bash .github/pages-kick.sh

      - name: Tell Sig which check held the Daily
        if: ${{ failure() && steps.commit.outcome != 'success' && (github.event_name == 'schedule' || inputs.send_email == true) }}
        continue-on-error: true
        env:
          FAILED: >-
            ${{ steps.g1.outcome == 'failure' && 'g1' || '' }}
            ${{ steps.gen.outcome == 'failure' && 'gen' || '' }}
            ${{ steps.g2f.outcome == 'failure' && 'g2f' || '' }}
            ${{ steps.g2h.outcome == 'failure' && 'g2h' || '' }}
            ${{ steps.g2.outcome == 'failure' && 'g2' || '' }}
            ${{ steps.schema.outcome == 'failure' && 'schema' || '' }}
            ${{ steps.g2v.outcome == 'failure' && 'g2v' || '' }}
            ${{ steps.commit.outcome == 'failure' && 'commit' || '' }}
          OWNER_TO:     ${{ secrets.SIG_TO }}
          SMTP_HOST:    ${{ secrets.SMTP_HOST }}
          SMTP_PORT:    ${{ secrets.SMTP_PORT }}
          SMTP_USER:    ${{ secrets.SMTP_USER || secrets.GMAIL_USER }}
          SMTP_PASS:    ${{ secrets.SMTP_PASS || secrets.GMAIL_APP_PASS }}
          FROM_ADDR:    ${{ secrets.FROM_ADDR }}
          GH_TOKEN:     ${{ github.token }}
        run: python scripts/daily_retry.py alert

      - name: Neither send loop can re-mail the whole list
        id: sendloops
        if: ${{ github.event_name == 'schedule' || inputs.send_email == true }}
        run: python3 scripts/test_send_loops.py

      - name: The email's local bid matches the homepage hero
        id: localbid
        if: ${{ github.event_name == 'schedule' || inputs.send_email == true }}
        continue-on-error: true
        run: |
          python scripts/local_bid.py --selftest
          node scripts/daily-local-bid-checks.mjs

      - name: Print of the day, is it live
        if: ${{ steps.podraw.outcome == 'success' && steps.podraw.outputs.file != '' }}
        continue-on-error: true
        timeout-minutes: 4
        env:
          F: ${{ steps.podraw.outputs.file }}
        run: |
          url="https://agsist.com/$F"
          for i in $(seq 1 12); do
            if curl -fsS -m 20 -o "$RUNNER_TEMP/live.png" "$url" && cmp -s "$RUNNER_TEMP/live.png" "$RUNNER_TEMP/print.png"; then
              python3 -c "import json,sys; p=json.load(open(sys.argv[1])); p['image_url']=sys.argv[2]; json.dump(p, open(sys.argv[3],'w'))" "$RUNNER_TEMP/pick.json" "$url" "$RUNNER_TEMP/print-of-day.json"
              echo "live: $url"; exit 0
            fi
            sleep 15
          done
          echo "::warning::the print of the day was not served by agsist.com in 3 minutes; the email goes without it"

      - name: Chart of the day, is it live
        if: ${{ steps.chartdraw.outcome == 'success' && steps.chartdraw.outputs.file != '' }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          F: ${{ steps.chartdraw.outputs.file }}
        run: |
          url="https://agsist.com/$F"
          for i in 1 2 3 4 5; do
            if curl -fsS -m 15 -o "$RUNNER_TEMP/chart-live.png" "$url" && cmp -s "$RUNNER_TEMP/chart-live.png" "$RUNNER_TEMP/chart.png"; then
              python3 -c "import json,sys; c=json.load(open('data/daily.json'))['chart_of_day']; o={k: c.get(k) for k in ('alt','takeaway','source','date','template')}; o['image_url']=sys.argv[1]; o['page_url']=sys.argv[2]; json.dump(o, open(sys.argv[3],'w'))" "$url" "https://agsist.com/daily/$(TZ=America/Chicago date +%F)" "$RUNNER_TEMP/chart-of-day.json"
              echo "live: $url"; exit 0
            fi
            sleep 12
          done
          echo "::warning::the chart of the day was not served by agsist.com in a minute; the email goes without it"

      - name: Send daily email
        if: ${{ github.event_name == 'schedule' || inputs.send_email == true }}
        env:
          DAILY_FORMAT: ${{ inputs.format || vars.DAILY_FORMAT || 'v2' }}
          PRINT_OF_DAY: ${{ runner.temp }}/print-of-day.json
          CHART_OF_DAY: ${{ runner.temp }}/chart-of-day.json
          OWNER_TO:     ${{ secrets.SIG_TO }}
          LOCAL_BIDS:   ${{ steps.localbid.outcome == 'success' && '1' || '0' }}
          SMTP_HOST:    ${{ secrets.SMTP_HOST }}
          SMTP_PORT:    ${{ secrets.SMTP_PORT }}
          SMTP_USER:    ${{ secrets.SMTP_USER || secrets.GMAIL_USER }}
          SMTP_PASS:    ${{ secrets.SMTP_PASS || secrets.GMAIL_APP_PASS }}
          FROM_ADDR:    ${{ secrets.FROM_ADDR }}
          RECIPIENTS:   ${{ secrets.RECIPIENTS }}
          LIST_URL:     ${{ secrets.LIST_URL }}
          LIST_TOKEN:   ${{ secrets.LIST_TOKEN }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
          FROM_NAME:    ${{ secrets.FROM_NAME }}
          REPLY_TO:     ${{ secrets.REPLY_TO }}
          SEND_DAILY_CAP: ${{ vars.SEND_DAILY_CAP }}
        run: python scripts/send_daily.py

      - name: Keep the sent copy
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.send_email == true) && inputs.test_to_sig != true }}
        continue-on-error: true
        run: |
          [ -d data/daily-sent ] || { echo "no sent copy this run"; exit 0; }
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          git add data/daily-sent/
          git diff --staged --quiet && { echo "sent copy already committed"; exit 0; }
          git commit -m "AGSIST Daily sent copy $(date +%Y-%m-%d)"
          for i in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase --autostash origin main && git push; then
              echo "push ok on attempt $i"; break
            fi
            echo "push attempt $i failed; retrying in 20s"; sleep 20
            [ "$i" = "3" ] && { git rebase --abort 2>/dev/null || true; exit 1; }
          done

      - name: A dry run does not mark the day done
        if: ${{ !cancelled() && steps.commit.outcome == 'success' && github.event_name != 'schedule' && inputs.send_email != true && inputs.test_to_sig != true }}
        continue-on-error: true
        run: python scripts/daily_retry.py dry-run-note "$(date +%Y-%m-%d)"

      - name: Ping IndexNow with today's issue
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 12
        run: |
          d=$(date +%Y-%m-%d)
          u="https://agsist.com/daily/${d}"
          [ -f "daily/${d}.html" ] || { echo "no daily/${d}.html, nothing to ping"; exit 0; }
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null --max-time 20 "$u"; then
              python scripts/indexnow_submit.py --urls "$u" https://agsist.com/daily \
                || echo "IndexNow ping failed; the weekly run covers it"
              exit 0
            fi
            echo "page not live yet (try $i of 20)"; sleep 30
          done
          echo "page never came up in 10 minutes; no ping sent, the weekly run covers it"
