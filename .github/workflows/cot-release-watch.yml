name: COT Release Watch

on:
  schedule:
    - cron: '13,43 19-21 * * 1-5'
  workflow_run:
    workflows: ["Fetch Grain Bids", "Tick 03", "Fetch Prices"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: 'Run the pipeline even if the report date has not moved'
        type: boolean
        default: false
      send_email:
        description: 'Email Funds this week too? A manual run is a dry run unless this is ticked.'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ ((github.event.workflow_run.name == 'Fetch Grain Bids' && vars.CLOCK_LIVE == '1') || (github.event.workflow_run.name == 'Tick 03' && !contains(github.event.workflow_run.display_title, ' cot-release-watch.yml '))) && format('fetch-cot-{0}', github.run_id) || 'fetch-cot' }}
  cancel-in-progress: false

jobs:
  gate:
    if: (github.event.workflow_run.name != 'Fetch Grain Bids' || vars.CLOCK_LIVE != '1') && (github.event.workflow_run.name != 'Tick 03' || contains(github.event.workflow_run.display_title, ' cot-release-watch.yml '))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      go: ${{ steps.report.outputs.go || steps.window.outputs.go }}
    steps:
      - id: window
        run: |
          W=$(date -u +%u); H=$(( 10#$(date -u +%H) ))
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; echo "manual run"; exit 0; fi
          if [ "$W" -le 5 ] && [ "$H" -ge 19 ]; then echo "open=1" >> "$GITHUB_OUTPUT"; echo "in window (day $W, hour $H)"
          else echo "go=0" >> "$GITHUB_OUTPUT"; echo "outside Mon-Fri 19:00-23:59 UTC (day $W, hour $H)"; fi
      - if: steps.window.outputs.open == '1'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            data/cot.json
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        if: steps.window.outputs.open == '1'
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: report
        if: steps.window.outputs.open == '1'
        run: python3 scripts/cron_gate.py cot --cot-file data/cot.json

  watch:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - name: Has the report moved?
        id: probe
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys, urllib.request
          from datetime import datetime

          URL = ("https://publicreporting.cftc.gov/resource/72hh-3qpy.json"
                 "?$limit=1&$order=report_date_as_yyyy_mm_dd%20DESC"
                 "&$where=market_and_exchange_names%20like%20%27CORN%20-%20CHICAGO%25%27")

          def committed():
              try:
                  with open("data/cot.json") as f:
                      raw = json.load(f).get("report_date", "")
                  return datetime.strptime(raw, "%B %d, %Y").date()
              except Exception as e:
                  print(f"# could not read committed report date ({e})", file=sys.stderr)
                  return None

          try:
              req = urllib.request.Request(URL, headers={"User-Agent": "AGSIST/1.0 (+https://agsist.com/cot)"})
              with urllib.request.urlopen(req, timeout=25) as r:
                  rows = json.loads(r.read().decode())
              latest = datetime.fromisoformat(rows[0]["report_date_as_yyyy_mm_dd"].split("T")[0]).date()
          except Exception as e:
              print(f"# probe failed: {e}", file=sys.stderr)
              print("moved=false")
              print("reason=probe-failed")
              sys.exit(0)

          have = committed()
          moved = have is None or latest > have
          print(f"# CFTC latest {latest} vs committed {have}", file=sys.stderr)
          print(f"moved={'true' if moved else 'false'}")
          print(f"latest={latest}")
          print(f"reason={'new-report' if moved else 'unchanged'}")
          PY

      - name: Nothing new
        if: steps.probe.outputs.moved != 'true' && inputs.force != true
        run: |
          echo "CFTC has not published a newer report (${{ steps.probe.outputs.reason }})."
          echo "This is the expected outcome for all but one run a week."

      - uses: actions/setup-python@v5
        if: steps.probe.outputs.moved == 'true' || inputs.force == true
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.probe.outputs.moved == 'true' || inputs.force == true
        run: pip install --quiet yfinance==1.7.0 pandas==3.0.6

      - name: Prove the readers
        if: steps.probe.outputs.moved == 'true' || inputs.force == true
        run: |
          python scripts/cot_calendar.py
          python scripts/cot_deep.py --selftest

      - name: Fetch the new report
        if: steps.probe.outputs.moved == 'true' || inputs.force == true
        run: python scripts/fetch_cot.py

      - name: Attach prices
        if: steps.probe.outputs.moved == 'true' || inputs.force == true
        run: python scripts/enrich_cot_prices.py

      - name: Deep history from raw
        id: rawpull
        continue-on-error: true
        if: steps.probe.outputs.moved == 'true' || inputs.force == true
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: bash scripts/pull_raw.sh data/cot-deep.json

      - name: Append the week to the deep history
        id: deep
        continue-on-error: true
        if: steps.probe.outputs.moved == 'true' || inputs.force == true
        run: python scripts/cot_deep.py --append

      - name: Save the deep history to raw
        if: (steps.probe.outputs.moved == 'true' || inputs.force == true) && steps.deep.outcome == 'success'
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RAW_SOFT: '1'
        run: bash scripts/push_raw.sh "cot deep history" data/cot-deep.json

      - name: Prove the statistics
        id: selftest
        continue-on-error: true
        if: steps.probe.outputs.moved == 'true' || inputs.force == true
        run: python scripts/cot_analysis.py --selftest

      - name: Run the analysis
        id: analysis
        continue-on-error: true
        if: (steps.probe.outputs.moved == 'true' || inputs.force == true) && steps.selftest.outcome == 'success'
        run: python scripts/cot_analysis.py

      - name: Options positions
        continue-on-error: true
        if: steps.probe.outputs.moved == 'true' || inputs.force == true
        run: |
          python scripts/cot_options.py --selftest
          python scripts/cot_options.py

      - name: Re-bake the head tags and crawler summary
        if: steps.probe.outputs.moved == 'true' || inputs.force == true
        id: bake
        continue-on-error: true
        run: |
          cp cot.html /tmp/cot.prebake.html
          trap 'cp /tmp/cot.prebake.html cot.html; echo "bake failed - cot.html rolled back"' ERR
          set -e
          python scripts/bake_seo.py --selftest
          python scripts/bake_seo.py --page cot.html
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import prerender_wpi_scorecard as p
          orig, new, fname = p.bake_cot()
          if new != orig:
              open(fname, "w", encoding="utf-8").write(new)
              print("Baked", fname)
          else:
              print(fname, "already in sync")
          PY
          trap - ERR

      - name: Refresh the report card's positioning line
        id: wpi
        continue-on-error: true
        if: steps.probe.outputs.moved == 'true' || inputs.force == true
        run: |
          python scripts/report_bands.py --selftest
          python scripts/build_whats_priced_in.py
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import prerender_wpi_scorecard as p
          orig, new, fname = p.bake_wpi()
          if new != orig:
              open(fname, "w", encoding="utf-8").write(new)
              print("Baked", fname)
          else:
              print(fname, "already in sync")
          PY

      - name: Commit
        id: commit
        if: steps.probe.outputs.moved == 'true' || inputs.force == true
        run: |
          git config user.name  "AGSIST Bot"
          git config user.email "bot@agsist.com"
          for f in data/cot.json data/cot-history.json data/cot-analysis.json data/cot-options.json data/cot-questions.json data/whats-priced-in.json; do
            mkdir -p "/tmp/keep/$(dirname "$f")"; cp "$f" "/tmp/keep/$f" 2>/dev/null || true
          done
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            for f in data/cot.json data/cot-history.json data/cot-analysis.json data/cot-options.json data/cot-questions.json data/whats-priced-in.json; do
              [ -f "/tmp/keep/$f" ] && cp "/tmp/keep/$f" "$f"
            done
            if ! python scripts/bake_seo.py --page cot.html >/dev/null || ! python -c "import sys; sys.path.insert(0, 'scripts'); import prerender_wpi_scorecard as p; o, n, f = p.bake_cot(); n != o and open(f, 'w', encoding='utf-8').write(n)"; then
              git checkout -- cot.html; echo "::warning::re-baking cot.html on the new main failed; cot.html left as it is on main"
            fi
            if ! python -c "import sys; sys.path.insert(0, 'scripts'); import prerender_wpi_scorecard as p; o, n, f = p.bake_wpi(); n != o and open(f, 'w', encoding='utf-8').write(n)"; then
              git checkout -- usda-calendar.html; echo "::warning::re-baking usda-calendar.html on the new main failed; left as it is on main"
            fi
            git add data/cot.json data/cot-history.json cot.html
            git add data/whats-priced-in.json usda-calendar.html 2>/dev/null || true
            git add data/cot-analysis.json 2>/dev/null || true
            git add data/cot-options.json 2>/dev/null || true
            git add data/cot-questions.json 2>/dev/null || true
            if git diff --staged --quiet; then
              echo "Probe said the report moved but nothing changed on disk — investigate."
              exit 0
            fi
            git commit -m "chore: COT ${{ steps.probe.outputs.latest }} released [skip ci]"
            if git push; then echo "published (attempt $i)"; exit 0; fi
            sleep $((RANDOM % 4 + 3))
          done
          echo "ERROR: could not push after 5 attempts"; exit 1

      - name: Bake result
        if: steps.bake.outcome == 'failure'
        run: |
          echo "The COT data published, but re-baking cot.html FAILED."
          echo "Title, meta descriptions and the crawler paragraph are still on"
          echo "the previous report. Fix the baker and re-run."
          exit 1

      - name: Analysis result
        if: (steps.probe.outputs.moved == 'true' || inputs.force == true) && (steps.rawpull.outcome == 'failure' || steps.deep.outcome == 'failure' || steps.selftest.outcome == 'failure' || steps.analysis.outcome == 'failure' || steps.selftest.outcome == 'skipped')
        run: |
          echo "The COT data published, but the analysis pipeline did not complete."
          echo "  raw unpack  : ${{ steps.rawpull.outcome }}"
          echo "  deep append : ${{ steps.deep.outcome }}"
          echo "  selftest    : ${{ steps.selftest.outcome }}"
          echo "  analysis    : ${{ steps.analysis.outcome }}"
          echo ""
          echo "If this is the first release after the kit was uploaded, run the"
          echo "'COT Deep History Rebuild' workflow once and this clears itself."
          echo "Otherwise the analysis sections on /cot are showing last week's"
          echo "report or hiding themselves. Fix before next Friday."
          exit 1

      - name: cot.html matches data/cot.json
        if: ${{ !cancelled() && steps.commit.outcome == 'success' }}
        run: python scripts/check_cot_baked.py

      - name: Test the Funds this week sender and its loop
        id: cot_mail_test
        if: ${{ !cancelled() && steps.commit.outcome == 'success' }}
        run: |
          python scripts/send_cot_weekly.py --selftest
          python3 scripts/test_send_loops.py

      - name: Email Funds this week
        if: ${{ !cancelled() && steps.commit.outcome == 'success' && steps.cot_mail_test.outcome == 'success' && steps.rawpull.outcome == 'success' }}
        env:
          SMTP_HOST:    ${{ secrets.SMTP_HOST }}
          SMTP_PORT:    ${{ secrets.SMTP_PORT }}
          SMTP_USER:    ${{ secrets.SMTP_USER || secrets.GMAIL_USER }}
          SMTP_PASS:    ${{ secrets.SMTP_PASS || secrets.GMAIL_APP_PASS }}
          FROM_ADDR:    ${{ secrets.FROM_ADDR }}
          FROM_NAME:    ${{ secrets.FROM_NAME }}
          REPLY_TO:     ${{ secrets.REPLY_TO }}
          LIST_URL:     ${{ secrets.LIST_URL }}
          LIST_TOKEN:   ${{ secrets.LIST_TOKEN }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
          SEND:         ${{ ((github.event_name != 'workflow_dispatch' && vars.FUNDS_WEEKLY_LIVE == '1') || (github.event_name == 'workflow_dispatch' && inputs.send_email == true)) && '1' || '' }}
        run: python scripts/send_cot_weekly.py
