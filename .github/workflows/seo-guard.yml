name: SEO guard

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'sitemap*.xml'
      - 'robots.txt'
      - 'scripts/check_seo.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-guard
  cancel-in-progress: true

jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - name: Prove the check
        run: python3 scripts/check_seo.py --selftest

      - name: Check every published page
        run: |
          set +e
          python3 scripts/check_seo.py > /tmp/seo.txt
          rc=$?
          set -e
          cat /tmp/seo.txt
          {
            echo "## SEO guard"
            echo
            echo '```'
            head -200 /tmp/seo.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            grep '^ERROR:' /tmp/seo.txt | head -50 | while IFS= read -r line; do echo "::error title=SEO guard::${line#ERROR: }"; done
            exit 1
          fi
