name: Site usage (GA4 + Search Console, 90 days)

# Per-page usage for the site audit: GA4 page views, users, engagement and
# entrances, and Search Console clicks, impressions, CTR, position and top
# queries, all for the last 90 days. Writes data/site-usage.json (aggregate
# only) and commits it. Each source fails on its own: a missing secret or an
# API error sets that block to null with a reason. If both fail, the file is
# left as it was. Secrets are the same ones sponsor-report.yml and
# gsc-sitemaps.yml already use.
#
# Monthly, 2nd of the month 14:37 UTC, off the hour. Run it by hand from the
# Actions tab any time.

on:
  schedule:
    - cron: '37 14 2 * *'
  # GitHub's scheduler drops scheduled fires (it never started land-data.yml on Nov 3, 2026;
  # scripts/cron_gate.py has the numbers). So this also runs after every "Fetch Grain Bids"
  # (cron-job.org, every 15 minutes), and the gate job lets the first run after each tick of the
  # cron above, by either trigger, do the work within 360 minutes
  # (six hours, the same day and well before the next tick).
  # Every other run skips in seconds. A chained run takes the scheduled path. A run by hand or
  # a push does not use up the tick (cron_gate.py MANUAL_DOES_NOT_SERVE): it may take narrower
  # inputs, and the chained run that follows is the same idempotent job.
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]
  workflow_dispatch:

jobs:
  # One run per tick of the schedule (see on: above). Sparse: the skip costs seconds.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow site-usage.yml --max-lag 360
          --cron "37 14 2 * *"

  report:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: site-usage
      cancel-in-progress: false
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install google-auth (pinned)
        run: pip install --disable-pip-version-check 'google-auth==2.40.3' 'requests==2.32.3'

      - name: Selftest (offline, fake transports)
        run: python3 scripts/site_usage_report.py --selftest

      - name: Pull usage
        env:
          GA4_PROPERTY_ID:          ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT:      ${{ secrets.GA4_SERVICE_ACCOUNT }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE:                 ${{ vars.GSC_SITE }}
        run: python3 scripts/site_usage_report.py

      # Fresh numbers, fresh to-do list (/seo-report). seo-weekly.yml rebuilds
      # it every Monday as well, after titles have changed.
      - name: What to fix (search)
        run: python3 scripts/seo_opportunities.py   # no --print: the Actions log is public

      - name: Commit
        run: |
          git config user.name  "agsist-bot"
          git config user.email "bot@agsist.com"
          git add data/site-usage.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "site usage: 90 days through $(date -u -d yesterday +%Y-%m-%d) [skip ci]"
          for i in 1 2 3; do
            git push && break
            git pull --rebase --autostash && sleep 3
          done
