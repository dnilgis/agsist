name: Build Analyst Scorecard
# Build Analyst Scorecard.

on:
  push:
    branches: [main]
    paths:
      - "data/analyst-estimates.json"
      - "scripts/build_analyst_scorecard.py"
  schedule:
    - cron: "25 11 * * *"   # 11:25 UTC daily — rolls the "next report" panel as dates pass
  # cron above, by either trigger, do the work within 360 minutes
  workflow_run:
    workflows: ["Fetch Grain Bids"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cron_gate.py
            /.github/actions/engine/
            /.github/engine-paths
          sparse-checkout-cone-mode: false
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cron_gate.py tick --workflow analyst-scorecard.yml --max-lag 360
          --cron "25 11 * * *"

  build:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: analyst-scorecard
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Engine checkout
        uses: ./.github/actions/engine
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: ${{ vars.ENGINE_MODE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the shared scoring rule
        run: python scripts/report_bands.py --selftest
      - name: Test the locked-call rule
        run: python scripts/build_analyst_scorecard.py --selftest
      - name: Build analyst-scorecard.json
        run: python scripts/build_analyst_scorecard.py
      - name: Commit if changed
        run: |
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          python scripts/prerender_wpi_scorecard.py || true
          git add data/analyst-scorecard.json usda-calendar.html cot.html
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "Update analyst scorecard $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            pushed=0
            for n in 1 2 3 4 5; do
              if git push; then pushed=1; break; fi
              echo "Push race on attempt $n; rebasing..."
              git pull --rebase --autostash origin main || { echo "Rebase failed."; exit 1; }
              sleep $((RANDOM % 4 + 2))
            done
            [ "$pushed" = 1 ] || { echo "Failed to push after 5 attempts."; exit 1; }
          fi
