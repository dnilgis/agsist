name: Build Analyst Scorecard

on:
  push:
    paths:
      - "data/analyst-estimates.json"
      - "scripts/build_analyst_scorecard.py"
  schedule:
    - cron: "25 11 * * *"   # 11:25 UTC daily — rolls the "next report" panel as dates pass
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analyst-scorecard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # THE RULE BEFORE THE BUILD. Both builders now share one definition of
      # "in line" (scripts/report_bands.py); before they had one each and
      # disagreed on the page about one number. Two seconds, no network.
      - name: Test the shared scoring rule
        run: python scripts/report_bands.py --selftest
      # THE LOCK RULE. The model's own yield calls are joined onto the board from
      # data/nowcast-direction.json, and only a call locked BEFORE the report it
      # forecasts is allowed on. Ten cases, no network, under a second.
      - name: Test the locked-call rule
        run: python scripts/build_analyst_scorecard.py --selftest
      - name: Build analyst-scorecard.json
        run: python scripts/build_analyst_scorecard.py
      - name: Commit if changed
        run: |
          git config user.name "AGSIST Bot"
          git config user.email "bot@agsist.com"
          python scripts/prerender_wpi_scorecard.py || true   # bake leaderboard into WPI page; never block
          git add data/analyst-scorecard.json whats-priced-in.html scorecard.html cot.html ag-odds.html
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "Update analyst scorecard $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase --autostash origin main || true
            git push
          fi
