<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Rain Print | AGSIST</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="AGSIST">
<meta property="og:title" content="Rain Print: a year of rain and snow at the farm, printed and framed">
<meta property="og:description" content="Every rain and snow of one year at the weather station nearest a farm or hometown, drawn and printed on 13 x 19 paper with a name and dates. A gift for the farmer.">
<meta property="og:image" content="https://agsist.com/img/og/rain-print.jpg?v=baa7e6a0">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A framed test Rain Print of Chetek, Wisconsin, 2025, photographed on a wall: each day&#x27;s rain hangs below the line, snow above, from NOAA records. A year of rain on your farm, framed. Prints from $45.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://agsist.com/img/og/rain-print.jpg?v=baa7e6a0">
<!-- The Rain Print QR short link (HTTPS://AGSIST.COM/R?ID). Looks the id up at
     the subs worker (v5.14, GET /rp-short/<id>) and opens /rain-print?d=<code>.
     R.html and r.html are the same bytes (GitHub Pages paths are case-sensitive;
     the QR uses /R, a typed link may use /r). test/rp-short.test.mjs checks that.
     Worker blocked, down or slower than 3 s: the sealed copy in data/rp-sealed/
     opens the same design (scripts/build_rp_sealed.mjs, test/rp-sealed.test.mjs).
     The text stays hidden for the first 0.7 s, so a normal scan goes straight
     to the design without a flash of this page. -->
<link rel="preconnect" href="https://agsist-subs.dnilgis.workers.dev" crossorigin>
<style>
  :root{--bg:#f6f7f5;--text:#161a18;--muted:rgba(22,26,24,.7);--link:#7a5a12}
  @media (prefers-color-scheme: dark){:root{--bg:#0a0c0d;--text:#e9edeb;--muted:rgba(233,237,235,.7);--link:#d4a23f}}
  html,body{background:var(--bg)}
  body{margin:0;color:var(--text);font:17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:520px;margin:0 auto;padding:4rem 16px;opacity:0;animation:rp-show 0s .7s forwards}
  main.now{opacity:1;animation:none}
  @keyframes rp-show{to{opacity:1}}
  h1{font-size:1.3rem;margin:0 0 .6rem}
  p{color:var(--muted);margin:.4rem 0}
  a{color:var(--link)}
</style>
<noscript><style>main{opacity:1;animation:none}</style></noscript>
</head>
<body>
<main id="box">
<h1 id="msg">Opening the Rain Print design</h1>
<p id="sub">One moment.</p>
<p><a id="again" href="" hidden>Try again</a> <a href="/rain-print">Go to Rain Print</a></p>
</main>
<script>
(function () {
  var API = 'https://agsist-subs.dnilgis.workers.dev/rp-short/';
  var gone = false;
  function fail(unknown) {
    if (gone) return;
    try {
      document.getElementById('msg').textContent = 'This Rain Print link did not open';
      document.getElementById('sub').textContent = unknown
        ? 'This link isn\u2019t one the site knows. Check the address, or make the print again on the Rain Print page.'
        : 'The connection dropped or the link service is busy. Try again in a minute, or make the print again on the Rain Print page.';
      var again = document.getElementById('again');
      if (again && !unknown) again.hidden = false;   // a busy link service: one tap to ask again (panel 3 F12)
      document.getElementById('box').className = 'now';
    } catch (e) {}
  }
  // ?K7Q2M, ?k7q2m, ?id=K7Q2M, and either with extra parameters an app added (&fbclid=...)
  var id = '', parts = String(location.search || '').replace(/^\?/, '').split('&');
  for (var i = 0; i < parts.length && !id; i++) {
    var p = parts[i];
    if (/^id=/i.test(p)) p = p.slice(3); else if (p.indexOf('=') >= 0) continue;
    try { p = decodeURIComponent(p); } catch (e) { p = ''; }
    id = p.trim().toUpperCase().replace(/[IL]/g, '1').replace(/O/g, '0');
  }
  if (!/^[0-9A-HJKMNP-TV-Z]{5,8}$/.test(id)) { fail(true); return; }
  if (typeof fetch !== 'function') { fail(false); return; }
  function go(code) { gone = true; location.replace('/rain-print?d=' + code); }
  var CODE_RE = /^[A-Za-z0-9_-]{8,400}$/;
  var t = setTimeout(function () { fail(false); }, 20000);
  // The worker first, for 3 s. A JSON 404 from it is a real "no such link".
  // Anything else (blocked, down, an HTML page, slow): the sealed copy below.
  var asked = false;
  function sealedOnce() { if (asked || gone) return; asked = true; sealed(); }
  var wt = setTimeout(sealedOnce, 3000);
  fetch(API + id).then(function (r) {
    if (r.status === 404) return r.json().then(function (j) { return j && typeof j === 'object' ? { missing: true } : null; });
    return r.ok ? r.json() : null;
  }).then(function (j) {
    if (asked) return;
    clearTimeout(wt);
    var code = j && typeof j.code === 'string' ? j.code : '';
    if (CODE_RE.test(code)) { clearTimeout(t); go(code); return; }
    if (j && j.missing) { clearTimeout(t); fail(true); return; }
    sealedOnce();
  }).catch(function () { clearTimeout(wt); sealedOnce(); });

  /* THE SEALED COPY (Oct 22, 2026): with the worker down, the id opens a file
     on agsist.com that only the id can find and read. scripts/build_rp_sealed.mjs
     writes it from the private copy of the worker's storage, with these same
     constants; its header has the threat model (the repo is public, so a
     guesser must run this whole derivation per guessed id). No id, no list
     and no plaintext is published. */
  function sealed() {
    var S = null, E = null;
    try { S = crypto.subtle; E = new TextEncoder(); } catch (e) { S = null; }
    if (!S || !E) { clearTimeout(t); fail(false); return; }
    var SALT = 'agsist.com/r sealed v1', ITERATIONS = 600000, NAME_BYTES = 16, name = '', key = null;
    var none = new Uint8Array(0);
    S.importKey('raw', E.encode(id), 'PBKDF2', false, ['deriveBits']).then(function (pw) {
      return S.deriveBits({ name: 'PBKDF2', salt: E.encode(SALT), iterations: ITERATIONS, hash: 'SHA-256' }, pw, 256);
    }).then(function (bits) {
      return S.importKey('raw', bits, 'HKDF', false, ['deriveBits', 'deriveKey']);
    }).then(function (ikm) {
      return Promise.all([
        S.deriveBits({ name: 'HKDF', hash: 'SHA-256', salt: none, info: E.encode('name') }, ikm, NAME_BYTES * 8),
        S.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt: none, info: E.encode('key') }, ikm, { name: 'AES-GCM', length: 256 }, false, ['decrypt'])
      ]);
    }).then(function (two) {
      var b = new Uint8Array(two[0]);
      for (var i = 0; i < b.length; i++) name += (b[i] < 16 ? '0' : '') + b[i].toString(16);
      key = two[1];
      return fetch('/data/rp-sealed/' + name + '.bin');
    }).then(function (r) {
      if (r.status === 404) return 'missing';
      return r.ok ? r.arrayBuffer() : null;
    }).then(function (buf) {
      if (buf === 'missing') return 'missing';
      var u = buf ? new Uint8Array(buf) : null;
      if (!u || u.length < 29 || u[0] !== 1) return null;
      return S.decrypt({ name: 'AES-GCM', iv: u.slice(1, 13), additionalData: E.encode(name) }, key, u.slice(13)).then(function (pt) {
        return new TextDecoder().decode(pt).replace(/\.+$/, '');
      });
    }).then(function (code) {
      clearTimeout(t);
      if (code === 'missing') { fail(true); return; }
      if (typeof code === 'string' && CODE_RE.test(code)) { go(code); return; }
      fail(false);
    }).catch(function () { clearTimeout(t); fail(false); });
  }
})();
</script>
</body>
</html>
